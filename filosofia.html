xF3esis)"],a:3,e:"La n\xF3esis \xE9s el coneixement directe de les Idees per mitj\xE0 de la dial\xE8ctica, dins del m\xF3n intel\xB7ligible."},{q:"Quines classes t\xE9 la polis ideal i quina virtut correspon als governants?",o:["Productors (valentia), guardians (saviesa), governants (tempran\xE7a)","Governants (saviesa), guardians (valentia), productors (tempran\xE7a)","Nom\xE9s dues classes: lliures i esclaus","Governants (just\xEDcia), guardians (saviesa), productors (valentia)"],a:1,e:"Els fil\xF2sofs governen amb saviesa, els guardians defensen amb valentia i els productors practiquen la tempran\xE7a. La just\xEDcia \xE9s que cada classe faci la seva funci\xF3."},{q:"Com \xE9s la relaci\xF3 \xE0nima-cos en el dualisme plat\xF2nic?",o:["L\u2019\xE0nima \xE9s mortal i dep\xE8n del cos","L\u2019\xE0nima \xE9s immortal i preexistent; el cos n\u2019\xE9s una pres\xF3","\xC0nima i cos s\xF3n una sola subst\xE0ncia","L\u2019\xE0nima \xE9s nom\xE9s una funci\xF3 del cervell"],a:1,e:"Per a Plat\xF3 l\u2019\xE0nima \xE9s d\u2019origen intel\xB7ligible i immortal; el cos la lliga al m\xF3n sensible."}],descartes:[{q:"Quina \xE9s la primera regla del m\xE8tode cartesi\xE0?",o:["Dividir cada dificultat en parts","L\u2019evid\xE8ncia: no admetre res com a veritable si no es coneix clarament i distinta","Anar del simple al complex","Fer enumeracions completes"],a:1,e:"L\u2019evid\xE8ncia (claredat i distinci\xF3) \xE9s la regla que fonamenta la resta: dividir, ordenar i enumerar."},{q:"Per qu\xE8 el dubte cartesi\xE0 s\u2019anomena \xABmet\xF2dic\xBB?",o:["Perqu\xE8 \xE9s un escepticisme definitiu","Perqu\xE8 \xE9s un instrument per trobar una veritat indubtable, no un fi en si mateix","Perqu\xE8 dubta nom\xE9s de la religi\xF3","Perqu\xE8 s\u2019aplica nom\xE9s a la matem\xE0tica"],a:1,e:"Descartes dubta de tot el que admet el m\xEDnim dubte (sentits, somni, geni maligne) per trobar un punt ferm."},{q:"Quina \xE9s la primera veritat indubtable?",o:["D\xE9u existeix","El m\xF3n exterior existeix","Penso, per tant existeixo (cogito)","Les matem\xE0tiques s\xF3n certes"],a:2,e:"Fins i tot si m\u2019engany\xE9s un geni maligne, per ser enganyat he d\u2019existir com a \xE9sser que pensa."},{q:"Quins tres tipus d\u2019idees distingeix Descartes?",o:["Simples, complexes i abstractes","Advent\xEDcies, fact\xEDcies i innates","Impressions, idees i h\xE0bits","Sensibles, imaginades i reals"],a:1,e:"Advent\xEDcies (v\xE9nen de fora), fact\xEDcies (les constru\xEFm) i innates (el pensament les t\xE9 de naixement, com la de D\xE9u)."},{q:"Quines subst\xE0ncies estableix Descartes?",o:["Nom\xE9s la pensant","Pensant (res cogitans), extensa (res extensa) i infinita (D\xE9u)","Nom\xE9s la mat\xE8ria","Cos, \xE0nima i esperit sant"],a:1,e:"Subst\xE0ncia pensant, extensa i infinita. L\u2019\xE9sser hum\xE0 \xE9s uni\xF3 de dues subst\xE0ncies finites: \xE0nima i cos."},{q:"Quin paper t\xE9 la veracitat divina?",o:["Garanteix que el que percebem amb claredat i distinci\xF3 \xE9s cert","Demostra que el cogito \xE9s fals","Substitueix el m\xE8tode","Explica el moviment de la mat\xE8ria"],a:0,e:"Un D\xE9u perfecte no pot ser enganyador; per aix\xF2 es pot confiar en les idees clares i distintes i recuperar el m\xF3n exterior."}],locke:[{q:"Quin \xE9s l\u2019origen del coneixement segons Locke?",o:["Les idees innates","L\u2019experi\xE8ncia","La ra\xF3 pura","La revelaci\xF3"],a:1,e:"Locke defensa l\u2019empirisme i rebutja les idees innates: la ment \xE9s un full en blanc (tabula rasa)."},{q:"Quines s\xF3n les dues fonts de les idees?",o:["Ra\xF3 i fe","Sensaci\xF3 i reflexi\xF3","Mem\xF2ria i imaginaci\xF3","Intu\xEFci\xF3 i deducci\xF3"],a:1,e:"La sensaci\xF3 d\xF3na idees dels objectes externs; la reflexi\xF3, de les operacions de la pr\xF2pia ment."},{q:"Quines s\xF3n qualitats prim\xE0ries?",o:["Color, gust i olor","Extensi\xF3, figura, moviment i solidesa","Dol\xE7or i calor","Bellesa i bondat"],a:1,e:"Les prim\xE0ries s\xF3n en els objectes i s\xF3n objectives; les secund\xE0ries (color, gust, olor) s\xF3n efectes en nosaltres."},{q:"Com \xE9s l\u2019estat de natura segons Locke?",o:["Una guerra de tots contra tots","Un estat de llibertat i igualtat regit per la llei natural","Un estat de monarquia absoluta","Un estat sense drets"],a:1,e:"Hi ha drets naturals (vida, llibertat i propietat) que cal protegir; no \xE9s un estat de guerra com en Hobbes."},{q:"Per qu\xE8 s\u2019origina l\u2019estat segons Locke?",o:["Per la for\xE7a d\u2019un sobir\xE0","Per un pacte per protegir els drets naturals i resoldre conflictes","Per designi div\xED","Per tradici\xF3"],a:1,e:"El pacte social crea un govern limitat; si \xE9s tir\xE0nic, es pot exercir el dret de resist\xE8ncia."},{q:"Qu\xE8 diu Locke de la subst\xE0ncia?",o:["Que la coneixem perfectament","Que \xE9s un substrat desconegut que suposem sota les qualitats","Que no existeix","Que nom\xE9s existeix l\u2019esperit"],a:1,e:"La subst\xE0ncia \xE9s un \xABno s\xE9 qu\xE8\xBB que suposem que sustenta les qualitats; no en tenim una idea clara."}],hume:[{q:"Qu\xE8 s\xF3n les impressions i les idees?",o:["Les idees s\xF3n m\xE9s vives que les impressions","Les impressions s\xF3n percepcions vives; les idees, c\xF2pies t\xE8nues d\u2019elles","Totes dues s\xF3n innates","S\xF3n sin\xF2nims"],a:1,e:"Principi de c\xF2pia: tota idea deriva d\u2019una impressi\xF3 pr\xE8via. Si no n\u2019hi ha, la idea no t\xE9 contingut."},{q:"Quins dos tipus de coneixement distingeix?",o:["A priori i sint\xE8tic","Relacions d\u2019idees i q\xFCestions de fet","Racionalisme i empirisme","Sensible i intel\xB7ligible"],a:1,e:"Les relacions d\u2019idees (matem\xE0tiques) s\xF3n necess\xE0ries; les q\xFCestions de fet (experi\xE8ncia) s\xF3n contingents."},{q:"Qu\xE8 \xE9s la causalitat per a Hume?",o:["Una connexi\xF3 necess\xE0ria observable","Una expectativa creada per l\u2019h\xE0bit davant la conjunci\xF3 constant d\u2019esdeveniments","Un principi innat","Una llei del m\xF3n no\xFCm\xE8nic"],a:1,e:"No percebem cap connexi\xF3 necess\xE0ria, nom\xE9s successi\xF3 regular; l\u2019h\xE0bit ens fa esperar l\u2019efecte."},{q:"Qu\xE8 \xE9s el \xABjo\xBB per a Hume?",o:["Una subst\xE0ncia pensant","Un feix de percepcions en flux continu","Una \xE0nima immortal","Una idea innata"],a:1,e:"No hi ha impressi\xF3 d\u2019un jo permanent; nom\xE9s percepcions successives."},{q:"Quin \xE9s el fonament de la moral per a Hume?",o:["La ra\xF3","El sentiment (simpatia)","La voluntat de D\xE9u","La llei natural"],a:1,e:"La ra\xF3 \xE9s \xABesclava de les passions\xBB; els judicis morals neixen del sentiment d\u2019aprovaci\xF3 o rebuig."},{q:"Quins s\xF3n els principis d\u2019associaci\xF3 d\u2019idees?",o:["Semblan\xE7a, contig\xFCitat i causalitat","Identitat, no contradicci\xF3 i ra\xF3 suficient","Sensaci\xF3, reflexi\xF3 i mem\xF2ria","Dubte, certesa i evid\xE8ncia"],a:0,e:"Semblan\xE7a, contig\xFCitat en l\u2019espai o el temps, i causa-efecte."}],kant:[{q:"Qu\xE8 \xE9s un judici sint\xE8tic a priori?",o:["Un judici que ampli\xEF el coneixement i sigui universal i necessari","Un judici merament anal\xEDtic","Un judici basat nom\xE9s en l\u2019experi\xE8ncia","Un judici contradictori"],a:0,e:"Amplia el coneixement (sint\xE8tic) i no dep\xE8n de l\u2019experi\xE8ncia (a priori). Fonamenta matem\xE0tiques i f\xEDsica."},{q:"En qu\xE8 consisteix la \xABrevoluci\xF3 copernicana\xBB de Kant?",o:["En defensar l\u2019heliocentrisme","En afirmar que l\u2019objecte es regeix pel subjecte i no a l\u2019inrev\xE9s","En rebutjar l\u2019experi\xE8ncia","En negar la ra\xF3"],a:1,e:"El subjecte aporta les formes (espai, temps, categories) amb qu\xE8 coneixem els fen\xF2mens."},{q:"Quines facultats t\xE9 el coneixement?",o:["Mem\xF2ria, imaginaci\xF3 i voluntat","Sensibilitat, enteniment i ra\xF3","Sensaci\xF3, reflexi\xF3 i h\xE0bit","Intu\xEFci\xF3, deducci\xF3 i fe"],a:1,e:"Sensibilitat (espai i temps), enteniment (categories) i ra\xF3 (idees d\u2019\xE0nima, m\xF3n i D\xE9u)."},{q:"Qu\xE8 \xE9s el no\xFCmen?",o:["El que percebem amb els sentits","La cosa en si, que no podem con\xE8ixer","Un tipus de categoria","Una forma de la sensibilitat"],a:1,e:"Nom\xE9s coneixem fen\xF2mens; el no\xFCmen \xE9s el l\xEDmit del coneixement."},{q:"Com es diferencia l\u2019imperatiu categ\xF2ric de l\u2019hipot\xE8tic?",o:["El categ\xF2ric mana incondicionalment; l\u2019hipot\xE8tic condiciona l\u2019acci\xF3 a una finalitat","El categ\xF2ric dep\xE8n de l\u2019inter\xE8s","S\xF3n iguals","L\u2019hipot\xE8tic \xE9s universal"],a:0,e:"\xABActua nom\xE9s segons una m\xE0xima que puguis voler com a llei universal.\xBB L\u2019hipot\xE8tic: \xABsi vols X, fes Y\xBB."},{q:"Qu\xE8 exigeix la f\xF3rmula de la humanitat?",o:["Obrar segons la utilitat","Tractar la humanitat sempre com a fi i mai nom\xE9s com a mitj\xE0","Obeir la llei positiva","Buscar la felicitat m\xE0xima"],a:1,e:"La persona t\xE9 dignitat, no preu, i mai no pot ser redu\xEFda a simple instrument."}],mill:[{q:"Qu\xE8 afirma el principi d\u2019utilitat?",o:["Una acci\xF3 \xE9s bona si compleix un deure","Una acci\xF3 \xE9s bona en la mesura que promou la felicitat i dolenta si promou el contrari","Una acci\xF3 \xE9s bona si obeeix D\xE9u","Una acci\xF3 \xE9s bona si \xE9s legal"],a:1,e:"Utilitarisme: la felicitat (plaer i abs\xE8ncia de dolor) \xE9s l\u2019\xFAnic fi desitjable en si mateix."},{q:"Qu\xE8 defensa Mill sobre la qualitat dels plaers?",o:["Tots valen igual","Els plaers intel\xB7lectuals s\xF3n superiors als merament corporals","Nom\xE9s importa la quantitat","Cal evitar tots els plaers"],a:1,e:"\xABMillor S\xF2crates insatisfet que un porc satisfet\xBB: els qui coneixen ambd\xF3s prefereixen els superiors."},{q:"Quin \xE9s el principi del dany?",o:["La llibertat nom\xE9s es pot limitar per evitar el dany als altres","La llibertat no t\xE9 l\xEDmits","L\u2019Estat ha de decidir qu\xE8 \xE9s bo per a cadasc\xFA","Cal prohibir tot all\xF2 perill\xF3s per a un mateix"],a:0,e:"Nom\xE9s es pot limitar la llibertat d\u2019alg\xFA per impedir que perjudiqui altres, no pel seu propi b\xE9."},{q:"Per qu\xE8 defensa la llibertat d\u2019expressi\xF3?",o:["Perqu\xE8 totes les opinions s\xF3n certes","Perqu\xE8 silenciar una opini\xF3, sigui falsa o certa, perjudica la recerca de la veritat","Perqu\xE8 afavoreix el govern","Perqu\xE8 ho exigeix la tradici\xF3"],a:1,e:"Una opini\xF3 falsa pot contenir una part de veritat, i una veritat no discutida es converteix en dogma."},{q:"Qu\xE8 ent\xE9n per \xABtirania de la majoria\xBB?",o:["El govern d\u2019un sol","La pressi\xF3 social i pol\xEDtica de la majoria sobre l\u2019individu i la minoria","La democr\xE0cia directa","Un tipus de monarquia"],a:1,e:"Cal protegir l\u2019individualitat i la diversitat davant la conformitat imposada per l\u2019opini\xF3 p\xFAblica."},{q:"Per qu\xE8 \xE9s l\u2019utilitarisme conseq\xFCencialista, a difer\xE8ncia de Kant?",o:["Perqu\xE8 jutja les accions per les seves conseq\xFC\xE8ncies","Perqu\xE8 jutja pel deure","Perqu\xE8 ignora la felicitat","Perqu\xE8 rebutja tota norma"],a:0,e:"Kant defensa una \xE8tica deontol\xF2gica (el deure); Mill valora les conseq\xFC\xE8ncies en termes de felicitat."}],nietzsche:[{q:"Qu\xE8 representen l\u2019apol\xB7lini i el dionis\xEDac?",o:["Dos sistemes pol\xEDtics","L\u2019ordre, la mesura i la forma enfront de l\u2019embriaguesa, l\u2019instint i la vida","Dos tipus de coneixement cient\xEDfic","Dues virtuts cristianes"],a:1,e:"Dues forces de l\u2019art grec; Nietzsche reivindica el dionis\xEDac, que la tradici\xF3 va reprimir."},{q:"Qu\xE8 significa \xABD\xE9u ha mort\xBB?",o:["Una afirmaci\xF3 teol\xF2gica","Que la fe en el D\xE9u cristi\xE0 i els valors suprems ha perdut credibilitat","Que els homes s\xF3n d\xE9us","Que la ci\xE8ncia prova D\xE9u"],a:1,e:"\xC9s un diagn\xF2stic cultural: s\u2019enfonsa el fonament dels valors occidentals i apareix el nihilisme."},{q:"Qu\xE8 \xE9s la moral d\u2019esclaus?",o:["La moral dels forts i creadors","La moral nascuda del ressentiment dels febles, que inverteix els valors","La moral militar","La moral kantiana"],a:1,e:"Els febles converteixen en virtuts la humilitat i la compassi\xF3; els amos defineixen \xABbo\xBB des de l\u2019afirmaci\xF3 de si."},{q:"Qui \xE9s el superhome?",o:["Un tir\xE0","Qui crea nous valors i afirma la vida i la terra","Un sant cristi\xE0","Un cient\xEDfic"],a:1,e:"\xC9s el sentit de la terra: supera el nihilisme i es fa creador de valors."},{q:"Qu\xE8 \xE9s l\u2019etern retorn?",o:["Una teoria f\xEDsica demostrada","La idea que tot es repeteix i cal viure de manera que s\u2019afirmaria repetir-ho","La reencarnaci\xF3 cristiana","Un m\xE8tode cient\xEDfic"],a:1,e:"\xC9s una prova d\u2019afirmaci\xF3 de la vida: viure com si haguessis de viure-ho infinites vegades."},{q:"Qu\xE8 defensa el perspectivisme?",o:["Que hi ha una veritat absoluta","Que no hi ha fets purs, sin\xF3 interpretacions des de perspectives vitals","Que la ci\xE8ncia \xE9s infal\xB7lible","Que cal rebutjar el coneixement"],a:1,e:"Tot coneixement \xE9s interpretaci\xF3; la \xABveritat\xBB dep\xE8n de la perspectiva i de la voluntat de poder."}],nussbaum:[{q:"Qu\xE8 mesura l\u2019enfocament de les capacitats?",o:["Els diners que t\xE9 cada persona","El que cada persona pot realment fer i ser","El PIB del pa\xEDs","La satisfacci\xF3 declarada de la gent"],a:1,e:"Avalua la just\xEDcia segons les oportunitats reals (capacitats) de cada persona, no per ingressos ni per la utilitat total."},{q:"Quina \xE9s la difer\xE8ncia entre capacitats internes i combinades?",o:["Les internes s\xF3n innates i les combinades adquirides","Les combinades sumen les habilitats personals i les condicions externes que permeten exercir-les","Les internes s\xF3n col\xB7lectives","No hi ha difer\xE8ncia"],a:1,e:"Una persona pot tenir capacitat interna per exercir una professi\xF3 per\xF2 no combinada si la llei no li ho permet."},{q:"Per qu\xE8 el cas de Vasanti \xE9s important per a Nussbaum?",o:["Perqu\xE8 mostra que nom\xE9s importa la renda","Perqu\xE8 revela la pluralitat de factors (nutrici\xF3, llei, analfabetisme, viol\xE8ncia, cr\xE8dit\u2026) que condicionen una vida digna","Perqu\xE8 demostra que l\u2019Estat no ha d\u2019intervenir","Perqu\xE8 parla de l\u2019educaci\xF3 infantil"],a:1,e:"Nussbaum parteix de casos concrets per veure tots els factors que fan falta per millorar la vida."},{q:"Qu\xE8 s\xF3n les prefer\xE8ncies adaptatives?",o:["Prefer\xE8ncies que canvien amb la moda","Desitjos que s\u2019ajusten a la privaci\xF3: qui ha viscut en la mancan\xE7a s\u2019acostuma a voler menys","Prefer\xE8ncies racionals i estables","Les prefer\xE8ncies de l\u2019Estat"],a:1,e:"Per aix\xF2 l\u2019utilitarisme (satisfacci\xF3) refor\xE7a l\u2019statu quo: una persona marginada pot dir-se satisfeta en una situaci\xF3 injusta."},{q:"Qu\xE8 \xE9s una capacitat f\xE8rtil?",o:["La que dona m\xE9s diners","La que afavoreix moltes altres capacitats (per exemple l\u2019educaci\xF3)","La que nom\xE9s tenen els rics","La que es desenvolupa a la inf\xE0ncia"],a:1,e:"Cal prioritzar les capacitats f\xE8rtils i eliminar els desavantatges corrosius, que en perjudiquen moltes altres."},{q:"Qu\xE8 \xE9s un desavantatge corrosiu?",o:["Una privaci\xF3 amb efectes negatius en altres \xE0mbits de la vida (p. ex. la viol\xE8ncia dom\xE8stica)","Un tipus de capacitat interna","Una manera de mesurar el PIB","Una cr\xEDtica dels utilitaristes"],a:0,e:"La viol\xE8ncia dom\xE8stica posa en perill la salut, el benestar emocional, l\u2019afiliaci\xF3 i la ra\xF3 pr\xE0ctica."},{q:"Per qu\xE8 Nussbaum considera que el seu enfocament \xE9s deontol\xF2gic?",o:["Perqu\xE8 maximitza la felicitat","Perqu\xE8 afirma el deure dels governs de garantir un m\xEDnim de capacitats a tothom i no sacrifica la dignitat de cap persona","Perqu\xE8 rebutja els drets","Perqu\xE8 nom\xE9s mira les conseq\xFC\xE8ncies"],a:1,e:"Rebutja la satisfacci\xF3 com a criteri, defensa que cada persona \xE9s un fi i que els governs han de promoure capacitats sense imposar funcionaments."},{q:"Quina cr\xEDtica fa Nussbaum al contractualisme de Rawls?",o:["Que \xE9s massa utilitarista","Que exclou les persones amb discapacitats greus i els animals, perqu\xE8 concep la persona a partir de la racionalitat","Que no parla de just\xEDcia","Que ignora la llibertat"],a:1,e:"La dignitat s\u2019ha d\u2019arrelar en la sensibilitat i l\u2019ag\xE8ncia, no nom\xE9s en la racionalitat."},{q:"Qu\xE8 significa que l\u2019educaci\xF3 \xE9s obligat\xF2ria fins als setze anys en aquest enfocament?",o:["Que es viola el liberalisme pol\xEDtic sense motiu","Que \xE9s l\u2019\xFAnica excepci\xF3: es limita la llibertat dels pares perqu\xE8 els nens encara no poden triar","Que els funcionaments s\u2019imposen a tothom","Que nom\xE9s cal ensenyar a llegir"],a:1,e:"L\u2019educaci\xF3 \xE9s una capacitat f\xE8rtil i no es pot permetre que cap fam\xEDlia en priva els fills."},{q:"Qu\xE8 afirma la \xABfal\xB7l\xE0cia de la mesura\xBB?",o:["Que nom\xE9s \xE9s fiable all\xF2 que es pot mesurar num\xE8ricament","Que les capacitats no es poden mesurar mai","Que l\u2019IDH \xE9s in\xFAtil","Que el PIB mesura b\xE9 la just\xEDcia"],a:0,e:"Nussbaum la rebutja: algunes capacitats nom\xE9s es poden mesurar qualitativament i aix\xF2 no invalida la teoria."}]},glos:[{k:"platon",t:"Idea",d:"Realitat intel\xB7ligible, immutable i eterna; model de les coses sensibles."},{k:"platon",t:"D\xF3xa i epist\xE8me",d:"Opini\xF3 sobre el m\xF3n sensible i coneixement veritable de les Idees."},{k:"platon",t:"Reminisc\xE8ncia",d:"Teoria segons la qual con\xE8ixer \xE9s recordar el que l\u2019\xE0nima va contemplar al m\xF3n de les Idees."},{k:"platon",t:"Dial\xE8ctica",d:"M\xE8tode ascendent de la ra\xF3 per arribar a les Idees, i porta fins a la Idea del B\xE9."},{k:"platon",t:"M\xE9thexis i m\xEDmesi",d:"Dues explicacions de la relaci\xF3 entre Idees i coses: participaci\xF3 i imitaci\xF3."},{k:"platon",t:"Just\xEDcia",d:"Virtut de la polis i de l\u2019\xE0nima en qu\xE8 cada part fa la funci\xF3 que li correspon."},{k:"descartes",t:"Cogito",d:"\xABPenso, per tant existeixo\xBB: primera veritat indubtable."},{k:"descartes",t:"Dubte met\xF2dic",d:"Dubte provisional, m\xE8tode per arribar a un fonament indubtable."},{k:"descartes",t:"Evid\xE8ncia",d:"Criteri de veritat: nom\xE9s \xE9s cert all\xF2 que es presenta amb claredat i distinci\xF3."},{k:"descartes",t:"Idees innates",d:"Idees presents a la ment des del naixement, com la de D\xE9u."},{k:"descartes",t:"Res cogitans i res extensa",d:"Subst\xE0ncia pensant (\xE0nima) i subst\xE0ncia extensa (cos i m\xF3n material)."},{k:"descartes",t:"Geni maligne",d:"Hip\xF2tesi que exagera el dubte: un \xE9sser poder\xF3s que ens enganyaria sempre."},{k:"locke",t:"Tabula rasa",d:"Ment en blanc en n\xE9ixer; totes les idees v\xE9nen de l\u2019experi\xE8ncia."},{k:"locke",t:"Sensaci\xF3 i reflexi\xF3",d:"Fonts de les idees: experi\xE8ncia externa i experi\xE8ncia de les operacions internes."},{k:"locke",t:"Qualitats prim\xE0ries i secund\xE0ries",d:"Les prim\xE0ries s\xF3n pr\xF2pies dels objectes; les secund\xE0ries depenen de la nostra percepci\xF3."},{k:"locke",t:"Estat de natura",d:"Condici\xF3 prepol\xEDtica de llibertat i igualtat sota la llei natural."},{k:"locke",t:"Drets naturals",d:"Vida, llibertat i propietat, anteriors a l\u2019Estat."},{k:"locke",t:"Contracte social",d:"Pacte pel qual neix el govern per protegir els drets naturals."},{k:"hume",t:"Impressi\xF3",d:"Percepci\xF3 viva i immediata (sensaci\xF3 o sentiment)."},{k:"hume",t:"Principi de c\xF2pia",d:"Tota idea simple deriva d\u2019una impressi\xF3."},{k:"hume",t:"Relacions d\u2019idees i q\xFCestions de fet",d:"Veritats necess\xE0ries (matem\xE0tica) enfront de veritats contingents (experi\xE8ncia)."},{k:"hume",t:"H\xE0bit o costum",d:"Disposici\xF3 que ens fa esperar un efecte despr\xE9s d\u2019observar-ne la causa moltes vegades."},{k:"hume",t:"Feix de percepcions",d:"Concepci\xF3 del jo i de la subst\xE0ncia com a col\xB7lecci\xF3 de percepcions."},{k:"hume",t:"Simpatia",d:"Capacitat de compartir sentiments d\u2019altres, base de la moral."},{k:"kant",t:"A priori i a posteriori",d:"Independent de l\u2019experi\xE8ncia o procedent d\u2019ella."},{k:"kant",t:"Judici sint\xE8tic a priori",d:"Judici que amplia el coneixement i \xE9s universal i necessari."},{k:"kant",t:"Fenomen i no\xFCmen",d:"La cosa tal com apareix al subjecte i la cosa en si, incognoscible."},{k:"kant",t:"Revoluci\xF3 copernicana",d:"El subjecte determina la forma de l\u2019objecte conegut."},{k:"kant",t:"Imperatiu categ\xF2ric",d:"Mandat moral incondicional: obra segons m\xE0ximes universalitzables."},{k:"kant",t:"Autonomia",d:"La voluntat es d\xF3na a si mateixa la llei moral."},{k:"mill",t:"Utilitarisme",d:"\xC8tica que valora les accions segons la felicitat que produeixen."},{k:"mill",t:"Plaers superiors",d:"Plaers intel\xB7lectuals i morals, de m\xE9s qualitat que els corporals."},{k:"mill",t:"Principi del dany",d:"L\xEDmit de la llibertat: no perjudicar els altres."},{k:"mill",t:"Tirania de la majoria",d:"Opressi\xF3 de l\u2019individu per l\u2019opini\xF3 dominant."},{k:"nietzsche",t:"Apol\xB7lini i dionis\xEDac",d:"L\u2019ordre i la forma enfront de l\u2019instint i l\u2019embriaguesa vital."},{k:"nietzsche",t:"Moral d\u2019amos i d\u2019esclaus",d:"Moral afirmativa dels forts enfront de la moral reactiva dels febles."},{k:"nietzsche",t:"Ressentiment",d:"Ranc\xFAnia dels febles que s\u2019imposa convertint la seva feblesa en virtut."},{k:"nietzsche",t:"Nihilisme",d:"P\xE8rdua de sentit dels valors suprems despr\xE9s de la \xABmort de D\xE9u\xBB."},{k:"nietzsche",t:"Superhome",d:"Creador de valors que afirma la vida i la terra."},{k:"nietzsche",t:"Etern retorn",d:"Idea de la repetici\xF3 infinita com a prova d\u2019afirmaci\xF3 de la vida."},{k:"nietzsche",t:"Voluntat de poder",d:"For\xE7a vital que explica la realitat i la vida."},{k:"nietzsche",t:"Perspectivisme",d:"Tot coneixement \xE9s interpretaci\xF3 des d\u2019una perspectiva."},{k:"nussbaum",t:"Capacitat",d:"Llibertat real de la persona per fer i ser el que valora; resposta a \xABqu\xE8 pot fer i ser?\xBB."},{k:"nussbaum",t:"Funcionament",d:"Realitzaci\xF3 activa d\u2019una capacitat (estar sa, votar); implica llibertat d\u2019elecci\xF3."},{k:"nussbaum",t:"Capacitats internes",d:"Aptituds personals, innates o adquirides amb la formaci\xF3."},{k:"nussbaum",t:"Capacitats combinades",d:"Capacitats internes m\xE9s les condicions externes que permeten exercir-les."},{k:"nussbaum",t:"Capacitats b\xE0siques",d:"Facultats innates que fan possible el desenvolupament posterior de la persona."},{k:"nussbaum",t:"Llindar m\xEDnim",d:"Nivell que cada capacitat central ha de garantir a tothom per viure amb dignitat."},{k:"nussbaum",t:"Capacitats centrals",d:"Les deu capacitats que els governs han de protegir: vida, salut, integritat, ra\xF3 pr\xE0ctica, afiliaci\xF3\u2026"},{k:"nussbaum",t:"Capacitat f\xE8rtil",d:"Capacitat que afavoreix moltes altres, com l\u2019educaci\xF3."},{k:"nussbaum",t:"Desavantatge corrosiu",d:"Privaci\xF3 que t\xE9 efectes negatius en altres \xE0mbits (p. ex. la viol\xE8ncia dom\xE8stica)."},{k:"nussbaum",t:"Elecci\xF3 tr\xE0gica",d:"Conflicte entre dues capacitats en qu\xE8 qualsevol opci\xF3 suposa una p\xE8rdua."},{k:"nussbaum",t:"Prefer\xE8ncies adaptatives",d:"Desitjos redu\xEFts per l\u2019h\xE0bit de viure en la privaci\xF3 (Sen)."},{k:"nussbaum",t:"Liberalisme pol\xEDtic",d:"Doctrina que respecta el pluralisme i la llibertat d\u2019elecci\xF3; no imposa una visi\xF3 del b\xE9."},{k:"nussbaum",t:"Teoria comprehensiva",d:"Doctrina que pret\xE9n valer per a tots els \xE0mbits de la vida, sense excepcions."},{k:"nussbaum",t:"Deontologia",d:"\xC8tica segons la qual una acci\xF3 \xE9s correcta si compleix el deure, amb independ\xE8ncia de les conseq\xFC\xE8ncies."},{k:"nussbaum",t:"Fal\xB7l\xE0cia de la mesura",d:"Creure que nom\xE9s \xE9s fiable all\xF2 que es pot mesurar num\xE8ricament."},{k:"nussbaum",t:"Imaginaci\xF3 narrativa",d:"Capacitat de posar-se en el lloc de l\u2019altre; la literatura i les arts la cultiven."}],comp:[{r:"\xC8poca i corrent",c:["Gr\xE8cia, s. V-IV aC \xB7 idealisme","S. XVII \xB7 racionalisme","S. XVII \xB7 empirisme","S. XVIII \xB7 empirisme esc\xE8ptic","S. XVIII \xB7 criticisme","S. XIX \xB7 utilitarisme i liberalisme","S. XIX \xB7 vitalisme","S. XX-XXI \xB7 enfocament de les capacitats"]},{r:"Font del coneixement",c:["Ra\xF3 i reminisc\xE8ncia (dial\xE8ctica)","Ra\xF3, idees innates i m\xE8tode","Experi\xE8ncia: sensaci\xF3 i reflexi\xF3","Impressions dels sentits; idees com a c\xF2pies","Sensibilitat + enteniment (s\xEDntesi)","\u2014","Perspectives vitals; cr\xEDtica de la metaf\xEDsica","\u2014"]},{r:"Realitat",c:["Dos m\xF3ns: sensible i intel\xB7ligible (Idees)","Tres subst\xE0ncies: pensant, extensa i infinita","Subst\xE0ncia com a substrat desconegut","Rebutja la subst\xE0ncia i la causalitat necess\xE0ria","Fenomen (cognoscible) i no\xFCmen (cosa en si)","\u2014","Devenir; voluntat de poder","\u2014"]},{r:"\xC0nima o jo",c:["\xC0nima immortal; el cos \xE9s una pres\xF3","Jo = res cogitans","Identitat personal per la consci\xE8ncia","Jo = feix de percepcions","Subjecte transcendental","\u2014","El cos; l\u2019\xAB\xE0nima\xBB com a invenci\xF3","\u2014"]},{r:"\xC8tica",c:["Intel\xB7lectualisme moral: virtut = coneixement del B\xE9","Moral provisional","Llei natural","Sentiment i simpatia","\xC8tica formal: imperatiu categ\xF2ric","Utilitarisme: la m\xE0xima felicitat","Cr\xEDtica de la moral; superhome","\xC8tica de les capacitats: dignitat i vida plenament humana"]},{r:"Pol\xEDtica i societat",c:["Polis ideal governada pels fil\xF2sofs","\u2014","Liberalisme: pacte, drets naturals, divisi\xF3 de poders","Convenci\xF3 i utilitat","Autonomia i dignitat de la persona","Llibertat individual i principi del dany","Cr\xEDtica de la moral greg\xE0ria","Just\xEDcia social: un m\xEDnim de capacitats garantit per a tothom"]},{r:"Obra clau",c:["La Rep\xFAblica","Discurs del m\xE8tode","Assaig sobre l\u2019enteniment hum\xE0","Tractat sobre la naturalesa humana","Cr\xEDtica de la ra\xF3 pura","Sobre la llibertat \xB7 Utilitarisme","Aix\xED parl\xE0 Zaratustra","Crear capacitats"]}],des:{est:[{n:"1",t:"Comentari de text",p:"6 punts",d:"Hi ha dues opcions de text (A i B) amb les mateixes caracter\xEDstiques; nom\xE9s cal triar-ne una. Inclou tres preguntes: un resum (2 p), l\u2019explicaci\xF3 de dues expressions (1 p) i el sentit d\u2019una afirmaci\xF3 de l\u2019autor amb les raons que el porten a sostenir-la (3 p)."},{n:"2",t:"Aplicaci\xF3 a una situaci\xF3",p:"2 punts",d:"Una sola pregunta, sense opcions: s\u2019avalua una situaci\xF3 pr\xE0ctica aplicant les idees de dos autors i s\u2019acaba amb una breu comparaci\xF3 de les seves propostes (1 punt per a cada part)."},{n:"3",t:"Redacci\xF3 argumentada",p:"2 punts",d:"Dues opcions de tesi: cal defensar-la, rebatre-la o argumentar una posici\xF3 interm\xE8dia. Es poden descomptar fins a 0,2 punts per ortografia i presentaci\xF3."}],guia:[{t:"Resum (2 p)",s:["Una sola idea central, en 3\u20135 l\xEDnies i amb paraules pr\xF2pies.","Ordena: tesi de l\u2019autor \u2192 raons principals \u2192 conclusi\xF3.","No copi\xEFs frases del text ni hi afegeixis opini\xF3."]},{t:"Expressions (1 p)",s:["Explica qu\xE8 vol dir cada expressi\xF3 dins del text, no nom\xE9s al diccionari.","Una o dues frases per expressi\xF3; relaciona-la amb un concepte de l\u2019autor.","Si pots, afegeix un exemple breu."]},{t:"Sentit d\u2019una afirmaci\xF3 (3 p)",s:["Primer, qu\xE8 vol dir l\u2019afirmaci\xF3 en un llenguatge senzill.","Despr\xE9s, per qu\xE8 ho sost\xE9 l\u2019autor: dues o tres raons lligades als conceptes del seu sistema.","Tanca situant-la dins el pensament de l\u2019autor (coneixement, \xE8tica, pol\xEDtica\u2026)."]},{t:"Aplicaci\xF3 a una situaci\xF3 (2 p)",s:["Presenta en una l\xEDnia el problema de la situaci\xF3.","Qu\xE8 en diria cada autor, amb els seus conceptes (no nom\xE9s \xABestaria d\u2019acord\xBB).","Acaba comparant: on coincideixen, on divergeixen i en qu\xE8 es basa la difer\xE8ncia."]},{t:"Redacci\xF3 argumentada (2 p)",s:["Tesi clara des de la primera l\xEDnia (a favor, en contra o interm\xE8dia).","Dos o tres arguments, cadascun amb una idea d\u2019un autor del temari.","Una objecci\xF3 possible i la teva resposta. Cuida l\u2019ortografia: es pot restar fins a 0,2."]}],aut:{platon:{afirm:"Nom\xE9s qui ha contemplat la Idea del B\xE9 est\xE0 preparat per governar la ciutat.",esq:["Sentit: el govern requereix coneixement, no nom\xE9s opini\xF3.","Raons: el s\xEDmil de la l\xEDnia i el mite de la caverna distingeixen d\xF3xa de n\xF3esis; qui surt de la caverna veu la Idea del B\xE9, que d\xF3na sentit a tot; la just\xEDcia a la polis \xE9s que cada classe faci la seva funci\xF3.","Context: per aix\xF2 els governants han de ser fil\xF2sofs i educats durant molts anys."],tesi:"Una societat hauria de ser governada pels qui m\xE9s en saben.",pro:["Ning\xFA no deixaria pilotar un avi\xF3 a qui no sap fer-ho: la pol\xEDtica tamb\xE9 \xE9s una t\xE8cnica que exigeix coneixement.","Les opinions majorit\xE0ries poden ser manipulades; el coneixement d\xF3na estabilitat i just\xEDcia (d\xF3xa enfront de n\xF3esis)."],con:["Ning\xFA no t\xE9 un coneixement indiscutible del b\xE9; el poder sense control tendeix a l\u2019ab\xFAs.","La participaci\xF3 de tots fa leg\xEDtim el poder i permet corregir errors (Locke, Mill)."],mod:"Cal el coneixement dels experts, per\xF2 subjecte a control democr\xE0tic: assessorament t\xE8cnic s\xED, poder il\xB7limitat no."},descartes:{afirm:"La primera veritat indubtable \xE9s \xABpenso, per tant existeixo\xBB.",esq:["Sentit: hi ha una certesa que resisteix qualsevol dubte.","Raons: el dubte met\xF2dic arriba a posar en q\xFCesti\xF3 els sentits, la vig\xEDlia i fins i tot les matem\xE0tiques (geni maligne); per\xF2 fins i tot dubtant penso, i per pensar he d\u2019existir.","Context: \xE9s el fonament sobre el qual es demostra D\xE9u i la veracitat del coneixement clar i distint."],tesi:"Per arribar a la veritat cal dubtar de tot el que creiem saber.",pro:["El dubte permet examinar prejudicis heretats i separar l\u2019evident de l\u2019aparent.","Sense un criteri sever (claredat i distinci\xF3) qualsevol creen\xE7a podria passar per veritable."],con:["Un dubte total \xE9s impracticable: en la vida quotidiana cal actuar amb creences no demostrades (Descartes mateix defensa una moral provisional).","Gran part del saber dep\xE8n de la confian\xE7a en testimonis i en la ci\xE8ncia col\xB7lectiva."],mod:"Dubtar \xE9s un m\xE8tode, no una forma de vida: val la pena revisar les creences amb rigor, per\xF2 no es pot dubtar de tot alhora."},locke:{afirm:"La ment \xE9s com un full en blanc: tot el coneixement ve de l\u2019experi\xE8ncia.",esq:["Sentit: no hi ha idees innates; les idees s\u2019adquireixen.","Raons: nens i persones de cultures diferents no comparteixen els principis suposadament innats; les idees simples v\xE9nen de la sensaci\xF3 i la reflexi\xF3 i les complexes se\u2019n formen per combinaci\xF3.","Context: \xE9s la base de l\u2019empirisme i de la defensa dels drets naturals i de la toler\xE0ncia."],tesi:"Tot all\xF2 que sabem ho hem apr\xE8s de l\u2019experi\xE8ncia.",pro:["Cap idea no apareix sense contacte amb el m\xF3n: un cec de naixement no t\xE9 idea de colors.","Explica la diversitat d\u2019opinions i justifica una educaci\xF3 que construeixi el coneixement."],con:["La ment no \xE9s passiva: t\xE9 capacitats (llenguatge, raonament) que organitzen l\u2019experi\xE8ncia (Kant).","Les matem\xE0tiques semblen tenir una certesa que l\u2019experi\xE8ncia sola no explica."],mod:"L\u2019experi\xE8ncia \xE9s la mat\xE8ria del coneixement, per\xF2 la ment aporta estructures per ordenar-la: sense experi\xE8ncia no hi ha contingut, sense capacitats no hi ha comprensi\xF3."},hume:{afirm:"Que una cosa causi una altra \xE9s nom\xE9s un h\xE0bit de la ment, no una connexi\xF3 necess\xE0ria.",esq:["Sentit: no observem cap \xABfor\xE7a\xBB que lligui causa i efecte.","Raons: nom\xE9s veiem successi\xF3 i conjunci\xF3 constant; l\u2019h\xE0bit ens fa esperar que passi el mateix; la causalitat no \xE9s relaci\xF3 d\u2019idees ni es pot demostrar per experi\xE8ncia sense circularitat.","Context: porta a un escepticisme moderat sobre la ci\xE8ncia i sobre el \xABjo\xBB."],tesi:"No podem estar segurs que el futur s\u2019assemblar\xE0 al passat.",pro:["Que ahir sort\xEDs el sol no implica l\xF2gicament que dem\xE0 ho faci: la inducci\xF3 no es pot justificar sense circularitat.","Recon\xE8ixer-ho fa m\xE9s prudents i menys dogm\xE0tics."],con:["La ci\xE8ncia prediu amb \xE8xit; negar tota seguretat \xE9s poc raonable a la pr\xE0ctica.","Podem raonar amb probabilitats: no hi ha certesa absoluta, per\xF2 s\xED raons m\xE9s o menys fortes."],mod:"La certesa absoluta sobre el futur no existeix, per\xF2 s\xED un grau elevat de confian\xE7a, i cal actuar segons el que \xE9s m\xE9s probable."},kant:{afirm:"Cal actuar nom\xE9s segons m\xE0ximes que puguem voler com a llei universal.",esq:["Sentit: una acci\xF3 \xE9s moral si la seva norma \xE9s universalitzable.","Raons: l\u2019\xE8tica kantiana \xE9s formal i aut\xF2noma; la voluntat bona actua per deure, no per inter\xE8s; l\u2019imperatiu categ\xF2ric mana sense condicions, i una de les seves formulacions exigeix tractar la humanitat sempre com a fi, mai nom\xE9s com a mitj\xE0.","Context: s\u2019oposa a l\u2019\xE8tica de les conseq\xFC\xE8ncies i defensa la dignitat de la persona."],tesi:"Mentir \xE9s sempre moralment incorrecte.",pro:["Una m\xE0xima que permeti mentir es destrueix si es universalitza: ning\xFA no creuria ning\xFA.","Mentir utilitza l\u2019altre com a simple mitj\xE0 i vulnera la seva autonomia."],con:["Hi ha casos extrems (protegir una vida) en qu\xE8 mentir sembla el mal menor.","Jutjar nom\xE9s per la intenci\xF3 ignora les conseq\xFC\xE8ncies reals sobre persones concretes (Mill)."],mod:"La mentida \xE9s en general incorrecta perqu\xE8 afecta la confian\xE7a i la dignitat, per\xF2 en conflictes extrems cal ponderar valors; Kant, per\xF2, rebutjaria excepcions."},mill:{afirm:"L\u2019\xFAnica ra\xF3 per limitar la llibertat d\u2019alg\xFA \xE9s evitar que perjudiqui els altres.",esq:["Sentit: el principi del dany marca el l\xEDmit de la intervenci\xF3 de l\u2019Estat i de la societat.","Raons: cadasc\xFA \xE9s el millor jutge del seu b\xE9; la llibertat d\u2019expressi\xF3 i d\u2019acci\xF3 fa progressar la societat i evita la tirania de la majoria; l\u2019utilitarisme jutja per la felicitat del major nombre.","Context: connecta la teoria \xE8tica (utilitarisme) amb la pol\xEDtica liberal."],tesi:"L\u2019Estat no hauria de limitar la llibertat d\u2019una persona pel seu propi b\xE9.",pro:["Cada persona sap millor que ning\xFA qu\xE8 li conv\xE9; el paternalisme tracta els adults com a infants.","La diversitat de vides i opinions genera progr\xE9s i corregeix errors."],con:["Algunes decisions \xABpr\xF2pies\xBB tenen costos socials (sanitat, accidents) i hi ha persones vulnerables o mal informades.","Una intervenci\xF3 m\xEDnima, com ara la informaci\xF3 o els cinturons, pot protegir sense anul\xB7lar la llibertat."],mod:"La llibertat individual \xE9s la regla, per\xF2 se\u2019n poden admetre l\xEDmits proporcionats quan hi ha un dany a tercers o una vulnerabilitat clara."},nietzsche:{afirm:"Els valors tradicionals neixen d\u2019una moral d\u2019esclaus que nega la vida; \xABD\xE9u ha mort\xBB i cal crear nous valors.",esq:["Sentit: cr\xEDtica geneal\xF2gica de la moral i del cristianisme.","Raons: la moral d\u2019esclaus (ressentiment) converteix la debilitat en virtut; el nihilisme apareix quan els valors suprems perden fonament; el superhome afirma la vida i crea valors nous.","Context: el perspectivisme i l\u2019etern retorn acompanyen la proposta."],tesi:"La moral tradicional frena el desenvolupament de les persones.",pro:["Molts valors s\u2019imposen per costum i por, no per reflexi\xF3, i limiten la creativitat.","Afirmar la vida i assumir la responsabilitat de crear valors propis d\xF3na sentit sense dogmes."],con:["Sense normes compartides \xE9s dif\xEDcil la conviv\xE8ncia i la protecci\xF3 dels febles.","Una \xE8tica del poder pot justificar l\u2019ab\xFAs; la compassi\xF3 tamb\xE9 enriqueix la vida."],mod:"Revisar cr\xEDticament els valors heretats \xE9s sa, per\xF2 una societat tamb\xE9 necessita normes comunes que protegeixin tothom."},nussbaum:{afirm:"Una societat \xE9s justa si garanteix a cada persona un m\xEDnim de capacitats centrals per viure amb dignitat.",esq:["Sentit: la just\xEDcia es mesura per les oportunitats reals de cada persona, no pels diners ni per la utilitat total.","Raons: les capacitats (el que una persona pot fer i ser) s\xF3n plurals i no intercanviables; cada persona \xE9s un fi en si mateixa; el PIB i l\u2019utilitarisme amaguen desigualtats i les prefer\xE8ncies adaptatives distorsionen el que la gent diu voler.","Context: la llista de deu capacitats \xE9s una concepci\xF3 pol\xEDtica (consens superposat) i fonamenta drets constitucionals m\xEDnims."],tesi:"L\u2019Estat ha de garantir a tothom un m\xEDnim de salut, educaci\xF3 i participaci\xF3 pol\xEDtica, encara que aix\xF2 costi m\xE9s diners.",pro:["Sense aquest m\xEDnim no hi ha vida digna ni llibertat real: els drets formals no serveixen sense condicions per exercir-los.","El PIB i la utilitat global amaguen qui queda enrere; les capacitats protegeixen cada persona (Nussbaum, Kant)."],con:["Garantir-ho tot t\xE9 un cost i pot limitar la llibertat econ\xF2mica o reduir recursos per a altres finalitats (Locke, Mill).","Una llista de capacitats pot imposar una visi\xF3 concreta del que \xE9s una bona vida; cal respectar el pluralisme."],mod:"L\u2019Estat ha de garantir un llindar b\xE0sic en les capacitats m\xE9s essencials, per\xF2 deixant que cada persona i cada comunitat tri\xEFn com viure per damunt d\u2019aquest m\xEDnim."}},apl:[{t:"Una mentida que beneficia molta gent",cas:"Una empresa ocultaria als clients una petita falla d\u2019un producte perqu\xE8, si es publica, tancaria i hi hauria 200 acomiadaments.",a:{k:"kant",i:["La m\xE0xima \xABocultar defectes si em conv\xE9\xBB no es pot universalitzar.","Els clients s\xF3n persones, fins i tot si els acomiadats pateixen; no es poden utilitzar nom\xE9s com a mitj\xE0."],v:"Cal informar-los, encara que el cost sigui alt."},b:{k:"mill",i:["Es comparen les conseq\xFC\xE8ncies per a la felicitat del major nombre.","Cal pesar el risc per als clients enfront dels perjudicis dels treballadors."],v:"Si el risc \xE9s petit, potser ocultar-ho maximitza el benestar; si \xE9s greu, no."},c:"Tots dos busquen una acci\xF3 correcta, per\xF2 Kant jutja pel principi (deure) i Mill per les conseq\xFC\xE8ncies. Per a Kant la resposta no dep\xE8n dels c\xE0lculs; per a Mill, s\xED."},{t:"Un diagn\xF2stic de la intel\xB7lig\xE8ncia artificial",cas:"Un sistema d\u2019IA ha encertat el 99 % dels diagn\xF2stics, i un metge dubta si fiar-se\u2019n del tot en un cas nou.",a:{k:"descartes",i:["Nom\xE9s cal acceptar com a veritable el que es veu amb claredat i distinci\xF3.","El dubte met\xF2dic demana verificar el resultat amb raons evidents."],v:"No s\u2019ha d\u2019acceptar el resultat sense comprovaci\xF3."},b:{k:"hume",i:["La confian\xE7a en la predicci\xF3 \xE9s h\xE0bit derivat de l\u2019experi\xE8ncia de l\u2019\xE8xit passat.","No hi ha garantia l\xF2gica que el sistema acerti sempre."],v:"Es pot fer servir amb prud\xE8ncia i amb un grau de confian\xE7a proporcionat a l\u2019evid\xE8ncia."},c:"Descartes busca una certesa fonamentada en la ra\xF3; Hume accepta que nom\xE9s tenim probabilitat basada en l\u2019h\xE0bit. Coincideixen en la prud\xE8ncia per\xF2 discrepen en el fonament de la certesa."},{t:"Qui hauria de decidir en pol\xEDtica",cas:"Un govern vol prohibir la difusi\xF3 de not\xEDcies falses i designar un comit\xE8 d\u2019experts perqu\xE8 decideixi qu\xE8 \xE9s veritat.",a:{k:"platon",i:["El coneixement ha de guiar la pol\xEDtica: d\xF3xa no pot decidir.","Els qui coneixen el b\xE9 han de dirigir la ciutat."],v:"Un comit\xE8 de savis \xE9s leg\xEDtim i necessari."},b:{k:"locke",i:["El poder prov\xE9 del pacte i el consentiment dels governats; ha de protegir drets naturals.","Cal limitar el poder i garantir la toler\xE0ncia."],v:"Un comit\xE8 sense control vulnera els drets i la confian\xE7a del pacte."},c:"Plat\xF3 posa el fonament del poder en el saber; Locke, en el consentiment. Per a Plat\xF3 importa qui sap; per a Locke, qui hi consent i qu\xE8 protegeix."},{t:"On invertir el pressupost",cas:"Una ciutat pot construir una autopista que estalviar\xE0 temps a la majoria o crear escoles i atenci\xF3 sanit\xE0ria en un barri molt desfavorit.",a:{k:"mill",i:["Es compara la felicitat total que produeix cada opci\xF3.","Cal comptar el benefici de tots, per\xF2 cadasc\xFA compta igual."],v:"Escollir\xE0 l\u2019opci\xF3 que augmenti m\xE9s el benestar global, que pot ser l\u2019autopista o l\u2019escola segons els n\xFAmeros."},b:{k:"nussbaum",i:["Cada persona t\xE9 dret a un m\xEDnim de capacitats (salut, educaci\xF3) per viure amb dignitat.","Una suma de beneficis no compensa que alg\xFA quedi per sota del llindar."],v:"Cal garantir primer el m\xEDnim al barri desfavorit abans d\u2019ampliar comoditats per a la majoria."},c:"Mill pensa en el total; Nussbaum, en el m\xEDnim garantit per a cada persona. Per a Mill es pot acceptar un sacrifici si el total puja; per a Nussbaum, no per sota del llindar."},{t:"La pressi\xF3 del grup",cas:"En un institut, els alumnes que s\u2019aparten del que fa la majoria (vestir, opinar, estudiar diferent) s\xF3n a\xEFllats.",a:{k:"mill",i:["La tirania de l\u2019opini\xF3 majorit\xE0ria \xE9s tan perillosa com la pol\xEDtica.","La individualitat i els experiments de vida fan progressar la societat."],v:"Cal protegir el dret a ser diferent mentre no es faci mal a ning\xFA."},b:{k:"nietzsche",i:["La \xABmoral de ramat\xBB uniformitza i nega la vida.","Cal crear valors propis, m\xE9s enll\xE0 de la pressi\xF3 social."],v:"L\u2019alumne ha de superar la pressi\xF3 i afirmar-se."},c:"Tots dos defensen la individualitat, per\xF2 Mill ho fa dins del respecte als altres (principi del dany) i Nietzsche com a superaci\xF3 de la moral dominant, sense subordinar-la a la utilitat general."}]},cmp:{c:[{r:"Font del coneixement",a:{platon:{g:"Racionalisme",l:"Ra\xF3 i reminisc\xE8ncia"},descartes:{g:"Racionalisme",l:"Ra\xF3 i idees innates"},locke:{g:"Empirisme",l:"Experi\xE8ncia"},hume:{g:"Empirisme",l:"Impressions"},kant:{g:"S\xEDntesi",l:"Sensibilitat + enteniment"},nietzsche:{g:"Perspectivisme",l:"Perspectives vitals"}}},{r:"Realitat",a:{platon:{g:"Dualisme",l:"Dos m\xF3ns"},descartes:{g:"Dualisme",l:"Tres subst\xE0ncies"},locke:{g:"Realisme cr\xEDtic",l:"Substrat desconegut"},hume:{g:"Escepticisme",l:"Rebutja la subst\xE0ncia"},kant:{g:"Idealisme transcendental",l:"Fenomen i no\xFCmen"},nietzsche:{g:"Devenir",l:"Voluntat de poder"}}},{r:"\xC0nima o jo",a:{platon:{g:"Dualisme",l:"\xC0nima immortal"},descartes:{g:"Dualisme",l:"Res cogitans"},locke:{g:"Consci\xE8ncia",l:"Identitat per la consci\xE8ncia"},hume:{g:"Feix de percepcions",l:"Jo com a feix"},kant:{g:"Subjecte transcendental",l:"Subjecte transcendental"},nietzsche:{g:"El cos",l:"El cos"}}},{r:"\xC8tica",a:{platon:{g:"B\xE9 i ra\xF3",l:"Virtut = coneixement"},descartes:{g:"Provisional",l:"Moral provisional"},locke:{g:"B\xE9 i ra\xF3",l:"Llei natural"},hume:{g:"Sentiment i conseq\xFC\xE8ncies",l:"Sentiment"},kant:{g:"B\xE9 i ra\xF3",l:"Deure formal"},mill:{g:"Sentiment i conseq\xFC\xE8ncies",l:"Utilitarisme"},nietzsche:{g:"Cr\xEDtica de la moral",l:"Superhome"},nussbaum:{g:"B\xE9 i ra\xF3",l:"Capacitats i dignitat"}}},{r:"Pol\xEDtica i societat",a:{platon:{g:"Govern dels savis",l:"Polis dels fil\xF2sofs"},locke:{g:"Liberalisme",l:"Pacte i drets"},hume:{g:"Convenci\xF3",l:"Utilitat i convenci\xF3"},kant:{g:"Liberalisme",l:"Autonomia i dignitat"},mill:{g:"Liberalisme",l:"Llibertat individual"},nietzsche:{g:"Cr\xEDtica de la moral",l:"Contra la moral greg\xE0ria"},nussbaum:{g:"Liberalisme",l:"Capacitats com a drets m\xEDnims"}}}],p:[{k:["descartes","locke"],n:"Descartes defensa idees innates i parteix de la ra\xF3; Locke ho nega i parteix de l\u2019experi\xE8ncia. \xC9s l\u2019enfrontament cl\xE0ssic entre racionalisme i empirisme."},{k:["hume","locke"],n:"Tots dos s\xF3n empiristes, per\xF2 Hume porta l\u2019empirisme fins al final: rebutja la subst\xE0ncia i la causalitat necess\xE0ria, que Locke encara accepta en bona part."},{k:["hume","kant"],n:"Hume desperta Kant del \xABson dogm\xE0tic\xBB. Kant accepta que tot comen\xE7a en l\u2019experi\xE8ncia, per\xF2 afirma que l\u2019enteniment hi aporta formes a priori que fan possible la causalitat."},{k:["descartes","hume"],n:"Descartes busca una certesa fonamental; Hume conclou que nom\xE9s tenim h\xE0bit i probabilitat. Difereixen sobre el jo: res cogitans enfront d\u2019un feix de percepcions."},{k:["kant","mill"],n:"Dues \xE8tiques rivals: Kant jutja per la intenci\xF3 i el deure (imperatiu categ\xF2ric); Mill, per les conseq\xFC\xE8ncies (felicitat del major nombre)."},{k:["mill","nussbaum"],n:"Nussbaum parteix de Mill per\xF2 el critica: sumar utilitat pot sacrificar persones concretes; cal garantir un llindar de capacitats a cadasc\xFA."},{k:["kant","nussbaum"],n:"Coincideixen en la dignitat i en tractar cada persona com a fi. Nussbaum la concreta en capacitats materials (salut, educaci\xF3, control del propi entorn)."},{k:["locke","nussbaum"],n:"Tots dos s\xF3n liberals: drets de les persones i l\xEDmit al poder. Locke parla de drets naturals; Nussbaum, d\u2019un m\xEDnim de capacitats que l\u2019Estat ha de garantir activament."},{k:["kant","nietzsche"],n:"Nietzsche critica la moral del deure universal com a moral d\u2019esclaus; Kant la considera la base de la dignitat."},{k:["mill","nietzsche"],n:"Tots dos defensen la individualitat, per\xF2 Mill ho fa dins del principi del dany i de la utilitat general; Nietzsche, per superar la moral greg\xE0ria."},{k:["descartes","platon"],n:"Tots dos s\xF3n dualistes (\xE0nima/cos i dos m\xF3ns o dues subst\xE0ncies) i racionalistes: la veritat s\u2019assoleix amb la ra\xF3, no amb els sentits."},{k:["nussbaum","platon"],n:"Tots dos pensen la pol\xEDtica des del b\xE9 hum\xE0 i la vida plena. Plat\xF3 confia el govern als savis; Nussbaum garanteix capacitats a tothom en una democr\xE0cia."},{k:["kant","locke"],n:"Tots dos defensen drets i una societat de persones lliures. Locke ho fonamenta en el pacte i la llei natural; Kant, en l\u2019autonomia i la dignitat."}]},sim:[{t:"Model 1",a:{k:"kant",frag:"Una persona amb voluntat bona no pregunta qu\xE8 li conv\xE9, sin\xF3 si la norma que segueix podria ser una llei per a tothom. Si actuem nom\xE9s pels resultats que ens agraden, l\u2019acci\xF3 pot ser \xFAtil, per\xF2 no t\xE9 valor moral: nom\xE9s en t\xE9 el que es fa per deure i tractant la humanitat com una finalitat.",expr:[["voluntat bona","la que actua per deure i no per inter\xE8s o inclinaci\xF3"],["deure","necessitat d\u2019actuar per respecte a la llei moral"]],res:"Per a Kant una acci\xF3 \xE9s moral si prov\xE9 del deure i la seva m\xE0xima es pot voler com a llei universal. L\u2019imperatiu categ\xF2ric mana sense condicions i exigeix tractar la humanitat sempre com a fi i mai nom\xE9s com a mitj\xE0."},b:{k:"mill",frag:"La societat no t\xE9 dret a obligar ning\xFA a viure d\u2019una manera determinada pel seu propi b\xE9. Nom\xE9s quan l\u2019acci\xF3 d\u2019una persona fa mal als altres \xE9s just intervenir-hi. I el que \xE9s bo per a la col\xB7lectivitat es mesura per la felicitat que produeix, de la qual cadasc\xFA \xE9s el millor jutge.",expr:[["dany a tercers","perjudici que una acci\xF3 causa a altres persones, \xFAnic motiu per limitar la llibertat"],["felicitat","plaer i abs\xE8ncia de dolor, criteri \xFAltim de l\u2019utilitarisme"]],res:"Mill \xE9s utilitarista: l\u2019acci\xF3 correcta \xE9s la que promou la felicitat del major nombre, i els plaers difereixen en qualitat. En pol\xEDtica en deriva el principi del dany: nom\xE9s es pot limitar la llibertat d\u2019alg\xFA per evitar un perjudici als altres."},apl:0,e3:["kant","mill"]},{t:"Model 2",a:{k:"descartes",frag:"Si volem una ci\xE8ncia ferma, hem de rebutjar com a fals tot all\xF2 de qu\xE8 es pugui dubtar, encara que sigui poc. Per\xF2 mentre dubto no puc dubtar que dubto: la certesa que s\xF3c una cosa que pensa \xE9s tan s\xF2lida que cap hip\xF2tesi d\u2019engany no la pot sacsejar.",expr:[["hip\xF2tesi d\u2019engany","suposici\xF3 extrema (el geni maligne) que serveix per portar el dubte al l\xEDmit"],["cosa que pensa","subst\xE0ncia pensant, l\u2019\xE0nima, la primera realitat que es coneix amb certesa"]],res:"Descartes busca una certesa que resisteixi qualsevol dubte. Posa en q\xFCesti\xF3 els sentits, la vig\xEDlia i fins i tot les matem\xE0tiques, per\xF2 en dubtar descobreix que pensa, i per tant que existeix: el cogito \xE9s el fonament de tot el sistema."},b:{k:"hume",frag:"Quan veiem que una bola en toca una altra i aquesta es mou, nom\xE9s percebem dos fets seguits. La for\xE7a que els lliga no la veiem enlloc. L\u2019esperit, avesat a veure-ho repetit, espera l\u2019efecte tan bon punt apareix la causa, i en conclou, sense cap prova, que hi ha una connexi\xF3 necess\xE0ria.",expr:[["connexi\xF3 necess\xE0ria","vincle que faria que un efecte hagu\xE9s de seguir sempre una causa"],["avesar-se (h\xE0bit)","tend\xE8ncia a esperar que es repeteixi el que s\u2019ha vist repetit"]],res:"Hume sost\xE9 que de la causalitat nom\xE9s observem successi\xF3 i conjunci\xF3 constant; la idea de connexi\xF3 necess\xE0ria ve de l\u2019h\xE0bit amb qu\xE8 la ment espera que el passat es repeteixi. No \xE9s una relaci\xF3 d\u2019idees ni es pot demostrar sense circularitat."},apl:1,e3:["descartes","hume"]},{t:"Model 3",a:{k:"platon",frag:"Qui ha sortit de la caverna i ha contemplat el Sol no vol tornar a les ombres, per\xF2 ha de baixar a educar els altres. Nom\xE9s ell sap qu\xE8 \xE9s el b\xE9, i per aix\xF2 ha de dirigir la ciutat; els qui nom\xE9s tenen opinions es deixen portar per les ombres i les aparences.",expr:[["sortir de la caverna","ascens de l\u2019\xE0nima del m\xF3n sensible al m\xF3n intel\xB7ligible"],["opini\xF3","coneixement imperfecte del m\xF3n sensible, enfront de la ci\xE8ncia"]],res:"Plat\xF3 defensa que governar \xE9s una tasca de coneixement: nom\xE9s qui ha sortit de la caverna i ha vist la Idea del B\xE9 sap qu\xE8 \xE9s realment just i pot orientar-hi la ciutat. L\u2019opini\xF3 no basta, perqu\xE8 nom\xE9s capta el m\xF3n sensible, que canvia."},b:{k:"locke",frag:"En n\xE9ixer no portem escrits principis ni idees: la nostra ment \xE9s com un paper en blanc. Tot el que hi trobem despr\xE9s, des de la idea de blanc fins a la de felicitat, hi ha entrat pels sentits o per la reflexi\xF3 sobre el que fa la nostra pr\xF2pia ment.",expr:[["paper en blanc","ment sense idees innates abans de l\u2019experi\xE8ncia (tabula rasa)"],["reflexi\xF3","percepci\xF3 de les operacions de la pr\xF2pia ment, segona font de les idees"]],res:"Locke afirma que no hi ha idees innates: la ment comen\xE7a com un full en blanc i s\u2019omple d\u2019idees que venen de la sensaci\xF3 i de la reflexi\xF3. Aquesta tesi empirista fonamenta tamb\xE9 la seva defensa de la toler\xE0ncia i dels drets naturals."},apl:2,e3:["platon","locke"]},{t:"Model 4",a:{k:"nietzsche",frag:"Els febles han anomenat bo all\xF2 que els ajuda a suportar la seva impot\xE8ncia, i dolent all\xF2 que \xE9s fort i es mostra. Quan l\u2019\xE9sser hum\xE0 deixa de creure en D\xE9u, els valors perden fonament, i cal que alg\xFA tingui l\u2019aud\xE0cia de crear-ne de nous en lloc d\u2019ob
