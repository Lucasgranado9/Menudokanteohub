ment, i són aquestes les que hem d'analitzar. Segons el seu origen diferencia tres classes d'idees seguint la regla de l'anàlisi:<\/p>\n<ul>\n<li>Idees <i>adventícies<\/i> , que són les que semblen provenir de la nostra experiència externa, dels sentits, com ara, les idees de cavall, d'ésser humà, etc. No podem assegurar d'on provenen perquè encara no s'ha demostrat l'existència de la realitat exterior, i per això diem \"semblen provenir\".<\/li>\n<li>Idees <i>factícies<\/i> , que són les que construïm tot combinant diferents idees adventícies, com ara, les idees de centaure, de quimera, de sirena, etc.<\/li>\n<li>Idees <i>innates<\/i> , que no procedeixen de l'experiència ni de la combinació d'altres idees sinó que se'ns imposen de manera necessària sense que hi puguem fer res, de forma que hem d'acceptar que procedeixen de la mateixa naturalesa de l'enteniment: la idea d'infinit, la idea d'existència, etc.<\/li>\n<\/ul>\n<p>Ja sabem que existim, que som una cosa pensant, que el nostre pensament recau sobre les idees i que hi ha diversos tipus d'idees. Cap a on ha d'orientar ara Descartes la seva investigació? Evidentment cap a la justificació de l'existència de la realitat exterior. Per a la filosofia anterior, el procés normal era intentar demostrar l'existència del món i després, a partir d'aquí, donar proves de l'existència de Déu. En canvi, Descartes orienta la seva investigació cap a la demostració de l'existència de Déu. Per què aquest canvi? Perquè s'adona que les idees factícies i adventícies poden ser una creació del seu pensament, mentre que la idea d'infinit, que Descartes identificarà amb Déu, és l'única que es resisteix a ser-ho.<\/p>\n<figure><img loading=\"lazy\" src=\"filo/descartes_03.jpg\" alt=\"\"><\/figure>\n<p><i>Les Coordenades Cartesianes: Un Invent de Descartes<\/i><\/p>\n<aside class=\"nota\"><p>L’any 1637, el filòsof i matemàtic francès René Descartes va revolucionar el món de la geometria amb la publicació de la seva obra *La Géométrie*. En aquest llibre, va introduir el sistema de coordenades cartesianes, una eina matemàtica que transformaria per sempre la manera d’entendre i representar l’espai.<\/p><p>La seva idea va sorgir de l’intent de connectar l’àlgebra amb la geometria, dues disciplines que fins aleshores es consideraven separades. Descartes va proposar utilitzar dos eixos perpendiculars –el que avui anomenem eix ‘x’ (horitzontal) i eix ‘y’ (vertical)– per localitzar punts en un pla mitjançant parelles ordenades de números. Aquest sistema permetia representar equacions algebraiques com línies i corbes geomètriques.<\/p><p>El geni de Descartes no només va marcar un abans i un després en les matemàtiques, sinó que també va posar les bases per al desenvolupament del càlcul i la física moderna. Gràcies al seu mètode, avui podem traçar gràfics, analitzar trajectòries i explorar dimensions més enllà del pla.<\/p><\/aside>", "min": 15}, {"n": 3, "num": "3.1.4", "title": "La realitat: L'existència del jo, de Déu i del món", "subs": [{"id": "s3-1", "num": "3.1", "title": "Déu"}, {"id": "s3-2", "num": "3.2", "title": "Noció de substància"}, {"id": "s3-3", "num": "3.3", "title": "El món físic, substància extensa"}, {"id": "s3-4", "num": "3.4", "title": "La concepció mecanicista del món"}], "html": "<h3 id=\"s3-1\"><span class=\"n\">3.1<\/span>Déu<\/h3>\n<p>Descartes enceta la recerca sobre la realitat analitzant la idea de Déu. En primer lloc, la defineix de la següent manera: \"pel mot Déu entenc una substància infinita, eterna, immutable, independent, omniscient, omnipotent, per la qual jo mateix i totes les altres coses que existeixen (si n'existeixen algunes) han estat creades i produïdes\". Aquesta definició implica que la idea de Déu no és una idea adventícia, ja que no tenim cap experiència empírica directa d'un ésser amb aquestes característiques; però tampoc no és una idea factícia, perquè, per exemple, amb la suma de diferents idees de finitud no es pot crear la idea d'infinitud. Accepta, doncs, que és una idea innata.<\/p>\n<p>Una vegada assumit això intenta, en segon lloc, demostrar com és possible que la idea de Déu sigui innata. ¿Per què la necessita, aquesta demostració? Perquè si aconsegueix demostrar que Déu existeix i que és la causa de la seva idea de Déu, podrà garantir la seva pròpia existència com a subjecte que pensa en els moments que no ho faci i, a més, l'existència del món que encara ara és dubtosa.<\/p>\n<figure><img loading=\"lazy\" src=\"filo/descartes_04.jpg\" alt=\"\"><\/figure>\n<p>Descartes utilitza dos tipus d'arguments: els basats en el principi de causalitat i l'anomenat \"argument ontològic\". Tots ell partirà de la seva pròpia existència com a ésser pensant, en oposició a la tradició escolàstica -concretament Sant Tomàs-que partia de l'existència del món sensible per a trobar en Déu la causa primera d'aquest món. El principi de causalitat diu que \"tota causa produeix un efecte o tot efecte és produït per una causa\". Descartes el matisa afegint que ha d'haver-hi, com a mínim, tanta realitat en la causa com en l'efecte, ja que: d'on pot l'efecte treure la seva realitat, si no és de la causa? I com pot aquesta causa comunicar l'efecte, si no el tingués ella mateixa? Hi ha dos arguments basats en aquest principi: el de la idea d'infinit i el de l'existència del jo:<\/p>\n<p>1. El primer parteix de la seva definició de Déu com a substància infinita: podem pensar que la idea de substància puc haver-la creat jo perquè jo en soc una; però què passa amb la idea d'infinit? No pot provenir de mi perquè soc un ésser finit i, per tant, ha hagut d'estar posada en mi (tot efecte és produït per una causa) per una substància que sigui vertaderament infinita (hi ha d'haver tanta realitat en la causa com en l'efecte). Aquesta substància ha de ser Déu, tal com s'ha definit més amunt.<\/p>\n<p>2. El segon argument parteix de la pregunta: a qui dec la meva existència? No pot ser deguda a mi mateix perquè si ho fos m'hauria creat perfecte i, en canvi, no ho soc perquè, entre altres coses, dubto; no pot ser deguda tampoc als meus pares, perquè ells, com a molt, han contribuït posant certes disposicions en el meu cos, però això no significa que ells m'hagin fet com a cosa que pensa (que és l'únic que Descartes concep de forma evident fins ara); si fos deguda a un ésser inferior a Déu, llavors la causa del meu ésser tindria una causa també imperfecta i així successivament. Per tant, dec la meva existència a Déu, que és un ésser perfecte.<\/p>\n<p><i>Meditacions metafísiques<\/i> Les objeccions que els seus contemporanis van plantejar a la prova de la causalitat es basen en el fet que la idea de \"perfecció\" és possible que es formi per una elevació de graus (una cosa bona, per exemple, ens la podem imaginar millor encara); en aquest cas no seria deguda a cap ésser perfecte que l'hagués posat en nosaltres.<\/p>\n<p>A més, aquests crítics hi afegeixen que hi ha causes que no contenen tanta perfecció com els seus efectes, per exemple, la terra i la pluja produeixen plantes i animals amb qualitats que elles no posseeixen. Així, si alguna cosa menys perfecta pogués ser la causa d'allò més perfecta, l'argument cartesià s'enfonsaria. En tercer lloc, se li va objectar que la idea de Déu, que ell troba en el seu esperit, no és una idea innata sinó que l'ha rebut de la tradició i, per consegüent, pot tenir tots els defectes que tenien els prejudicis que ell ha descartat mitjançant el dubte metòdic. Encara hi ha d'altres objeccions que posen l'èmfasi en què Descartes basa les seves dues proves en el principi de causalitat, que va donar per vàlid sense haver-lo examinat, tal com exigia l'actitud rigorosa que s'havia imposat.<\/p>\n<p>L'altra demostració que Descartes introdueix a les Meditacions Metafísiques és una nova versió de l'argument ontològic, exposat per Sant Anselm al segle XI. Aquest argument parteix de la definició de Déu com a ésser summament perfecte i, per tant, entre les seves perfeccions ha d'incloure l'existència. La seva existència és, en ell, inseparable de la seva essència, com és inseparable de l'essència d'un triangle que la magnitud dels seus tres angles sigui igual a dos rectes, o com la idea de vall és inseparable de la idea de muntanya. Si Déu només existís a la meva ment, però no a la realitat, seria una limitació de les seves perfeccions, per la qual cosa, dir que Déu és l'ésser summament perfecte, però que no existeix realment és caure en una contradicció lògica.<\/p>\n<figure><img loading=\"lazy\" src=\"filo/descartes_05.jpg\" alt=\"\"><\/figure>\n<p>Així doncs, per a Descartes és evident que Déu existeix. Al segle XVIII, Kant considerarà que l'argument ontològic és un raonament abusiu, perquè del fet de pensar Déu com un ésser que existeix necessàriament no es desprèn que aquest ésser existeixi necessàriament fora del meu pensament. Després que Descartes ha demostrat l'existència de Déu, pot assegurar definitivament que algunes coses de les quals havia dubtat són realment certes i també que el seu criteri de veritat té fonament: si percep alguna cosa clara i distinta, aquesta serà verdadera perquè Déu no pot voler que ell s'enganyi, perquè l'engany és part de la imperfecció.<\/p>\n<p>Així, a les Meditacions escriu: \"tinc en mi una certa facultat de jutjar o discernir el ver del fals, que sens dubte he rebut de Déu, com tot allò que hi ha en mil jo posseeixo\". No obstant això, és evident que, de vegades, ens equivoquem i que, per tant, l'error existeix tot i que aquest només pot ser fruit de la imperfecció humana. Així doncs, per no equivocar-se es fa palesa la necessitat del mètode. Un cop demostrada l'existència de Déu, Descartes rebutja la seva anterior hipòtesi de l'esperit maligne; encara li queda, però, revisar tot allò que havia qüestionat en relació amb el món.<\/p>\n<h3 id=\"s3-2\"><span class=\"n\">3.2<\/span>Noció de substància<\/h3>\n<p>Seguint a Descartes poden interpretar que el primer que una persona pot conèixer amb certesa absoluta és tant que pensa, existeix i que és una \"cosa que pensa\". En relació amb aquesta darrera expressió considera que la paraula \"cosa\" (res, en llatí) és sinònima del concepte \"substància\". I en tant que una cosa és allò concret existent, defineix la substància com \"una cosa que existeix, de tal manera que no té necessitat sinó de si mateixa per existir\". Així, \"substància\" s'aplica a tot allò que existeix i que deu la seva existència a si mateix. Però, en sentit estricte, aquesta definició només seria vàlida per a Déu, i per això Descartes afegeix que una substància també és allò que només necessita Déu per existir. A partir d'aquest matís es pot entendre que parli de dos tipus de substància, la substància infinita, Déu, i les substàncies finites, les ànimes i els cossos. Per explicar les diferències entre les substàncies finites, Descartes introdueix dos conceptes nous l'atribut i el mode. El cos i l’ànima es diferencien pels seus atributs respectius, l’extensió i el pensament. Dir que tot cos és extens, és a dir, que ocupa un espai, vol dir que té alçada, amplada i profunditat (qualitats físiques) que constitueixen els seus modes. Igualment, dir que l'ànima és pensament vol dir que és capaç d'opinar, d'imaginar, jutjar (qualitats espirituals), que també constitueixen els seus modes. Per tant, l'atribut és la característica essencial de la substància i els modes són les qualitats dels atributs.<\/p>\n<figure><img loading=\"lazy\" src=\"filo/descartes_06.jpg\" alt=\"\"><\/figure>\n<p>Recapitulant, doncs, l'estructura de la realitat per a Descartes abasta: Déu com a substància infinita (res infinita), l'ànima com a substància pensant (res cogitans) i el cos com a substància extensa (res extensa). Per què considera Descartes que l'atribut de l'ànima és el pensament? Perquè si l'ànima és allò que constitueix la meva essència i jo puc imaginar-me a mi mateix sense cos, però no sense pensament, l’ànima es manifesta com a pensament. El cos, en canvi, constitueix les coses materials i es manifesta com a extensió. Després de clarificar quina és l'estructura de la realitat i havent demostrat que Déu existeix i que el pensament també, Descartes ha de demostrar l'existència dels cossos, el món, i per això, examina aquell altre tipus d'idees que tenim a la ment: les idees adventícies, aquelles que semblen tenir la seva causa en el món. La pregunta és ¿existeixen realment coses fora de la meva ment que siguin la causa d'aquestes idees, com, per exemple, el meu cos?<\/p>\n<h3 id=\"s3-3\"><span class=\"n\">3.3<\/span>El món físic, substància extensa<\/h3>\n<p>Si apliquem les regles del mètode al món corpori, llavors l'existència de les coses materials esdevé problemàtica perquè no les percebem clarament ni distintament. Tenim dues opcions: o bé negar aquest món i admetre només l'existència de l'ànima i de Déu o bé intentar demostrar l'existència de les coses materials. Descartes abandona la primera possibilitat per inviable i resol la segona amb una argumentació racional basada en la veracitat divina. L'argument és el següent: \"No puc dubtar que hi ha en mi una facultat passiva de sentir, és a dir, de rebre i reconèixer les idees de les coses sensibles. Aquesta facultat seria inútil si no hi hagués en mi, o en alguna altra cosa, una altra facultat activa capaç de formar i produir aquestes idees. Però, pel fet que aquesta facultat activa no pot estar en mi, com a ésser que pensa, perquè no pressuposa el meu pensament sinó que aquestes idees se m'han presentat molts cops sense que jo hi faci res fins i tot, en contra dels meus desitjos, llavors aquesta facultat ha de trobar-se necessàriament en alguna substància diferent de mi.\" I aquesta substància és o bé un cos -una naturalesa corpòria- o Déu, o alguna altra criatura més noble que el cos. Ara bé, si Déu m’ha donat una poderosa inclinació a creure que les idees parteixen de les coses corporals no veig com podria disculpar-se l'engany si aquestes idees partissin d'una altra causa que no fossin les corporals perquè Déu no és capaç d'enganyar-me (és veraç). La conclusió és doncs que les coses corporals existeixen, tot i que potser no siguin tal com les percebem pels nostres sentits perquè hi ha moltes coses que fan que la percepció dels sentits sigui fosca i confusa...<\/p>\n<figure><img loading=\"lazy\" src=\"filo/descartes_07.jpg\" alt=\"\"><\/figure>\n<p>Ara bé, què és allò que, de manera evident, captem de les coses? Descartes, com a bon racionalista influenciat per la geometria, afirma que és la seva corporeïtat en tant que les coses són per definició extensa. Allò que defineix la substància corporal és el fet de ser extensa, de posseir longitud amplada i profunditat i, per tant, només podem saber amb certesa dels cossos tot allò que té a veure amb les seva geomatització. Totes les altres qualitats que definien un cos, com ara la seva olor, color, gust, etc. (qualitats secundàries) són dubtoses perquè no es presenten de forma tan clara evident com la figura el moviment (a repòs), allò que Descartes considera els modes fonamentals de la substància extensa. Conclusió: el món extern existeix, però la seva extensió és l'únic que podem conèixer amb evidència<\/p>\n<h3 id=\"s3-4\"><span class=\"n\">3.4<\/span>La concepció mecanicista del món<\/h3>\n<p>La concepció geomètrica de la realitat, definida com a extensió, el porta reduir el món físic a matèria extensa i moviment (qualitats primàries), i a negar el buit i les qualitats secundàries (olors colors, sabors...). Descartes torna aquí al clàssic tema de l'explicació de com és possible el moviment, el canvi. Si el món físic només és extensió i moviment, no té cabuda cap mena d'explicació que faci referència a forces ocultes com havien fet alguns renaixentistes, ni a causes finals com havia fet Aristòtil. Com es produeix, doncs, el moviment?<\/p>\n<p>Descartes considera la naturalesa com una gegantesca maquinà construïda per Déu semblant a les màquines dels artesans, però diferent en tant que els engranatges d'aquestes són visibles, mentre que els engranatges dels cossos naturals són invisibles. Aquest univers-màquina inclou també les plantes, els animals i els cossos humans, que no són res més purs mecanismes.<\/p>\n<figure><img loading=\"lazy\" src=\"filo/descartes_08.jpg\" alt=\"\"><\/figure>\n<p>I així ho confirma, per exemple, el descobriment de la circulació de la sang realitzat per Harvey (1628), segons el qual aquesta depèn de les contraccions i dilatacions del cor, i que Descartes explica a la cinquena part del Discurs del Mètode.<\/p>\n<p>I què és el que produeix el moviment en la matèria? Per a Descartes és Déu, el qual la crea amb una quantitat constant de moviment sotmès a un seguit de lleis físiques. A la seva obra Principis de la filosofia (II, 36-40) les enuncia de la següent manera:<\/p>\n<figure><img loading=\"lazy\" src=\"filo/descartes_09.jpg\" alt=\"\"><\/figure>\n<ul>\n<li>(Primera) <i>llei de la inèrcia:<\/i> cada cosa roman en l'estat en què es troba (moviment repòs) si res no la canvia.<\/li>\n<li>(Segona) <i>llei del moviment en línia recta<\/i> : tot cos que es mou tendeix a continuar el seu moviment en línia recta.<\/li>\n<li>(Tercera) <i>llei de la conservació del moviment<\/i> : si un cos que es mou en troba un altre de més fort, no perd res del seu moviment; i si en troba un altre de més feble que pugui ser mogut per ell, perd tant de moviment com en transmet.<\/li>\n<\/ul>\n<p class=\"cap\"><b>El Mundo. Alianza<\/b><\/p>", "min": 12}, {"n": 4, "num": "3.1.5", "title": "L'ésser humà: la unió de cos i anima", "subs": [{"id": "s4-1", "num": "4.1", "title": "Cos i ànima"}, {"id": "s4-2", "num": "4.2", "title": "La moral provisional"}, {"id": "s4-3", "num": "4.3", "title": "Les accions i les passions"}], "html": "<h3 id=\"s4-1\"><span class=\"n\">4.1<\/span>Cos i ànima<\/h3>\n<p>Sabem que existeix tant el cos com la ment, que el cos és extensió en longitud, amplada i profunditat i que la ment és una substància pensant. La conclusió natural que es deriva d'això en relació amb la pregunta què és l'ésser humà, és que aquest consta de dues substàncies: una extensa, el cos, una altra pensant, l'ànima. De fet, Descartes es troba en una situació difícil perquè l’aplicació de la regla de l'evidència el porta a considerar que ànima i cos són dues substàncies diferents i completes cadascuna, fins i tot pensa que l'ànima li dona la consciència de la seva existència amb més evidència que no pas el cos; però, no vol acceptar la conclusió que sembla derivar-se'n, és a dir, que l'ànima no té cap relació amb el cos.<\/p>\n<p>Descartes admet que hi ha una relació entre cos i ànima i per explicar-la la compara a la que s'estableix entre un pilot i la seva nau: el cos (nau) és una màquina mentre que l'anima (pilot) és allò que la dirigeix i la fa funcionar, l'ànima decideix i el cos executa. No obstant això, Descartes reconeix que hi ha d'haver una relació més estreta que permeti explicar els sentiments com el de la por o l’amor, que afecten tant l'anima com el cos. Com a solució, afirma que entre l'ànima i el cos no hi ha una simple relació sinó una autèntica unió, tot i que aquesta és accidental, és a dir, ambdues substàncies juntes constitueixen l'ésser humà i la mort representa la seva separació (dissolució del cos i permanència de l'ànima). Com es produeix aquesta unió? La seva solució és tant original com insuficient: afirma que la connexió es produeix a la glàndula pineal (la hipòfisi). Aquest problema va ser reprès pels racionalistes posteriors i constitueix el que s'anomena \"problema de la interacció entre les substàncies\".<\/p>\n<figure><img loading=\"lazy\" src=\"filo/descartes_10.jpg\" alt=\"\"><\/figure>\n<aside class=\"nota\"><p><b>Esquema del cap, concretament un esbós de la glàndula<\/b> <b>on descartes creia que estava la res cogitans.<\/b><\/p><\/aside>\n<h3 id=\"s4-2\"><span class=\"n\">4.2<\/span>La moral provisional<\/h3>\n<p>Quan Descartes comença el seu procés personal i filosòfic de recerca de coneixements vertaders s'adona que mentrestant haurà de respondre la pregunta com he de viure. I és per això que al Discurs accepta seguir unes regles de conducta que, tot i no ser resultat del mètode, prendrà com a provisionals i necessàries per conviure amb els altres. Com que després no va tornar a revisar-les per fer la versió definitiva, hem de considerar-les com les seves idees ètiques. Així Descartes es planteja una moral provisional que sigui eminentment pràctica. Es proposa seguir tres regles:<\/p>\n<p>1. La primera regla és \"obeir les lleis i els costums del meu país\", la qual cosa significa respectar la religió en què s'ha estat educat i tenir en compte les opinions més moderades i assenyades. L'objectiu de Descartes no és, doncs, ni polític ni religiós, sinó que busca la veritat des de la perspectiva filosòfica.<\/p>\n<p>2. La segona regla demana \"ser tan ferm i decidit com pogués en les meves accions\" de forma que fins i tot en les decisions més dubtoses, un cop assumides, hom ha d'obligar-se a seguir-les amb constància.<\/p>\n<p>3. La tercera regla aconsella \"sempre vèncer-me a mi mateix més aviat que a la fortuna\", és a dir, acceptar que tot allò que esdevé en contra dels nostres desitjos és impossible de canviar. El que cal, doncs, és intentar canviar els nostres desitjos abans que les coses que els causen, o dit d'una altra manera, acostumar-se a no desitjar aquells béns que no estiguin al nostre abast.<\/p>\n<p>Aquesta última regla, en consonància amb les altres dues, ens porta a considerar la influència de l'ètica estoica en Descartes, és a dir, aquella ètica que ens parla de paciència davant d'esdeveniments incontrolables, d'autodomini de distinció entre les coses que resten sota el nostre control i les que no.<\/p>\n<h3 id=\"s4-3\"><span class=\"n\">4.3<\/span>Les accions i les passions<\/h3>\n<p>Les idees que acabem de veure necessiten situar-se en el context de les consideracions cartesianes sobre l'ànima i el cos. Descartes distingeix en la vida humana entre accions i passions. Les accions són aquells actes portats a terme per l'individu com a resultat de la capacitat de deliberació de la seva voluntat, és a dir, allò que fem després d'haver sospesat els pros i els contres. Les passions són aquells sentiments, emocions i percepcions que l'individu rep passivament a través del cos, com ara l'amor, la por, el color… Les passions poden portar l'individu cap al bé o cap al mal, perquè exciten desitjos bons i desitjos dolents. Si hom és capaç de diferenciar-los, en cas de triar els bons i dominar els que no li convenen, llavors actuarà moralment bé.<\/p>\n<figure><img loading=\"lazy\" src=\"filo/descartes_11.jpg\" alt=\"\"><\/figure>\n<p>Aquí Descartes mostra una clara tendència cap a l'intel·lectualisme moral (socràtic): si veiem clarament que una cosa és bona, l'escollim. Però no és fàcil descobrir les coses que són realment bones perquè les passions ens enganyen i, de vegades, ens presenten una cosa més desitjable del que és o més difícil d'aconseguir del que pot ser. Per això, actuar malament implica ignorància.<\/p>\n<p>Què cal fer davant d'aquesta situació? Primer de tot saber distingir entre un bon desig que és el que aporta un coneixement vertader de la realitat, i un de dolent. A més acceptar que el millor per a l'ésser humà és aconseguir la tranquil·litat de la nostra ànima i que aquesta depèn del fet que la nostra raó pugui dirigir les nostres passions. I això és possible, si arribem a conèixer quines són les coses que depenen de nosaltres i quines no. Per aconseguir que la raó domini plenament la voluntat i les passions, Descartes recomana la prudència com a virtut.<\/p>\n<aside class=\"nota\"><p>Fragment Text Selectivitat 2023-24 | Sèrie 1 | Opció A:<\/p><p><i>I heus aquí que, mentre parlo, algú atansa aquest tros de cera al foc. El<\/i> <i>que hi quedava de sabor es desprèn, l’olor s’esvaeix, canvia de color,<\/i> <i>perd la forma, augmenta de grandària, es fon, s’escalfa, a penes es pot<\/i> <i>tocar<\/i> <i>i,<\/i> <i>si el palpem, no emet cap so. Subsisteix la mateixa cera,<\/i> <i>després<\/i> <i>d’aquests canvis? Hem de confessar que subsisteix la mateixa<\/i> <i>cera, i ningú no ho pot negar. Què és, doncs, el que coneixíem tan<\/i> <i>distintament d’aquell tros de cera?<\/i><\/p><p><i>Certament, no pot ser res del que he notat mitjançant els sentits, ja que<\/i> <i>totes les coses percebudes pel gust, l’olfacte, la vista, el tacte o<\/i> <i>l’oïda han canviat i, malgrat tot, continua havent-hi la mateixa cera.<\/i> <i>Potser és el que ara penso, això és: que la cera no era ni aquesta dolçor<\/i> <i>de<\/i> <i>mel,<\/i> <i>ni<\/i> <i>aquesta<\/i> <i>agradable<\/i> <i>olor<\/i> <i>de<\/i> <i>flors, ni aquesta blancor, ni<\/i> <i>aquesta figura, ni aquest so, sinó tan sols un cos que poc abans se’m<\/i> <i>manifestava sota aquestes formes i, ara, sota unes altres. Però què és,<\/i> <i>parlant amb precisió, el que jo imagino quan la concebo d’aquesta manera?<\/i> <i>Considerem-ho atentament i, apartant totes les coses que no pertanyen a<\/i> <i>la<\/i> <i>cera,<\/i> <i>vegem<\/i> <i>què<\/i> <i>en<\/i> <i>resta.<\/i> <i>Certament,<\/i> <i>només<\/i> <i>alguna<\/i> <i>cosa<\/i> <i>extensa,<\/i> <i>flexible i mutable. […]<\/i><\/p><p><i>Però<\/i> <i>què<\/i> <i>és<\/i> <i>aquest<\/i> <i>tros<\/i> <i>de<\/i> <i>cera<\/i> <i>que<\/i> <i>només<\/i> <i>pot<\/i> <i>ser<\/i> <i>comprès<\/i> <i>per<\/i> <i>l’enteniment o per l’esperit? Sens dubte, és el mateix que veig, que<\/i> <i>toco, que imagino; en fi, és el mateix que conec des del començament. Ara<\/i> <i>bé, el que cal remarcar amb força és que la percepció del tros de cera no<\/i> <i>és en absolut una visió, ni un tacte, ni una imaginació (i no ho ha estat<\/i> <i>mai, tot i que abans ho semblés), sinó una inspecció de l’esperit […].<\/i><\/p><p>René Descartes, Meditacions metafísiques, II<\/p><\/aside>", "min": 7}]}, {"id": 3, "key": "locke", "title": "Locke", "full": "John Locke", "dates": "1632 – 1704", "era": "Empirisme", "tag": "L’experiència com a origen del coneixement i l’estat liberal", "hue": 150, "obres": "Assaig sobre l’enteniment humà, Carta sobre la tolerància", "secs": [{"n": 1, "num": "3.6.1", "title": "Vida, obra i objectius", "subs": [], "html": "<p>va néixer al poble de Wrington, prop de Bristol, el 29 d'agost de 1632. Li va tocar viure un període de lluites polítiques entre la monarquia absoluta i la nova classe burgesa representada pel Parlament, que van donar lloc a les revolucions angleses del segle XVII, i en les que es van forjar moltes de les que més endavant van inspirar els il·lustrats francesos del segle XVIII. Quan té 10 anys esclata la revolució puritana (1642). La seva família era d'ideologia liberal, era el fill d'un advocat i petit propietari que, quan la guerra civil va esclatar, va servir com a capità de cavalleria en l'exèrcit parlamentari, i en aquest ambient es va educar durant 14 anys.<\/p>\n<p>Recordem que el Parlament, dirigit per Cronwell, va derrotar el rei Carles I i el va condemnar a mort tot executant-lo l'any 1648. Un any abans, en 1647, Locke va ser enviat a la prestigiosa Escola de Westminster a Londres, sota el patrocini d'Alexander Popham, un membre del Parlament i excomandant del seu pare. Finalitzats els seus estudis en aquesta escola, en la tardor de 1652 ingressarà en el Christ Church, en aquells dies el més important \"college\" de la Universitat d'Oxford. L'educació a Oxford estava llavors sota el predomini de l'escolàstica aristotelizante, cosa que no resultava del gust de Locke (el que tampoc havia resultat del grat, anteriorment, de Hobbes). Allà, a més d'estudiar filosofia (on mentalment lògica i metafísica), aprofundirà els seus estudis de les llengües clàssiques, però també s'interessarà per la física i la química (entrant en contacte amb R. Boyle i el seu cercle), així com per la medicina, en la qual s'iniciarà amb T. Sydenham, encara que no obtindrà la titulació fins a 1674.<\/p>\n<p>Un cop finalitzats els seus estudis romandrà a Oxford, impartint classes com a Lector de grec en el Christ Church des de 1660, i també de Retòrica des de 1663. En 1665 va ingressar en el servei diplomàtic i en 1667 entrarà al servei de Lord Ashley (futur Comte de Shaftesbury), un dels fundadors del partit liberal dels Whigs, que va exercir gran influència sobre les idees polítiques de Locke. Locke es va involucrar en la política quan Shaftesbury es va convertir en Lord Canceller el 1672. i amb ell compartirà les vicissituds polítiques durant la monarquia dels Estuard, exercint diversos càrrecs de responsabilitat al seu servei.<\/p>\n<p>La caiguda política de Shaftesbury i, en part, la seva delicada salut, el van portar primer a Oxford, on va acabar els seus estudis de Medicina i va obtenir la titulació i llicència per al seu exercici, i posteriorment a França, on va viure de 1675-1680, on passa a ser membre actiu de l'oposició al rei catòlic Carles II, i entra en contacte amb dissidents i heterodoxos i els cercles filosòfics de l'època (cartesians i llibertins), rebent, sobretot, l'influx de la filosofia de Gassendi. En tornar a Anglaterra tornarà a entrar al servei de Lord Shaftesbury. Al voltant d'aquest temps, Locke va compondre la major part dels Dos Tractats sobre el Govern. Si bé es pensava que Locke va escriure els Tractats per defensar la Revolució Gloriosa de 1688,<\/p>\n<p>John Locke estudis recents han demostrat que l'obra va ser composta molt abans d'aquesta data, i que ara es veu com un argument més general contra la monarquia absoluta (en particular, com el que defensa per Robert Filmer i Thomas Hobbes) i el consentiment individual com a base de la legitimitat política.<\/p>\n<p>Però la ja definitiva derrota política de Lord Shaftesbury l'obligarà de nou a abandonar Anglaterra, sota la forta sospita de participació en la Conspiració de la casa de Rye, encara que hi ha poca evidència per suggerir que ell va estar directament involucrat. Refugiat als Països Baixos, on romandrà de 1683-1689, Locke centra les seves reflexions al voltant de la idea que Anglaterra estava a punt de trencar amb l'absolutisme monàrquic, per esdevenir la terra de les llibertats individuals i amb poder d'elecció dels seus representants polítics. Va tenir temps de tornar als seus escrits, i dedica gran quantitat de temps en tornar a treballar en les obres que li obririen les portes de la fama, L'assaig sobre l'enteniment humà, de caràcter filosòfic, i<\/p>\n<p>L'assaig sobre el govern civil on plasma el seu pensament polític. Cal destacar també la Carta sobre la tolerància entre les seves obres escrites en aquesta època. Va tornar a la seva terra natal en 1688, quan Guillem d'Orange va desembarcar a Anglaterra per enderrocar als Estuards i acomplir les paraules inscrites en les seves banderes: per la llibertat, per la religió protestant i pel Parlament. D'aquesta manera Anglaterra, gràcies a la Revolució Gloriosa de 1688, es va convertir en la primera monarquia constitucional. Des de llavors, Locke es va convertir en el representant intel·lectual i al defensor filosòfic del nou règim liberal, a més de ser nomenat pel rei Guillem perquè exercís el ministeri de Comerç En 1691 es retirarà a Oates, a Essex. Allà s'instal·larà a la mansió de Sir Francis i Lady Masham (una de les primeres dones angleses que va publicar obres filosòfiques, i va mantenir correspondència filosòfica amb Locke i Leibniz, publicant a més la primera biografia de Locke), a la qual havia conegut de soltera com Damaris Cudworth el 1682, poc abans del seu exili, i amb qui va mantenir una relació afectiva i intel·lectual fins a la seva mort, el 28 d'octubre de 1704.<\/p>\n<p>El seu tarannà liberal i el seu esperit aventurer el van portar a viure amb intensitat tots els successos revolucionaris de l'època. Amb el seu Assaig, la teoria del coneixement (la investigació sobre \"l'origen, la certesa i l'extensió del coneixement humà\") esdevé una branca independent de la filosofia (a Descartes no és sinó una introducció al mètode). A més, es pot considerar Locke l'autèntic fundador de l'empirisme: Berkeley i Hume seguiran en el camí obert per ell. D'altra banda, és el primer gran teòric del liberalisme polític. La influència de Locke en la il·lustració francesa serà molt considerable i en el seu pensament polític s'inspira la Constitució dels Estats Units d'Amèrica (ell mateix havia escrit un esbós de constitució liberal per a Carolina).<\/p>", "min": 5}, {"n": 2, "num": "3.6.2", "title": "L'experiència com a origen del coneixement", "subs": [{"id": "s2-1", "num": "2.1", "title": "Les idees i el seu origen"}, {"id": "s2-2", "num": "2.2", "title": "Idees simples"}, {"id": "s2-3", "num": "2.3", "title": "Idees simples de sensació i reflexió alhora"}, {"id": "s2-4", "num": "2.4", "title": "Les idees complexes"}, {"id": "s2-5", "num": "2.5", "title": "Què és conèixer i graus de coneixement"}, {"id": "s2-6", "num": "2.6", "title": "L'existència d'una realitat diferent de les nostres idees"}], "html": "<p>Al principi de l'Assaig Locke explica quin és el seu propòsit. Determina així, per primera vegada, quin és l'objectiu del qual posteriorment s'anomenarà \"teoria del coneixement\" i què en resta exclòs. El mètode emprat per Locke en la seva investigació és el que ell anomena \"mètode històric\"; es tracta, en realitat, d'una anàlisi descriptiva (una espècie \"d'història natural de la ment\": una, enumeració i classificació semblant a la que podria fer un botànic). La finalitat d'aquesta anàlisi és \"conèixer l'abast del nostre coneixement\" i trobar \"l'horitzó que fixa els límits entre les parts il·luminades i obscures de les coses\". Heus aquí, doncs, el que s'anomena la \"raó crítica\", que s'examina a si mateixa per trobar els seus propis límits (enfront de la il·limitació de la raó que postula el racionalisme). Però, en qualsevol cas, Locke té confiança en les possibilitats de coneixement de l'home: \"El llantiol que ens fa llum brilla prou per a tots els nostres quefers.\" Únicament caldrà limitar \"la gosadia de presumir d'un coneixement universal\".<\/p>\n<h3 id=\"s2-1\"><span class=\"n\">2.1<\/span>Les idees i el seu origen<\/h3>\n<figure><img loading=\"lazy\" src=\"filo/locke_00.jpg\" alt=\"\"><\/figure>\n<p>Un cop vist el primer problema que Locke es planteja a l'Assaig, el de l'origen del coneixement; passa a definir la noció d'idea : \"tot allò que la ment percep en si mateixa o és objecte immediat de percepció, de pensament o d'enteniment, això és el que anomeno idea\". Dit d'una altra manera, \"l'objecte del pensament quan un home pensa.\"<\/p>\n<p>La idea és el que la ment contempla: \"Cal que hi hagi alguna cosa que estigui present en la ment com a signe o representació de la cosa que considera: la idea.\" Aquesta és la teoria representativa de Locke: la idea actua d'intermediària entre la cosa i la ment, representa la cosa en la ment i és la idea, no la cosa, la que és objecte de la ment.<\/p>\n<p>Així, posteriorment diu Locke: \"Ja que tot home és conscient de si mateix, que pensa, i, sent allò en què, en pensar, la seva ment s'ocupa de les idees que són allà, no hi ha dubte que els homes tenen en la seva ment idees diverses, com aquelles que s'expressen per les paraules blancor, duresa, dolçor, pensar, moviment, home, elefant, exèrcit, embriaguesa, etc. Així, doncs, el primer que cal esbrinar és com arriba a tenir-les\". A partir d'aquí podem plantejar les dues qüestions de la seva anàlisi de l'Assaig sobre l'enteniment humà:<\/p>\n<p>1. D'on procedeixen les idees? 2. Quina relació tenen les nostres idees amb les coses?<\/p>\n<p>Però abans de respondre les preguntes anteriors, Locke desenvolupa una crítica a la teoria de les idees innates. Descartes considerava que algunes idees eren innates, Locke, en canvi, pensa que tota idea procedeix de l'experiència. Per això, comença refutant l'innatisme dels racionalistes: si existissin idees innates, tothom les hauria de tenir, i això no és cert perquè, per exemple, ni els nens ni els bojos posseeixen la idea d'ànima (Descartes) ni coneixen el principi d'identitat (Leibniz). I, fins i tot, suposant que les poguessin tenir, això no demostra<\/p>\n<p>Entendimiento Humano Locke. Alianza que no les hagin après. Locke afirma que la nostra ment és com un full en blanc ( una tabula rasa) que anem omplint a partir de l'experiència. Però podem distingir dos tipus d'experiència. Una experiència \"externa\", que ens afecta per via de la sensació, i una experiència \"interna\", que ho fa mitjançant la sensació i la reflexió són, doncs, les dues formes d'experiència de les quals deriven totes les nostres idees. Les idees de sensació i de reflexió són anomenades per Locke idees simples i són produïdes per l'experiència directa.<\/p>\n<p>Quan les rep, la ment es comporta passivament (la ment no crea cap idea simple, només en rep). Però a partir de les idees simples, la ment pot formar activament una nova classe d'idees: les idees complexes, que són combinacions d'idees simples. Així sorgeixen tres categories d'idees complexes: modes (propietats), substàncies (suport dels modes) i relacions. Però anem a poc a poc…<\/p>\n<figure><img loading=\"lazy\" src=\"filo/locke_01.jpg\" alt=\"\"><\/figure>\n<p class=\"cap\"><b>Tabula rasa<\/b><\/p>\n<h3 id=\"s2-2\"><span class=\"n\">2.2<\/span>Idees simples<\/h3>\n<p>Segons Locke, les idees simples són aquelles que la ment rep passivament. Són idees indivisibles i completes, però no són pas sempre clares; són sense barreja, homogènies i no-analitzables: hom no pot, per tant, ni definir-les ni explicar-les. Hom no pot tampoc comunicar-les, ni conèixer-les sense experiència personal.<\/p>\n<p>Dades immediates de l'experiència, aquestes idees són els únics materials del nostre pensament. La sensació és l'origen de les idees que procedeixen de l'experiència externa i la reflexió ho és de les que procedeixen de l'experiència interna. Així, Locke distingeix dos tipus d'idees simples: les idees simples de la sensació i les idees simples de la reflexió:<\/p>\n<ul>\n<li><i>Idees simples de sensació:<\/i> \"En primer lloc, els nostres sentits, que tenen tracte amb objectes sensibles particulars transmeten a la ment \"percepcions\" de coses, segons les variades maneres en què són afectats pels objectes.\" La sensació consisteix en la transmissió, a través dels sentits, de les qualitats sensibles dels objectes a la ment, per<\/li>\n<\/ul>\n<p>a la seva percepció (primera font del coneixement); i així es produeixen les idees de color, calor, duresa, sabor, etc. Dins de les idees de sensació, Locke distingeix entre:<\/p>\n<p>- Les idees de les qualitats primàries arriben a la ment per més d'un sentit, i no les podem separar dels cossos perquè es troben realment en la matèria. Són els models (patterns) dels que la percepció ens ofereix \"imatges\" (ressemblances). Aquestes idees són les idees de l'extensió, la figura i el moviment.<\/p>\n<p>- Les idees de les qualitats secundàries arriben a la ment per un sol sentit: la llum i els colors, a través dels ulls; els sorolls, sons i tons, per les orelles; les olors pel nas i els sabors, pel paladar; la calor, el fred i la solidesa, pel tacte... Nosaltres les percebem directament, però aquestes qualitats no són pas realment en els cossos, i les seves aparences varien amb l'abast dels nostres sentits. Per bé que jutgem naturalment que aquestes qualitats són en els cossos, quan no poden ésser percebudes, aquestes qualitats no existeixen pas. Sense un cos i una ànima per poder-les percebre, la calor, el sabor, etc. no existeixen enlloc en el món.<\/p>\n<p>- Locke distingeix una tercera classe de qualitat: la potència que posseeixen els cossos per produir o rebre efectes o canvis com els que resulten per a nosaltres de les alteracions de les nostres percepcions. Per exemple, el foc transforma la matèria, que aleshores percebem diferentment. Aquestes qualitats són percebudes indirectament i nosaltres no les atribuïm pas naturalment als cossos.<\/p>\n<ul>\n<li><i>Idees simples de reflexió:<\/i> La reflexió és la \"percepció de les operacions internes de la nostra pròpia ment.\" La nostra ment és capaç de percebre la seva pròpia activitat mental reflexionant sobre les seves idees (segona font del coneixement); i així es produeixen les idees de percepció, pensament, dubte, creença, etc. Aquestes idees s'originen, per tant, quan la ment es torna sobre si mateixa i observa les seves pròpies accions sobre les idees que ha rebut de l'exterior.<\/li>\n<\/ul>\n<h3 id=\"s2-3\"><span class=\"n\">2.3<\/span>Idees simples de sensació i reflexió alhora<\/h3>\n<p>La combinació de la sensació i la reflexió poden donar lloc a la creació de noves idees, com les d'existència, plaer i dolor, per exemple.<\/p>\n<p>\"Aquestes són (sensació i reflexió) les dues fonts de coneixement d'on parteixen totes les idees que tenim o podem tenir de manera natural.\" (Assaig, L.ll, 1, 2, 164.). El conjunt de totes dues és l'experiència, fonament d'on deriva el nostre coneixement.<\/p>\n<p>A partir de les idees simples, i sense que sigui possible l'addició de nou material (ja que no n'hi ha), la ment pot formar \"idees complexes\", que resulten de la comparació de les primeres.<\/p>\n<figure><img loading=\"lazy\" src=\"filo/locke_02.jpg\" alt=\"\"><\/figure>\n<p class=\"cap\"><b>Tipus d’idees segons Locke<\/b><\/p>\n<h3 id=\"s2-4\"><span class=\"n\">2.4<\/span>Les idees complexes<\/h3>\n<p>Les idees complexes són el resultat de l'activitat de l'enteniment quan compara, uneix i separa Idees simples. \"Però com la ment és totalment passiva en la recepció de totes les seves idees simples, exerceix, per tant, diversos actes propis pels quals forma, a partir de les idees simples que utilitza com a materials i fonament de la resta, les altres\". Tot i que poden ser infinites en nombre, les classifica en tres tipus: modes (combinació d'idees simples sense cap suposició d'existència pròpia, i que poden ser simples -dotzena, espai, temps, lloc-i mixtes -bellesa, robatori-), substàncies (combinacions d'idees simples que es prenen per representar coses particulars que subsisteixen per si mateixes) i relacions (consideració i comparació d'una idea amb una altra):<\/p>\n<p>1. Els modes són idees complexes que no subsisteixen pas per elles mateixes, sinó que són com a dependents de les substàncies. Els modes es divideixen en diversos tipus:<\/p>\n<p>A) Els modes compostos d'un sol tipus d'idees simples. Són modificacions d'una idea simple: per exemple, dos és la unitat repetida. L'espai ve de la idea simple de l'extensió: és la idea sensible elaborada de distància. La durada ens ve de la idea de successió; el nombre, comporta una unitat estrictament determinada; l'infinit es forma per l'addició sense fi del qual és finit.<\/p>\n<p>B) Els modes de pensament: l'esperit percep una gran varietat de les seves pròpies modificacions quan reflexiona sobre ell mateix. Hom troba la percepció, la memòria, l'atenció, etc.<\/p>\n<p>C) Els modes de la voluntat: la potència, la llibertat com la potència de començar o de no començar pas una acció, de reprendre-la o no.<\/p>\n<p>D) Modes mixtos: són idees independents que l'esperit ajunta sense que aquests modes tinguin existència sensible real (per exemple, la mentida).<\/p>\n<figure><img loading=\"lazy\" src=\"filo/locke_03.jpg\" alt=\"\"><\/figure>\n<p>precisament la base de la seva crítica al concepte metafísic tradicional de \"substància\", la qual cosa suposa una ruptura amb la filosofia anterior. Per tant, la conseqüència final de l'empirisme de Locke és que no coneixem l'ésser de les coses, només coneixem allò que l'experiència ens mostra, és a dir, un conjunt de qualitats sensibles. D'aquesta manera, conclou Locke, l'experiència és l'origen i també el límit del nostre coneixement.<\/p>\n<p>Encara que el que coneixem són les idees, no les coses, Locke no dubta que hi hagi un món real. Les coses materials són conegudes a través d'idees. Però Locke reconeix que \"tenir la idea d'una cosa en el nostre esperit no prova la seva existència\". (IV, 11, 1). Per tant, la sensació no prova, sense més ni més, que existeixi la cosa sentida, amb la certesa que donen la intuïció o la demostració. Però si ens dona un coneixement suficient. Les sensacions no són produïdes pels nostres òrgans sensorials, per tant, han de ser degudes a una causa exterior, una cosa real existent. No obstant això, encara que les sensacions (idees de sensació) siguin representacions de coses reals, no per això pretén Locke que siguin còpies exactes d'aquestes coses.<\/p>\n<p>3. Per últim, les idees complexes de relacions resulten de la comparació d'unes idees amb d'altres. El nombre d'idees d'aquesta classe és quasi infinit, ja que qualsevol idea és susceptible de múltiples consideracions amb relació a altres idees; per exemple, un home pot ser capaç de totes aquestes relacions: pare, fill, net, amic, professor, europeu, jove, semblant, etc. Però allò que a Locke l'interessa sobretot és demostrar que totes les idees de relacions es poden reduir a idees simples de sensació i de reflexió, que no és altra cosa que la reafirmació de la tesi empirista que totes les nostres idees tenen com a origen l'experiència. Això és el que fa Locke amb la seva anàlisi de la relació de causalitat; les nocions de causa i efecte procedeixen, segons Locke, de l'experiència. Una altra de les relacions examinades al seu Assaig és la d'identitat i diversitat.<\/p>\n<h3 id=\"s2-5\"><span class=\"n\">2.5<\/span>Què és conèixer i graus de coneixement<\/h3>\n<p>Fins ara, Locke ha establert que l'experiència és la font d'on procedeix tot el material del nostre coneixement o idees; ara bé, l'experiència no és el coneixement mateix. Locke dedica el llibre IV de l'Assaig, el més extens i significatiu de l'obra, a l'estudi de la naturalesa, graus, extensió, realitat… del coneixement. En primer lloc, Locke defineix el coneixement com la percepció per part de la ment de l'acord o desacord d'unes idees amb d'altres. Conèixer és comparar idees, descobrir quines són les seves relacions, i jutjar. Locke redueix a quatre les formes en què les idees poden concordar o no concordar entre si.<\/p>\n<ul>\n<li><i>identitat o diversitat (lògica);<\/i> per exemple, \"allò blau no és groc\", que indica una no concordança d'identitat;<\/li>\n<li><i>relació (matemàtica);<\/i> per exemple, \"dos triangles de bases iguals entre dos costats paral·lels són iguals\", que assenyala una relació entre dues idees;<\/li>\n<li><i>coexistència o connexió necessària (física);<\/i> per exemple, \"el ferro és susceptible d'impressions magnètiques\", on la ment percep que certes idees coexisteixen amb d'altres en el mateix subjecte;<\/li>\n<li><i>existència real (metafísica);<\/i> per exemple, \"Déu existeix\", que implica la percepció de l'existència real d'una idea fora de la ment.<\/li>\n<\/ul>\n<p>Si la concordança o no concordança entre idees és percebuda per la ment de mode immediat, llavors tenim el primer grau de coneixement, el coneixement intuïtiu. El coneixement intuïtiu és la percepció immediata de la concordança o de la no concordança de les idees entre elles, sense recórrer a cap idea intermediària. Aquesta intuïció és evident, i produeix la certesa. Així, totes les idees clares i distintes, fins i tot les idees abstractes, són evidents; l'esperit concep immediatament que cada idea concorda amb ella mateixa i que aquesta no concorda amb totes les altres: Nogensmenys, aquestes idees no són pas axiomes del pensament i de les ciències, car aquests axiomes són inútils per copsar proposicions particulars, i poden induir-nos a l'error. Les idees abstractes són evidents pel fet que són obra nostra, no tenen pas necessitat de ser demostrades.<\/p>\n<p>Quan la ment no percep l'acord o desacord entre idees de manera immediata, sinó que necessita la intervenció d'altres idees intermèdies per descobrir-lo, llavors es té el segon grau de coneixement, el coneixement demostratiu. El coneixement demostratiu consisteix a comparar idees i a percebre'n la conveniència o la desconveniència per mitjà d'altres idees que són proves per a la demostració. És la raó qui percep aquests lligams entre les idees, seguint-ne el fil de la deducció. La deducció comprèn diversos graus:<\/p>\n<p>1) descobrir proves; 2) ordenar les idees amb claredat i convenientment de manera que les connexions apareguin amb evidència; 3) percebre aquestes connexions; 4) finalment, concloure.<\/p>\n<p>En el domini de la demostració, les matemàtiques proporcionen el grau més alt de la certesa. El coneixement intuïtiu és, segons Locke, el més cert i clar perquè, encara que el coneixement demostratiu és cert, ja que en ell l'acord o desacord entre les idees arriba a percebre's finalment, tanmateix, això no té lloc sinó després d'un gran esforç i atenció, i, en el processos llargs, l'error és possible. A més, el coneixement intuïtiu constitueix el fonament de la certesa de tot el nostre coneixement: així, en el coneixement demostratiu, la intuïció ha de donar-se en cadascun dels passos intermedis. Finalment, Locke parla d'un tercer grau de coneixement, el sensitiu ; és a dir, el coneixement d'existència d'objectes particulars exteriors a nosaltres, que es fonamenta en la percepció o consciència de la ment de rebre idees procedents d'objectes externs<\/p>\n<aside class=\"nota\"><p><i>Aquestes dues, és a dir, la intuïció i la demostració, són els graus del<\/i> <i>nostre coneixement; [...]<\/i><\/p><p><i>Hi ha, no obstant això, una altra percepció de la ment que s'empra en<\/i> <i>l'existència particular dels éssers finits que estan fora de nosaltres, i<\/i> <i>que sobrepassant la mera probabilitat, i no aconseguint, no obstant això,<\/i> <i>totalment cap dels graus de certitud abans establerts, passa pel nom de<\/i> <i>coneixement. No pot haver-hi res amb una certesa major que el que la idea<\/i> <i>que rebem d'un objecte exterior estigui en la nostra ment: aquest és el<\/i> <i>coneixement intuïtiu. Però el que hi hagi en la nostra ment una mica més<\/i> <i>que merament aquesta idea, el que d'aquí puguem inferir l'existència<\/i> <i>certa d'alguna cosa fora de nosaltres que correspongui a aquesta idea, és<\/i> <i>el que alguns homes pensen que s'ha de qüestionar; perquè els homes poden<\/i> <i>tenir en les seves ments semblants idees, quan tals coses no existeixen,<\/i> <i>ni semblants objectes afecten els seus sentits. Però penso que en aquest<\/i><\/p><p><i>sentit estem dotats d'una evidència que sobrepassa tot dubte. Doncs jo<\/i> <i>preguntaria a qualsevol si no està irremeiablement conscient en si mateix<\/i> <i>de tenir una percepció diferent quan mira el sol pel dia i quan pensa en<\/i> <i>ell durant la nit; quan assaboreix l'ajenjo, o fa olor una rosa, i quan<\/i> <i>solament pensa en aquest sabor o en aquest perfum. Així, doncs, trobem<\/i> <i>que existeix la mateixa diferència entre qualsevol idea reviscuda en la<\/i> <i>ment per la memòria i qualsevol que arriba a la nostra ment pels sentits,<\/i> <i>que la que existeix entre dues idees diferents. I si algú afirmés que un<\/i> <i>somni<\/i> <i>pot<\/i> <i>provocar<\/i> <i>el<\/i> <i>mateix,<\/i> <i>i que totes aquestes idees poden ser<\/i> <i>produïdes en nosaltres sense els objectes exteriors, estarà molt content<\/i> <i>de somiar que jo li puc contestar això:<\/i><\/p><p><i>1. Que no revesteix gran importància el que li augmenti o no els seus<\/i> <i>escrúpols, perquè si tot és un somni, el raonament i les argumentacions<\/i> <i>no tenen cap utilitat, estant desproveïts de veritat i de coneixement.<\/i><\/p><p><i>2. Que jo penso que admetrà que hi ha una diferència molt manifesta entre<\/i> <i>somiar que està en el foc, i estar en aquest moment en ell. [...] Així<\/i> <i>que crec que podem afegir a les dues anteriors classes de coneixement una<\/i> <i>tercera:<\/i> <i>el<\/i> <i>de<\/i> <i>l'existència<\/i> <i>d'objectes<\/i> <i>externs<\/i> <i>particulars;<\/i> <i>[...]<\/i> <i>i<\/i> <i>deduir que existeixen tres graus de coneixement: intuïtiu, demostratiu i<\/i> <i>sensitiu,<\/i> <i>en<\/i> <i>cadascun<\/i> <i>dels<\/i> <i>quals<\/i> <i>hi<\/i> <i>ha<\/i> <i>diferents<\/i> <i>graus<\/i> <i>i<\/i> <i>maneres<\/i> <i>d'evidència i de certitud.<\/i><\/p><p><i>Ensayo sobre el entendimiento humano<\/i> , l.4, cap. 2, n. 14 (Editora Nacional, Madrid 1980, vol. 2, p. 802-803).<\/p><\/aside>\n<h3 id=\"s2-6\"><span class=\"n\">2.6<\/span>L'existència d'una realitat diferent de les nostres idees<\/h3>\n<p>Locke anomena a les idees el material del coneixement, ja que són l'intermediari entre el món i la ment, en tant que la idea representa la cosa a la ment. Això suposa pensar que existeixen les coses i les idees, concepció que sembla obvia si comparem, per exemple, una reacció química (objecte extern) amb l'olor que provoca en nosaltres (idea); en aquest cas no podem identificar l'olor amb la reacció química perquè la descripció d'una i de l'altra són distintes.<\/p>\n<p>Ara bé, això en Locke suposaria que no podem arribar a conèixer les coses sinó les idees de les coses: si la ment treballa amb idees que són el reflex de la realitat i la forma de conèixer el món és a través d'idees, només puc conèixer idees, i, segons això, puc pensar, tanmateix, que la realitat no existeix. Locke, però, adopta una postura realista no idealista perquè no només accepta l'existència de la substància en sentit genèric, sinó que es planteja, a més, l'existència de les tres substàncies cartesianes: jo, Déu i món.<\/p>\n<ul>\n<li>Del jo com a substància, en tenim un coneixement intuïtiu, és a dir, immediat: \"en cada acte de sensació, de raonament o de pensament, som conscients del nostre propi ésser\". \"Pel que fa a la nostra existència, la percebem amb tanta d'evidència i de certesa que no cal pas que sigui demostrada per cap prova. Jo penso, jo raono, jo sento plaer i dolor; cap d'aquestes coses no em pot ser més evident que la meva pròpia existència? Si dubto de qualsevol altra cosa, aquest mateixa qüestió em convenç de la meva pròpia existència i no em permet pas que en dubti. [...] En cada acte de sensació, de raonament o de pensament, som convençuts interiorment en nosaltres mateixos del nostre propi ésser, i arribem pel que fa a això al més alt de certesa que sigui possible d'imaginar.\"<\/li>\n<li>De Déu, en tenim un coneixement demostratiu perquè l'existència de l'ésser contingent que soc jo, suposa l'existència d'un ésser etern i totpoderós que és la causa de les meves facultats de coneixement i creador del món.<\/li>\n<li>Del món en tenim un coneixement sensitiu perquè si les sensacions no són produïdes pels nostres òrgans (que només les reben), han de ser produïdes pels objectes externs; és a dir, el món existeix independentment de les nostres percepcions, i n'és la causa, però una causa desconeguda perquè nosaltres només coneixem les nostres percepcions en forma d'idees.<\/li>\n<\/ul>", "min": 18}, {"n": 3, "num": "3.6.3", "title": "La política: l'estat liberal", "subs": [{"id": "s3-1", "num": "3.1", "title": "L'estat de naturalesa"}, {"id": "s3-2", "num": "3.2", "title": "De la naturalesa a la societat civil"}, {"id": "s3-3", "num": "3.3", "title": "El pacte social"}, {"id": "s3-4", "num": "3.4", "title": "L'estat civil. La monarquia parlamentària"}, {"id": "s3-5", "num": "3.5", "title": "La limitació del poder"}, {"id": "s3-6", "num": "3.6", "title": "Sobre la tolerància"}], "html": "<p>La filosofia política de John Locke (1632-1704) és deutora en bona part de les idees de Hobbes i Spinoza. Igual que ells, Locke defensa que l'origen del poder i de l'Estat resideix en un acord o conveni entre els individus. No obstant això, discrepa dels seus predecessors pel que fa a l'estat de naturalesa. Seguint als iusnaturalistes, com Grocio o Pufendorf, accepta l'existència d'una llei natural que prové de la raó i que ens confereix uns drets i deures previs a tota forma d'organització política. Aquesta última no té altre fi que assegurar el lliure exercici d'aquests drets.<\/p>\n<figure><img loading=\"lazy\" src=\"filo/locke_04.jpg\" alt=\"\"><\/figure>\n<figure><img loading=\"lazy\" src=\"filo/locke_05.jpg\" alt=\"\"><\/figure>\n<h3 id=\"s3-1\"><span class=\"n\">3.1<\/span>L'estat de naturalesa<\/h3>\n<p>En clara oposició a Hobbes, l'estat de naturalesa de Locke no és un estat presocial ni premoral. En ell, els homes viuen en família i reconeixen l'autoritat d'aquesta. A més reconeixen la llei natural, pròpia i connatural a la nostra raó, que ens porta a defensar la nostra vida i llibertat i a respectar la dels altres. Tots dos constitueixen el que Locke denomina drets naturals . A ells s'afegeix el dret de propietat, que, com els anteriors, no neix de la societat, sinó que és previ a ella.<\/p>\n<p>Argumenta Locke que la propietat és en principi comunal, ja que totes les coses van ser donades a tots per Déu. Però això no exclou el dret de cada un d'apropiar-se individualment d'alguna cosa per mitjà del treball. Aquest es constitueix llavors com el mitjà legítim d'adquirir una propietat. D'aquí es dedueix que tenim dret a tanta propietat -i Locke es refereix sobretot a la possessió de terres- com siguem capaços de treballar, però no a més. No obstant això, amb la introducció de la moneda en els intercanvis de béns sorgeix la possibilitat d'incrementar les possessions individuals més enllà dels límits establerts per la llei natural. Es tracta, sense cap dubte, d'un dels punts més febles de la teoria política de Locke, a qui molts han criticat que justifiqui en la naturalesa les desigualtats econòmiques que més aviat semblen producte de la societat. De tots és coneguda l'afinitat que Locke sentia per la classe mitjana propietària, a la qual pertanyia i l'statu quo sembla que tractava de justificar racionalment.<\/p>\n<h3 id=\"s3-2\"><span class=\"n\">3.2<\/span>De la naturalesa a la societat civil<\/h3>\n<p>De l'anterior es desprèn que en estat natural els éssers humans viuen en un règim de llibertat, igualtat i respecte mutu. El treball i les relacions familiars els proporcionen una existència feliç. Per què, llavors, l'ésser humà hauria d'abandonar aquest estat de coses? Quina necessitat hi hauria de constituir una societat amb el seu govern i les seves lleis?<\/p>\n<p>La resposta de Locke és senzilla: la societat civil s'origina per les deficiències de l'estat de naturalesa, incapaç de garantir als individus seus drets. En efecte, en absència de lleis i jutges imparcials, com assegurar que els altres respectaran el que és d'un? Qui i de quina manera castigarà les possibles infraccions que pogueren cometre? La raó ens dona a entendre el que és just i bo, però cal instaurar un estat en què aquesta justícia pugui realitzar efectivament. I aquest és precisament l'estat polític.<\/p>\n<figure><img loading=\"lazy\" src=\"filo/locke_06.jpg\" alt=\"\"><\/figure>\n<h3 id=\"s3-3\"><span class=\"n\">3.3<\/span>El pacte social<\/h3>\n<p>Moguts pel desig d'assegurar millor els seus drets, els individus consenten a renunciar a la seva llibertat natural per sotmetre's a un poder comú. Aquest és, doncs, l'origen del contracte social. No obstant això, aquesta renúncia no és incondicional ni absoluta, a diferència del que pensava Hobbes. El pacte és un contracte recíproc entre els individus i el sobirà. En conseqüència, no només obliga els primers a obeir, sinó també al governant a garantir els drets previs d'aquells. Aquest contracte no implica de cap manera la cessió total dels drets, que són irrenunciables, únicament suposa la renúncia d'exercir la força de forma individual.<\/p>\n<p>En conseqüència, el pacte sempre és reversible. El poder es dissol si no respecta els drets fonamentals i, en aquest cas, els individus recuperen la seva llibertat per tornar a l'estat natural o bé+ constituir-se en una nova societat política.<\/p>\n<h3 id=\"s3-4\"><span class=\"n\">3.4<\/span>L'estat civil. La monarquia parlamentària<\/h3>\n<p>Un cop establertes les condicions del contracte, Locke passa a exposar el procés constituent de l'Estat. En el seu sistema, el poble escull els seus representants per majoria i aquests tenen el poder legislatiu, que limita i controla el poder executiu del govern. La majoria ha de decidir en cada cas si atorga el poder a un de sol (monarquia), a una minoria triada (oligarquia), o si ho assumeix ella mateixa, en aquest cas es constitueix una democràcia perfecta. Si bé Locke no es decanta per cap forma de govern, sembla clar que l'Estat que tenia al pensament era una monarquia parlamentària amb divisió de poders.<\/p>\n<p>Amb tot, el més important no és, segons el parer de Locke, qui té el poder, sinó el fet que el manté per un mandat exprés del poble, veritable dipositari de la sobirania, que sempre conserva la potestat de recuperar aquest poder i de revocar el govern quan aquest no compleix amb el pactat. Es justifica així el dret de rebel·lió que, acceptat ja per Tomàs d'Aquino i Ockham a l'edat mitjana, i per teòrics jesuïtes com Mariana i Suárez en el Renaixement, va ser, no obstant això, negat per Hobbes i pel mateix Spinoza. Aquest dret a resistir al poder injust i tirànic serà desenvolupat pels teòrics del segle XIX, amb especial menció d'HD Thoreau, i arribarà plena vigència en ple segle XX de la mà de líders polítics com Gandhi o Luther King.<\/p>\n<h3 id=\"s3-5\"><span class=\"n\">3.5<\/span>La limitació del poder<\/h3>\n<p>Es tracta, doncs, d'una concepció liberal de l'Estat on el poder polític ja no és absolut ni indivís, com defensava Hobbes, sinó limitat i dividit en tres. D'una banda, el poder legislatiu (poder suprem), que recau en els representants legítimament elegits pel poble (Parlament), de l'altra, el poder executiu, ostentat pel govern i sotmès permanentment al control del legislatiu. Tots dos poders es limiten mútuament, de manera que s'eviten abusos de poder i es garanteixen millor els drets individuals. Quant al tercer poder, el judicial, Locke no el diferencia del legislatiu, amb el qual es confon, distinció que sí que farà Montesquieu mig segle més tard quan, inspirant-se en Locke, estableixi el cèlebre principi de la separació de poders, base fonamental del modern estat de dret.<\/p>\n<figure><img loading=\"lazy\" src=\"filo/locke_07.jpg\" alt=\"\"><\/figure>\n<p class=\"cap\"><b>Els tres poders<\/b><\/p>\n<h3 id=\"s3-6\"><span class=\"n\">3.6<\/span>Sobre la tolerància<\/h3>\n<p>Les idees del liberalisme econòmic i polític van tenir una gran repercussió en la manera de cal considerar la religió. Apareix així un nou valor: la tolerància. La lluita a favor de la tolerància i el creixent antidogmatisme camina de la mà del canvi social que s'opera al segle XVII, en què el creixement de la burgesia mercantil va a afavorir l'establiment d'una pax fidei (pau religiosa) que és necessària per als intercanvis comercials, ja que els continus conflictes religiosos de l'època creaven seriosos problemes en aquest terreny.<\/p>\n<figure><img loading=\"lazy\" src=\"filo/locke_08.jpg\" alt=\"\"><\/figure>\n<p>D'una banda, en una època de viatges i exploracions, el descobriment de pobles que, com el xinès, encara que amb una moral estricta no es recolzen en una religió revelada, qüestionen la validesa universal de la religió cristiana i de la seva moral.<\/p>\n<p>Fins aquí, la intransigència i l'apel·lació a les armes caracteritzaven la defensa de la religió. La nova mentalitat suposa que la llibertat d'honorar a Déu, cadascun segons la seva pròpia comprensió, pot admetre's sense perill per a la pau i la pietat de l'Estat. És més: s'entén, d'ara endavant, que sense aquesta llibertat no és possible ni la pau de l'Estat ni la pietat. Aquestes idees són les que defensa Locke, en la seva Carta sobre la tolerància (1689) i seran la base teòrica per a la defensa de la convivència pacífica entre totes les religions.<\/p>\n<p class=\"cap\"><b>Carta sobre la<\/b> <b>tolerància<\/b><\/p>", "min": 7}]}, {"id": 4, "key": "hume", "title": "Hume", "full": "David Hume", "dates": "1711 – 1776", "era": "Empirisme", "tag": "Crítica de la causalitat i de la substància", "hue": 8, "obres": "Tractat sobre la naturalesa humana, Investigació sobre l’enteniment humà", "secs": [{"n": 1, "num": "3.9.1", "title": "Vida i Obra", "subs": [], "html": "<p>(1711-1776) va néixer a Edimburg al si d'una bona família. Des de petit es va mostrar apassionat per la literatura, però la seva disposició per a l'estudi i el fet que el seu pare hagués estat advocat, el van portar a estudiar dret. Va abandonar la carrera de dret i va provar la vida de comerciant, però, adonant-se que no era per a ell, va marxar a França, a La Flèche (on havia estudiat Descartes), per dedicar-se a la filosofia. Durant la seva estada a França es retira al camp i escriu el seu Tractat sobre la naturalesa humana, obra que, en publicar-se el 1739 no va tenir el reconeixement que ell esperava.<\/p>\n<p>A partir d'aquí, la seva vida succeeix entre el compliment de càrrecs oficials i la creació d'escrits filosòfics: pren part en una expedició militar a la Bretanya, s'encarrega d'una missió diplomàtica a Tori i a Viena, és nomenat bibliotecari de la Facultat de Dret d'Edimburg, torna a París com a ambaixador d'Anglaterra, període en què coneix Rousseau i es relaciona amb els enciclopedistes, i el 1767 és nomenat sots-secretari d'Estat d'Escòcia, càrrec que ocupa durant un any. Entre la resta d'obres que escriu cal destacar Abstract (1740), que és un resum del Tractat, Investigació sobre l'enteniment humà (1748) | Investigacions sobre els principis de la moral (1751).<\/p>\n<p>El seu objectiu filosòfic es plasma al Tractat sobre la naturalesa humana, on afirma que el seu propòsit és l'estudi científic de la naturalesa de l'ésser humà per tal d'esbrinar quines són les possibilitats i els límits del coneixement. Per fer això, pensa que s'ha d'abandonar l'anàlisi filosòfic del coneixement tal com s'ha portat a terme pels filòsofs anteriors i proposa com a alternativa una anàlisi de l'ésser humà utilitzant el mètode experimental, que tants fruits havia donat a les ciències de la naturalesa; així, igual que Newton explica el moviment dels cossos, ell vol explicar el funcionament de la ment humana.<\/p>\n<p>Parteix, doncs, d'una investigació empírica dels processos psicològics que es donen en l'acte de conèixer, tot seguint el mètode inductiu i la introspecció, és a dir, l'anàlisi dels seus propis pensaments. L'objectiu és trobar causes i principis que expliquin no tan sola com coneixem sinó també com actuem. Això significa abandonar el mètode racionalista: la seva anàlisi freda de les idees i la seva visió essencialista de l'ésser humà; en canvi, Hume proposa l'anàlisi de les idees examinant com es formen, com es construeixen a la ment, des d'un punt de vista psicològic<\/p>\n<p>David Hume<\/p>", "min": 2}, {"n": 2, "num": "3.9.2", "title": "El coneixement: la crítica al principi de causalitat", "subs": [{"id": "s2-1", "num": "2.1", "title": "Elements del coneixement: Impressions i idees"}, {"id": "s2-2", "num": "2.2", "title": "Crítica del principi de causalitat"}, {"id": "s2-3", "num": "2.3", "title": "Relacions d'idees i qüestions de fet"}], "html": "<h3 id=\"s2-1\"><span class=\"n\">2.1<\/span>Elements del coneixement: Impressions i idees<\/h3>\n<p>Hume com també els empiristes precedents afirma que tots els continguts de la ment tenen l'origen en l'experiència i són, per tant, percepcions; això implica que conèixer la realitat vol dir conèixer les nostres percepcions. Ara bé, Hume comença diferenciant-ne dos tipus, segons la seva intensitat: les impressions i les idees. Les impressions són les dades immediates de l'experiència (tant externa com interna), és a dir, sensacions, passions, emocions, que es caracteritzen per la seva intensitat i vivor; les idees , en canvi, són les còpies o imitacions de les impressions, o dit d'una altra manera, són petjades que queden a la ment després de l'acció de les impressions i que es caracteritzen per ser menys intenses i menys vives. Així, quan olorem una taronja tenim una impressió (l'olor), i quan la deixem d'olorar ens queda un record, la idea de l'olor.<\/p>\n<p>Ara bé, la percepció no és un procés tan senzill. Les percepcions, tant les impressions com les idees, poden classificar-se segons la seva composició en simples o complexes. Són simples quan no es poden dividir en altres percepcions, per exemple la percepció (impressió o idea) d'una taca vermella. Són complexes quan, en canvi, poden dividir-se a través d'una anàlisi, com, per exemple, la percepció de la ciutat de : si pujo a Montmartre i des d'allí veig la ciutat de París tinc una impressió complexa de la ciutat, dels taulats, de les xemeneies, torres i carrers; i quan penso després en París i recordo aquesta impressió complexa, tinc una idea complexa.<\/p>\n<p>Així doncs, una idea simple és el resultat d'una impressió simple, i una idea complexa és el resultat d'una impressió complexa. Però, a més, Hume diu, \"m'adono que moltes de les nostres idees complexes no han tingut mai impressions complexes que les precedeixin (...). Puc imaginar-me una ciutat com la Nova Jerusalem amb el terra d'or i parets de robí, encara que mai no hagi vist res de semblant\". En aquest cas, aquesta idea complexa no correspon a una impressió complexa, sinó a la unió d'idees simples. Per tant, es pot afirmar que a cada idea correspon una impressió, fins i tot a les idees complexes com la idea de Nova Jerusalem, perquè pot descompondre's en idees simples que, al seu torn, procedeixen d'impressions simples.<\/p>\n<p>Defensant tant fermament que l'origen del coneixement és la percepció, Hume està al mateix temps negant l'existència d'idees innates , és a dir, d'idees que posseeix l'ésser humà des de sempre. La nostra experiència personal mostra com totes les idees provenen d'impressions (és per això, per exemple, que un cec de naixement no té la idea de color). D'altra banda, aquesta prioritat temporal de les impressions respecte de les idees és tan important a la seva filosofia que li serveix com a criteri per diferenciar un coneixement vertader d'un de fals: com que les idees són còpia d'impressions, només cal buscar de quina impressió o impressions deriven per saber si són vertaderes o mancades de significat. Aquest criteri es coneix com el principi de còpia.<\/p>\n<p>Hem dit que les idees complexes són el resultat de la unió d'idees simples. Hume investiga més a fons aquest procés, fent referència a dues facultats: la memòria i la imaginació. Les idees poden aparèixer a la ment per mitjà de la memòria o de la imaginació. La diferència entre ambdues és que, si bé la memòria respecta l'ordre d'aparició de les impressions, la imaginació, en canvi, altera aquest ordre i crea idees complexes tot combinant idees simples. Ara bé, Hume pensa que aquestes associacions que porta a terme la imaginació no són del tot aleatòries sinó que la ment humana es regeix per unes determinades lleis que atreuen entre si algunes idees i que anomena lleis d'associació que són: la semblança (que uneix idees que s'assemblen, com ara una fotografia mena naturalment tots els nostres pensaments sobre l'original), la contigüitat (que uneix idees que apareixen properes en l'espai i en el temps, com ara pensar en la platja ens porta a imaginar la sorra, el mar i els vaixells) i la causa-efecte (que uneix idees fent que unes siguin el resultat de les altres, com ara pensar en una ferida ens porta a considerar el dolor que provoca).<\/p>\n<p>El fet que les idees de la imaginació no provinguin directament d'impressions, ni complexes ni simples, fa que no tinguin un correlat a l'experiència i, per tant, segons el principi de còpia, són idees sense sentit. Però què passa amb les idees universals, per exemple la idea d'arbre? Després d'haver tingut impressions d'allò que anomenem arbres i haver-nos adonat que entre elles existeixen semblances, els apliquem a totes la mateixa paraula, \"arbre\", malgrat les diferències que hi ha entre roures, llimoners, tarongers..., I un cop adquirit el costum d'aplicar la mateixa paraula a aquestes impressions, en sentir la paraula, reviu la idea d'una d'elles. Per tant, la idea d'arbre és un nom que s'aplica a un conjunt d'impressions diferents, com va defensar Occam, ja que no existeix l'arbre genèric.<\/p>\n<figure><img loading=\"lazy\" src=\"filo/hume_00.jpg\" alt=\"\"><\/figure>\n<p class=\"cap\"><b>Classes de percepcions segons Hume<\/b><\/p>\n<h3 id=\"s2-2\"><span class=\"n\">2.2<\/span>Crítica del principi de causalitat<\/h3>\n<p>De les tres lleis d'associació, la de causa-efecte ha estat entesa per alguns filòsofs com un principi: el principi de causalitat , segons el qual tota causa produeix necessàriament un efecte. Aquest principi és molt important perquè fonamenta la nostra forma de raonar: des de la meva habitació sento sorolls de motor que provenen del carrer, i sé que la seva causa són els cotxes que passen; quan vull encendre el llum, acciono l'interruptor perquè infereixo que aquest acte provocarà que s'encengui..., És a dir, tot allò que esdevé té la seva causa. En el seu afany per investigar el funcionament psicològic de la ment humana, Hume analitza aquest principi des del seu empirisme. Per fer-ho, aplica el principi de còpia i es planteja de quina o quines impressions deriva allò que anomenem \"causa\". Si pensem en els coneixements que tenim, molts d'ells es basen en el fet de relacionar certes impressions entre si: quan veig aigua bullint, veig que s'evapora; quan veig un metall escalfant-se, veig que es dilata, etc. Del que acabem de dir se segueix que: tenim unes impressions que anomenem causes, d'altres que anomenem efectes, però no tenim impressions de la relació entre la causa i el seu efecte. Malgrat això, tendim a establir relacions entre la causa i l'efecte. Tant és així que, fins i tot, la cultura popular recull una bona quantitat d'aquestes relacions: \"cel rogent, pluja o vent\", \"al maig, cada dia un raig... En tots aquests casos trobem una causa i un efecte, i anomenem causa a alguna cosa que, quan es dona, immediatament en produeix una altra, l'efecte. Però Hume pensa que aquesta relació no existeix entre les impressions sinó entre les idees que les impressions provoquen. Si això és així, cal, doncs, analitzar com es produeix la relació de causa-efecte entre les idees. Considera tres aspectes:<\/p>\n<p>1. La relació causa-efecte suposa contigüitat en temps i lloc: \"trobo en primer lloc que els objectes que considerem causes i efectes són contigus\". Hume imagina dues boles de billar, una blanca que està quieta a sobre d'una taula i una altra negra que es mou amb rapidesa cap a la primera; quan la bola negra contacti amb la blanca (contigüitat en el lloc), aquesta es mourà, però entre el xoc i el moviment no hi ha hagut cap interval (contigüitat en el temps). No obstant això, no es preocupa especialment d'aquesta característica perquè no la troba sempre necessària, per exemple, les passions són relacions causals, però no requereixen la contigüitat (algú pot enamorar-me sense que estigui al meu costat)<\/p>\n<figure><img loading=\"lazy\" src=\"filo/hume_01.jpg\" alt=\"\"><\/figure>\n<p class=\"cap\"><b>Relació causa-efecte a les boles de billar<\/b><\/p>\n<p>2. La relació causa-efecte suposa prioritat temporal: sempre que alguna cosa és causa d'una altra, la causa és anterior a l'efecte. Així, el moviment de la bola negra és anterior al moviment de la bola blanca. Per a Hume, aquesta característica tampoc no és suficient, perquè poden donar-se dos fets contigus (contigüitat) i un anterior a l'altre (prioritat temporal) sense haver-hi relació causal (per exemple, que tanqui un llibre i, immediatament després, soni el telèfon).<\/p>\n<p>3. La relació causa-efecte suposa connexió necessària: si afirmem que la calor dilata els metalls\" o que \"la bola de billar negra és la causa del moviment de la blanca\", el que volem dir és que A (\"la calor\") és causa de B (\"la dilatació dels metalls\") sempre que aquests fets es donin contiguament, que A sigui anterior a B i que quan es dona A necessàriament es dona B. El que fonamenta la idea de causalitat és, doncs, l'establiment d'una relació necessària entre dos fets, és a dir, justament d'allò que no en tenim cap percepció<\/p>\n<p>I com arribem a aquesta idea de connexió necessària, si no en tenim percepció? La seva resposta és que ho fem per hàbit, per costum. Només tenim impressions d'A i de B; però a partir de la repetició d'aquestes dues impressions contigües i una seguida de l'altra, acabem suposant que hi ha una relació entre elles. Per exemple, experimentem que en apropar la mà a un foc sentim calor, i recordem que sempre que s'ha repetit aquesta experiència ha estat en el mateix ordre (primer apropem la mà al foc i després sentim calor); llavors, per costum, anomenem a una idea \"causa\" [el foc) i a l'altra \"efecte\" (la calor), i pensem que una deu la seva existència a l'altra.<\/p>\n<figure><img loading=\"lazy\" src=\"filo/hume_02.jpg\" alt=\"\"><\/figure>\n<p>Així, la idea d'una connexió necessària és quelcom que existeix a la ment, no als objectes\". El que sembla una connexió necessària entre els objectes és, en realitat, una connexió entre idees d'aquests objectes. La ment actua influenciada pel costum, i és aquest costum el que dona lloc a la idea de causa.<\/p>\n<p>Aquesta contínua apel·lació al costum i l'hàbit suposa que, des d'un punt de vista intel·lectual, no tenim cap classe d'argument per demostrar que els fets es relacionen entre si i, per tant, no podem assegurar que dos fets que hem percebut sempre relacionats, ho continuïn estant en el futur. Per tant, la predicció d'esdeveniments, objectiu de la ciència, no és possible de confirmar mai de manera absoluta. Hem de concloure, doncs, que afirmacions com a calor dilata els metalls\". Només és probable. I el mateix passa amb tots els arguments que els filòsofs han fet servir i que es basen en el principi de causalitat. Si això és veritat, ¿com és possible el coneixement científic i el filosòfic?<\/p>\n<h3 id=\"s2-3\"><span class=\"n\">2.3<\/span>Relacions d'idees i qüestions de fet<\/h3>\n<p>Quan Hume analitza les diverses ciències observa que els seus enunciats bàsics tenen diferents característiques. Així, per exemple, els enunciats de les matemàtiques no parlen de coses que podem percebre, només estableixen relacions entre idees: la relació entre les diferents parts del triangle dona lloc a l'enunciat \"el quadrat de la hipotenusa és igual a la suma dels quadrats dels catets\". Que aquests enunciats siguin vertaders no depèn de l'experiència sinó del principi lògic de contradicció, i els anomena relacions d'idees (les veritats de raó que afirmava Leibniz).<\/p>\n<p>En canvi, un tipus diferent d'enunciats són els de la Física: afirmacions com \"l'aigua bull a 100°\" o \"la calor dilata els metalls\", fan referència a fets observats, són el que ell anomena qüestions de fet. Aquests enunciats es basen en l'experiència i són el resultat de les lleis de relacions entre les idees, de les quals la més important, com hem vist, és la de causalitat. Precisament perquè es basen en operacions de la ment, com la tendència a relacionar causes i efectes, no podem parlar pròpiament de coneixements necessaris sinó probables, perquè la seva fonamentació és el costum o l'hàbit. Per tant, la pregunta sobre com és possible el coneixement científic , Hume la respon dient que només és possible com a coneixement probable, tot i que afirma que això no ha de suposar un problema, ja que, per viure, en tenim prou amb un coneixement probable.<\/p>", "min": 10}, {"n": 3, "num": "3.9.3", "title": "La realitat: la crítica a la idea de substància", "subs": [{"id": "s3-1", "num": "3.1", "title": "La crítica a la idea de substància"}, {"id": "s3-2", "num": "3.2", "title": "El món extern"}, {"id": "s3-3", "num": "3.3", "title": "L'existència de Déu"}, {"id": "s3-4", "num": "3.4", "title": "La identita
