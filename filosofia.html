t personal"}, {"id": "s3-5", "num": "3.5", "title": "L'escepticisme i el fenomenisme de Hume"}], "html": "<h3 id=\"s3-1\"><span class=\"n\">3.1<\/span>La crítica a la idea de substància<\/h3>\n<p>La concepció que Hume té de la realitat es basa en la crítica a aquells plantejaments filosòfics (sobretot els dels racionalistes) que, en descriure-la, utilitzen el concepte de substància com quelcom que existeix per si mateix i no necessita de res més per existir. Hume comença qüestionant-se l'existència de la substància, entesa d'aquesta manera. I com ho fa? Aplicant el principi de còpia. Si busquem de quina impressió o impressions deriva la idea de substància trobem que no en tenim cap, d'impressió, és a dir, no percebem res que pugui donar lloc a aquesta idea.<\/p>\n<p>I com que, segons Hume, tota idea ha d'anar precedida, en últim terme, d'una impressió, allò que anomenem substància no és res més que \"una col·lecció d'idees simples que són unides per la imaginació i que tenen un nom assignat.\" Això és així, perquè \"tenim impressions de les qualitats de les coses, no de les coses en si\". El que passa és que la nostra ment associa un conjunt d'impressions simultànies i produeix la idea d'una cosa que existeix com a suport, la substància.<\/p>\n<p>Però Hume considera que aquesta activitat de la ment no és prou fonament per afirmar que la substància és quelcom que existeix per si mateix. Des de la perspectiva dels filòsofs racionalistes, la idea de substància servia per definir el món material (substància extensa), Déu (substància infinit a), el jo (substància pensant). Hume, canvi, havent mostrat que la substància només és un nom que donem a un feix d'impressions es replanteja l'existència del món extern, de Déu del jo.<\/p>\n<h3 id=\"s3-2\"><span class=\"n\">3.2<\/span>El món extern<\/h3>\n<p>Hume, tot i estar d'acord amb la crítica de Berkeley a la substància material, l'explica des d'una altra perspectiva: a partir de la invalidesa del principi de causalitat. Tenim impressions i tendim pensar que aquestes provenen d'objectes externs que en serien la causa. Així creiem en l'existència d'un món extern, més enllà de les impressions i diferent d'elles, un món independent de nosaltres. Però, si segons Hume, l'únic que coneixem són impressions, només podem parlar d'impressions i no d'una cosa diferent d'elles, la realitat exterior. I molt menys dir que els objectes externs són la causa de les nostres impressions, perquè la relació causal no és més que una ficció que es basa en un hàbit. I que, com a molt, ens pot aportar un coneixement probable.<\/p>\n<p>Ara bé, arribats aquí podríem conformar-nos pensant que l'existència del món només és probable, però aquesta tampoc és la conclusió de Hume. El coneixement probable es dona quan relacionem impressions amb el principi de causalitat (associem la impressió del foc amb la de la calor) i així diem que una impressió és causa de l'altra. Però quan diem que existeixen coses independents de nosaltres que ens causen les impressions, estem relacionant alguna cosa que no sabem que és amb les impressions. Si bé en el primer exemple, l'ús del principi de causalitat és adient, tot i que només pot proporcionar-nos coneixements probables, en el segon, el seu ús és totalment inacceptable. La conclusió, per tant, és que allò que anomenem coses no són més que \"pures col·leccions d'idees simples unides per la imaginació a les quals donem un nom\". Ara bé, Hume reconeix que el fet de no poder justificar racionalment l'existència del món extern ni significa pas que no existeixi: no hi ha coneixement, però hi ha creença.<\/p>\n<h3 id=\"s3-3\"><span class=\"n\">3.3<\/span>L'existència de Déu<\/h3>\n<p>Pel que fa a l'existència de Déu, Hume duu a terme la mateixa anàlisi que amb l'existència del món extern. D'una banda, examina la idea de Déu aplicant-li el principi de còpia i ens fa adonar que de Déu no tenim cap impressió, i per tant aquesta idea manca de fonament. De l'altra, considera els diferents arguments per demostrar la seva existència, els arguments a posteriori (basats en el principi de causalitat) i els arguments a priori (l'argument ontològic).<\/p>\n<ul>\n<li>Pel que fa als primers pren en consideració Descartes (Déu és la causa de les idees innates, de l'existència del jo, del món exterior) i Berkeley (Déu és la causa de les idees que percebem).<\/li>\n<\/ul>\n<figure><img loading=\"lazy\" src=\"filo/hume_03.jpg\" alt=\"\"><\/figure>\n<p>És fàcil reconèixer que ambdós es basen en el principi de causalitat , que com sabem , per a Hume no té un fonament racional, sinó que es recolza en un hàbit. En el cas de Déu passa al mateix que en el cas del món extern: estem relacionant quelcom del qual no tenim impressions amb les nostres impressions.<\/p>\n<ul>\n<li>Pel que fa al segon tipus d'arguments, estudia l'argument ontològic (Anselm, Descartes), segons el qual Déu existeix necessàriament i té en si mateix la raó de la seva existència.<\/li>\n<\/ul>\n<p>Aquest argument, segons Hume, no és vàlid perquè a priori \"res no es pot demostrar tret que el seu contrari impliqui una contradicció, però, tot el que podem concebre<\/p>\n<p class=\"cap\"><i><b>La flagel·lació de Crist.<\/b><\/i> <b>Caravaggio 1607<\/b><\/p>\n<p>com a existent, podem també concebre-ho com a no existent... Per tant, les paraules existència necessària no tenen significat\".<\/p>\n<p>Concloent, des d'un punt de vista racional, no podem tenir certesa de l'existència de Déu. I, per això, diu que Déu és per a nosaltres una endevinalla, un enigma i un misteri. Incertesa, dubte i suspensió de judici semblen ser l'únic resultat de la nostra investigació\".<\/p>\n<h3 id=\"s3-4\"><span class=\"n\">3.4<\/span>La identitat personal<\/h3>\n<p>En la seva crítica a les substàncies cartesianes, Hume va més enllà de Berkeley en afirmar que tampoc existeix la substància espiritual, el jo. Descartes i Locke afirmen que el jo és una evidència, Berkeley, malgrat negar l'existència del món extern, defensa la dels esperits (allò que pot percebre) per diferenciar-los de les percepcions (allò percebut). Hume, en canvi, diu: \"pel que fa a mi quan aprofundeixo més en el que anomeno jo mateix, vaig ensopegant amb determinades percepcions, de calor o fred, de llum o ombra, d'amor o odi, de dolor o plaer. Mai no puc atrapar el jo sense una percepció, i mai no puc observar alguna cosa que no sigui la percepció\". Amb això està afirmant que la idea de jo no correspon a cap impressió i, per tant, no és res més que una idea complexa produïda per l'ésser humà i, com a tal, no es refereix a res del que poguem tenir una impressió. La ment associa una sèrie d'idees successives pressuposant un subjecte que és la pròpia ment, però la idea mateixa de ment no prové de cap impressió.<\/p>\n<p>Hume afirma rotundament que la nostra identitat no és res més que el resultat d'unir diferents impressions de coses que ens passen, però en cap cas podem tenir una impressió de nosaltres mateixos, ja que no som més que \"una col·lecció de diferents percepcions que se succeeixen unes a les altres amb una rapidesa inconcebible i que estan en constant flux i moviment.\" D'això, però, no se segueix que el jo no existeixi sinó que no en podem tenir un coneixement racional, només una creença que es fonamenta en un feix d'impressions referides a alguna cosa que no és més un nom Per fer-nos entendre això, Hume compara el nostre jo amb un Estat, constituït per diversos ciutadans (impressions) relacionats entre si per les lleis (les relacions entre les impressions). L'Estat pot mantenir la seva identitat tot i que canviïn els seus ciutadans i les seves lleis, tot i que realment, allò que anomenem Estat no és res que existeixi independentment dels seus ciutadans.<\/p>\n<h3 id=\"s3-5\"><span class=\"n\">3.5<\/span>L'escepticisme i el fenomenisme de Hume<\/h3>\n<p>Sí, segons Hume, el coneixement comença en l'experiència i també acaba en ella, llavors l'experiència és l'origen i, a la vegada, el límit del nostre coneixement. I si per experiència entenem allò que apareix a les nostres percepcions (colors, sabors, sons formes,etc.), llavors, de la realitat només podem conèixer el que se'ns mostra, el fenomen (del verb grec, phainomai, aparèixer). En filosofia, aquesta postura s'anomena fenomenisme i Hume n'és un representant quan redueix la realitat a impressions.<\/p>\n<p>A més, segons hem vist, per a Hume no hi ha fonamentació racional del principi de causalitat. Ens basem en aquest principi perquè no en tenim cap de millor, no perquè hi hagi raons intel·lectuals suficients que el justifiquin. Si el principi fonamental que és pilar del nostre pensament i de la ciència no és racional, sinó resultat de l'hàbit, el costum, llavors no podem tenir coneixement cert sobre els fets, sinó únicament creences basades en la probabilitat, la qual cosa vol dir que no podem estar segurs, al 100%, de res. La postura filosòfica que defensa aquesta última afirmació 'anomena escepticisme i, per això, podríem dir que Hume és un escèptic. Ara bé, l'escepticisme de Hume és moderat perquè, segons ell, és possible un grau de coneixement tot i que no sigui absolut, i així ens ajuda a reflexionar sobre els límits del coneixement humà. La ment humana és de tal manera que fonamenta el coneixement en la creença i aquesta descansa sobre la tendència natural a afirmar coses sobre la realitat: \"la naturalesa, per mitjà d'una necessitat absoluta i controlable, ens ha determinat a realitzar judicis exactament igual que a respirar i a sentir\". Així, només cal que entenguem que el principi de causalitat no té un fonament lògic, però sí un fonament psicològic: la naturalesa humana. Hume reconeix, tanmateix, que acceptar això no canvia per a res la nostra vida pràctica.<\/p>\n<figure><img loading=\"lazy\" src=\"filo/hume_04.jpg\" alt=\"\"><\/figure>", "min": 8}, {"n": 4, "num": "3.9.4", "title": "L'acció: el sentiment com a fonamentació de la moral", "subs": [{"id": "s4-1", "num": "4.1", "title": "La moral es basa en el sentiment"}, {"id": "s4-2", "num": "4.2", "title": "Les qualitats morals es basen en la utilitat"}], "html": "<h3 id=\"s4-1\"><span class=\"n\">4.1<\/span>La moral es basa en el sentiment<\/h3>\n<p>En el seu intent per estudiar la naturalesa humana, Hume també vol estudiar la conducta moral. Així, igual que ha descobert que moltes de les coses que sabem de la realitat es basen en uns hàbits o tendències naturals, vol descobrir si les consideracions que fem sobre el que és bo i el que és dolent es basen també en tendències naturals o, en canvi, en principis racionals. La pregunta que es planteja és: per què considerem que unes accions són bones i unes altres dolentes? I segons això, què fa que una persona sigui virtuosa o com ell diu, tingui mèrits personals?<\/p>\n<p>Des de l'intel·lectualisme de Sòcrates , les concepcions filosòfiques més tradicionals han defensat que el bé i el mal depenen de la raó, és a dir, que els éssers humans, en tant que éssers racionals, tenim en nosaltres mateixos uns principis morals que ens indiquen el que és bo, de manera que, les accions humanes són bones si s'adeqüen a ells i dolentes si no ho fan. Seguint això, aquestes concepcions han entès la virtut com la capacitat d'actuar conforme aquells principis morals de la raó. Per exemple, la nostra raó ens diu que és bo ajudar els altres i, per això, una persona és virtuosa quan ho fa. Hume està d'acord en què la moral es un conjunt de principis que ens diuen el que està bé i el que no i que intenten obligar-nos a fer unes coses i a evitar-ne d'altres. També és conscient que tots reflexionem, raonem i discutim sobre problemes i decisions morals. Ara bé, no creu que la raó sigui la que determini el que està bé i el que no, perquè està convençut que, al final, les nostres distincions morals entre el que és bo i el que és dolent les determina el sentiment. Podem saber perfectament que ajudar als altres és bo perquè ens ho diu la nostra raó, però si ajudem a algú és perquè ens agrada fer-ho.<\/p>\n<p>Com arriba Hume a aquesta afirmació? La raó no pot ser la que determini els nostres principis morals, ja que aquesta només pot efectuar dues operacions: relacionar idees o fets, i per això, Hume diferenciava entre dos tipus de qüestions: les relacions d'idees (que es basen en el pensament lògic) i les qüestions de fet (que es basen en l'experiència). D'una banda, les qüestions morals com, per exemple, \"assassinar és dolent\", no són del primer tipus, no hi ha cap principi lògic que ens demostri que l'enunciat \"assassinar és dolent\" sigui vertader. D'altra banda, les qüestions morals no són tampoc qüestions de fet, perquè si nosaltres observem un assassinat, pròpiament parlant, observem com una persona mata a una altra, però no observem que sigui un fet dolent, sinó que percebre aquest fet ens crea un sentiment de desaprovació.<\/p>\n<p>En conclusió, si la raó efectua dues operacions i en cap d'elles intervenen les qüestions morals, aquestes no tenen en ella el seu fonament. La distinció entre allò bo i allò dolent prové de la naturalesa humana que ens fa tenir sentiments de rebuig i censura en uns casos i d'aprovació en d'altres: \"la moral, per tant, se sent més que no pas es jutja\".<\/p>\n<p>Dient això, però, Hume no té la intenció de negar que la raó jugui un paper important en la vida moral: \"la raó i el sentiment concorren en quasi totes les determinacions i conclusions morals\". A més del sentiment, la raó ha d'intervenir com a guia i àrbitre en moltes qüestions de la vida moral, tot ajudant-nos a clarificar conceptes, a treure conclusions i a comparar i examinar una acció des de diferents perspectives. Però quan tenim una idea clara sobre allò que hem de fer és, en últim terme, el sentiment el que més ens influeix. Partint de la idea que les decisions morals es basen en el sentiment, defineix el bé com quelcom agradable i el mal com quelcom desagradable.<\/p>\n<figure><img loading=\"lazy\" src=\"filo/hume_05.jpg\" alt=\"\"><\/figure>\n<p>Una acció noble i generosa és aquella que ens és grata i una acció cruel és aquella que ens repugna. O dit d'una altra manera, una acció és bona perquè ens produeix plaer i aquest plaer comporta la nostra aprovació (no diem que quelcom és agradable perquè sigui bo, sinó que, en sentir que ens és agradable, ho considerem bo). Ara bé, això pot portar-nos al relativisme, és a dir, a aquella postura filosòfica que defensa que tota qüestió moral és relativa i que depèn només de qui opinió . Hume, en aquest punt prefereix pensar que els sentiments morals són iguals per a tots els éssers humans, ja que depenen de la constitució natural de la nostra ment. I així s'entén que tothom pugui considerar moralment correcte, per exemple, rebel·lar-se contra un tirà, tret que algú tingui pervertit el sentit comú. Aquesta concepció filosòfica que fonamenta els valors morals en el sentiment rep el nom d'emotivisme moral i arriba fins avui dia.<\/p>\n<h3 id=\"s4-2\"><span class=\"n\">4.2<\/span>Les qualitats morals es basen en la utilitat<\/h3>\n<p>La segona pregunta que es planteja Hume en parlar de la moral és: que fa que una persona sigui virtuosa o com ell diu, tingui mèrits personals? Hume comença definint la virtut com \"tota acció o qualitat mental que dona a l'espectador el sentiment plaent de l'aprovació i al vici com el contrari\". Com a bon investigador li preocupa determinar quines característiques tenen aquestes accions i qualitats per produir-nos el sentiment d'aprovació i, en concret, quins són els mèrits personals que fan d'un ésser humà un ésser bo.<\/p>\n<p>El problema moral es converteix així en una qüestió de fet que es pot tractar amb el mètode experimental. A partir de l'anàlisi de determinades qualitats considerades com a bones, com la benevolència i la generositat, arriba a la conclusió que el fonament de les qualitats morals de la persona virtuosa es troba en la utilitat que els seus actes tinguin per a la societat: \"la utilitat és agradable i mereix la nostra aprovació\". Això és un fet observable en la pràctica diària. Però útil, per a què? Per a interès d'algú, és clar… Ara bé, com que pensa que la utilitat que ho és per algú pot ser directament agradable per a tothom, \"tot el que contribueix a la felicitat de la societat mereix la nostra aprovació i bona voluntat. Així, l'amistat, l'altruisme, la fidelitat són bones qualitats en tant que són útils, però aquesta utilitat no es redueix només al mer egoisme perquè la nostra felicitat depèn també de la felicitat dels altres, i per això un dels objectius de la societat és aconseguir la felicitat més gran possible per a tothom. Aquesta concepció que té com a criteri i fonamentació de l'acció moral la utilitat s'anomena utilitarisme.<\/p>\n<aside class=\"nota\"><p><i>La primera vez que un hombre vio la comunicación del movimiento por<\/i> <i>impulso, como en el choque de dos bolas de billar, no pudo afirmar que un<\/i> <i>evento estaba conectado, sino sólo conjuntado, con el otro. Después que<\/i> <i>hubo observado varios casos de esta naturaleza, afirmó que estaban<\/i> <i>conectados. ¿Qué alteración ha sucedido para dar lugar a esta nueva idea<\/i> <i>de conexión? Ninguna, salvo que ahora siente que estos eventos están<\/i> <i>conectados en su imaginación, y puede fácilmente predecir la existencia<\/i> <i>de alguno a partir de la aparición del otro. Cuando decimos, por<\/i> <i>consiguiente, que un objeto está conectado con otro, sólo indicamos que<\/i> <i>han adquirido una conexión en nuestro pensamiento, dando lugar a esta<\/i> <i>inferencia por la que devienen pruebas de la existencia el uno del otro.<\/i><\/p><p><i>Fragments de Hume Abstract<\/i><\/p><\/aside>", "min": 7}]}, {"id": 5, "key": "kant", "title": "Kant", "full": "Immanuel Kant", "dates": "1724 – 1804", "era": "Idealisme transcendental", "tag": "Judicis sintètics a priori i ètica formal", "hue": 225, "obres": "Crítica de la raó pura, Crítica de la raó pràctica", "secs": [{"n": 1, "num": "4.5.1", "title": "Vida i Obra", "subs": [], "html": "<p>(1724-1804) va néixer i morir a la ciutat de Königsberg. Prússia Oriental. Fill d'una família modesta, es va criar en un ambient d'honradesa i de profunda religiositat pietista. No va abandonar mai el seu país i molt ocasionalment la seva ciutat natal. La seva educació s'inicià al Collegium Fridericianum, col·legi on es respirava una estricta religiositat protestant on s'aplicava un sistema educatiu que girava entorn de l'ensenyament de les llengües clàssiques.<\/p>\n<p>L'any 1740 Kant es matricula a la Universitat de Königsberg, atret per les matemàtiques, les ciències naturals i la filosofia. Tot i la seva vocació de professor universitari, la situació econòmica el va obligar, en acabar els seus estudis, a guanyar-se la vida com a preceptor mentre aprofundia en la investigació de temes científics i filosòfics, es doctorava i obtenia el permís de docent privat a la Universitat. L'any 1756 es va incorporar a la docència universitària i es dedica a l'ensenyança de geografia, matemàtiques, física, ciències naturals, antropologia, lògica, filosofia moral, pedagogia, art de la fortificació i pirotècnia. No serà fins als 46 anys que Kant obtindrà la càtedra de professor ordinari de Lògica i Metafísica. Res millor que les paraules d'un deixeble seu, Herder, per fer-nos idea de l'impacte que produïa entre els seus seguidors: \"L'amplitud del seu front, fet per pensar, donava aixopluc també a una serenor i alegria inalterables. Dels seus llavis fluïa un discurs ric i rigorós.<\/p>\n<p>Posseïa gràcia, humor i sensatesa, i les seves classes eren d'allò més amè que es podia trobar. Amb el mateix tarannà que analitzava les obres de Leibniz, Wolff, Baumgarten, Crusius, Hume, i penetrava en les lleis de la naturalesa formulades per Newton, Kepler i els físics, s'ocupava dels escrits, llavors apareguts, de Rousseau..., donant-los la importància que mereixien i tornant sempre a aquest coneixement lliure de la naturalesa i al valor moral de l'ésser humà. (...) Res que fos digne de ser sabut no li era indiferent. (...) Impulsava els ànims i els obligava suaument a un pensament propi i personal.\" Persona de vida sedentària, metòdica i tranquil·la, Kant va saber compaginar la docència de la filosofia, que a la universitat girava entorn dels manuals de Wolff i Baumgarten, amb una seriosa dedicació a la investigació que fructificarà amb la lenta gestació del seu propi pensament. Aquest solter vocacional, famós pel seu passeig diari cronomètricament exacte, era un defensor convençut del pacifisme, un admirador de Frederic II el Gran, a qui dedica la seva primera obra, i un entusiasta de les Revolucions francesa i americana.<\/p>\n<p>Immanuel Kant Habitualment es considera la vida de Kant monòtona i avorrida, però aquest ha estat un judici que no s'ajusta a la realitat perquè, si és cert que la seva vida pública no és la pròpia del protagonista d'un llibre d'aventures, interiorment Kant viu amb passió la vida d'un autèntic descobridor. Tant és així que Kant despertava autèntica admiració entre els seus conciutadans i no és estrany que, ja en vida seva, circulessin tres biografies de l'insigne professor. L'any 1797, Kant abandona la seva càtedra obligat per la seva avançada edat i la seva fràgil salut. Morirà set anys més tard. A l'epitafi de la seva tomba es podia llegir la reproducció d'un bell fragment seu: \"dues coses omplen el meu ànim amb sempre nova i creixent admiració i respecte: el cel estrellat a sobre meu i la llei moral dins meu.\" Tres seran les obres més significatives de Kant: la Crítica de la raó pura (1781), escrita en quatre o cinc mesos, però que serà el resultat d'un esforç silenciós i constant de més de dotze anys de gestació; la Crítica de la raó pràctica (1788) i la Crítica del judici (1790).<\/p>\n<p>També són importants una sèrie d'obres que reflexionen sobre la problemàtica de les seves crítiques. Així, l'any 1783 publica els Prolegòmens a tota metafísica futura, autèntica introducció a la seva Crítica de la raó pura, i dos anys més tard veurà la llum el seu llibre Fonaments de la metafísica dels costums. L'any 1793, any de l'execució de Lluís XVI, publica La religió dins dels límits de la mera raó, obra que li causarà problemes amb el poder perquè Frederic Guillem II, atemorit per les conseqüències de la Revolució Francesa, canvia la política cultural del seu pare i es manifesta \"disposat a extirpar el lliure pensament de Prússia\".<\/p>\n<figure><img loading=\"lazy\" src=\"filo/kant_00.jpg\" alt=\"\"><\/figure>\n<p>Així, recrimina Kant perquè menysprea algunes doctrines fonamentals de l'Escriptura i del cristianisme. El filòsof no es retracta, però promet no celebrar cap manifestació pública relacionada amb la religió. Un cop mort el rei, en una obra publicada l'any 1798, ataca el despotisme que havia pretès abolir la llibertat de pensament<\/p>", "min": 4}, {"n": 2, "num": "4.5.2", "title": "Influència i Objectius", "subs": [], "html": "<p>Així com en el procés de gestació de la nostra formació intel·lectual intervenen tot un conjunt de condicionants socials, culturals, econòmics, ideològics,... del nostre entorn, també en Kant es produeix aquest fet. En aquest sentit, els referents intel·lectuals que l'ajuden a perfilar el seu propi pensament són: primer, la concepció de la naturalesa de Newton; després, el plantejament metafísic de Wolff; en tercer lloc, la teoria del coneixement de Hume; i, tot plegat, emmarcat en el context de la Il·lustració. En aquest context racionalista, com va influenciar Hume a Kant? A partir del 1770, Kant passarà més de deu anys treballant en la seva gran obra: la Critica de la raó pura (1781). I en el procés de gestació del seu pensament més madur, la influència de Hume, al que Kant havia llegit ja feia temps, es fa cada cop més palesa, fins al punt que ell mateix reconeixerà més tard que la influència de Hume li havia estat decisiva, així ho indica: \"Confesso obertament que Hume va ser qui, fa uns anys, em va despertar del meu somni dogmàtic i va donar una nova direcció a les meves investigacions en el camp de la filosofia\" (Prolegòmens). Hume, doncs, l'allunyarà del seu somni dogmàtic, l'ajudarà a reconèixer la insuficiència del dogmatisme racionalista i la seva pretensió d'explicar la totalitat de la realitat sense recórrer a l'experiència, però també l'obligarà a<\/p>\n<p class=\"cap\"><b>Crítica de la raó<\/b> <b>Pura. Taurus<\/b><\/p>\n<p>prendre partit davant l'empirisme i la seva manifestació més radical, l'escepticisme. Què representa per a Kant la Il·lustració? Ningú millor que ell mateix per explicar-nos-ho. En la seva Resposta a la pregunta ¿Què és la Il·lustració?, de 1783, escriu:<\/p>\n<p><i>\"La Il·lustració és la sortida de l'ésser humà de la seva minoria d'edat, de la qual ell<\/i> <i>mateix és culpable. Minoria d'edat és la incapacitat de servir-se del mateix enteniment<\/i> <i>sense la direcció d'un altre. Ell mateix n'és culpable d'aquesta minoria, perquè la seva<\/i> <i>causa no consisteix en un defecte de l'enteniment sinó en la mancança de la decisió i del<\/i> <i>coratge de servir-se del seu propi enteniment, sense la direcció de cap altre. Sapere aude!<\/i> <i>Tingues coratge de servir-te del teu propi enteniment! Aquest és, doncs, el lema de la<\/i> <i>Il·lustració.<\/i><\/p>\n<p>La mandra i la covardia són les causes del fet que una part tan gran dels éssers humans -malgrat que la natura els va declarar ja fa molt temps lliures de direcció aliena-, romanen de bon grat menor d'edat per tota la vida, i del fet que a altres els és tan fàcil erigir-se en els seus tutors. És tan còmode ser menor d'edat! Si tinc un llibre que pensa per mi, un director espiritual que substitueix la meva consciència, un metge que em prescriu la dieta, i així successivament, aleshores ja no cal que m'esforci. Si puc pagar, no tinc cap necessitat de pensar; altres assumiran per mi aquesta feina tan empipadora (...). És difícil, per tant, per a cada ésser humà sortir d'aquesta minoria d'edat la qual s'ha convertit gairebé en naturalesa. Fins i tot s'hi han acostumat de bon grat, i ara per ara, són realment incapaços de servir-se del seu propi enteniment, perquè mai no se'ls deixa intentar-ho (...). En canvi, és més aviat possible que algú 's'il·lustri' a si mateix; més ben dit, és gairebé indefectible sempre que se li doni llibertat. Perquè sempre n'hi ha alguns que pensin per si mateixos, fins i tot entre els que ha estat designat tutors de la gran massa. Aquests, després d'haver refusat el joc de la minoria d'edat, estendran arreu l'esperit d'una estimació racional del mateix valor i de la vocació de tot ésser humà a pensar per si mateix.\" Efectivament, Kant va acceptar el repte de pensar per si mateix, va convertir el criteri de la raó en fonament per al progrés del coneixement i es va adonar que havia de prendre partit davant els grans corrents de pensament de l'època (racionalisme i empirisme), repte que va acceptar amb coratge.<\/p>\n<figure><img loading=\"lazy\" src=\"filo/kant_01.jpg\" alt=\"\"><\/figure>\n<p>Per això, reivindica, en primer lloc, enfront de tota forma d'autora externa, la llibertat de l'individu que vol ser protagonista del seu destí i això el porta a recolzar els principis d’igualtat, fraternitat i llibertat de la Revolució Francesa; en segon lloc, enfront de les discussions entre racionalistes i empiristes pel que fa al paper de la raó en el procés de coneixement, Kant defensa la necessitat d'examinar la raó per veure quines són les seves possibilitats i quins els seus límits; en tercer lloc, enfront dels que buscaven una guia externa que servis de criteri per decidir com actuar en cada ocasió, defensa un model d'individu que actua mogut pel deure i no accepta receptes alienes a la seva voluntat.<\/p>\n<p>Del que acabem de dir se'n deriva l'objectiu filosòfic de Kant: respondre a pregunta \"que és l'ésser humà\". I considera que això només es podrà portar a terme contestant les preguntes següents: 1) Què puc saber? 2) Què he de fer? 3) Què puc esperar si faig allò que he de fer? Explicarem la resposta de Kant a la primera pregunta a l'apartat sobre el coneixement, la segona a l'apartat sobre l'acció, i la tercera a l'apartat sobre l'ésser humà.<\/p>", "min": 5}, {"n": 3, "num": "4.5.3", "title": "El coneixement", "subs": [{"id": "s3-1", "num": "3.1", "title": "El judici imaginari de la raó"}, {"id": "s3-2", "num": "3.2", "title": "El coneixement a priori"}, {"id": "s3-3", "num": "3.3", "title": "Els judicis sintètics a priori"}, {"id": "s3-4", "num": "3.4", "title": "La possibilitat dels judicis sintètics a priori"}, {"id": "s3-5", "num": "3.5", "title": "La Crítica de la raó pura"}, {"id": "s3-6", "num": "3.6", "title": "L'Estètica Transcendental"}, {"id": "s3-7", "num": "3.7", "title": "L'Analítica Transcendental"}, {"id": "s3-8", "num": "3.8", "title": "Fenomen i noümen. L'idealisme transcendental"}, {"id": "s3-9", "num": "3.9", "title": "La Dialèctica Transcendental"}], "html": "<p>Hem vist dues interpretacions del paper que la raó desenvolupa en el procés de coneixement l'empirisme escèptic, on la raó només recull i elabora les dades sensibles, i el racionalisme dogmàtic, on, al marge de l'experiència, coneix a partir d'idees innates. Kant vol prendre part per això, es pregunta si és possible el coneixement de la naturalesa, en contra dels que el negaven, els escèptics (com ara Hume), i vol aclarir quins són els límits d'aquest coneixement, en contra dels dogmàtics que el creien il·limitat (com Wolff). Aquest plantejament porta Kant a replantejar-se el paper que la raó juga en el procés del coneixement i amb passa per l’anàlisi de la pròpia raó. La raó s'ha de sotmetre a crítica, en un judici imaginari on ella mateixa sigui, a la vegada, acusat i jutge.<\/p>\n<h3 id=\"s3-1\"><span class=\"n\">3.1<\/span>El judici imaginari de la raó<\/h3>\n<p>La primera de les preguntes anteriors, què puc conèixer?, l'aborda Kant en l'obra Crítica de la raó pura. En ella comença plantejant-se si la metafísica és una ciència perquè havia estat considerada d'antuvi la reina de totes elles, però arran dels atacs dels pietistes i dels empiristes, aquesta disciplina filosòfica havia caigut en el descrèdit i cap a ella s'havia estès una actitud d'indiferència.<\/p>\n<figure><img loading=\"lazy\" src=\"filo/kant_02.jpg\" alt=\"\"><\/figure>\n<p>Kant, en canvi, considera, per una banda, que l'objecte de la metafísica (Déu, la llibertat i la immortalitat de l'ànima) no ens pot deixar indiferents i, per l'altra, assenyala , com hem vist que raó ha d'instituir un tribunal que la refermi \"en les seves pretensions legítimes i que, en canvi, acabi amb totes les arrogàncies infundades, no a través d'afirmacions arbitràries, sinó segons les seves lleis immutables. Aquest tribunal no és altre que la Crítica de la raó pura mateixa\". I què és allò que s'està jutjant en aquest tribunal?<\/p>\n<p>Decidir si és possible d'obtenir un coneixement científic de l'objecte de la metafísica, és a dir, de realitats que se suposen més enllà de l'experiència sensible. Arribat aquest punt, Kant se sent obligat a reconèixer que la matemàtica i la física són inqüestionablement ciències; per tant, el criteri per decidir sobre la validesa científica de la metafísica queda constituït a partir d'allò que fa possible que la matemàtica i la física siguin ciències. Els passos que Kant recorrerà són, per tant, els següents: primer es pregunta quins són els elements que intervenen en el procés de coneixement; després, es planteja de quina manera és possible el coneixement científic, és a dir, quines són les seves condicions de possibilitat finalment, aplica aquestes condicions de possibilitat de la ciència a la metafísica per comprovar si les compleix o no.<\/p>\n<h3 id=\"s3-2\"><span class=\"n\">3.2<\/span>El coneixement a priori<\/h3>\n<p>Tota la Crítica de la raó pura gira al voltant de la concepció kantiana del coneixement i dels elements que el fan possible, Kant afirma que tot el nostre coneixement s'inicia \"amb\" l'experiència, però que no tot ell s'origina en l'experiència. Aquesta distinció és fonamental i s'ha de clarificar: Kant es planteja si el conegut no serà resultat, per una banda, de les impressions sensibles (la matèria del coneixement) i, per l'altra, d'allò que aporta la nostra pròpia facultat de conèixer. I afegeix que potser no som capaços de distingir ambdós elements perquè fa falta una reflexió profunda per tal de diferenciar-los. A partir d'aquesta reflexió, distingeix entre un coneixement empíric , aquell que té la seva font en l'experiència, en les impressions, I un coneixement que és independent de l'experiència tot fent-la possible i que anomena a priori. Què vol dir a priori? Tots sabem a priori (sense esperar al fet que l'experiència ens ho confirmi) que si es destrueixen els fonaments d'una casa caurà; aquest sentit de a priori, però, es fonamenta en l'experiència passada del subjecte: que els cossos són pesats i que quan se'ls treu la seva base cauen. Kant, en canvi, entén la a priori com aquell coneixement que és absolutament independent de tota experiència, per exemple, que el \"tot és major que les seves parts\".<\/p>\n<figure><img loading=\"lazy\" src=\"filo/kant_03.jpg\" alt=\"\"><\/figure>\n<p>Kant està d'acord amb l'empirisme de Hume quan afirma que el coneixement empíric , tot i que amplia el nostre coneixement de la realitat, només ens proporciona un coneixement de tipus probable i, per tant, no vàlid universalment, d'aquí l'escepticisme de Hume; però Kant també està d'acord amb el racionalisme quan considera que en el coneixement intervé un component a priori que li aporta el seu caràcter d'universalitat de necessitat. Aquests seran, doncs, els dos requisits que Kant demana al coneixement científic , que ampliï el nostre coneixement de la realitat (gràcies al seu component empíric) i que proporcioni un coneixement universal i necessari (gràcies al vessant a priori). Una de les tasques de la Crítica de la raó pura consistirà en la identificació d'aquells elements a priori del coneixement.<\/p>\n<h3 id=\"s3-3\"><span class=\"n\">3.3<\/span>Els judicis sintètics a priori<\/h3>\n<p>Com la ciència s'expressa a través de judicis, Kant aborda la pregunta sobre la seva possibilitat plantejant-se quins són els tipus de judicis propis de la ciència. Abans, però, estudia els diferents tipus de judicis existents tot seguint un doble criteri: analitza el tipus de relació que es produeix entre el subjecte i el predicat i distingeix de quina manera és possible conèixer la veritat del judici. Pel que fa a la relació que s'estableix entre el subjecte i el predicat considera que hi ha dos tipus de judicis: els judicis analítics i els judicis sintètics. Els judicis analítics són aquells en què el predicat està comprès en la noció del subjecte, això significa que tenen dues característiques: són judicis explicatius, és a dir, el predicat no ens diu res de nou sobre el subjecte, només l'explica, però sense ampliar-ne el coneixement; en segon lloc, la seva negació suposa contradicció.<\/p>\n<p>Així, per exemple, dir que \"tots els cossos són extensos\" és un judici analític perquè el concepte de \"cos\" ja inclou l'\"extensió\", i perquè afirmar que un cos és inextens és contradictori. Els judicis sintètics , en canvi, són aquells en els quals el predicat no s'identifica amb la noció del subjecte, la qual cosa implica, d'una banda, que són judicis d'ampliació perquè el predicat sí que afegeix quelcom de nou al subjecte, ampliant-ne així el nostre coneixement i, de l'altra, que la seva negació no suposa contradicció. Per exemple, el judici \"tots els cossos són pesats\" ens dona una informació que no es troba inclosa en el subjecte: tot cos és necessàriament extens però no pesat, ja que el pes depèn de la força de gravetat, de forma que no és contradictori afirmar que no tots els cossos són pesats. Així, nosaltres som cossos extensos tant a la Terra com a l'espai, però no tenim el mateix pes, millor dit, a l'espai no pesem; a més, sense extensió no seríem cossos, mentre que sense pes, sí.<\/p>\n<p>En relació amb la manera com es pot esbrinar la veritat dels judicis Kant distingeix entre judicis a priori , la veritat dels quals pot ser coneguda independentment de l'experiència, judicis a posteriori , la veritat dels quals és coneguda a partir de l'experiència. Així, el judici \"tot cos és extens\", és un judici que no necessita comprovació empírica perquè per definició, tot cos és extens; en canvi, el judici \"tot cos és pesar\", necessita del recurs de l'experiència perquè només ho podem saber recorrent a ella. Així, del pes d'un objecte ens adonem quan l'agafem, però no ens cal ni percebre'l per saber que si és un cos, és extens<\/p>\n<p>Segons l'anterior classificació, Kant parla de judicis analítics a priori i judicis sintètics posteriors i. Els primers (per exemple: \"un triangle és una figura formada per la unió de tres anglès\"), no necessiten del recurs de l'experiència i són universals i necessaris, però no amplien el nostre coneixement (qualsevol que sàpiga què és un triangle sap que ha de tenir tres angles), els segons, en canvi (per exemple: \"tots els cignes són blancs\") amplien el nostre coneixement de la realitat, però en tant que necessiten l'experiència no són universals ni necessaris. Aquesta distinció és la que havia considerat Hume quan parlava de \"relacions d'idees\" i \"judicis de fets\".<\/p>\n<p>Kant, però, no està encara satisfet perquè té clar que un judici científic ha d'ampliar el nostre coneixement alhora ser universal i necessari. Analitzen el següent judici: \"Tot el que esdevé té una causa\". En aquest cas, el predicat aporta quelcom de nou al subjecte, ja que en la noció de \"quelcom que esdevé, no es fa referència a la noció de \"tenir una causa\". Es tracta, per tant, d'un judici sintètic, però, a més, és estrictament universal i necessari, ja que no cal recórrer a l'experiència per saber que és així; és o a priori.<\/p>\n<p>En aquest exemple troba Kant justament un cas de judici que no només amplia el mostri coneixement de la realitat sinó que, a més, és universal i necessari, perquè no depèn de l'experiència. Acaba de descobrir els judicis sintètics a priori , judicis que compleixen les condicions que, com hem assenyalat, aquest autor demana per al coneixement científic.<\/p>\n<p><i>Classificació dels judicis segons Kant:<\/i><\/p>\n<figure><img loading=\"lazy\" src=\"filo/kant_04.jpg\" alt=\"\"><\/figure>\n<h3 id=\"s3-4\"><span class=\"n\">3.4<\/span>La possibilitat dels judicis sintètics a priori<\/h3>\n<p>Hem vist que Kant considera que els judicis propis del coneixement científic són els judicis sintètics a priori; exemples d'aquests judicis són: \"la línia recta és la distància més curta entre dos punts\", \"la quantitat de matèria roman inalterada\", \"en tota comunicació del moviment han de ser sempre iguals l'acció i la reacció\", etc. Però tots aquests exemples són trets de les matemàtiques de la física, falta encara saber si a la metafísica també es donen les condicions que els fan possibles. En aquest sentit, a la Crítica de la raó pura es planteja Kant dos tipus de preguntes: primer, com són possibles els judicis sintètics a priori en la física i en les matemàtiques, sense dubtar de la seva existència; i, segon, si són possibles els judicis sintètics o prior en la metafísica és a dir, si la metafísica és una ciència, cosa de la qual dubta.<\/p>\n<h3 id=\"s3-5\"><span class=\"n\">3.5<\/span>La Crítica de la raó pura<\/h3>\n<p>Per intentar respondre totes les preguntes plantejades, Kant parteix a la Crítica de la raó pura de les diverses facultats que, segons ell, intervenen en el procés del coneixement. Considera així que l'ésser humà està dotat, primer, de sensibilitat , és a dir, que és capaç de rebre passivament impressions provinents de l'exterior (colors, sons, ); segon, d'enteniment , perquè elabora conceptes (Maria, rossa, simpàtica) i formula judicis relacionant aquests conceptes (la Maria és rossa); finalment, de raó , perquè, a més, lliga els judicis establint cadenes de raonaments (totes les persones rosses són simpàtiques, la Maria és rossa, per tant, la Maria és simpàtica). Aquestes tres capacitats de l'ésser humà formen part d'allò que Kant anomena la raó en sentit genèric i es relacionen amb els tres tipus de coneixement que està analitzant: el matemàtic, el físic i el metafísic. Ja tenim, per tant, plantejada en tres parts l'estructura de la Crítica de la raó pura:<\/p>\n<ul>\n<li><i>Estètica transcendental<\/i> : estudia les condicions que fan possible el coneixement sensible (els seus elements empírics i a priori) i com són possibles els judicis sintètics a priori a les matemàtiques, és a dir, les condicions que els fan possibles.<\/li>\n<li><i>Analítica transcendental<\/i> : estudia les condicions que fan possible el coneixement intel·lectual (els seus elements empírics i a priori) i, a més, busca quines són les condicions que fan possibles els judicis sintètics a priori a la física.<\/li>\n<li><i>Dialèctica transcendental:<\/i> fa un estudi de la raó per veure fins on podem arribar en el procés del coneixement intel·lectual i, també, es pregunta si són possibles els judicis sintètics a priori a la metafísica<\/li>\n<\/ul>\n<h3 id=\"s3-6\"><span class=\"n\">3.6<\/span>L'Estètica Transcendental<\/h3>\n<p>Estètica (del grec, aiscesis) significa \"sensació\". Així, Kant, quan parla de la sensibilitat com a facultat de coneixement està fent referència a la capacitat de l'ésser humà de rebre sensacions. A través de les sensacions entrem en contacte amb la realitat exterior. Ara bé, les sensacions constitueixen la matèria del nostre coneixement, són el seu element empíric, però falta encara la seva forma, allò que a priori les fa possibles. Què és l'absolutament independent de tota sensació que, a més, és la seva condició de possibilitat? Per poder percebre quelcom s'han de donar dues condicions: que s'hagi percebut en un lloc i en un temps. Si algú ens digués que ha vist quelcom, però que no l'ha vist en cap lloc ni mai, immediatament pensaríem que ens està prenent el pèl.<\/p>\n<p>Percebre, doncs, significa ordenar les sensacions caòtiques (colors, sons, volums, etc.) en l'espai i en el temps , que no són quelcom de les sensacions sinó quelcom que pertany a la nostra facultat de sentir: mitjançant l'espai percebem espaialment i mitjançant el temps percebem temporalment. Espai i temps no són, per tant, quelcom real sinó \"formes a priori de la sensibilitat\", són \"formes perquè constitueixen l'estructura on ens són fetes totes les sensacions, \"a prior\" perquè són previs a l'experiència sensible i, per tant, tenen un caràcter universal i necessari), i de la \"sensibilitat\" perquè fan possible el coneixement sensible. També els anomena \"intuïcions pures\", \"intuïcions pel seu caràcter immediat, i \"pures\" perquè no tenen contingut empíric. També s'ocupa a l'Estètica Transcendental de la possibilitat dels \"judicis sintètics a prior\" en les matemàtiques. Per a Kant, les matemàtiques són possibles com a ciència precisament perquè es fonamenten en l'espai i el temps; així, la geometria estudia les propietats de l'espai i l’aritmètica estudia les sèries numèriques (1, 2, 3, etc.) que són successions temporals (el 2 va abans que el 3 però després de l'1, per exemple). Serà justament perquè espai i temps són \"formes a priori\" que són possibles els judicis sintètics a priori en les matemàtiques. Judicis del tipus 7+5=12\" són sintètics, perquè el predicat amplia la informació continguda al subjecte, i són a priori, perquè són previs i independents de l'experiència i, per tant, són judicis universals i necessaris. Kant ha descobert que a la sensibilitat s'unifiquen i ordenen les dades de l'experiència sensible (les sensacions) en l'espai i el temps, tot formant-se l'objecte de la nostra experiència, allò que anomena el fenomen.<\/p>\n<h3 id=\"s3-7\"><span class=\"n\">3.7<\/span>L'Analítica Transcendental<\/h3>\n<p>La sensibilitat proporciona al coneixement un conjunt de fenòmens, de sensacions situades a l'espai i el temps. Però percebre no vol dir entendre, per això és necessària una altra capacitat en l'ésser humà que li permeti entendre allò percebut, aquesta capacitat és l'enteniment. Entendre vol dir, ser capaç de poder relacionar un fenomen amb un concepte. Tots ens hem trobat algun cop amb la pregunta pròpia dels infants: I això com es diu? Aquesta pregunta implica, per un cantó, que és a través dels conceptes que els humans entenem allò que percebem a través de la sensibilitat (casa, amiga...); però també, que el procés amb què es refereix una impressió a un concepte es realitza a través d'un judici (\"això és una casa\", \"aquesta és la meva amiga, etc.). Així, per entendre una impressió hem de poder aplicar-li un concepte i en aquest procés d'aplicació de conceptes fem servir els judicis.<\/p>\n<p>Pel que fa als conceptes, Kant en distingeix de dos tipus: els conceptes empírics (casa, a mi a, etc.) aquells que procedeixen de l'experiència, és a dir, que són a posteriori ; i els conceptes purs categories (causa, substància, existència...) que són a priori, serveixen per unificar les dades de l'experiència i no tenen contingut empíric. Quants conceptes purs hi ha i com descobrir-los? Ja que l'enteniment utilitza els conceptes tot relacionant-los a través de judicis per ordenar les dades de l'experiència sensible (\"la Marta és amiga meva\", \"una casa no és un ésser viu\", etc.), Kant recorre a la lògica per analitzar els diversos tipus de judicis que hi ha i així descobrir les categories. Per això, entén l'analítica transcendental com la \"lògica de la veritat\", ja que estudia l'ús correcte dels conceptes i principis de l'enteniment. Aquest procés que pretén descobrir les diferents categories de l'enteniment a partir dels diferents tipus de judicis és el que Kant anomena \"deducció metafísica de les categories\".<\/p>\n<p><i>Tipus de judicis segons Kant:<\/i><\/p>\n<figure><img loading=\"lazy\" src=\"filo/kant_05.jpg\" alt=\"\"><\/figure>\n<p>de fenòmens. Així, com es tracta d'un judici categòric, l'enteniment aplica la categoria de substància, com es tracta d'un judici afirmatiu, l'enteniment aplica la categoria relació, etc. Són categories com la de substància, relació, etc., les que ens permeten unificar els fenòmens tot ordenant-los en un conjunt de conceptes empírics significatius per a l'enteniment. Les categories representen aquell element a priori que fa possible que els fenòmens puguin ser pensats. Igual que l'espai i el temps unifiquen les dades sensibles tot fent possible la sensibilitat, les categories unifiquen els fenòmens tot fent possible l'enteniment. Igual que l'espai i el temps. Són buits de contingut empíric i s'han d'omplir amb les impressions sensibles, les categories han d'omplir-se amb les dades provinents de la sensibilitat. Per tant, les categories només poden ser aplicades als fenòmens, és a dir, a les sensacions donades a l'espai i el temps. Un altre aspecte que tracta a l'Analítica Transcendental és el de la possibilitat dels \"judicis sintètics a priori\" en la física. La física explica sempre els fenòmens mitjançant judicis hipotètics (\"si passa això, esdevindrà allò\"), judicis que són possibles gràcies a la categoria de causa-efecte i, per això, són a priori. El judici \"si escalfem aigua a 100°, aquesta s'evapora\" és un exemple de judici sintètic, perquè amplia el nostre coneixement de la realitat, però també és a priori perquè es fonamenta en la categoria de causa-efecte i la seva aplicació, per tant, és universal i necessària, s'estén a tots els fenòmens, a tot allò donat a l'enteniment i conegut per ell. Kant s'allunya així de Hume que considerava la relació causa-efecte com a resultat de l'experiència (a posteriori) i, per tant, no podia ser universal i necessària.<\/p>\n<h3 id=\"s3-8\"><span class=\"n\">3.8<\/span>Fenomen i noümen. L'idealisme transcendental<\/h3>\n<p>Assenyalàvem anteriorment que tot i que les categories no provenen de l'experiència, la seva utilització només és vàlida per referir-nos al que es dona en l'experiència, als fenòmens. Kant distingeix així un ús legítim de les categories, la seva aplicació als fenòmens, del que seria el seu ús il·legítim , aplicar-les a objectes que transcendeixen l'àmbit de l'experiència. Mentre que l'ús legítim de les categories amplia el nostre coneixement de la realitat, el seu ús il·legítim no ho fa. Significa això, però, que Kant redueix la realitat a purs fenòmens? Cal afirmar que el fenomen és allò que se'ns apareix, aquell aspecte de la realitat que podem conèixer, implica acceptar que la realitat en si mateixa gaudeix d'altres aspectes que ens són desconeguts. L'objecte en quant és quelcom conegut (fenomen, cosa per a mi), implica un correlat, allò que sigui l'objecte en si mateix i al marge de la nostra manera d'intuir-lo, a aquest correlat Kant l'anomena noümen o \"cosa en si\".<\/p>\n<p>Kant distingeix dos sentits del concepte \"noümen\": des d'un punt de vista negatiu el noümen significaria \"una cosa en quant no és objecte de la nostra intuïció sensible\", és a dir, un objecte considerat al marge de la nostra manera de conèixer-lo; des d'un punt de vista positiu, significaria \"l'objecte d'una intuïció no sensible\", és a dir, el que es capta a través d'una intuïció intel·lectual. Però, donat que, segons Kant, l'ésser humà és incapaç d'intuir intel·lectualment, el concepte de noümen queda restringit al vessant negatiu del seu sentit: el noümen és el límit de la nostra experiència i, per tant, del nostre coneixement de la realitat. Ara podem entendre per què Kant caracteritza el seu pensament d'idealisme transcendental. És idealisme perquè les condicions que permeten al subjecte conèixer l'objecte van més enllà de l'objecte, són condicions independents de l'experiència (que depenen del subjecte que coneix). És transcendental perquè espai, temps i categories són allò que fa possible el nostre coneixement de la realitat, però no són trets de les coses en si mateixes.<\/p>\n<figure><img loading=\"lazy\" src=\"filo/kant_06.jpg\" alt=\"\"><\/figure>\n<p>En aquest sentit, la genialitat de Kant no consisteix només en la seva capacitat d'analitzar sintetitzar les diferents tendències intel·lectuals del seu entorn, especialment el racionalisme l'empirisme, sinó en ser capaç, a més, d'aportar una nova perspectiva per al futur que ell mateix considera que representa una nova revolució copernicana. Què implica aquesta revolució? Igual que Copèrnic havia plantejat una nova visió de l'univers que passava del geocentrisme a l'heliocentrisme, Kant presenta una nova perspectiva del paper que l'ésser humà juga en el procés de coneixement: en lloc de considerar que és la nostra facultat de coneixement la que s'adapta a la forma dels objectes, es planteja si no seran els objectes els que s'adapten a la forma de la nostra manera de conèixer. És a dir, Kant està donant el protagonisme al subjecte que coneix perquè considera que aquest desenvolupa un paper actiu en la configuració d'allò que anomenem l'objecte de coneixement. Això no implica, però, que l'objecte conegut sigui una creació del subjecte, sinó que està afirmant que el subjecte adapta l'objecte a la seva pròpia manera de conèixer (gir copernicà).<\/p>\n<h3 id=\"s3-9\"><span class=\"n\">3.9<\/span>La Dialèctica Transcendental<\/h3>\n<p>Si l'analítica era considerada per Kant la \"lògica de la veritat\", la dialèctica l'entén com la \"lògica de l'aparença i la il·lusió\". Si a l'Analítica Transcendental havia portat a terme l'anàlisi de l'ús legítim de l'enteniment com a facultat que coneix, a la Dialèctica Transcendental pretén portar a terme \"una crítica de l'enteniment i la raó, respecte al seu ús hiperfísic\". Kant aborda així, en primer lloc, l'estudi de la raó i, en segon lloc, la pretensió de la metafísica d'oferir coneixement científic.<\/p>\n<p>1) L'estudi de la raó. Hem vist com la sensibilitat rep les sensacions i les ordena en l'espai i el temps formant el fenomen; i que l'enteniment aplica als fenòmens les categories, tot elaborant conceptes empírics que lliga en forma de judicis; ens falta encara considerar la raó com a facultat que lliga uns judicis amb uns altres per constituir raonaments. Així, si diem que \"tots els éssers humans són mortals\" i que \"Sòcrates és un ésser humà\", podem concloure que \"Sòcrates és mortal\"; la conclusió d'aquest raonament es fonamenta en les dues premisses que actuen de condicions i que la fan possible. Ara bé, podem preguntar-nos per la condició de la primera premissa \"tots els éssers humans són mortals\" i la trobarem en el següent raonament: si \"tots els animals són mortals\" i 'tots els éssers humans són animals\", llavors \"tots els éssers humans són mortals\". Novament hem trobat les condicions que fan possible la conclusió. Kant considera que aquest procés que \"busca la condició general del judici\" constitueix l'ús formal o lògic de la raó. Seguint amb el nostre exemple, encara ens podem preguntar per les condicions que fan possible el judici \"tots els animals són mortals\". Trobem així que si \"tots els éssers vius són mortals\" i \"tots els animals són éssers vius es conclou que \"tots els animals són mortals\". Fins on podem arribar en aquest procés ascendent? Kant considera que la raó és una facultat que busca cada cop judicis més generals amb la pretensió legitima d'arribar al que podríem considerar el judici que és condició de tots els altres, essent ell mateix incondicionat. Això no significa que aquesta condició incondicionada última existeixi ni que es pugui assolir, però aquesta és la manera de funcionar de la raó, des del punt de vista del seu ús lògic. La tendència de la raó a buscar allò incondicionat la porta a certs principis que no són presos ni de la sensibilitat ni de l'enteniment, estem parlant de tres conceptes purs de la raó, de tres condicions incondicionades que Kant anomena idees transcendentals. Igual que les categories constituïen els conceptes purs (conceptes a priori) de l'enteniment, les idees transcendentals constitueixen els conceptes purs de la raó, allò absolutament primer més enllà del qual no podem anar. Quines són aquestes idees? Kant considera que són tres: en primer lloc, la idea d'Ànima, que unifica el conjunt de fenòmens de l'experiència interna en allò que es considera un subjecte pensant o una substància permanent; en segon lloc, la idea de Món, que unifica la totalitat dels fenòmens de l'experiència externa; i, finalment, la idea de Déu, considerat com la condició de possibilitat última de tots els fenòmens.<\/p>\n<p>2) Possibilitat de la metafísica com a ciència. Kant considera que Ànima, Món i Déu constituïen els tres objectes d'estudi de la metafísica del seu temps: la \"psicologia racional\", la \"cosmologia racional\" i la \"teologia racional\", respectivament. El problema es planteja no tant en l'objecte de la metafísica, ja hem indicat que es tracta de tres idees \"proposades per la naturalesa mateixa de la raó\", com en la pretensió d'aquestes disciplines d'oferir coneixement científic de l'Ànima, del Món i de Déu. Perquè una cosa pugui ser objecte de coneixement cal que es produeixi la síntesi de la sensibilitat i l'enteniment; cal, primer, que l'objecte ens sigui donat a través de l'experiència, després, que sigui conegut a través de les categories de l'enteniment. I el problema de la metafísica és que aplica les categories de l'enteniment a Déu, a l' À nima i al Món, que són idees i no fenòmens. Per exemple, quan afirma que l'ànima existeix està aplicant la categoria d'existència a una realitat de la qual no en tenim cap intuïció. I el mateix passa amb les idees de Déu i Món. Per això, la pregunta sobre la possibilitat de la metafísica com a ciència és contestada negativament a la Dialèctica transcendental. En ella, Kant estudia com la il·lusió de considerar les idees de la raó en tant que objectes susceptibles de coneixement científic, ha portat els metafísics a diferents tipus de raonaments dialèctics (en el sentit de falsos):<\/p>\n<ul>\n<li>Quan la metafísica intenta conèixer l'ànima al marge de l'experiència arriba a paralogismes, és a dir sil·logismes de conclusió errònia. Així, sorgeix un paralogisme quan apliquem el concepte de substància a l'ànima, que és una idea de la raó i, com a tal idea, no es dona en l'experiència.<\/li>\n<li>Quan la metafísica intenta explicar el món arriba a antinòmies, és a dir, a dues afirmacions oposades que proven amb la mateixa necessitat tant la tesi, per exemple, que el món té un origen en el temps i que es troba limitat en l'espai, com la seva antítesi, en el nostre exemple, que el món no té un origen en el temps ni límits en l'espai.<\/li>\n<li>Finalment, l'intent de demostrar l'existència de Déu cau en \"ideals de la raó\". Kant rebutja les diverses proves de l'existència de Déu: l'argument teleològic (que parteix de la finalitat i ordre que es manifesta al cosmos i busca a Déu com a causa d'aquest ordre i finalitat), l'argument cosmològic (que parteix de l'existència contingent de les coses i arriba a Déu com a ésser necessari causa de tot) i l'argument ontològic (nom que utilitza ell per primer cop per referir-se a l'intent de demostrar l'existència de Déu a partir de la idea d'un ésser perfectíssim). Pel que fa als dos primers, Kant considera que aplicar la categoria de causa a quelcom suprasensible implica fer un ús il·legítim d'aquesta categoria. I amb relació a l'argument ontològic, Kant pensa que no n'hi ha prou amb afegir al concepte d'una cosa l'existència perquè aquella cosa existeixi, ja que l'existència no és un predicat més de la cosa.<\/li>\n<\/ul>\n<p>Assenyalem, però, que les idees de la raó no són en si mateixes dialèctiques (falses). Allò que provoca que d'elles sorgeixi una il·lusió dialèctica és el seu ús incorrecte: aplicar les categories de l'enteniment (substància, causalitat, existència...) a suposats objectes que es troben fora de l'àmbit de l'experiència. Però si, per una banda, és lògicament incorrecte aplicar les categories més enllà de l'experiència, per l'altra és una tendència inevitable de la pròpia raó. Per això, Kant considera que aquestes idees, tot i que escapen a les possibilitats de la ciència, representen un paper útil per al coneixement i susceptible d'un ús correcte, és el que anomena ús regulatiu de les idees de la raó. Les idees de la raó són idees reguladores del coneixement científic, és a dir, són ideals que orienten el desenvolupament de la ciència tot dibuixant un horitzó que no per inassolible s'ha d'oblidar. Així, per exemple, el científic ha de donar per suposada la idea de Món com a escenari on tots els fenòmens s'interrelacionen a través d'una concatenació causal, si no la ciència és impossible. A més, tot i que Ànima i Déu són idees que escapen a l'ús teòric de la raó , Kant considera que són objecte d'estudi de la raó pràctica, del camp de la moralitat.<\/p>\n<p><i>Estructura de la crítica a la raó pura:<\/i><\/p>\n<figure><img loading=\"lazy\" src=\"filo/kant_07.jpg\" alt=\"\"><\/figure>", "min": 25}, {"n": 4, "num": "4.5.4", "title": "L'ètica formal", "subs": [{"id": "s4-1", "num": "4.1", "title": "El formalisme moral"}, {"id": "s4-2", "num": "4.2", "title": "La llei moral"}, {"id": "s4-3", "num": "4.3", "title": "Els postulats de la raó pràctica"}, {"id": "s4-4", "num": "4.4", "title": "L'ésser humà: la insociable sociabilitat"}, {"id": "s4-5", "num": "4.5", "title": "Història i religió"}], "html": "<p>Ja hem vist com Kant respon la pregunta sobre el coneixement plantejant-se, per una banda, com és possible i, per l'altra, fins on és possible. Però per apropar-se d'una manera global al seu objectiu, que no és altre que saber què és l'ésser humà, necessita encara respondre les preguntes sobre la seva perspectiva moral i religiosa: què he de fer?, que puc esperar? Tot i que la raó humana és una facultat única, segons Kant posseeix una doble funció: és capaç de conèixer \"com és la naturalesa (raó teòrica) però també és capaç de conèixer \"com ha de ser\" la conducta humana (raó pràctica). Mentre a la raó teòrica l'interessa allò que és donat a través de la intuïció sensible i formula les seves lleis a través de judicis (\"l'aigua bull als 100°\"), a la raó pràctica l'interessen el \"fonaments de determinació de la voluntat\" (allò que condiciona les nostres decisions) l'expressa els seus principis a través d'imperatius o manaments (\"no robaràs\" \"no mataràs\"). És a aquesta perspectiva pràctica de la raó a la qual ens aproparem en aquest apartat.<\/p>\n<h3 id=\"s4-1\"><span class=\"n\">4.1<\/span>El formalisme moral<\/h3>\n<p>Dèiem que la raó pràctica s'expressa en imperatius , però a Kant no l'interessa tant l'estudi dels diferents imperatius morals que hi ha com l'estudi del seu fonament; és a dir, es planteja què és allò que fa que una acció sigui moralment correcta o no. I per respondre aquesta pregunta analitza quina és la característica general de tots els imperatius. Donat que tots els imperatius són prescriptius, ens obliguen en un sentit moral, Kant es pregunta pel fonament d'aquesta obligació moral i s'adona que ha estat divers en diferents pensadors: la felicitat, el plaer, la perfecció... Kant pensa que, a través d'aquests principis, els filòsofs han intentat identificar, primer, allò que consideraven el bé últim de l'ésser humà i, després, han prescrit les normes morals necessàries per assolir aquest bé. El resultat ha estat el que ell anomena ètiques materials, ètiques que comparteixen les següents característiques:<\/p>\n<p>1) Els seus principis són empírics, és a dir, s'han obtingut mitjançant generalitzacions fetes a partir de l'experiència (a posteriori). Així, què sigui el bé últim de l'ésser humà uns l'han trobat en la felicitat (Aristòtil, Sant Tomàs), d'altres en el plaer (Epicur), etc. Tots, però, han hagut de buscar aquest bé últim analitzant les accions humanes i, per fer-ho, han hagut de recórrer a l'experiència, A Kant, però, aquest plantejament no el satisfà perquè ell busca una ètica que tingui validesa universal, una ètica que sigui, en comptes d'empírica, a priori.<\/p>\n<p>2) Els seus principis són heterònoms, és a dir, són imposats i, per tant, no decidits per la meva raó. Així, per exemple, jo no busco la felicitat, en el cas d'una ètica eudemonista, perquè sigui una decisió de la meva voluntat sinó perquè la meva naturalesa m'obliga a fer-ho. Kant, en canvi, busca una ètica que doni el protagonisme a la capacitat de decisió del subjecte que actua, una ètica autònoma, sense cap principi imposat.<\/p>\n<p>3) Els seus principis són hipotètics, és a dir, són condicionals perquè ens manen de fer una acció concreta per aconseguir un fi determinat. Per això, tenen la forma \"si..., llavors...\" (\"si vols arribar a ser vell, has de tenir cura de la teva salut\"). Aquests principis no tenen un valor absolut, i per això no tothom segueix els mateixos preceptes: alguns, per exemple, defensen que la moderació és important per gaudir d'una vida llarga i saludable, d'altres, però, consideren que així ben segur que la vida serà més llarga, molt més llarga... i també insípida. Kant considera que els imperatius de l'ètica no poden ser hipotètics, sinó que han de ser categòrics, absoluts.<\/p>\n<p>Kant rebutja les característiques de les ètiques materials, però quina és l'alternativa que proposa? Afirma que per actuar necessitem normes (màximes, diu ell) però no busca una ètica que prescrigui normes concretes, sinó que ens indiqui quina és la forma que ha de tenir qualsevol norma per ser moral. Per això, l'ètica que ens proposa és una ètica formal , una ètica buida de contingut empíric. Què significa buida de contingut empíric?, que no delimita cap bé últim de l'ésser humà, ni tampoc ens dona una relació de preceptes per assolir aquest bé. Llavors, quan podem estar segurs que la nostra acció ha estat la correcta, que hem fet el que calia fer? Kant dirà que quan actuem per deure, és a dir, quan deixem al marge qualsevol tipus d'interès.<\/p>\n<p>A la Fonamentació de la metafísica dels costums, ens aclareix què significa actuar per deure: imaginem-nos un comerciant que ha de decidir el preu dels seus productes. ¿Quan actua honradament des d'un punt de vista moral, és a dir, per deure? El mercader pot variar el preu en funció del tipus de client i no tractar igual un comprador habitual que un nen o un turista, en aquest cas actuaria contràriament al deure; també pot ser que el mercader demanés a tothom el mateix preu per por de perdre la clientela, en aquest cas actuaria conforme al deure. Tot i que aquesta conducta és legal, es tracta d'una actitud interessada i moralment reprovable. El mercader només actuarà com s'ha d'actuar, és a dir, per deure, quan posi el preu que consideri que s'ha de posar, i no per interès, sinó perquè considera que és el que s'ha de fer i que tothom hauria de fer. En tots els casos anteriors, la voluntat és la facultat que ha pres la decisió, però considera Kant que en els dos primers la voluntat no és bona, mentre que sí que ho és en el tercer. Actuem de bona voluntat, quan ho fem moguts pel deure. Així, només la voluntat bona és un bé absolut, un bé en si mateix, ja que tots els altres béns que l'ésser humà pugui tenir (bellesa, riquesa, enteniment, etc.) són relatius, depenen de l'ús que d'ells se'n faci<\/p>\n<aside class=\"nota\"><p>Selectivitat juliol 2020 (sèrie 3)<\/p><p><i>Un altre individu es veu empès per la necessitat a demanar que li prestin<\/i> <i>diners. Ell sap molt bé que no podrà tornar-los, però també veu que no li<\/i> <i>prestaran res si no promet fermament de tornar-ho en un temps determinat.<\/i> <i>Té ganes de fer aquesta promesa, però encara té prou consciència per a<\/i> <i>preguntar-se: No és prohibit i contrari al deure sortir del pas d’aquesta<\/i> <i>manera? Suposant, tanmateix, que prengués aquesta determinació, la màxima<\/i> <i>de la seva acció s’expressaria així: «Quan cregui que necessito diners,<\/i> <i>els demanaré prestats i prometré tornar-los, encara que sàpiga que no ho<\/i> <i>faré mai.» Malgrat que tal vegada aquest principi de l’amor a si mateix o<\/i> <i>del propi profit pugui estar d’acord amb tot el meu benestar futur, ara<\/i> <i>la<\/i> <i>pregunta<\/i> <i>és<\/i> <i>aquesta:<\/i> <i>És<\/i> <i>això<\/i> <i>lícit?<\/i> <i>Jo<\/i> <i>transformo,<\/i> <i>per<\/i> <i>tant,<\/i> <i>l’exigència de l’amor propi en una llei universal i plantejo la qüestió<\/i> <i>d’aquesta manera: Què passaria si la meva màxima esdevingués una llei<\/i> <i>universal? Veig de seguida que mai no podria valer com una llei universal<\/i> <i>de la naturalesa i estar d’acord amb ella mateixa […].<\/i><\/p><p>Immanuel Kant. Fonamentació de la metafísica dels costums, ii<\/p><\/aside>\n<h3 id=\"s4-2\"><span class=\"n\">4.2<\/span>La llei moral<\/h3>\n<p>Kant defineix el deure com \"la necessitat d'una acció per respecte a la llei\", això significa que el principi que ha de guiar-nos en el nostre actuar ha de ser una llei moral objectiva, vàlida per a tots els éssers humans. I quina seria aquesta llei moral?: \"he d'actuar sempre de manera que la meva màxima es pugui convertir en llei universal\". Aquest és, segons Kant, el principi objectiu de la moralitat, i remarquem que no es tracta d'un principi sinó del principi que serveix de fonament a tots els judicis morals. Per què?, perquè és, primer, un principi universal, vàlid per a tots i en tot moment: segon, perquè és un principi a priori , ja que no s'ha tret de l'experiència; tercer perquè és un principi autònom , ja que la voluntat no se sotmet a cap altra llei que la que ella mateixa es dona; finalment, perquè el seu imperatiu, que és la forma que adopta per a la voluntat humana la llei moral, no és hipotètic sinó categòric . I és per tot això, que es tracta d'una ètica formal. L'imperatiu categòric declara quan una acció és bona en si mateixa i no en funció d'un fi extern determinat. Prescindeix, per tant, del contingut de l'acció i del seu efecte i només demana conformitat amb la universalitat de la llei moral. Això és així perquè l'imperatiu categòric és la mateixa llei moral expressada com a manament, és a dir, diu \"actua\" en lloc d'\"he d'actuar\". De les diverses formulacions que d'ell presenta Kant, destacarem dues:<\/p>\n<p>1. \"Actua només segons una màxima tal que puguis voler alhora que esdevingui llei universal”<\/p>\n<p>2. \"Actua de tal manera que sempre prenguis la humanitat, tant en la teva persona com en qualsevol altra, com un fi i mai com un mitjà”<\/p>\n<p>Perquè les nostres màximes puguin esdevenir lleis universals (primera formulació), és necessari que l'ésser humà es consideri a si mateix i als altres com a fins i no com a mitjans (segona formulació).<\/p>\n<figure><img loading=\"lazy\" src=\"filo/kant_08.jpg\" alt=\"\"><\/figure>\n<p class=\"cap\"><b>Definició de Màxima segons la RAE (Real Academia de la lengua Española)<\/b><\/p>\n<h3 id=\"s4-3\"><span class=\"n\">4.3<\/span>Els postulats de la raó pràctica<\/h3>\n<p>Igual que en l'àmbit de la raó teòrica eren necessaris l'espai-temps, les categories i les idees de la raó com a condicions de possibilitat del coneixement científic, pel que fa a la raó pràctica són necessaris uns postulats, uns principis indemostrables que són condicions de possibilitat de la moralitat. Considera Kant que aquests postulats són la llibertat, la immortalitat de l'ànima i l'existència de Déu.<\/p>\n<p>Amb relació a la llibertat, malgrat que no pugui ser objecte del coneixement científic, l'hem de donar per suposada en l'ésser humà quan acceptem que aquest gaudeix de voluntat, és a dir, que pot prendre decisions mogudes per màximes dictades per la seva raó i al marge de la necessitat natural. Per tant, la llibertat és la condició de possibilitat de la llei moral. Pel que fa als altres dos postulats, cal abans, prendre en consideració: que el bé més elevat en l'ésser humà és la virtut, és a dir, el compliment del deure; que ser virtuosos ens fa merèixer la felicitat, però, que els éssers racionals no volem només ser mereixedors de la felicitat sinó ser feliços realment, per tal d'assolir el que considerem el Bé Suprem. I per assolir aquest Bé cal acceptar la immortalitat de l'ànima i l'existència de Déu. Per què la immortalitat de l'ànima? Perquè en el món sensible no podem assolir la unió perfecta entre virtut i felicitat, allò que ell anomena santedat o voluntat santa, i, per tant, hem d'acceptar que només s'assolirà en un altre món. Podem ser molt virtuosos i, en canvi, no ser feliços. Per això, la immortalitat es converteix en un postulat.<\/p>\n<figure><img loading=\"lazy\" src=\"filo/kant_09.jpg\" alt=\"\"><\/figure>\n<p>I per què és necessari postular l'existència de Déu? Perquè Déu garanteix l'harmonia entre la felicitat i el compliment del deure (la virtut), ja que si no fos així, felicitat i deure serien com dues paral·leles que mai no es troben. Si el fet concret de la nostra vida és que ens movem contínuament entre el que \"és\", la causalitat natural, i el que \"hauria de ser\", l'ordre moral, llavors cal que existeixi un ésser superior en el qual \"ser\" i \"haver de ser\" coincideixin sempre. Aquest ésser és Déu.<\/p>\n<h3 id=\"s4-4\"><span class=\"n\">4.4<\/span>L'ésser humà: la insociable sociabilitat<\/h3>\n<p>Hem vist la resposta que Kant dona a la pregunta \"què he de fer?\", ens resta encara plantejar la solució a la pregunta sobre el destí últim de l'ésser humà: \" què he d'esperar?\". Aquesta qüestió només pot ser pensada des de la perspectiva d'un temps indeterminat, d'ella s'ocupa la religió, la sociologia i la política. La reflexió de Kant sobre l'ésser humà el va portar a considerar un doble vessant: en tant que intel·ligible.<\/p>\n<p>Això posa de manifest en l'ésser humà una doble dimensió, l'empírico-sensible i l'ètico-social. Per la primera dimensió, l'ésser humà és un ésser tancat sobre si mateix i, per tant, egoista, és a dir, que es manté aliè a tota mena de judici moral i a tota forma de socialització; però per la segona dimensió, l'ésser humà es descobreix com un ésser entre els altres, és a dir, es descobreix com a ésser sociable i moral.<\/p>\n<p class=\"cap\"><b>Crítica de la raó<\/b> <b>pràctica<\/b><\/p>\n<p>És en aquesta tensió d'insociabilitat-sociabilitat, com es constitueix la paradoxal naturalesa humana. Ens podem preguntar, però, de quina manera es concilia aquesta insociable-sociabilitat de l'ésser humà. I la resposta la troba Kant en la història i en la religió, ja que, a través de la primera l'ésser humà es realitza com a ésser social i, al llarg de la segona, com a ésser moral.<\/p>\n<h3 id=\"s4-5\"><span class=\"n\">4.5<\/span>Història i religió<\/h3>\n<p>Pel que fa a la història, considera que és des de la perspectiva d'una \"societat de ciutadans del món\" com es poden realitzar progressivament les capacitats humanes. L'individu tot sol no pot desenvolupar les potencialitats de la seva naturalesa i, per tant, la realització plena de la naturalesa humana exigeix de la societat. I una societat entesa com el mitjà per assolir el màxim benestar, la màxima concòrdia i la màxima llibertat només es pot entendre com a procés de desenvolupament de la facultat racional de l'ésser humà. Aquest desenvolupament es realitza de manera progressiva i indefinidament en l'àmbit de l'espècie, no de l'individu, i això és la història, que busca la realització efectiva d'una societat justa, estructurada d'acord amb els principis de la raó.<\/p>\n<p>Amb relació a la religió, Kant considera que el formalisme moral no és un mitjà per assolir la felicitat sinó una manera d'arribar a ser dignes de la felicitat. Queda plantejada la pregunta sobre com pot l'ésser humà esperar assolir el Bé Suprem, l'objecte necessari de la voluntat moral. Es produeix així \"el pas de la moral cap a la religió\". Amb la religió arriba l'esperança de poder participar de la felicitat. Kant entén la religió com una religió positiva, és a dir, una religió mediatitzada per la raó i la seva autonomia i al marge dels dogmes i ritus imposats per la tradició, una religió moral que es manté dins els límits de la raó, però que s'harmonitza amb els principis de la revelació.<\/p>\n<figure><img loading=\"lazy\" src=\"filo/kant_10.jpg\" alt=\"\"><\/figure>\n<p class=\"cap\"><b>Tomba de Kant a Kaliningrado, l’actual Rússia.<\/b><\/p>", "min": 13}]}, {"id": 6, "key": "mill", "title": "Mill", "full": "John Stuart Mill", "dates": "1806 – 1873", "era": "Utilitarisme", "tag": "Utilitarisme, reformisme i llibertat", "hue": 330, "obres": "Utilitarisme, Sobre la llibertat", "secs": [{"n": 1, "num": "5.10.1", "title": "Vida i Obra", "subs": [], "html": "<p>, filòsof economista anglès, nascut a Londres, és un dels principals representants del neoempirisme anglès del s. XIX. Educat pel seu pare, James Mill (Stuart és cognom afegit en agraïment a un benefactor de la família), va ser aïllat de la relació amb nois de la seva edat i no va freqüentar pràcticament l'escola. Va ser sotmès a un rígid sistema de disciplina intel·lectual i als 14 anys disposarà ja d'una educació clàssica rigorosa. Però el mateix Mill reconeixerà més tard que el sistema educatiu imposat pel seu va negligir la seva vida emocional i que també la seva salut s'havia ressentit per tanta disciplina intel·lectual.<\/p>\n<p>Molt influït filosòficament i políticament pel seu pare (a qui seguia amb el \"fanatisme de la joventut per les idees de Bentham, per difondre els principis de l'utilitarisme funda, el 1821, una «Societat utilitarista», reemplaçada el 1824 per una «Societat de debats». Als 16 anys ingressa en l'«East India Companys», empresa en què aconsegueix càrrecs de responsabilitat i en la que roman fins a la seva dissolució, el 1858. Rebutja un càrrec oficial per a afers exteriors de l'Índia i és membre del Parlament durant el trienni 1865-1868.<\/p>\n<p>Als vint anys, pateix una profunda depressió. L'objecte de la seva vida, allò en què havia estat entrenat i que hi havia donat sentit perd tot el seu encant. Anys de constant anàlisi havien assecat les fonts del sentiment. Després de mesos de desesperació, accidentalment, descobreix que la capacitat emocionar-se no havia desaparegut. S'interessa per les noves orientacions que li arriben de lectures de Wordsworth, Saint-Simon i A. Comte: a les seves idees de sempre i a la formació estrictament intel·lectual rebuda del seu pare, afegeix una major obertura cap a la sensibilitat de sentiments i a una major valoració de la dimensió social i històrica del coneixement teòric i pràctic. Un altre factor important a la seva vida serà Harriet Taylor, amb qui conviurà platònicament i compartirà interessos intel·lectuals des de 1831 i amb qui es casarà tres anys després que envidués del seu marit, l'any 1852.<\/p>\n<p>La filosofia de John Stuart Mill és, a conseqüència de totes aquestes influències, una reelaboració de la tradició empirista i liberal anglesa, de l'utilitarisme i de l'esperit positivista. Liberal, però profundament preocupat per les qüestions socials, va defensar la llibertat sindical i el cooperativisme. Va ser pioner del feminisme i, en la seva joventut, va ser arrestat per propagar mètodes de control de la natalitat.<\/p>\n<p>John Stuart Mill<\/p>", "min": 2}, {"n": 2, "num": "5.10.2", "title": "Plantejament ètic", "subs": [], "html": "<p>La cohesió moral que necessita una societat ha de provenir de l'ètica La que proposa Mill, en Utilitarisme (1863), és l'ètica del principi utilitarista, segons el qual la bondat d'una acció correspon a la quantitat més gran de felicitat per al nombre més gran possible de persones, i on felicitat és presència de plaer i absència de dolor. Però, què vol dir \"la felicitat per al nombre més gran possible\"? En aquest punt, les trones de Mill i Bentham divergeixen:<\/p>\n<ul>\n<li>Per a Bentham la felicitat està vinculada a la quantitat de plaer. Es tracta, doncs, una concepció aritmètica, agregativa.<\/li>\n<li>Per a Mill, al contrari, és més important la qualitat dels plaers. Estableix una jerarquia dels plaers que situa les satisfaccions intel·lectuals i els plaers emocionals per damunt dels més vulgars i sensorials, així, afirma que els humans \"busquen els plaers fàcils dels sentits en detriment de la seva salut, tot i que ells s'adonin perfectament que la salut és un bé més gran\" i que \"més val ser un home insatisfet que no pas un porc satisfet, més val ser Sòcrates insatisfet que no pas un imbècil satisfet\".<\/li>\n<\/ul>\n<p>La felicitat i la utilitat es troben, per tant, en l'autorealització no de qualsevol classe de felicitat o de plaer, sinó en aquell que major universalitat pugui tenir imparcialment considerat.<\/p>\n<p>Quin és el paper de la felicitat? Aquí apareix una altra diferència bàsica de Mill i Bentham.<\/p>\n<ul>\n<li>Bentham considera que la felicitat de l'individu s'identifica amb els interessos de la humanitat. Anar contra la satisfacció d'un desig individual es anar contra la humanitat de la qual l'individu forma part perquè tota satisfacció ha de ser considerada imparcialment com dotada del mateix valor. Podríem parlar d'un cert utilitarisme individualista.<\/li>\n<li>Per a Mill, en canvi, donat l'estat actual de les nostres societats, s'ha de distingir entre la satisfacció purament privada i el bé públic. S'ha de treballar per reduir la diferència entre ambdós, però mentre tant, el sacrifici d'un individu pel bé públic ha de considerar-se com la virtut més alta. En aquest cas podem parlar d'un utilitarisme altruista.<\/li>\n<\/ul>\n<p>Per tant, a l'egoisme ètic que suposa el principi utilitarista, contraposa Mill, com a contrapès, la reflexió que no hi ha felicitat pròpia sense la percepció de la felicitat dels altres. L'autèntica felicitat només es dóna en un context de felicitat general. Mill posa l'èmfasi en la noció de bé comú i la identifica amb l'o
