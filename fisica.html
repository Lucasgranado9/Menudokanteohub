l","Aumento lateral","m","adimensional","","m = y\u2032/y = s\u2032/s. Si \xE9s negatiu, la imatge \xE9s invertida; si |m| > 1, \xE9s major que l\u2019objecte.","m = y\u2032/y = s\u2032/s. Si es negativo, la imagen est\xE1 invertida; si |m| > 1, es mayor que el objeto."),g(8,"Equaci\xF3 de les lents primes","Ecuaci\xF3n de las lentes delgadas","1/s\u2032 \u2212 1/s = 1/f","\u2014","","Relaciona la dist\xE0ncia de l\u2019objecte s i la de la imatge s\u2032 amb la dist\xE0ncia focal f (normes DIN).","Relaciona la distancia del objeto s y la de la imagen s\u2032 con la distancia focal f (normas DIN)."),g(8,"Punt pr\xF2xim i punt lluny\xE0 de l\u2019ull","Punto pr\xF3ximo y punto remoto del ojo","\u2014","m","punt pr\xF2xim \u2248 25 cm \xB7 punt lluny\xE0: infinit (ull normal)\xA6punto pr\xF3ximo \u2248 25 cm \xB7 punto remoto: infinito (ojo normal)","M\xEDnima i m\xE0xima dist\xE0ncia de visi\xF3 n\xEDtida. La miopia es corregeix amb lents divergents i la hipermetropia amb convergents.","M\xEDnima y m\xE1xima distancia de visi\xF3n n\xEDtida. La miop\xEDa se corrige con lentes divergentes y la hipermetrop\xEDa con convergentes."),g(9,"Constant de Planck","Constante de Planck","h","J\xB7s","6,63\xB710\u207B\xB3\u2074","Quantum d\u2019acci\xF3: E = h\xB7f. La seva petitesa explica que la qu\xE0ntica no es noti en objectes quotidians.","Cuanto de acci\xF3n: E = h\xB7f. Su peque\xF1ez explica que la cu\xE1ntica no se note en objetos cotidianos."),g(9,"Energia d\u2019un fot\xF3","Energ\xEDa de un fot\xF3n","E","J (o eV)","llum visible 1,8\u20133,1 eV\xA6luz visible 1,8\u20133,1 eV","E = h\xB7f = h\xB7c/\u03BB. Un fot\xF3 transporta una quantitat discreta d\u2019energia.","E = h\xB7f = h\xB7c/\u03BB. Un fot\xF3n transporta una cantidad discreta de energ\xEDa."),g(9,"Treball d\u2019extracci\xF3","Trabajo de extracci\xF3n","W\u2080","J (o eV)","sodi 2,3 eV \xB7 coure 4,7 eV\xA6sodio 2,3 eV \xB7 cobre 4,7 eV","Energia m\xEDnima per arrencar un electr\xF3 d\u2019un metall. Efecte fotoel\xE8ctric: E_c = h\xB7f \u2212 W\u2080, amb f \u2265 f\u2080 = W\u2080/h.","Energ\xEDa m\xEDnima para arrancar un electr\xF3n de un metal. Efecto fotoel\xE9ctrico: E_c = h\xB7f \u2212 W\u2080, con f \u2265 f\u2080 = W\u2080/h."),g(9,"Longitud d\u2019ona de De Broglie","Longitud de onda de De Broglie","\u03BB","m","electr\xF3 de 1 eV \u2248 1,2 nm \xB7 pilota de 0,1 kg a 10 m/s \u2248 6,6\xB710\u207B\xB3\u2074 m\xA6electr\xF3n de 1 eV \u2248 1,2 nm \xB7 pelota de 0,1 kg a 10 m/s \u2248 6,6\xB710\u207B\xB3\u2074 m","\u03BB = h/(m\xB7v). Tota part\xEDcula t\xE9 car\xE0cter ondulatori; nom\xE9s \xE9s apreciable per a masses molt petites.","\u03BB = h/(m\xB7v). Toda part\xEDcula tiene car\xE1cter ondulatorio; solo es apreciable para masas muy peque\xF1as."),g(9,"Principi d\u2019incertesa de Heisenberg","Principio de incertidumbre de Heisenberg","\u0394x\xB7\u0394p \u2265 \u0127/2","J\xB7s","\u0127 = 1,05\xB710\u207B\xB3\u2074 J\xB7s","No es poden con\xE8ixer alhora amb precisi\xF3 posici\xF3 i quantitat de moviment d\u2019una part\xEDcula.","No se pueden conocer a la vez con precisi\xF3n posici\xF3n y cantidad de movimiento de una part\xEDcula."),g(9,"Nivells d\u2019energia de Bohr (H)","Niveles de energ\xEDa de Bohr (H)","E_n","eV","E_n = \u221213,6/n\xB2 eV","Energies permeses de l\u2019electr\xF3 de l\u2019\xE0tom d\u2019hidrogen. En saltar de n\u2082 a n\u2081 s\u2019emet un fot\xF3 d\u2019energia E_{n\u2082} \u2212 E_{n\u2081}.","Energ\xEDas permitidas del electr\xF3n del \xE1tomo de hidr\xF3geno. Al saltar de n\u2082 a n\u2081 se emite un fot\xF3n de energ\xEDa E_{n\u2082} \u2212 E_{n\u2081}."),g(9,"Radi de Bohr","Radio de Bohr","a\u2080","m","5,29\xB710\u207B\xB9\xB9","Radi de l\u2019\xF2rbita fonamental de l\u2019hidrogen; en el model de Bohr, r_n = n\xB2\xB7a\u2080.","Radio de la \xF3rbita fundamental del hidr\xF3geno; en el modelo de Bohr, r_n = n\xB2\xB7a\u2080."),g(10,"Factor de Lorentz","Factor de Lorentz","\u03B3","adimensional","\u03B3 = 2 a 0,87c \xB7 \u03B3 = 7,1 a 0,99c\xA6\u03B3 = 2 a 0,87c \xB7 \u03B3 = 7,1 a 0,99c","\u03B3 = 1/\u221A(1 \u2212 v\xB2/c\xB2). Sempre \u2265 1; a velocitats quotidianes \xE9s pr\xE0cticament 1.","\u03B3 = 1/\u221A(1 \u2212 v\xB2/c\xB2). Siempre \u2265 1; a velocidades cotidianas es pr\xE1cticamente 1."),g(10,"Dilataci\xF3 del temps","Dilataci\xF3n del tiempo","\u0394t","s","","\u0394t = \u03B3\xB7\u0394t\u2080. El temps propi \u0394t\u2080 \xE9s el mesurat al sistema on el rellotge est\xE0 en rep\xF2s; l\u2019altre observador mesura un temps m\xE9s llarg.","\u0394t = \u03B3\xB7\u0394t\u2080. El tiempo propio \u0394t\u2080 es el medido en el sistema donde el reloj est\xE1 en reposo; el otro observador mide un tiempo mayor."),g(10,"Contracci\xF3 de longituds","Contracci\xF3n de longitudes","L","m","","L = L\u2080/\u03B3. Nom\xE9s es contrau la dimensi\xF3 paral\xB7lela al moviment; L\u2080 \xE9s la longitud pr\xF2pia (en rep\xF2s).","L = L\u2080/\u03B3. Solo se contrae la dimensi\xF3n paralela al movimiento; L\u2080 es la longitud propia (en reposo)."),g(10,"Energia en rep\xF2s","Energ\xEDa en reposo","E\u2080","J","1 g de massa \u2248 9\xB710\xB9\xB3 J \xB7 electr\xF3 0,511 MeV\xA61 g de masa \u2248 9\xB710\xB9\xB3 J \xB7 electr\xF3n 0,511 MeV","E\u2080 = m\xB7c\xB2. La massa \xE9s una forma d\u2019energia. Energia total: E = \u03B3\xB7m\xB7c\xB2; cin\xE8tica: E_c = (\u03B3 \u2212 1)\xB7m\xB7c\xB2.","E\u2080 = m\xB7c\xB2. La masa es una forma de energ\xEDa. Energ\xEDa total: E = \u03B3\xB7m\xB7c\xB2; cin\xE9tica: E_c = (\u03B3 \u2212 1)\xB7m\xB7c\xB2."),g(11,"Nombre at\xF2mic i nombre m\xE0ssic","N\xFAmero at\xF3mico y n\xFAmero m\xE1sico","Z, A","\u2014","radi nuclear R = 1,2\xB7A^{1/3} fm\xA6radio nuclear R = 1,2\xB7A^{1/3} fm","Z = nombre de protons; A = Z + N (protons + neutrons). Els nuclis tenen mides de l\u2019ordre de fm (10\u207B\xB9\u2075 m).","Z = n\xFAmero de protones; A = Z + N (protones + neutrones). Los n\xFAcleos tienen tama\xF1os del orden de fm (10\u207B\xB9\u2075 m)."),g(11,"Unitat de massa at\xF2mica","Unidad de masa at\xF3mica","u","kg","1,66\xB710\u207B\xB2\u2077 kg = 931,5 MeV/c\xB2","1/12 de la massa del carboni-12. \xDAtil per comptar masses nuclears.","1/12 de la masa del carbono-12. \xDAtil para contar masas nucleares."),g(11,"Defecte de massa","Defecto de masa","\u0394m","u (o kg)","","Difer\xE8ncia entre la massa dels nucleons per separat i la del nucli: \u0394m = Z\xB7m_p + N\xB7m_n \u2212 m_nucli.","Diferencia entre la masa de los nucleones por separado y la del n\xFAcleo: \u0394m = Z\xB7m_p + N\xB7m_n \u2212 m_n\xFAcleo."),g(11,"Energia d\u2019enlla\xE7","Energ\xEDa de enlace","E_b","J (o MeV)","\u2248 8 MeV per nucle\xF3 (m\xE0xim al ferro-56, 8,8 MeV)\xA6\u2248 8 MeV por nucle\xF3n (m\xE1ximo en el hierro-56, 8,8 MeV)","E_b = \u0394m\xB7c\xB2. Energia necess\xE0ria per desfer el nucli; com m\xE9s gran per nucle\xF3, m\xE9s estable.","E_b = \u0394m\xB7c\xB2. Energ\xEDa necesaria para deshacer el n\xFAcleo; cuanto mayor por nucle\xF3n, m\xE1s estable."),g(11,"Activitat","Actividad","A","Bq (becquerel = s\u207B\xB9)","1 Ci = 3,7\xB710\xB9\u2070 Bq \xB7 una banana \u2248 15 Bq\xA61 Ci = 3,7\xB710\xB9\u2070 Bq \xB7 un pl\xE1tano \u2248 15 Bq","Desintegracions per segon: A = \u03BB\xB7N = A\u2080\xB7e^(\u2212\u03BB\xB7t).","Desintegraciones por segundo: A = \u03BB\xB7N = A\u2080\xB7e^(\u2212\u03BB\xB7t)."),g(11,"Constant de desintegraci\xF3","Constante de desintegraci\xF3n","\u03BB","s\u207B\xB9","","Probabilitat de desintegraci\xF3 per unitat de temps. Llei: N = N\u2080\xB7e^(\u2212\u03BB\xB7t).","Probabilidad de desintegraci\xF3n por unidad de tiempo. Ley: N = N\u2080\xB7e^(\u2212\u03BB\xB7t)."),g(11,"Per\xEDode de semidesintegraci\xF3","Per\xEDodo de semidesintegraci\xF3n","T\xBD","s (anys)","I-131: 8 dies \xB7 C-14: 5 730 anys \xB7 U-238: 4,5\xB710\u2079 anys\xA6I-131: 8 d\xEDas \xB7 C-14: 5 730 a\xF1os \xB7 U-238: 4,5\xB710\u2079 a\xF1os","Temps en qu\xE8 es redueix a la meitat el nombre de nuclis: T\xBD
