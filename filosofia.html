btenció efectiva d'aquella suma més alta possible de satisfacció i de felicitat per al major nombre de persones.<\/p>\n<p>I, com sabem que una acció és la correcta? Només mitjançant l'anàlisi de les seves conseqüències podem saber si una acció és bona o desitjable. Si entre dos principis morals volem saber quin és el millor, cal tenir en compte tant la quantitat com la qualitat de les seves conseqüències. Per això és especialment valuós el judici dels qui, sent persones competents, han conegut diversos modes d'existència. No veurem a un savi acceptar convertir-se en ignorant, o a un home descendir a la categoria d'animal. El bo és sempre qualitativament desitjable i socialment útil i no pot emparar-se en cap tipus d'autoritat externa. Per poder valorar un criteri o una regla com efectivament moral ha de ser de valor universal, deu procedir-se a una valoració imparcial dels interessos afectats per un determinat criteri i les conseqüències derivades de la seva aplicació han d'incrementar la felicitat (benestar) general. Tot, fins i tot la virtut desinteressada, té unes conseqüències que han de ser avaluades empíricament. L'utilitarisme de Mill, per tant, és incompatible amb l'acceptació resignada i pessimista de les dures condicions socials en què vivia el proletariat durant la Revolució Industrial. Això permet caracteritzat l'utilitarisme com una concepció política i moral i com un programa de reformisme econòmic i social.<\/p>\n<figure><img loading=\"lazy\" src=\"filo/mill_00.jpg\" alt=\"\"><\/figure>", "min": 3}, {"n": 3, "num": "5.10.3", "title": "Reformisme econòmic i social", "subs": [], "html": "<p>Com a filòsof social, Mill considera inacceptable l'embrutiment humà derivat de l'industrialisme i de l'economia capitalista característiques de l'Anglaterra del seu temps. Homes, dones i criatures (sovint a partir del set anys), pateixen jornades laborals de dotze i catorze hores, en fabriques i mines insalubres i perilloses, sens protecció legal (inexistència de contractes fixos, sou inestable, acomiadament lliure), ni cap tipus de cobertura social (com invalidesa, accident, malaltia o jubilació) i amb salaris fixats pels empresaris. Cal recordar que la mecanització fa incrementar exponencialment la producció. Els artesans s'arruïnen perquè no poden competir en el nou mercat industrial i s'afegeixen als agricultors empobrits que emigren a les ciutats a la recerca de treball i subsistència. Uns i altres constitueixen la força de treball que necessita la indústria.<\/p>\n<p>Així, la naixent societat industrial comporta una forta desigualtat entre les dues classes socials que la caracteritzen, la burgesia capitalista i el proletariat, desigualtat que el liberalisme inicial considera inevitable. La burgesia té el capital i la propietat industrial, el proletariat només té el treball. Amb el principi utilitarista del bé comú, Mill vol apaivagar la desigualtat mitjançant la intervenció de l'Estat fent que aquest limiti per llei la jornada de treball, prohibeixi el treball infantil, promogui la salut i l'educació, equipari homes i dones, etc. D'altra banda, no qüestiona radicalment el capitalisme, els valors burgesos o el principi de no-intervenció directa de l'Estat en matèria econòmica. El bé comú imposa una legislació social i laboral humanitzadora i té el valor d'una reacció lúcida i crítica, dins del mateix àmbit liberal, contra les primeres concepcions d'aquest liberalisme que equiparaven la llibertat a la total inexistència de lleis i d'intervenció estatal. Mill és l'autor -amb la decisiva col·laboració intel·lectual de la seva muller- d'una nova formulació de l'economia política liberal que defensa la distribució més justa de la riquesa derivada de la cooperació social. Així, aprofundint en el principi utilitarista de la màxima felicitat per al màxim de gent, se separa de la tesi del liberalisme de Ricardo i s'aproxima al socialisme. La legislació social rebutja el naturalisme econòmic, això és, la pretensió que les lleis del mercat siguin naturals. En els seus aspectes econòmics, la legislació ha de fomentar les cooperatives de producció o ha de limitar el dret a l'herència, perquè l'herència contribueix a conservar les diferències econòmiques.<\/p>\n<p>Així, Mill segueix una tradició anglesa que accepta el sistema a través de reformes constants i el manté. D'aquesta forma, sense qüestionar radicalment el capitalisme, Mill polemitza sobre el dret a la propietat i hi veu aspectes tant positius com negatius. En la seva obra Principis d'economia política (II, 1,3) afirma que aquest dret es recolza en el costum o en la convenció, que \"l'organització social de l'Europa moderna va començar a partir d'una distribució de la propietat que no va ser el resultat d'un repartiment just, ni de l'adquisició mitjançant el treball, sinó per la conquesta i la violència\", que la propietat privada ha de ser la garantia dels individus als \"fruits del seu propi treball i de la seva abstinència (estalvi) i no pas als resultats del treball i privacions dels altres. A més, aquesta propietat, definida com a dret a allò que un individu ha produït, és del tot imprescindible per al funcionament de l'economia i de la llibertat d'adquisició per contracte. El reformisme social de Mill va més enllà de la persecució egoista dels béns econòmics coma únic objectiu i assenyala l'educació i la formació cultural sòlida com la garantia de la llibertat que proporciona felicitat. Es tracta, doncs, d'educar en l'exercici de la llibertat i fer que el poder es recolzi en el consens i la persuasió, i no pas en la por i en la força.<\/p>", "min": 3}, {"n": 4, "num": "5.10.4", "title": "La concepció política i moral", "subs": [], "html": "<p>Mill es proposa, en la introducció de l'assaig Sobre la llibertat (1859), la tasca d'examinar \"la llibertat social o civil, és a dir, la naturalesa i els límits del poder que pot exercir legítimament la societat sobre l'individu\", tasca que \"segons totes les probabilitats, molt aviat es farà reconèixer com la qüestió vital del futur\". La llibertat, condició necessària de la responsabilitat, es pot veure anul·lada tant per la desigualtat social com per la tirania política. Els humans tenim la possibilitat d'automillorar-nos, i justament ens humanitzem exercint la nostra capacitat per al bé i per al mal.<\/p>\n<p>La llibertat de què s'ocupa és la llibertat de l'individu en societat, la llibertat d'acció, que s'exterioritza en llibertat de pensament, expressió, associació i l'exercici dels altres drets civils, però no d’aquella que suposa la defensa i protecció de l'individu enfront dels abusos o l’opressió del poder que se suposa que ja ha d'estar defensada en un estat democràtic-, sinó la que ofega la «tirania de la majoria», o de la massa, o de l'opinió dominant. Un argument bàsic de Mill fou l'anomenat Principi del dany, és a dir, la gent es lliure de fer el que li sembli convenient sempre que això no suposi un dany o perjudici als interessos dels altres. En base a aquest argument, Mill defensa que el paper de l'Estat hauria de ser la supressió de les barreres a la llibertat, com ara algunes lleis, i reduir-les en base exclusivament al principi del dany. Tal com queda plantejat aquest principi apareixen seriosos problemes: potser resulti difícil trobar un acte les conseqüències del qual només m'afectin a mi mateix (fins i tot el fet de vestir una manera o l'altra pot afectar a la gent amb la qual em trobo, o als meus amics). Per evitar aquesta crítica, no està de més observar com usa Mill, i en general l'utilitarisme, la paraula \"interessos\". El \"principi del dany\" s'aplica perquè resulta útil quan es produeix efectivament podria produir-se amb gran seguretat- algun mal \"als interessos d'una altra persona\": és obvi que els meus interessos no queden pertorbats si algun individu va vestit d'un horrible color verd o si predica l'amor lliure, encara que ni l'un ni l'un altre m'agradin en absolut. La societat, doncs, no pot legislar sobre la vida privada.<\/p>\n<p>Més aviat al contrari, la llibertat és el dret a la no-interferència i, per això, comporta la protecció de la diversitat contra tota opressió, entre les quals la més temible és la que prové del poder d'una opinió pública que pretengui imposar els seus vulgars costums o creences. La llibertat no consisteix a sotmetre's a la llei del número, ni es pot veure limitada per la tirania de la majoria. No hi ha cap dany en l'opinió tota aplicació d'aquest principi es produeix en l'àmbit dels drets concrets. Però l'individu ha de donar compte de tot acte perjudicial per als interessos dels altres. Els dos principis de la llibertat Com tots els liberals, John Stuart Mill pretén delimitar clarament un domini en què els individus puguin \"fer el que vulguin\", un domini en què la societat no empri la coacció, ni a través de les lleis, ni -de forma més subtil: mitjançant la pressió de l'opinió pública Des d'un punt de vista teòric, la qüestió de la llibertat consisteix a trobar la millor línia de demarcació, la frontera més adient per tal de promoure \"la felicitat de tots\".<\/p>\n<p>Per tal d'establir aquesta frontera, Mill recorre a dos principis que s'apliquen l'un després de l'altre.<\/p>\n<ul>\n<li>El primer, que anomena \"principi de la llibertat individual\", identifica un àmbit extens d'accions en que l'individu \"té tot el dret\" de fer el que vol (o el que no vol que vindria a ser el mateix) i en que la societat \"no té dret a limitar-lo. Així, per exemple, la societat no té dret a prohibir el consum d'alcohol per a ús privat.<\/li>\n<li>El segon, que es podria anomenar el \"principi de les circumstàncies especifiques del cas\", determina, dins les circumstàncies en què la societat té dret a coaccionar, camps específics d'activitat on és millor no actuar perquè s'assoleix millor la finalitat pròpia d'aquest tipus d'activitat deixant fer lliurement els individus, més que no pas manant-los. Aquest seria, per exemple, el camp de l'economia: l'Estat podria actuar-hi, i potser en algun cas ho ha de fer, però si no ho fa les coses van millor.<\/li>\n<\/ul>\n<p>El principi de la llibertat individual fa referència a les accions que no tenen repercussions nocives sobre els altres: sobre aquesta mena d'accions, la llibertat dels individus ha de ser absoluta. Com diu a les primeres planes de Sobre la llibertat \"coaccionar un individu per al seu propi bé, físic o moral, no forneix una justificació suficient (...) Hi poden haver raons per fer-li retrets, raonar-hi, persuadir-lo o suplicar-li; però no per coaccionar-lo, ni per fer-li mal\": L'única raó legitima que pot tenir una comunitat per usar la força contra algun dels seus membres és impedir que faci mal a altres individus, però en aquest cas, el problema pertany a l'àmbit jurídic.<\/p>\n<p>La llibertat individual permet augmentar la felicitat dels individus, fa possible experimentar tipus de vida més plaents i evita que l'opinió pública i/o l'Estat interfereixin a la vida privada dels individus. El principi de llibertat individual, però, només és vàlid per a les societats que Mill anomena \"civilitzades\"; val a dir, les que prenen com a criteri la lliure discussió com a mitjà de millora. No s'aplicaria, doncs, als estadis de la societat en què la lliure discussió només inflama les passions i mena al desordre o a la guerra civil. El principi de la llibertat en les circumstàncies específiques del cas fa referència a la jurisdicció de la societat, que té dret a intervenir i sancionar quan les coses no funcionen. Amb un exemple quedarà, potser, més clar: la forma com els pares eduquen o alimenten els fills és cosa seva; però, arribat a un cert extrem, no constitueix un problema particular dels pares, sinó l'Estat hi pot intervenir, quan es que va més enllà de la llibertat individual i s'entra en la jurisdicció de la societat. És el que Mill anomena \"the particular expediencies of the case\". Per això, per exemple, no atempta a la llibertat que els governs estableixin un control sanitari sobre els aliments.<\/p>\n<figure><img loading=\"lazy\" src=\"filo/mill_01.jpg\" alt=\"\"><\/figure>\n<p>En resum, Mill defensa el dret de tot ciutadà a les llibertats bàsiques (com la d'expressió o d'associació), a la discrepància pacífica i a no ser represaliat per les seves opcions (dret de vaga, llibertat religiosa, lliure elecció educativa, etc.). En canvi, les limitacions legislatives a la llibertat consisteixen, per exemple, en l'obligatorietat de l'educació ja que el dret al sufragi està suspès per als analfabets, o en la prohibició de treballar més enllà del que les lleis permeten:<\/p>\n<p>1. L'Estat ha de fer obligatòria l'educació precisament perquè la democràcia necessita la força del coneixement i de l'argumentació per poder augmentar la seva diversitat, una societat educada és més lliure encara que Mill és contrari a l'escola pública per por de la uniformització i a l'adoctrinament. La uniformització constitueix per a ell un despotisme de la classe dirigent. La seva pedagogia, per exemple, defensa que els exàmens siguin optatius i que en ells no es pugui obligar a adherir-se a cap opinió sinó que s'inciti a l'alumne a pensar pel seu compte. Per això mateix era contrari que per entrar en certes professions fos obligatori un títol oficial, amb el que s'evitaria que certs individus -els funcionaris- tinguessin un poder despòtic.<\/p>\n<p>2. En política, l'estat ha de garantir la igualtat d'oportunitats. Algunes coses (l'educació, la sanitat, etc.) han de ser legislades precisament per aconseguir la major utilitat general. La desregulació no pot, doncs, ser una norma general i invariable. Un exemple molt típic és el de l'horari de treball que, segons Mill (en això segueix a Smith) ha de ser legislat i limitat perquè individus aïllats no podrien defensar l'interès general.<\/p>\n<p>3. Per a Mill, en el context d'un Estat mínim, que garanteixi efectivament l'accés de tothom al mercat en igualtat de condicions, l'Estat no ha d'intervenir en l'activitat econòmica. En determinades circumstàncies, però, l'Estat pot intervenir en economia per preservar el lliure joc de la competència i els drets dels consumidors: l'Estat té el deure de fer tot el que és susceptible d'augmentar la felicitat general.<\/p>\n<p>4. La llibertat política implica la participació en el poder i Mill és un demòcrata convençut, però posa per davant la llibertat a la democràcia (que és, en definitiva, un instrument). En Consideracions sobre el govern representatiu (1861), assenyala la característica essencial de la democràcia, és ser prou representativa de les minories; només així és millor que qualsevol que govern monàrquic o aristocràtic. Defensa, així, una democràcia representativa que estiguin reconeguts tots els parers i no només les majories. En una democràcia les minories han de poder fer-se sentir i tenir la possibilitat de triomfar mitjançant la força dels seus arguments si són conformes a la raó.<\/p>\n<p>5. La clau d'una bona societat consisteix a coordinar els interessos individuals. De fet, el comerç és un bon exemple de tasca individual en què s'aconsegueix coordinar interessos individuals i servir a l'interès general. Això no significa que l'estat hagi de renunciar a intervenir encara que procuri ser mínim per no donar massa poder a ningú. Més que a l'estat, la utilitat més gran l'eficiència) es troba als municipis i en les petites comunitats. Mill és un liberal amb objectius socials. D'aquí el seu defensa, a la vegada, de l'economia liberal i de les organitzacions obreres, que el va portar a defensar una espècie de socialització més o menys llibertària del treball.<\/p>\n<p>6. Mill va reconèixer als socialistes utòpics de la seva època (Saint-Simon, Owen, Fourier) li ment d'haver estat els primers en la defensa de l'emancipació de la dona. En Sobre la servitud de les dones (1869), destaca que una de la fallada de representativitat està no va reconèixer el dret de vot a les dones. De fet, una de les seves condicions per ser candidat a Westminister va ser la de poder batallar pel dret al vot femení. El seu feminisme té a veure profundament amb la seva idea que la llibertat és qualitativa, no divisible i que ha de conduir a una societat equilibrada<\/p>", "min": 9}, {"n": 5, "num": "5.10.5", "title": "Plantejament polític i social", "subs": [], "html": "<p>En el seu Sistema de lògica argumenta que la vida humana i social tampoc hauria de quedar exclosa dels plantejaments científics empírics; advoca per l'existència d'una nova ciència, que hauria d'anomenar-se etologia, i l'objecte de la qual haurien de ser les lleis de la societat. I, adoptant la perspectiva de la llei dels tres estats de Comte, considera l'estat actual com l'estat especulatiu de la humanitat, del que ha de sorgir un coneixement científic de la realitat social. El coneixement científic de les lleis empíriques que determinen la realitat humana i social és totalment compatible amb la intervenció de l'home en els afers socials i polítics i amb l'afirmació decidida de la llibertat humana individual. La llibertat és instrumentalment valuosa, però no \"intrínsecament\" valuosa: allò intrínsecament valuós és la felicitat. Seria un error considerar que Mill parla de la llibertat natural quan el seu criteri implica que els humans participen d'una societat política, l'única que en definitiva pot avaluar les conseqüències de la llibertat com a criteri. És per això que no tots els individus poden gaudir de total llibertat: els nens no han de ser lliures, per exemple, per decidir si volen, o no, aprendre a llegir i el mateix podria dir-se d'algunes deficiències psíquiques o de la barbàrie extrem aquest que alguns han considerat colonialista, però que en Mill no implica cap significat racial ni xenòfob. Com empirista, l'utilitarisme és constructivista. Que els sentiments morals no siguin innats comporta que la demostració de la seva \"naturalitat\" (Utilitarisme, cap. III) només pugui ser social.<\/p>\n<p>Com diu el propi Mill: És natural en l'home parlar, raonar, construir ciutats i cultivar la terra encara que aquestes siguin facultats adquirides». En les accions morals hi ha \"aquesta poderosa base natural de sentiments\" que ens els fa sentir com necessaris; però \"l'interès i la simpatia\" ens porten a considerar necessàriament a tota la humanitat entesa com a totalitat política. La llibertat, com la felicitat, ha de ser desitjada desinteressadament, però això no impedeix que es tracti també de principis normatius validats i confirmats per l'experiència, és a dir, pel comportament de les societats humanes. En resum, per a l'utilitarisme: «Els ingredients de la felicitat són diversos; cadascun d'ells és desitjable pel seu compte, i no només quan se li considera unit al tots. Que alguna cosa sigui desitjat pels individus millors mostra que és desitjable.<\/p>\n<figure><img loading=\"lazy\" src=\"filo/mill_02.jpg\" alt=\"\"><\/figure>\n<p>Maximitzar la suma total de felicitat o de plaer, considerant imparcialment els interessos de tots els que estan relacionats amb un acte en concret, és l'objectiu de qualsevol decisió que un utilitarista consideraria justa. Però s'ha de deixar clar que cap sacrifici personal té valor en si mateix, sinó en la mesura que augmenta la suma total de felicitat. I. per això mateix, una individualitat vigorosa i inconformista, oposada als prejudicis socials petits burgesos moguda per la imparcialitat en els seus judicis i per la racionalitat és més útil a la societat que una personalitat submisa. Com diu en el títol 3r de Sobre la llibertat (1859), la individualitat és un dels elements del benestar.<\/p>", "min": 3}]}, {"id": 7, "key": "nietzsche", "title": "Nietzsche", "full": "Friedrich Nietzsche", "dates": "1844 – 1900", "era": "Vitalisme", "tag": "Crítica de la moral, superhome i etern retorn", "hue": 28, "obres": "Així parlà Zaratustra, Ecce Homo", "secs": [{"n": 1, "num": "5.7.1", "title": "Vida i Obra", "subs": [], "html": "<p>El dia 15 d'octubre de 1844, en una ciutat alemanya prop de Leipzig, anomenada Röcken, va néixer<\/p>\n<p>. Va viure, durant la seva infància, en un ambient profundament religiós, ja que el seu pare i els seus dos avis, el matem i el patern, eren pastors de l'església protestant. De ben petit composava peces musicals i escrivia versos, potser era l'inici del camí cap a les humanitats a les quals es dedicarà més tard, cap a l'any 1864, quan a la Universitat de Bonn començarà a estudiar teologia i filologia clàssica. Arthur Schopenhauer, Richard Wagner i Lou Andreas Salome seran persones que desaran una gran petjada en la vida i en el pensament de Nietzsche.<\/p>\n<p>De Schopenhauer coneix l'obra “El món com a voluntat i representació” quan estava estudiant a la universitat de Bonn, la qual cosa l'influirà en alguns temes del seu pensament com: la preponderància dels instints per sobre de la intel·ligència, la importància de l'art i de la música, la visió cíclica de l'esdevenir, etc; més tard, però, trencarà amb ell perquè, lluny d'acceptar el dolor, la lluita i la crueltat de la vida, Schopenhauer proposava un camí de renúncia, de fuga, un camí cap a l'ascetisme. Amb Wagner, va mantenir una relació tempestuosa, que va des de l'admiració fins a la decepció; quan el va conèixer, l'any 1868, li va atreure tant la seva música com el fet de creure que les seves concepcions sobre l'art els enriquien mútuament, però el 1876 Nietzsche comença a desafiar al seu ídol tot dient que Wagner és un romàntic adulterat, i el 1888, quan escriu el Cas Wagner, l'ataca directament, tot renegant del wagnerianisme i dient: \"Wagner és un gran corruptor de música\". Amb això va trobar la manera d'estimular els nervis cansats.\" Amb Lou Andreas Salomé no només hi va mantenir una excel·lent comunicació intel·lectual sinó que també se'n va enamorar, però la relació va acabar d'una manera turmentada, ja que ella no va acceptar de casars’hi.<\/p>\n<p>Mentre Nietzsche mantenia aquestes relacions angoixoses en l'àmbit privat, la seva vida professional també era molt agitada; així, l'any 1871 s'acabarà la seva carrera acadèmica, tot i que podrà mantenir la càtedra de filologia clàssica de la universitat de Basilea fins a 1879. Inicia aleshores una vida errant per la costa italiana i els Alps suïssos, una vida de malalt que comença amb trastorns visuals i migranyes i acaba amb un \"reblaniment cerebral\" i una paràlisi progressiva. Nietzsche va morir l'any 1900 a l’edat de 56 anys. Malgrat les seves decepcions i la seva malaltia, Nietzsche no va deixar d'escriure, bona mostra en tenim amb les següents obres escrites al llarg de diferents èpoques vitals i que es classifiquen segons un criteri metafòric, el del procés cíclic que va de la nit al dia:<\/p>\n<p>Nietzsche 1. Època romàntica. Filosofia de la nit, amb treballs d'interpretació i crítica de la cultura: El naixement de la tragèdia en l'esperit de la música (1872); Sobre veritat i mentida en sentit extramoral (escrita el 18 i publicada postumanent); Consideracions intempestives (1876). 2. Època il·lustrada. Filosofia del mati, homenatge als esperits lliures: Humà, massa humà (1878); Aurora (1881); La gaia ciència (1882). 3. Tercera època. Filosofia del migdia, on ataca a tota la cultura occidental, a religió, la filosofia i la moral tradicionals: Així parla Zaratustra (1883). 4. Època critica. Filosofia del vespre, que continua en la seva línia de desemmascarament: Més enllà del bé i del mal (1885); La genealogia de la moral (1887); El cas Wagner, El crepuscle dels ídols, l’Anticrist i Ecce homo (totes escrites el 1888).<\/p>\n<p>Quan es parla de l'obra de Nietzsche en el seu conjunt, el primer que cal dir és que no és el producte d'un pensador sistemàtic, ja que el seu filosofar és aforístic i presenta una pluralitat de significats, de camins, d'esquemes de lectura, que sempre poden aprofundir-se i reformular-se. Els seus aforismes tenen un caràcter lapidari que lliga amb la seva intenció de denunciar i desemmascarar les idees clàssiques i il·lustrades; fins i tot, per tal d'accentuar el seu caràcter crític, capgira el sentit d'algunes idees religioses i morals. Per tot això, li han plogut crítiques per la seva falta de força deductiva, de rigor conceptual, de sistematicitat, etc. Però és que la seva filosofia funciona a base de \"descàrregues\" i no de deduccions, a base d'imatges i no de conceptes, amb força i no amb sistema.<\/p>\n<p>També hi ha hagut intents de desqualificació: s'ha dit que la seva obra és producte de la seva degradació física o que és normal que acabés boig després de dir el que va dir. Actualment, però, els estudiosos defensen que cal situar Nietzsche en la soledat i la malaltia: només des del sofriment i des de la solitud es pot tenir una visió profunda sobre el món. Així doncs, la filosofia d'aquest autor cal jutjar-la pel que diu i no pel seu presumpte origen patològic.<\/p>\n<figure><img loading=\"lazy\" src=\"filo/nietzsche_00.jpg\" alt=\"\"><\/figure>\n<p>L'objectiu de la filosofia de Nietzsche se centra en la crítica de la cultura occidental, que ell considera una mentida mil·lenària. Està convençut que els mites i les creences d'aquesta cultura, inventats pels humans per tal de sobreviure en mig d'una vida caòtica, han portat l'ésser humà a sotmetre's a l'autoritat constituïda i a tot allò que, segons ell, és contrari a la vida.<\/p>\n<p>Cal, doncs, desmitificar i dessacralitzar el món, destruir les creences i els mites perquè només així es destruirà el tipus humà que la civilització occidental ha produït. Per consegüent, Nietzsche dibuixa un nou model d'humanitat, aquella que defensa l'acceptació total i entusiàstica de la vida.<\/p>\n<p class=\"cap\"><b>Así Habló<\/b> <b>Zaratustra. Alianza<\/b><\/p>", "min": 5}, {"n": 2, "num": "5.7.2", "title": "La defensa del vitalisme", "subs": [], "html": "<p>Quan l'any 1865 Nietzsche va trobar a una llibreria de vell el llibre de Schopenhauer, El món com a voluntat i representació, escriu: \"a cada ratlla hi descobria un mirall en el qual hi apareixia el món, la vida, el meu ànim (...), la malaltia i la curació, l'exili i l'asil, l'infern i el paradís\". Schopenhauer és, a partir d'aquest moment, el seu heroi, del qual recull la idea que el món està governat pel principi irracional del dolor, la lluita, la destrucció, la crueltat, la incertesa i l'error. La vida, doncs, no es desenvolupa ordenadament. Nietzsche participa d'aquesta opinió, però, en canvi, s'allunya de la solució d'aquest autor (renunciar a aquest món i emprendre el camí de l'ascetisme) i proposa l'acceptació de la vida amb totes les seves característiques: l'acceptació del dolor, els aspectes absurds dels esdeveniments, el drama de la vida i de la mort.<\/p>\n<p>La realitat és, per a ell, la vida entesa com força, instint, lluita, etc. És en la seva primera època, a l'obra el Naixement de la tragèdia, quan escriu que l'essència del món i de la vida es pot explicar a través de l'art, ja que, tal com creuen els romàntics, l'art és l'ull per mitjà del qual el pensador pot conèixer els fons de les coses més enllà de les aparences. Per expressar aquesta concepció recorre a la Grècia clàssica, concretament a la tragèdia àtica que, segons ell, és la màxima expressió artística de la civilització grega, ja que en ella es manifesten plegades les dues forces que animen l'esperit grec: l'element apol·lini i l'element dionisíac, representats pels déus Apol·lo i Dionís, respectivament.<\/p>\n<figure><img loading=\"lazy\" src=\"filo/nietzsche_01.jpg\" alt=\"\"><\/figure>\n<figure><img loading=\"lazy\" src=\"filo/nietzsche_02.jpg\" alt=\"\"><\/figure>\n<aside class=\"nota\"><p><b>Apol·lo Déu del sol<\/b> <b>(Ordre, raó, moderació, serenitat)<\/b><\/p><p><b>Dionís Déu de la fertilitat i el vi<\/b> <b>(Caos, instints, borratxera,<\/b> <b>irracionalitat)<\/b><\/p><\/aside>\n<p>En aquesta obra, Nietzsche explica que dionisíac i apol·lini manifesten dues concepcions oposades de la realitat, així, dionisíac és sinònim de caos, instint, borratxera i irracionalitat; mentre que apol·lini representa l’ordre, la raó, la moderació i la serenitat. Ens diu, a més, que l'element dionisíac neix del sentit caòtic de l'esdevenir i de la força vital i es manifesta artísticament mitjançant l'exaltació creadora de la música; per contra, l'element apol·lini neix d'una actitud de fugida davant del flux imprevisible dels esdeveniments i s'expressa en les formes harmòniques de l'art plàstic i l'epopeia. Nietzsche afirma que el caràcter dionisíac va dominar durant l'època presocràtica, però que l'element apol·lini va manifestar-se quan es va voler comprendre el caos i transformar tot allò que d'horrible i absurd hi ha en el món. La tragèdia àtica (Sòfocles i Esquil) va harmonitzat els dos elements fins que Eurípides va trencar l'equilibri tot transformant l'acció dramàtica en un debat teòric que, segons Nietzsche, reprodueix la mediocritat de la vida quotidiana.<\/p>\n<p>El que Eurípides fa amb la tragèdia, Sòcrates ho fa amb la filosofia, ja que pretén interpretar l'existència a partir de conceptes racionals, tot matant la profunditat dels instints vitals i donant pas a la raó i a la seva visió serena i mesurada del món. El que Esquil fa amb la tragèdia, Heràclit ho fa amb la filosofia, perquè ha sabut mostrar la importància d'esdevenir per sobre de l'ésser, ha anticipat la unitat de l'apol·lini i el dionisíac parlant de la unitat dels oposats i, finalment, ha sabut veure que el flux del temps és la dimensió vertadera de la realitat. Podem dir, doncs, que Sòcrates i Eurípides són el contrapunt d'Heràclit i Esquil, aquests expressen meravellosament la tragicitat de l'ésser humà, aquells trenquen el nexe de l'ésser humà amb el mite i amb la polis. Amb ells, ja no hi ha home tràgic, el seu lloc és ocupat per l'home teòric, per aquell que construeix un món d'aparences gràcies a la raó i la ciència.<\/p>\n<p>Nietzsche vol ser el deixeble de Dionís i, ja que ell és el símbol de l'exaltació infinita de la infinita vida, acceptar la vida voldrà dir entendre el dolor com a joia, la crueltat com a justícia, la lluita com a harmonia i la destrucció com a creació. Però defensar aquesta postura vol dir enfrontar-se a la filosofia antitràgica, que no només va triomfar amb Sòcrates i Eurípides sinó que va perdurar al llarg dels temps a través de Plató i del cristianisme, els quals segueixen imposant un ordre racional al món, tot referint-se a unes preteses essències i estructures metafísiques. Com que aquest ordre és encara present en la cultura del seu temps, Nietzsche n'inicia una crítica, ja que aquesta ha comès l'error de sotmetre la vida a la raó, de pensar que la racionalitat es deriva de la vida.<\/p>\n<p>Aquesta crítica es força virulenta entre els anys 1873 i 1876, quan escriu les quatre Consideracions intempestives, a través de les quals fa una crida a les forces sanes i creadores de la cultura. En aquesta obra ret homenatge a aquells que venera de manera apassionada: Schopenhauer i Wagner. Schopenhauer apareix aquí com el mestre que ha volgut denunciar el conformisme i ha anat a la recerca de la llibertat, com l'educador que presenta un nou tipus d'ésser humà, el que busca la veritat, és a dir, el que posseeix la intuïció del tot, el savi que amb la seva saviesa il·lumina tota l'existència. Wagner és el redemptor, en el sentit que ens indica el camí cap a la veritat, una veritat que sorgeix de les cendres de la catàstrofe. Tots dos prefiguren la imatge del Geni, l'artista inventor i productor de cultura, el savi capaç d'intuir l'essència tràgica de la vida. Aquesta visió serà abandonada, a partir de 1876, quan es produeix la ruptura amb els dos ídols de la seva joventut, aleshores deixa enrere els seus mites juvenils i, despertant-se del somni romàntic, abandona la metafísica schopenhaueriana i s'allibera de la divinització wagneriana de l'art. És ara quan orienta el seu pensament cap a la crítica a la ciència, com mostren les obres, Humà, massa humà, Aurora i Gaia ciència. En totes elles ataca de manera violenta els conceptes metafísics de transcendència i de \"cosa en sí\", ja que no fan res més que duplicar el món, tot mostrant-nos que més enllà d'aquesta realitat caòtica n'hi ha una altra d'ideal, a la qual cal tendir. Per a ell no existeix un ésser immutable i estàtic en un altre món també estàtic i immutable, això només és un error de la raó, un engany en el qual els humans s'hi troben ben asseguts. \"La metafísica tracta dels errors fonamentals de l'home com si fossin veritats fonamentals.\"<\/p>\n<p>A Així parlà Zaratustra, Nietzsche ja ha desemmascarat tots els conceptes metafísics anteriors (substància, consciència, cosa en sí, etc.) i col·loca en un lloc preferent la terra. La terra és el principi còsmic de totes les coses, a partir del qual sorgeix tot l'existent, tot allò que és limitat i individualitzat; en aquest sentit, podem dir que la terra és concebuda com a poder creador, gràcies al qual totes les coses adquireixen figura, consistència i perfil. Així per exemple, la pedra, l'animal i l'home no són iguals en tant que tenen diferències essencials i existeixen de manera diferent, però ho són en la mesura que són creacions o productes de la terra, que és el fons sobre el qual descansa tota existència finita.<\/p>\n<p>Al Crepuscle dels ídols, ja en la darrera etapa de la seva obra, es referma en les posicions fins ara esmentades, és a dir, segueix defensant que només hi ha un únic món, aquell que captem a través dels sentits, aquesta terra que se'ns mostra a través de l'espai i del temps, sota aquest cel i amb tota la multitud de coses que hi ha; una terra que no coneix res quiet ni immutable, tot és temps, esdevenir i res més. Aquestes són les seves paraules: \"Tot el que els filòsofs han emprat des de fa mil·lennis han estat mòmies conceptuals (...) Aquests senyors idòlatres dels conceptes, maten, omplen de palla, tot allò que adoren (...) La mort, el canvi, la vellesa, així com la procreació i el naixement són només objeccions per a ells\" La Metafísica, tal com Nietzsche l'entén, és, doncs, el món a l'inrevés.<\/p>\n<figure><img loading=\"lazy\" src=\"filo/nietzsche_03.jpg\" alt=\"\"><\/figure>", "min": 7}, {"n": 3, "num": "5.7.3", "title": "La critica a la ciència i a la filosofia", "subs": [], "html": "<p>Nietzsche planteja el problema del coneixement a partir de la seva concepció de la realitat. Si la realitat és canvi i contradicció és impossible conèixer-la racionalment, és a dir, a partir de categories fixes. Malgrat això, el llenguatge, en general, i la ciència i la filosofia, en particular, pretenen fixar la realitat a partir de conceptes, lleis, teories, etc. Pensen així que, amb aquesta manera de reflectir la realitat, poden conèixer-la de forma vertadera. Per això, Nietzsche centra la seva anàlisi en l'estudi del concepte de veritat i critica radicalment qualsevol intent de reduir la realitat a conceptes. Nietzsche mostra aquesta anàlisi de manera diversa en els dos primers períodes de la seva obra.<\/p>\n<p>A Sobre veritat i mentida en sentit extramoral, considera que els éssers humans se senten molt confortats d'allò que anomenen intel·lecte, n'estan tan orgullosos que consideren que és el centre del món i obliden que només és un recurs dels éssers infeliços i efímers per poder-se mantenir i conservar en la seva existència. Mentre la majoria pensa que amb l'intel·lecte podem assolir la veritat, Nietzsche considera que l'intel·lecte només conrea l'art de l'engany, la mentida, el frau..., i es pregunta: ¿d'on procedeix l'impuls dels éssers humans cap a la veritat? Aquest impuls té el seu origen en el desig de viure en pau amb els altres éssers humans. Perquè aquest desig es faci realitat és necessari un pacte, a través del qual es fixi allò que, a partir d'aquell moment, ha de ser \"ventat\".<\/p>\n<p>D'aquesta manera es va inventar una eina uniformement vàlida i obligatòria per designar les coses, és a dir, es va inventar el llenguatge, que proporciona les primeres lleis de veritat gràcies al seu poder legislador. El llenguatge i, per tant, tot el material amb el qual treballen els científics , els investigadors, els filòsofs i els homes en general és una convenció i, com a tal, no representa l'essència de les coses. Els conceptes, diu Nietzsche, no són res més que \"necròpolis d'intuïcisumaons\", \"residus de metàfores\" i, si això és així, què és la veritat? \"Un exèrcit en moviment de metàfores, metonímies, antropomorfismes, comptat i debatut, una suma de relacions humanes que han estat enaltides, extrapolades i adornades poèticament i retòricament i que, després d'un ús prolongat, un poble considera fermes, canòniques i vinculants; les veritats són il·lusions de les quals ens hem oblidat que ho són; metàfores que s'han fet malbé i sense força sensible, monedes que han perdut el seu encuny i ara ja no són considerades monedes sinó metall\".<\/p>\n<p>Si el llenguatge només és un sistema de metàfores lliurement produït, com qualsevol altre sistema de metàfores, llavors no podem entendre'l com l'única manera correcta i vàlida de descriure el món. En canvi, els éssers humans han oblidat que el llenguatge té origen metafòric i fan de la seva perspectiva l'única perspectiva, d'aquesta manera, viuen en calma i seguretat, encara que empresonats. Si poguessin sortir d'aquesta presó s'adonarien que la seva percepció del món i la que tenen, per exemple, l'ocell o l'insecte són totalment diferents i cap d'elles no és la percepció correcta. Amb el llenguatge, doncs, no podem conèixer la \"vertadera realitat de l'ésser\", ja que aquest només és canvi i devenir. En aquest període i a la mateixa obra Nietzsche comença a ocupar-se de la ciència, perquè aquesta té un paper importar en la construcció de conceptes. Amb els conceptes, la ciència ordena el món empíric, tot formulant lleis que constitueixen la \"veritat científica\" i que serveixen per protegir-se del món caòtic i canviant.<\/p>\n<p>Al segon període, sobretot a la Gaia ciència, Nietzsche continua ocupant-se de la ciència, però no li dona el mateix sentit que tenia a la seva època. Amb l'expressió gaia ciència reprèn la manera com als segles XIII i XIV es designava la poesia dels trobadors provençals i, segons això, entén la ciència com un art per mitjà del qual poder expressar amb gràcia i elegància la infinita diversitat de l'existència. A diferència d'ell, la concepció dominant de la ciència del XIX, el mecanicisme i el positivisme, pretenia reduir a una interpretació definitiva l'ambigüitat de tot el real; així, se sistematitzaven els seus continguts per tal d'ordenar i racionalitzar el caràcter caòtic del món i s'intentava explicar objectivament la realitat per tal d'amagar i negar tot allò que horroritzava i inquietava als humans. Nietzsche vol desemmascarar l'objectivitat científica mostrant que respon a pressupòsits extracientífics. Quins són? Creences morals i metafísiques. I, quines són aquestes creences? El desig de comprendre de la millor manera possible la bondat i la saviesa divines, l'ideal que el coneixement és útil i, finalment, la convicció que és millor posseir quelcom d'autosuficient que no pas el coneixement caòtic i canviant de la realitat <i>Y ¿qué es esa resuelta voluntad de alcanzar la verdad? ¿Es la resolución de no dejarse engañar?<\/i> <i>¿Es la resolución de no engañar? Pues el deseo de verdad puede interpretarse también de esta<\/i> <i>última manera, admitiendo que en la proposición general no quiero engañar esté comprendida<\/i> <i>también la particular no quiero engañarme. Mas ¿por qué no engañar?<\/i><\/p>\n<p><i>¿Por qué no dejarse engañar? Forzoso es reconocer las razones que aconsejan lo segundo.<\/i> <i>No queremos dejarnos engañar porque juzgamos que es perjudicial, peligroso y funesto ser<\/i> <i>engañado, y desde este punto de vista podría considerarse la ciencia como resultado de una<\/i> <i>prolongada astucia, de una precaución y de un cálculo de utilidad, a los cuales podría en verdad<\/i> <i>objetarse: ¿cómo? El hecho de no querer dejarse engañar ¿disminuye verdaderamente el peligro<\/i> <i>de tropezar con cosas perjudiciales, peligrosas y funestas? ¿Qué sabéis acerca del carácter de la<\/i> <i>existencia para poder decidir si es más ventajosa la desconfianza absoluta que la confianza<\/i> <i>absoluta? Mas para el caso en que fuesen necesarias ambas cosas, mucha confianza y mucha<\/i> <i>desconfianza, ¿de dónde sacaría entonces la ciencia su fe absoluta, esa convicción que le sirve de<\/i> <i>base, de que la verdad es más importante que todas las demás cosas y que todas las convicciones?<\/i> <i>Esta convicción no habría podido llegar a formarse si la verdad y la mentira afirmasen de<\/i> <i>continuo su utilidad, utilidad que es un hecho.<\/i><\/p>\n<p><i>Luego la fe en la ciencia, fe que es indudable que existe, no puede provenir de semejante cálculo de<\/i> <i>utilidad, sino que, al contrario, se ha formado a pesar de la demostración constante de la<\/i> <i>inutilidad y del peligro que hay en el ansia de verdad y en la máxima “la verdad a toda costa”. A<\/i> <i>toda costa ¡ay! Harto sabemos lo que esto quiere decir, cuando hemos sacrificado en su altar una<\/i> <i>creencia tras otra. Por consiguiente, el apego a la verdad no significa “yo no quiero dejarme<\/i> <i>engañar”, sino “yo no quiero engañar, no quiero engañarme a mí mismo ni a los demás”, pues no<\/i> <i>queda otra solución, y esto nos lleva al terreno de la moral.<\/i><\/p>\n<p>Amb aquest desemmascarament de la ciència i dels científics s'oposa, sobretot, al mite de la ciència positiva, tot afirmant que \"no hi ha fets, sinó només interpretacions\", la qual cosa significa que sobre la realitat no hi ha veritat ni falsedat, només perspectives diferents. I si hi ha perspectives diferents, llavors no coneixem mai la veritat objectiva sinó la diversa pluralitat de punts de vista. Per això, conèixer no és adequar el subjecte a la cosa, sinó interpretar, donar sentit, avaluar, és a dir, organitzar la realitat d'acord amb la perspectiva dels valors a través dels quals cada ésser humà expressa la singularitat de la seva pròpia existència. L'activitat científica és així una activitat artística, com ja hem dit, que imposa formes arbitràries a una realitat dúctil i elàstica. Amb la gaia ciència serem conscients que hi ha un autèntic saber, perquè: \"Què són, en darrer terme, les veritats de l'home? Els seus errors irrefutables.\" Si no hi ha un autèntic saber, què hi ha? Nietzsche diu que només existeix un joc inconscient d'instints pràctics, mitjançant el qual construïm una lògica que ens permet orientar-nos en la realitat, però no desvetllar-la. En tota la seva obra posterior manté la mateixa postura, cada cop més perfilada i clarificada. Així, a Més enllà del bé i del mal, analitzant-ho tot des de l'òptica de la vida, retorna a l'afirmació que no podem eliminar el món aparent i substituir-lo per un de vertader, perquè, \"¿què és suposar que existeix una antítesi essencial entre vertader i fals? ¿No n'hi hauria prou amb suposar graus que ens d'aparença i, per dir-ho així, ombres i tons generals, més clars i més foscos, de l'aparença?\".<\/p>\n<p>Aquest plantejament de crítica a la ciència és vàlid també com a crítica a la filosofia, ja que, en els filòsofs veu Nietzsche el mateix instint que porta a fugir del món real per anar cap a un suposat món \"vertader\". Enfront d'aquests filòsofs, entre els que esmenta Sòcrates, Plató, Descartes, Kant i el positivisme, exigeix uns filòsofs del futur que acceptin que el més segur i ferm que podem tenir és la \"indole errònia del món.\" Per a Nietzsche l'autèntica filosofia és saviesa tràgica, la mirada que ens permet copsar la lluita entre allò dionisíac i allò apol·lini, filosofia és adonar-se del conflicte entre el món de les idees (Plató, Kant) i el món de la vida sense forma, que tot ho origina i tot ho destrueix.<\/p>", "min": 8}, {"n": 4, "num": "5.7.4", "title": "Crítica a la moral occidental", "subs": [{"id": "s4-1", "num": "4.1", "title": "La mort de Déu"}, {"id": "s4-2", "num": "4.2", "title": "Nihilisme"}, {"id": "s4-3", "num": "4.3", "title": "La transvaloració"}], "html": "<p>Nietzsche s'ocupa de l'acció en la mesura que critica les pretensions humanes d'oferir principis morals vàlids per a tothom. Més que refutar un sistema moral o un altre, s'ocupa de desemmascarar quines són les arrels psicològiques que porten les persones a formular unes determinades concepcions morals. Aquest desemmascarament, encara que es troba present en tota la seva obra, es fa més palès en els escrits de l'última època, en la qual mostra el seu desig de provocar un canvi radical en la civilització humana tot proposat nous fonaments per una nova humanitat.<\/p>\n<figure><img loading=\"lazy\" src=\"filo/nietzsche_04.jpg\" alt=\"\"><\/figure>\n<p>Nietzsche, doncs, és un genealogista de la moral, és a dir, descriu l'origen dels valors, del bé i del mal, del just i l'injust, al mateix temps que es pregunta quin és el valor d'aquests valors. Com a genealogista, la convicció que guia la seva anàlisi és que els pretesos valors transcendents (la bondat, la justícia,...) no són més que projeccions de determinades tendències humanes, per això afirma a Ecce Homo: \"On vosaltres hi veieu coses ideals, jo hi veig coses humanes, massa humanes\". Així, el més que per a s'anomena \"veu de la consciència\", per exemple, de la qual procedeix la moral, no és res ell que la presència en nosaltres de les autoritats socials per les que hem estat educats, és a dir, la moralitat és \"L'instint del ramat\" o el sotmetiment a determinades directrius, donades per les elits dominants, per tal de reforçar el seu domini.<\/p>\n<p>Però els valors no sempre han estat els mateixos, sinó que en el món de la Grècia clàssica la moral dominant era la d'una aristocràcia de cavallers, els valors dels quals eren: la força, la joia, la salut, la fermesa, etc. Era la moral dels senyors, que va ser substituïda, però, per la moral dels esclaus, els valors dels quals eren: el desinterès, l'abnegació, el sacrifici de si mateix, etc. Nietzsche ens diu que aquesta transmutació, aquest canvi de valor, va venir de la mà dels sacerdots, encara que originàriament la moral dels senyors era tant la dels guerrers com la dels sacerdots. Però el ressentiment i l'enveja secreta dels sacerdots va provenir del fet que els guerrers cercaven la virtut del cos, mentre que ells buscaven la de l'esperit, i com que la naturalesa humana és irresistible i el sacerdot no podia dominar la casta dels guerrers en el seu terreny, va fer-ho en el terreny de la moral, tot elaborant una taula de valors antitètica, de tal manera que al cos se li va contraposar l'esperit, a l'orgull la humilitat, a la sensualitat la castedat, etc.<\/p>\n<p>Aquesta actitud va ser portada a l'extrem pel cristianisme. Recordem que si bé Judea va ser sotmesa políticament pels romans, els jueus però, sobretot, els cristians van conquerir moralment Roma, tot imposant-li la seva religió. Una religió que, a través de la noció de \"pecat\", presenta un home reprimit turmentat psíquicament, un home ressentit que amaga una agressivitat contra la vida i vol venjar-se del seu proïsme.<\/p>\n<p>Segons Nietzsche aquests valors que presideixen la moral dels esclaus són ata inadequats i ficticis per això la civilització occidental (l'esperit d'Occident) està cansada, esgotada. Cal, doncs, acabar amb aquesta situació i destruir la moral que tant de mal ha fet, i això només és possible si eliminem el seu fonament últim: Déu. Cal certificar la mort de Déu.<\/p>\n<h3 id=\"s4-1\"><span class=\"n\">4.1<\/span>La mort de Déu<\/h3>\n<p>Per entendre l'expressió \"mort de Déu\", cal aclarir que entén Nietzsche per Déu. D'una banda, el considera el símbol d'una perspectiva antivital i ultramundana, que posa l'accent en un més enllà transcendent i autènticament vertader, contraposat a aquest món. En aquest sentit, ha estat la causa de la fugida i la revolta contra el món on vivim, el món de l'aparença. De l'altra banda, considera que Déu és la personificació de totes les certeses últimes de la humanitat, de totes les creences metafísiques i religioses. Per això, davant la realitat contradictòria, cruel i caòtica d'aquest món, els homes, per tal de sobreviure, s'han hagut de convèncer que el món és racional, harmònic, providencial, etc.<\/p>\n<p>L'autor anuncia per primer cop la mort de Déu a l'aforisme 125 de la Gaia ciència, aforisme titulat l’Home foll. Aquest home, que representa el filòsof profeta, porta una lot encesa a ple dia i corrent per la plaça va dient \"Busco Déu! ¡Busco Déu!\", els homes de la plaça riuen irònicament, perquè són els ateus optimistes i superficials del segle XIX als que la mort de Déu ha deixat insensibles. Ells li pregunten si se li ha perdut, però ell continua: \"On és Déu? (...) just ho diré! Nosaltres l'hem mort! (...) Però, com ho hem fet? Com hem pogut buidar la mar? Qui ens ha donat l'esponja per esborrar completament l'horitzó? Què hem fet per separar la terra de la cadena del seu sol?(...)\". Les expressions \"buidar la mar\", \"esborrar l'horitzó\" i \"separar la terra del sol\" signifiquen el caràcter difícil i sobrehumà de la matança de Déu. El foll continua: \"¿No ens precipitem en una constant caiguda cap a enrere, cap al costat, cap a endavant...? Hi segueix havent un dalt i un baix? (...) No fa fred?\" Totes aquestes qüestions signifiquen el vertigen que segueix a la mort de Déu, ja que si Déu és mort, la humanitat és òrfena i no té sentit parlar de moral, del bé i del mal, del just i de l'injust. El foll segueix: \"No és massa gran la magnitud d'aquest fet? No hauríem de convertir-nos en déus per poder ser dignes d'una acció com aquesta? (...) En arribar aquí el foll va callar i va observar-los tots aquests també havien callat i el miraven sense entendre res. Finalment, va tirar la lot al terra, aquesta es va trencar i es va apagar. Arribo massa d'hora, va dir aleshores, el meu temps encara no ha arribat (...). Conten també que aquest mateix dia l'home foll va entrar a diverses esglésies on va entonar el Requiem aeternam Deo. Quan el feien fora i li demanaven que s'expliqués, no deixava de repetir: ¿Què són aquestes esglésies sinó tombes i monuments funeraris de Déu?\" Tot aquest fragment s'interpreta des de la següent perspectiva: la necessitat d'esdevenir déus significa que l'home ha d'esdevenir creador i responsable únic dels seus valors; el fet d'arribar massa aviat representa la consciència del filòsof en adonar-se'n que la mort de Déu no és acceptada encara per tothom; i les esglésies com a sepulcres de Déu representen la crisi moderna de la religió.<\/p>\n<p>Metafòricament parlant, podem dir que Déu estava agonitzant des del Renaixement, moment en què l'ésser humà desplaça Déu com objecte d'estudi i el món es veu amb una perspectiva humana. Ara bé, quan realment es produeix la mort de Déu és a l'època il·lustrada, que suposa la deïficació de la raó. Nietzsche, però, creu que Déu encara perdura a través de les institucions que representen el dret, la moralitat, la ciència, etc. Malgrat això, la seva mort és un fet, que es manifesta en la situació decadent a que ha arribat, segons Nietzsche, la cultura occidental. Si Déu representa el món dels valors que sustentaven aquesta cultura, amb la seva mort moren els valors i la humanitat perd la seva orientació, allò li donava sentit. Aquesta situació l'anomena nihilisme<\/p>\n<figure><img loading=\"lazy\" src=\"filo/nietzsche_05.jpg\" alt=\"\"><\/figure>\n<figure><img loading=\"lazy\" src=\"filo/nietzsche_06.jpg\" alt=\"\"><\/figure>\n<h3 id=\"s4-2\"><span class=\"n\">4.2<\/span>Nihilisme<\/h3>\n<p>Nietzsche va lligat directament amb la mort de Déu i amb la fi de la metafísica. Podem distingir dues menes de nihilisme: nihilisme passiu i nihilisme actiu. El nihilisme passiu significa l'absència de finalitats que, d'entrada, permetin donar sentit a la vida humana; aquesta mena de nihilisme és el que l'autor detecta en la societat d'Occident, que, com hem dit, ha perdut la guia. I quina és a la causa d'aquesta pèrdua de meta? La vertadera causa es troba en el fet que s'ha negat l'existència d'una realitat transcendent i, amb ella, la dels valors que la sustentaven, és a dir, ara s'ha descobert que ni l'ésser és u, ni és bo, ni és veritat. No és u, perquè no hi ha una totalitat racional ordenada; no és bo, perquè la realitat no s'adequa a les nostres expectatives ètiques; no és veritat, perquè no hi ha una veritat absoluta. Malgrat que no hi ha cap ésser transcendent, els homes continuen buscant-lo però ara no en el més enllà sinó en l'autoritat de la raó, de la consciència, en l'instint social, en la història. Aquesta feblesa de l'esperit ha de ser superada segons Nietzsche pel nihilisme actiu, que és senyal de la creixent potència de l'esperit, amb la qual destruirà de manera violenta els residus de l'antiga fe i donarà peu a una nova taula de valors.<\/p>\n<h3 id=\"s4-3\"><span class=\"n\">4.3<\/span>La transvaloració<\/h3>\n<p>Fins ara Nietzsche ha negat la moral i la religió cristiana, ha derruït a cops de martell tot l'edifici sobre el qual s'aguantava la civilització de la seva època, és el moment d'elaborar una nova taula de valors, d'operar la transvaloració, com habitualment es diu. Ell, que és el primer immoralista, estableix un conjunt de valors a la mesura humana, amb un caràcter mundi i terrestre; són els valors vitals com: la fermesa, la joia, la salut, l'enemistat i la guerra, les belles actituds, les bones maneres, la voluntat de poder; el reconeixement de la terra i de la vida, etc. El protagonista d'aquesta moral no pot ser l'home tal com l'entén Nietzsche, sinó un ésser superior.<\/p>", "min": 8}, {"n": 5, "num": "5.7.5", "title": "El superhome", "subs": [{"id": "s5-1", "num": "5.1", "title": "El superhome i la voluntat de poder"}, {"id": "s5-2", "num": "5.2", "title": "L'etern retorn"}], "html": "<p>Nietzsche considera que l'ésser humà és un ésser indeterminat, un híbrid en el qual es mescla l'animalitat i la humanitat. És ben cert que ha anat evolucionant, però poca cosa s'ha aconseguit amb aquesta evolució, perquè ha donat més importància a l'ànima i al més enllà que al cos i a la terra; en contraposició a tots els altres animals que han evolucionat, l'home és l'únic animal que no s'ha consolidat, que no s'ha superat, que és un pont entre la bèstia i el que ell anomena superhome. Ara bé, a diferència de l'animal, l'home mira cap al futur i pot concebre ideals. Tres han estat les diferents versions d'ideal humà: l'ideal estètic, l'ideal científic i el superhome. Nietzsche parla en el seu primer període de l'ideal estètic, quan s'ocupa de la tragèdia grega, en la que allò dionisíac i allò apol · lini s'harmonitzen. La figura humana que destaca és la de l'home intuïtiu, l'artista que coneix l'engany, tant de les coses fixes com de les metàfores, però que es mou lliurement davant de la realitat. És l'home creador, el geni, personificat en Schopenhauer i en Wagner.<\/p>\n<p>El geni no és un home allunyat dels homes ordinaris ni tampoc un tipus afortunat, sinó l'home caracteritzat per allò sobrehumà, l'home que posseeix una missió còsmica, la de penetrar en el fons del món per interpretar-lo de manera artística. És cert que ha de consagrar la seva tasca a la recerca de la veritat, però ara veritat significa conèixer de manera intuïtiva l'essència tràgica de la vida, tal com feien els herois de la tragèdia grega quan actuaven de manera desmesurada.<\/p>\n<p>De l'ideal científic se n'ocupa en el segon període de la seva obra i el concep com a saviesa que tracta de conèixer la realitat tal com és, despullada dels elements religiosos, metafísics i morals. El nou protagonista és l'esperit lliure, que és superior al lliure pensador de l'època de la Il·lustració, perquè no creu cegament en la raó sinó que hi desconfia i la interroga. És cert que va a la cacera de la veritat, però sense il·lusió i destruint les veritats dels altres, el seu món és organitzat d'acord amb la \"gaia ciència\"; és el gran escèptic amb relació a tot el que accepten i veneren els homes inferiors.<\/p>\n<p>No respecta res, no té por i és lliure en relació amb tot allò que l'havia alienat, d'aquesta manera pren possessió de si mateix com si es tractés d'un sobirà que pren possessió del seu tron. Aquest alliberament s'aconsegueix per la via de la reflexió, tot adonant-se que la cosa en si no existeix, que el bell, el bo i el sant tampoc, perquè només són transcendències aparents, projectades per l'home mateix. En aquest sentit, l'home és agosarat i considera que la vida és un experiment: no cal buscar les finalitats fora d'ell sinó dins seu, encara que en fer-ho, percep el caràcter arriscat de l'existència. Com artífex que és del seu propi destí, es comporta de manera coratjosa i responsable, però en veure que ell és qui ha creat els valors que presideixen la vida humana, veu la possibilitat d'invertir-los i de crear-ne de nous.<\/p>\n<p>Pel que fa al superhome, Nietzsche diu que personifica el valor suprem de la vida. Dèiem abans que la mort de Déu representava un trauma per a l'home, incapaç de tenir el coratge de plantar cara a la vida i de fer-se càrrec de la irracionalitat caòtica del món, incapaç de donar el salt que superhome el separa del superhome.<\/p>\n<figure><img loading=\"lazy\" src=\"filo/nietzsche_07.jpg\" alt=\"\"><\/figure>\n<p class=\"cap\"><b>El superhome, en alemany Übermensch<\/b><\/p>\n<h3 id=\"s5-1\"><span class=\"n\">5.1<\/span>El superhome i la voluntat de poder<\/h3>\n<p>En el pròleg a Així parla Zaratustra, Nietzsche ens relata com Zaratustra, aquella figura semillegendària persa, va arribar a la ciutat que estava a la vora dels boscos i va trobar reunida una gran gernació a la plaça, a ella s'hi va adreçar tot dient: \"Jo us ensenyo el superhome. L'home és quelcom que ha de ser superat. (...) Tots els éssers han creat fins ara quelcom per damunt d'ells mateixos: i ¿vosaltres voleu (...) recular a l'animal més aviat que superar l'home?\" Seguidament va afegir.<\/p>\n<p>\"L'home és un pont entre la bèstia i el superhome\". Del que acabem de dir podria entendre's que el superhome és el resultat d'una evolució des de l'homo sapiens fins a una raça d'homes superiors, però Nietzsche s'allunya d'aquesta interpretació perquè no només considera l'evolucionisme del seu temps com una concepció ingènua del progrés, sinó que veu en la mateixa societat humana una regressió, si la comparem amb els homes del Renaixement i amb els Grecs antics, no hi ha, segons ell, una elit que estigui per damunt de la massa sinó que és la massa anodina dels idealistes i dels cristians la que domina per damunt de tot.<\/p>\n<p>En el primer discurs de la primera part, anomenada \"De les tres transformacions\", Nietzsche presenta, de forma metafòrica, la transformació de l'essència humana. Gràcies a ella, l'home passa de l'autoalienació a la llibertat creadora del que es coneix a sí mateix. \"Tres transformacions de l'esperit us essimento: com l'esperit es converteix en camell, i el camell en lleó, i el lleó, finalment, en nen\". Quin significat tenen aquestes metàfores?<\/p>\n<figure><img loading=\"lazy\" src=\"filo/nietzsche_08.jpg\" alt=\"\"><\/figure>\n<p>El camell significa l'home que encara s'inclina davant l'omnipotència divina, davant la sublimitat de la moral, és l'home idealista que menysprea la vida diària perquè és massa fàcil, busca manaments pesats i rigorosos i se sotmet a l'imperatiu \"tu has de...\". Quan el camell es transforma en lleó, Nietzsche ens vol dir que l'home ja ha deixat la càrrega feixuga de la moral i coneix la seva autoalienació, el seu estranyament en un món intel·ligible i diví, que rebutja per esdevenir lliure.<\/p>\n<p>Aquesta llibertat, però, encara no és total, perquè és \"llibertat de\", és a dir, llibertat de negar els valors antics i venerables, no \"llibertat per a\". Aquesta només es dona en el nen: \"Innocència és el nen, i oblit, un nou començament, un joc, una roda que es mou per si mateixa...\"; el nen representa la \"llibertat per a\", és l'ésser creador de nous valors, l'home que, allunyant-se de totes les comunitats humanes, arriba a ser-si-mateix.<\/p>\n<p>Què és, doncs, el superhome? Nietzsche ens dona les següents aproximacions: és quelcom que oscil·la entre la \"bella individualitat\", com la de l'esperit lliure, i l'aventurer, més concretament: és \"la figura lluminosa\" que redimeix i dona la virtut; és l'heroi que té una disposició dionisíaca a acceptar la vida de manera plena; és el que peca d'hybris (del grec, desmesura), que té la indiferència d'aquell que està més enllà del bé i del mal; és l'home del gran amor i del gran menyspreu; l'esperit creador, l'home de les grans decisions, que salvarà la humanitat del nihilisme, el que refusa la moral tradicional i provoca la transvaloració; el que en el curs del temps puja i puja fins a situacions de poder cada cop més elevades.<\/p>\n<p>La voluntat de poder, doncs, s'identifica amb la manera de ser pròpia del superhome. Però vejam ara quina interpretació ha tingut i té aquesta expressió. Durant temps s'ha interpretat tot tenint en compte el significat més immediat i, així, s'ha dit que volia dir agressivitat, domini i violència sobre els altres. Nietzsche, però, no anava per aquest camí. En les últimes obres té el mateix sentit que la paraula \"vida\" tenia en altres textos i, des d'aquest punt de vista, s'entén com una energia inquieta, turbulenta i indeterminada que contínuament crea i destrueix, a la vegada, noves formes. La vida té una tendència a ascendir, s'assembla a una torre immensa que creix i creix; cada nova posició serveix de trampolí per la següent; vist d'aquesta manera podem entendre que la voluntat de poder no és la tendència a parar-se en una posició ja conquerida, sinó sempre voluntat de superació, tendència afirmativa i expansiva, impuls continu a ultrapassar-se a si mateix.<\/p>\n<p>Analitzant l'expressió podem extreure'n que la paraula voluntat suggereix que la primera cosa no és el \"logos\" (la consciència, la intel·ligència); aquest, com tot allò que posseeix una forma definida, és secundari i efímer. La paraula poder també pertany a un ordre secundari, perquè no és poder a seques, sinó voluntat de poder, és a dir, voluntat sense forma que busca definir-se i amb el màxim de força, d'energia vital, no només per conservar-se en l'ésser sinó per dominar i créixer. L'exemple més clar al que recorre Nietzsche per evocar el protagonista de la voluntat de poder és l'artista creador que dona forma a la matèria; en el camp de la creació artística es veu més clar com l'autèntic creador de noves formes s'ensenyoreja del seu camp sense cap esforç per exemple, Picasso no obligava ningú a pintar com ell, però després d'ell és gairebé impossible ignorar-lo. Resumint, la voluntat de poder representar l'impuls per \"crear noves formes de vida i això comporta la destrucció de les formes ja esgotades, decadents o reactives que es resisteixen a morir\".<\/p>\n<h3 id=\"s5-2\"><span class=\"n\">5.2<\/span>L'etern retorn<\/h3>\n<p>Darrere l'expressió \"etern retorn\" s'amaga el pensament més profund de la filosofia de Nietzsche, ell mateix s'hi va acostar amb por i excitació quan en va fer l'exposició. La primera intuïció la va tenir el 1881 i en el primer text on apareix és a l'aforisme 341 de la Gaia ciència, però l'explicació completa la dona al llibre III d'Així parlà Zaratustra, al discurs titulat \"De la visió i de l'enigma\".<\/p>\n<p>Aquest concepte és presentat per Nietzsche com el resultat d'una intuïció inesperada, segons la qual \"el temps no té fi; l'esdevenir no té finalitat\", és a dir, el temps no és lineal, no va ni cap a una finalitat transcendent (cristianisme) ni cap a una d'immanent (historicisme). El cristianisme havia parlat d'un temps lineal, segons el qual hi havia un principi i un final en el més enllà; l'historicisme havia dit el mateix, però considerava que la finalitat es realitzaria en el món d'aquí. Tot això significa, per a Nietzsche, que l'home occidental sempre ha estat presoner d'una concepció del temps en la qual tot tendeix cap a una meta i els diversos moments del procés són només això: moments que únicament tenen sentit en funció dels altres. Una visió així, implica que el passat és irreversible, que no el podem rectificar, que si el rebutgem només ho fem d'una manera il·lusòria.<\/p>\n<p>Però, i el futur?, el futur és un esdeveniment encara per arribar, encara obert, però que ens impedeix gaudir del present i viure feliçment. Contra aquest plantejament Nietzsche accepta l'eternitat del temps. Quines conseqüències implica pensar que passat i futur són eterns? Si és veritat que existeix un passat etern, tot el que pot succeir, ja ha d'haver succeït, en ell no hi pot faltar res, perquè si és etern ho ha de contenir tot, una eternitat passada no pot ser imperfecta. I si és veritat que el futur és etern, llavors ha de ser veritat que en ell han de transcórrer tots els esdeveniments que es donen en el temps, per la mateixa raó que abans, perquè una eternitat futura no pot ser imperfecta. Però aquí hi trobem un absurd, sí passat i futur són eterns, llavors cadascun d'ells s'ha de concebre com el temps total, és a dir, hem de pensar que hi ha d'haver dues vegades el mateix temps. En això rau l'absurd: dues vegades el mateix temps! Per això, Nietzsche, retornant a Heràclit, ens proposa una visió cíclica del temps: si és que el temps, en tant que passat i en tant que futur, és el temps total, llavors totes les coses que es donen dins del temps han d'haver transcorregut sempre i transcorreran sempre en el futur.<\/p>\n<p>Cada instant viscut, cada plaer, cada dolor han existit infinites vegades i tornaran a existir eternament infinites vegades. Però, si això és cert, no som aleshores presoners d'una concepció fatalista del temps? És cert que la idea de l'etern retorn pot interpretar-se d'aquesta manera, ja que si tot el que esdevé és repetició de l'anterior, llavors el futur és fix, no hi haurà res de nou, ja que tot està decidit. Ara bé, també es pot interpretar a l'inrevés, des d'una total i absoluta llibertat: podríem pensar que encara està tot per fer i que el que fem ara és el que seguirem fent sempre en el futur; des d'aquesta perspectiva, cada instant té un significat que sobrepassa la nostra vida individual, és decisiu i posseeix el seu ple sentit. El moment present mereix ser viscut com si fos etern, perquè la decisió que prenguem ara no només deixa la seva petjada en un futur immediat sinó en tot un futur de repeticions que vindran. Zaratustra defensa la segona interpretació i diu que des d'aquesta perspectiva el poder de crear és immens i així, des del coneixement de l'etern retorn, l'home es transforma en superhome. L'etern retorn només pot ser volgut pel superhome i el superhome només pot donar-se en un món ordenat segons l'etern retorn.<\/p>\n<figure><img loading=\"lazy\" src=\"filo/nietzsche_09.jpg\" alt=\"\"><\/figure>\n<p class=\"cap\"><b>L’etern Retorn<\/b><\/p>", "min": 11}]}]};window.EXTRA={"quiz": {"platon": [{"q": "Què són les Idees per a Plató?", "o": ["Pensaments subjectius de cada persona", "Realitats intel·ligibles, immutables i eternes, model de les coses sensibles", "Còpies mentals de les coses que percebem", "Paraules convencionals per classificar objectes"], "a": 1, "e": "Les Idees formen el món intel·ligible: són reals, universals i immutables, i les coses sensibles en participen (méthexis) o les imiten (mímesi)."}, {"q": "Al mite de la caverna, què simbolitza el Sol?", "o": ["El món sensible", "La Idea del Bé", "L’opinió (dóxa)", "La política"], "a": 1, "e": "El Sol, que il·lumina i fa possible veure, representa la Idea del Bé, la suprema del món intel·ligible."}, {"q": "Què vol dir que conèixer és «recordar» (reminiscència)?", "o": ["Que aprenem només de l’experiència dels sentits", "Que l’ànima va contemplar les Idees abans d’unir-se al cos i les rememora", "Que la memòria és el pitjor camí cap a la veritat", "Que el coneixement depèn de la tradició"], "a": 1, "e": "L’ànima, immortal, va contemplar les Idees; l’aprenentatge és anamnesi, i la dialèctica el mètode per recordar-les."}, {"q": "Al símil de la línia, quin és el grau de coneixement més alt?", "o": ["Imaginació (eikasia)", "Creença (pístis)", "Raonament discursiu (diànoia)", "Intel·ligència (nóesis)"], "a": 3, "e": "La nóesis és el coneixement directe de les Idees per mitjà de la dialèctica, dins del món intel·ligible."}, {"q": "Quines classes té la polis ideal i quina virtut correspon als governants?", "o": ["Productors (valentia), guardians (saviesa), governants (temprança)", "Governants (saviesa), guardians (valentia), productors (temprança)", "Només dues classes: lliures i esclaus", "Governants (justícia), guardians (saviesa), productors (valentia)"], "a": 1, "e": "Els filòsofs governen amb saviesa, els guardians defensen amb valentia i els productors practiquen la temprança. La justícia és que cada classe faci la seva funció."}, {"q": "Com és la relació ànima-cos en el dualisme platònic?", "o": ["L’ànima és mortal i depèn del cos", "L’ànima és immortal i preexistent; el cos n’és una presó", "Ànima i cos són una sola substància", "L’ànima és només una funció del cervell"], "a": 1, "e": "Per a Plató l’ànima és d’origen intel·ligible i immortal; el cos la lliga al món sensible."}], "descartes": [{"q": "Quina és la primera regla del mètode cartesià?", "o": ["Dividir cada dificultat en parts", "L’evidència: no admetre res com a veritable si no es coneix clarament i distinta", "Anar del simple al complex", "Fer enumeracions completes"], "a": 1, "e": "L’evidència (claredat i distinció) és la regla que fonamenta la resta: dividir, ordenar i enumerar."}, {"q": "Per què el dubte cartesià s’anomena «metòdic»?", "o": ["Perquè és un escepticisme definitiu", "Perquè és un instrument per trobar una veritat indubtable, no un fi en si mateix", "Perquè dubta només de la religió", "Perquè s’aplica només a la matemàtica"], "a": 1, "e": "Descartes dubta de tot el que admet el mínim dubte (sentits, somni, geni maligne) per trobar un punt ferm."}, {"q": "Quina és la primera veritat indubtable?", "o": ["Déu existeix", "El món exterior existeix", "Penso, per tant existeixo (cogito)", "Les matemàtiques són certes"], "a": 2, "e": "Fins i tot si m’enganyés un geni maligne, per ser enganyat he d’existir com a ésser que pensa."}, {"q": "Quins tres tipus d’idees distingeix Descartes?", "o": ["Simples, complexes i abstractes", "Adventícies, factícies i innates", "Impressions, idees i hàbits", "Sensibles, imaginades i reals"], "a": 1, "e": "Adventícies (vénen de fora), factícies (les construïm) i innates (el pensament les té de naixement, com la de Déu)."}, {"q": "Quines substàncies estableix Descartes?", "o": ["Només la pensant", "Pensant (res cogitans), extensa (res extensa) i infinita (Déu)", "Només la matèria", "Cos, ànima i esperit sant"], "a": 1, "e": "Substància pensant, extensa i infinita. L’ésser humà és unió de dues substàncies finites: ànima i cos."}, {"q": "Quin paper té la veracitat divina?", "o": ["Garanteix que el que percebem amb claredat i distinció és cert", "Demostra que el cogito és fals", "Substitueix el mètode", "Explica el moviment de la matèria"], "a": 0, "e": "Un Déu perfecte no pot ser enganyador; per això es pot confiar en les idees clares i distintes i recuperar el món exterior."}], "locke": [{"q": "Quin és l’origen del coneixement segons Locke?", "o": ["Les idees innates", "L’experiència", "La raó pura", "La revelació"], "a": 1, "e": "Locke defensa l’empirisme i rebutja les idees innates: la ment és un full en blanc (tabula rasa)."}, {"q": "Quines són les dues fonts de les idees?", "o": ["Raó i fe", "Sensació i reflexió", "Memòria i imaginació", "Intuïció i deducció"], "a": 1, "e": "La sensació dóna idees dels objectes externs; la reflexió, de les operacions de la pròpia ment."}, {"q": "Quines són qualitats primàries?", "o": ["Color, gust i olor", "Extensió, figura, moviment i solidesa", "Dolçor i calor", "Bellesa i bondat"], "a": 1, "e": "Les primàries són en els objectes i són objectives; les secundàries (color, gust, olor) són efectes en nosaltres."}, {"q": "Com és l’estat de natura segons Locke?", "o": ["Una guerra de tots contra tots", "Un estat de llibertat i igualtat regit per la llei natural", "Un estat de monarquia absoluta", "Un estat sense drets"], "a": 1, "e": "Hi ha drets naturals (vida, llibertat i propietat) que cal protegir; no és un estat de guerra com en Hobbes."}, {"q": "Per què s’origina l’estat segons Locke?", "o": ["Per la força d’un sobirà", "Per un pacte per protegir els drets naturals i resoldre conflictes", "Per designi diví", "Per tradició"], "a": 1, "e": "El pacte social crea un govern limitat; si és tirànic, es pot exercir el dret de resistència."}, {"q": "Què diu Locke de la substància?", "o": ["Que la coneixem perfectament", "Que és un substrat desconegut que suposem sota les qualitats", "Que no existeix", "Que només existeix l’esperit"], "a": 1, "e": "La substància és un «no sé què» que suposem que sustenta les qualitats; no en tenim una idea clara."}], "hume": [{"q": "Què són les impressions i les idees?", "o": ["Les idees són més vives que les impressions", "Les impressions són percepcions vives; les idees, còpies tènues d’elles", "Totes dues són innates", "Són sinònims"], "a": 1, "e": "Principi de còpia: tota idea deriva d’una impressió prèvia. Si no n’hi ha, la idea no té contingut."}, {"q": "Quins dos tipus de coneixement distingeix?", "o": ["A priori i sintètic", "Relacions d’idees i qüestions de fet", "Racionalisme i empirisme", "Sensible i intel·ligible"], "a": 1, "e": "Les relacions d’idees (matemàtiques) són necessàries; les qüestions de fet (experiència) són contingents."}, {"q": "Què és la causalitat per a Hume?", "o": ["Una connexió necessària observable", "Una expectativa creada per l’hàbit davant la conjunció constant d’esdeveniments", "Un principi innat", "Una llei del món noümènic"], "a": 1, "e": "No percebem cap connexió necessària, només successió regular; l’hàbit ens fa esperar l’efecte."}, {"q": "Què és el «jo» per a Hume?", "o": ["Una substància pensant", "Un feix de percepcions en flux continu", "Una ànima immortal", "Una idea innata"], "a": 1, "e": "No hi ha impressió d’un jo permanent; només percepcions successives."}, {"q": "Quin és el fonament de la moral per a Hume?", "o": ["La raó", "El sentiment (simpatia)", "La voluntat de Déu", "La llei natural"], "a": 1, "e": "La raó és «esclava de les passions»; els judicis morals neixen del sentiment d’aprovació o rebuig."}, {"q": "Quins són els principis d’associació d’idees?", "o": ["Semblança, contigüitat i causalitat", "Identitat, no contradicció i raó suficient", "Sensació, reflexió i memòria", "Dubte, certesa i evidència"], "a": 0, "e": "Semblança, contigüitat en l’espai o el temps, i causa-efecte."}], "kant": [{"q": "Què és un judici sintètic a priori?", "o": ["Un judici que ampliï el coneixement i sigui universal i necessari", "Un judici merament analític", "Un judici basat només en l’experiència", "Un judici contradictori"], "a": 0, "e": "Amplia el coneixement (sintètic) i no depèn de l’experiència (a priori). Fonamenta matemàtiques i física."}, {"q": "En què consisteix la «revolució copernicana» de Kant?", "o": ["En defensar l’heliocentrisme", "En afirmar que l’objecte es regeix pel subjecte i no a l’inrevés", "En rebutjar l’experiència", "En negar la raó"], "a": 1, "e": "El subjecte aporta les formes (espai, temps, categories) amb què coneixem els fenòmens."}, {"q": "Quines facultats té el coneixement?", "o": ["Memòria, imaginació i voluntat", "Sensibilitat, enteniment i raó", "Sensació, reflexió i hàbit", "Intuïció, deducció i fe"], "a": 1, "e": "Sensibilitat (espai i temps), enteniment (categories) i raó (idees d’ànima, món i Déu)."}, {"q": "Què és el noümen?", "o": ["El que percebem amb els sentits", "La cosa en si, que no podem conèixer", "Un tipus de categoria", "Una forma de la sensibilitat"], "a": 1, "e": "Només coneixem fenòmens; el noümen és el límit del coneixement."}, {"q": "Com es diferencia l’imperatiu categòric de l’hipotètic?", "o": ["El categòric mana incondicionalment; l’hipotètic condiciona l’acció a una finalitat", "El categòric depèn de l’interès", "Són iguals", "L’hipotètic és universal"], "a": 0, "e": "«Actua només segons una màxima que puguis voler com a llei universal.» L’hipotètic: «si vols X, fes Y»."}, {"q": "Què exigeix la fórmula de la humanitat?", "o": ["Obrar segons la utilitat", "Tractar la humanitat sempre com a fi i mai només com a mitjà", "Obeir la llei positiva", "Buscar la felicitat màxima"], "a": 1, "e": "La persona té dignitat, no preu, i mai no pot ser reduïda a simple instrument."}], "mill": [{"q": "Què afirma el principi d’utilitat?", "o": ["Una acció és bona si compleix un deure", "Una acció és bona en la mesura que promou la felicitat i dolenta si promou el contrari", "Una acció és bona si obeeix Déu", "Una acció és bona si és legal"], "a": 1, "e": "Utilitarisme: la felicitat (plaer i absència de dolor) és l’únic fi desitjable en si mateix."}, {"q": "Què defensa Mill sobre la qualitat dels plaers?", "o": ["Tots valen igual", "Els plaers intel·lectuals són superiors als merament corporals", "Només importa la quantitat", "Cal evitar tots els plaers"], "a": 1, "e": "«Millor Sòcrates insatisfet que un porc satisfet»: els qui coneixen ambdós prefereixen els superiors."}, {"q": "Quin és el principi del dany?", "o": ["La llibertat només es pot limitar per evitar el dany als altres", "La llibertat no té límits", "L’Estat ha de decidir què és bo per a cadascú", "Cal prohibir tot allò perillós per a un mateix"], "a": 0, "e": "Només es pot limitar la llibertat d’algú per impedir que perjudiqui altres, no pel seu propi bé."}, {"q": "Per què defensa la llibertat d’expressió?", "o": ["Perquè totes les opinions són certes", "Perquè silenciar una opinió, sigui falsa o certa, perjudica la recerca de la veritat", "Perquè afavoreix el govern", "Perquè ho exigeix la tradició"], "a": 1, "e": "Una opinió falsa pot contenir una part de veritat, i una veritat no discutida es converteix en dogma."}, {"q": "Què entén per «tirania de la majoria»?", "o": ["El govern d’un sol", "La pressió social i política de la majoria sobre l’individu i la minoria", "La democràcia directa", "Un tipus de monarquia"], "a": 1, "e": "Cal protegir l’individualitat i la diversitat davant la conformitat imposada per l’opinió pública."}, {"q": "Per què és l’utilitarisme conseqüencialista, a diferència de Kant?", "o": ["Perquè jutja les accions per les seves conseqüències", "Perquè jutja pel deure", "Perquè ignora la felicitat", "Perquè rebutja tota norma"], "a": 0, "e": "Kant defensa una ètica deontològica (el deure); Mill valora les conseqüències en termes de felicitat."}], "nietzsche": [{"q": "Què representen l’apol·lini i el dionisíac?", "o": ["Dos sistemes polítics", "L’ordre, la mesura i la forma enfront de l’embriaguesa, l’instint i la vida", "Dos tipus de coneixement científic", "Dues virtuts cristianes"], "a": 1, "e": "Dues forces de l’art grec; Nietzsche reivindica el dionisíac, que la tradició va reprimir."}, {"q": "Què significa «Déu ha mort»?", "o": ["Una afirmació teològica", "Que la fe en el Déu cristià i els valors suprems ha perdut credibilitat", "Que els homes són déus", "Que la ciència prova Déu"], "a": 1, "e": "És un diagnòstic cultural: s’enfonsa el fonament dels valors occidentals i apareix el nihilisme."}, {"q": "Què és la moral d’esclaus?", "o": ["La moral dels forts i creadors", "La moral nascuda del ressentiment dels febles, que inverteix els valors", "La moral militar", "La moral kantiana"], "a": 1, "e": "Els febles converteixen en virtuts la humilitat i la compassió; els amos defineixen «bo» des de l’afirmació de si."}, {"q": "Qui és el superhome?", "o": ["Un tirà", "Qui crea nous valors i afirma la vida i la terra", "Un sant cristià",
