:root{
  --bg:#ffffff; --fg:#111111; --muted:#68646e; --line:#e7e3ee; --soft:#f6f3fa; --strong:#111111; --on:#ffffff;
  --red:#c8102e;
  --acc:#6d28d9; --acc-ink:#6d28d9; --on-acc:#ffffff; --acc-soft:#efe8fb;
  --warn:#f2b705;
  --lab-bg:#f3effa; --lab-line:#c9b8ec;
  --disp:"Inter Tight","Helvetica Neue",Arial,sans-serif; --sans:"IBM Plex Sans",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace; --serif:"IBM Plex Serif",Georgia,serif;
  --lgA:url("img/logo-a.webp"); --lgB:url("img/logo-b.webp");
  --figf:none;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e0c12;--fg:#f2eff6;--muted:#a49fb0;--line:#2a2535;--soft:#17131f;--strong:#f2eff6;--on:#0e0c12;--red:#ff4d63;--acc:#a78bfa;--acc-ink:#b9a2fb;--on-acc:#120826;--acc-soft:#221a38;--lab-bg:#17121f;--lab-line:#3a2f55;--figf:invert(.9) hue-rotate(180deg);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e0c12;--fg:#f2eff6;--muted:#a49fb0;--line:#2a2535;--soft:#17131f;--strong:#f2eff6;--on:#0e0c12;--red:#ff4d63;--acc:#a78bfa;--acc-ink:#b9a2fb;--on-acc:#120826;--acc-soft:#221a38;--lab-bg:#17121f;--lab-line:#3a2f55;--figf:invert(.9) hue-rotate(180deg);color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth;scroll-padding-top:84px}
body{background:var(--bg);color:var(--fg);font:15px/1.6 var(--sans);margin:0;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
a{color:inherit;text-decoration:none}
.gut{padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.wrap{max-width:1120px;margin:0 auto}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:6px}
.logo{position:relative;display:block;aspect-ratio:900/458}
.logo::before,.logo::after{content:"";position:absolute;inset:0}
.logo::before{background:var(--fg);-webkit-mask:var(--lgA) center/contain no-repeat;mask:var(--lgA) center/contain no-repeat}
.logo::after{background:var(--red);-webkit-mask:var(--lgB) center/contain no-repeat;mask:var(--lgB) center/contain no-repeat}

/* cabecera */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hdr .wrap{display:flex;align-items:center;gap:14px;height:62px}
.hdr .logo{height:44px;flex:none;width:auto}
.hdr .sub{font:800 15px var(--disp);letter-spacing:-.02em;color:var(--acc-ink);display:flex;align-items:center;gap:8px;white-space:nowrap}
.hdr .sub::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--acc)}
nav.main{display:flex;gap:2px;margin-left:auto;overflow-x:auto;scrollbar-width:none}
nav.main::-webkit-scrollbar{display:none}
nav.main a{display:inline-flex;align-items:center;font-size:14px;padding:7px 12px;border-radius:999px;white-space:nowrap;color:var(--muted)}
nav.main a:hover{color:var(--fg);background:var(--soft)}
nav.main a[aria-current="page"]{color:var(--fg);background:var(--acc-soft);font-weight:600}
.ico{flex:none;width:36px;height:36px;border-radius:999px;border:1px solid var(--line);background:none;color:var(--fg);display:grid;place-items:center;cursor:pointer}
.ico svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.6}
.ico:hover{border-color:var(--acc)}
@media (max-width:760px){.hdr .sub{display:none}.hdr .logo{height:38px}nav.main a{padding:7px 9px}}

h1,h2,h3{font-family:var(--disp);letter-spacing:-.03em;text-wrap:balance;margin:0}
.lbl{font:500 11.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 20px;border-radius:999px;border:1.5px solid var(--fg);font-weight:600;font-size:14.5px;cursor:pointer;background:none;color:var(--fg);font-family:inherit}
.btn:hover{background:var(--soft)}
.btn.acc{background:var(--acc);border-color:var(--acc);color:var(--on-acc)}
.btn.acc:hover{opacity:.88}
.btn.sm{min-height:36px;padding:0 14px;font-size:13.5px}

/* portada */
.hero{padding-block:clamp(40px,7vw,80px) clamp(28px,5vw,48px);border-bottom:1px solid var(--line);background:linear-gradient(180deg,var(--acc-soft),var(--bg))}
.hero .grid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:40px;align-items:center}
@media (max-width:860px){.hero .grid{grid-template-columns:1fr}}
.hero h1{font-size:clamp(46px,9vw,92px);font-weight:800;line-height:.95;margin:10px 0 16px;color:var(--acc-ink)}
.hero p.lead{font-size:17px;color:var(--muted);max-width:52ch;margin:0 0 24px}
.hero .cta{display:flex;flex-wrap:wrap;gap:10px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat{padding:16px 18px;border:1px solid var(--line);border-radius:14px;background:var(--bg)}
.stat b{display:block;font:800 36px/1 var(--disp);letter-spacing:-.05em;color:var(--acc-ink)}
.stat span{font-size:13px;color:var(--muted)}
section.blk{padding-block:40px 8px}
.sh{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.sh h2{font-size:24px;font-weight:700}
.find{width:min(320px,100%);min-height:40px;border:1px solid var(--line);border-radius:999px;padding:0 16px;background:var(--bg);color:var(--fg);font:inherit;font-size:14px}
.find:focus{outline:2px solid var(--acc);border-color:var(--acc)}

/* índice de temas */
.tlist{border-top:1px solid var(--line)}
.tema{border-bottom:1px solid var(--line)}
.tema>summary{list-style:none;display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:14px;align-items:center;padding:16px 4px;cursor:pointer}
.tema>summary::-webkit-details-marker{display:none}
.tema>summary:hover{background:var(--soft)}
.tema .ab{font:800 30px var(--disp);letter-spacing:-.05em;color:var(--acc-ink)}
.tema .tt b{display:block;font:700 18px var(--disp);letter-spacing:-.02em}
.tema .tt small{color:var(--muted);font-size:13px}
.tema .chev{width:22px;height:22px;transition:transform .15s;color:var(--muted)}
.tema[open] .chev{transform:rotate(90deg)}
.tema .body{padding:2px 4px 22px 78px;display:grid;gap:4px}
@media (max-width:560px){.tema>summary{grid-template-columns:44px minmax(0,1fr) auto}.tema .ab{font-size:24px}.tema .body{padding-left:8px}}
.sec{display:grid;grid-template-columns:34px minmax(0,1fr);gap:8px;padding:8px 10px;border-radius:10px}
.sec:hover{background:var(--acc-soft)}
.sec .nn{font:600 13px var(--mono);color:var(--acc-ink);padding-top:2px}
.sec b{font-weight:600}
.sec .subs{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{display:inline-flex;align-items:center;gap:6px;font:500 12.5px var(--mono);padding:6px 12px;border-radius:999px;border:1px solid var(--lab-line);background:var(--lab-bg);color:var(--acc-ink)}
.chip:hover{background:var(--acc);color:var(--on-acc);border-color:var(--acc)}

/* laboratorios (tarjetas) */
.labgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.labc{display:flex;flex-direction:column;gap:6px;padding:18px;border:1px solid var(--lab-line);border-radius:14px;background:var(--lab-bg);transition:transform .15s,border-color .15s}
.labc:hover{border-color:var(--acc);transform:translateY(-2px)}
.labc .k{font:600 11.5px var(--mono);letter-spacing:.08em;color:var(--acc-ink);text-transform:uppercase}
.labc b{font:700 18px/1.2 var(--disp);letter-spacing:-.02em}
.labc p{margin:0;color:var(--muted);font-size:13.5px}
.labc i{font-style:normal;font-weight:600;font-size:13.5px;color:var(--acc-ink);margin-top:auto;padding-top:8px}

/* página de tema / apuntes */
.ph{padding-block:clamp(28px,5vw,48px) 22px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--acc) 7%,var(--bg))}
.crumbs{display:flex;gap:6px;flex-wrap:wrap;font:500 12.5px var(--mono);color:var(--muted);margin-bottom:12px}
.crumbs a:hover{color:var(--fg);text-decoration:underline}
.ph h1{font-size:clamp(30px,5.5vw,52px);font-weight:800}
.ph .ab{font:800 14px var(--mono);color:var(--acc-ink);letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px;display:block}
.tabs{display:flex;gap:4px;margin-top:20px;overflow-x:auto;scrollbar-width:none}
.tabs a{padding:8px 14px;font-weight:500;color:var(--muted);border-radius:999px;white-space:nowrap;font-size:14px}
.tabs a:hover{color:var(--fg);background:var(--soft)}
.tabs a[aria-current="page"]{color:var(--on-acc);background:var(--acc);font-weight:600}
.layout{display:grid;grid-template-columns:240px minmax(0,1fr);gap:48px;padding-block:32px}
@media (max-width:960px){.layout{grid-template-columns:1fr;gap:16px}}
aside.toc{position:sticky;top:84px;align-self:start;max-height:calc(100vh - 100px);overflow:auto;font-size:13.5px}
@media (max-width:960px){aside.toc{position:static;max-height:none}}
.toc h4,.toc .toch{font:600 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.toc a{display:block;padding:5px 10px;border-left:2px solid var(--line);color:var(--muted)}
.toc a:hover{color:var(--fg)}
.toc a.on{color:var(--acc-ink);border-color:var(--acc);font-weight:600}
.toc a.s2{padding-left:22px;font-size:12.5px}
.toc .gap{height:10px}
.tocd>summary{cursor:pointer;font-weight:600;padding:8px 0;list-style:none}
.tocd>summary::-webkit-details-marker{display:none}
@media (min-width:961px){.tocd>summary{display:none}}
.note-main{min-width:0}
.pg-title{font-size:clamp(26px,4.2vw,38px);font-weight:800;margin-bottom:6px}
.pg-title .n{color:var(--acc-ink);margin-right:10px}

/* prosa */
.prose{font-size:16px;line-height:1.7;max-width:76ch}
.prose p{margin:0 0 14px}
.prose h3{font-size:21px;font-weight:700;margin:34px 0 10px;scroll-margin-top:84px}
.prose h3 .n{font:600 14px var(--mono);color:var(--acc-ink);margin-right:10px}
.prose ul,.prose ol{padding-left:22px;margin:0 0 14px}
.prose li{margin-bottom:6px}
.prose li::marker{color:var(--acc-ink)}
.prose strong{font-weight:600}
.prose blockquote{margin:18px 0;padding:14px 18px;border-left:4px solid var(--acc);background:var(--acc-soft);border-radius:0 12px 12px 0}
.prose blockquote p:last-child{margin-bottom:0}
.prose p.tip{padding:12px 16px;border-radius:12px;background:color-mix(in srgb,var(--warn) 16%,var(--bg));border:1px solid color-mix(in srgb,var(--warn) 45%,var(--bg))}
.prose p.note{color:var(--muted);font-size:14.5px}
.prose code{font:13px var(--mono);background:var(--soft);padding:1px 5px;border-radius:5px}
.tbl{overflow-x:auto;margin:16px 0;max-width:100%}
.prose table{border-collapse:collapse;font-size:14.5px;min-width:100%}
.prose th,.prose td{border-bottom:1px solid var(--line);padding:9px 12px;text-align:left;vertical-align:top}
.prose th{font:600 12px var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);border-bottom:2px solid var(--acc)}
.prose figure{margin:22px 0;padding:14px;border:1px solid var(--line);border-radius:14px;background:#fff;text-align:center}
.prose figure img{max-width:100%;height:auto;filter:var(--figf);display:inline-block}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .prose figure{background:#14111b}}
:root[data-theme="dark"] .prose figure{background:#14111b}
.prose figcaption{font-size:13.5px;color:var(--muted);margin-top:10px;text-align:left}
.prose figcaption b{color:var(--fg)}
.katex{font-size:1.06em}
.katex-display{overflow-x:auto;overflow-y:hidden;padding:4px 0;margin:14px 0}
.labcard{display:grid;gap:4px;margin:20px 0;padding:16px 20px;border:1.5px solid var(--lab-line);border-radius:14px;background:var(--lab-bg);transition:border-color .15s}
.labcard:hover{border-color:var(--acc)}
.labcard .k{font:600 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--acc-ink)}
.labcard b{font:600 16px/1.35 var(--sans)}
.labcard i{font-style:normal;font-size:13.5px;font-weight:600;color:var(--acc-ink)}

/* problemas */
.prob{border:1px solid var(--line);border-radius:14px;margin:0 0 16px;overflow:hidden}
.prob>h3{font-size:16px;padding:12px 18px;background:var(--acc-soft);margin:0!important}
.prob .st{padding:14px 18px 6px}
.prob details{border-top:1px dashed var(--line)}
.prob summary{cursor:pointer;padding:12px 18px;font-weight:600;color:var(--acc-ink);list-style:none}
.prob summary::-webkit-details-marker{display:none}
.prob summary::before{content:"▸ ";}
.prob details[open] summary::before{content:"▾ "}
.prob .so{padding:0 18px 8px}

/* pager */
.pager{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:40px;max-width:76ch}
.pager a{display:flex;flex-direction:column;gap:2px;padding:14px 16px;border:1px solid var(--line);border-radius:12px}
.pager a:hover{border-color:var(--acc);background:var(--acc-soft)}
.pager a.nx{text-align:right;grid-column:2}
.pager small{font:500 11px var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.pager b{font-weight:600;font-size:14.5px}

/* laboratorio 3D */
.labwrap{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start}
@media (max-width:900px){.labwrap{grid-template-columns:minmax(0,1fr)}}
.stage{width:100%;min-width:0;position:relative;border:1px solid var(--lab-line);border-radius:16px;overflow:hidden;background:var(--lab-bg);aspect-ratio:16/10;min-height:300px;touch-action:none}
@media (max-width:900px){.stage{aspect-ratio:4/3}}
.stage canvas{display:block;width:100%;height:100%;cursor:grab;touch-action:none}
.stage canvas:active{cursor:grabbing}
.stage .hint{position:absolute;left:12px;bottom:10px;font:500 11.5px var(--mono);color:var(--muted);pointer-events:none;background:color-mix(in srgb,var(--bg) 75%,transparent);padding:3px 8px;border-radius:999px}
.stage .nogl{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:var(--muted)}
.panel{border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:14px;background:var(--bg)}
.modes{display:flex;flex-wrap:wrap;gap:6px}
.modes button{font:500 13px var(--sans);padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:none;color:var(--muted);cursor:pointer}
.modes button[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:var(--on-acc);font-weight:600}
.ctl{display:grid;gap:4px}
.ctl label{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--muted)}
.ctl label output{font:600 13px var(--mono);color:var(--fg)}
.ctl input[type=range]{width:100%;accent-color:var(--acc);height:28px}
.ctl select{font:inherit;min-height:36px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg);padding:0 8px}
.rd{display:grid;gap:0;border-top:1px solid var(--line);margin:0}
.rd div{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.rd dt{color:var(--muted)}
.rd dd{margin:0;font:600 13px var(--mono);text-align:right}
.panel .row2{display:flex;gap:8px;flex-wrap:wrap}
.labtext{margin-top:20px;max-width:76ch;color:var(--muted)}
.labtext b{color:var(--fg)}
.wave2d{width:100%;height:90px;border:1px solid var(--line);border-radius:10px;background:var(--bg);display:block}

/* formulari / apunts */
.fgroup{margin-bottom:44px}
.fgroup>h2{font-size:24px;padding-bottom:10px;border-bottom:2px solid var(--acc);margin-bottom:6px}
.fgroup>h2 span{color:var(--acc-ink);margin-right:10px;font-family:var(--mono);font-size:15px}
.pdfbox{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px;padding:20px 22px;border:1.5px solid var(--lab-line);border-radius:16px;background:var(--lab-bg)}
.pdfbox b{font:700 18px var(--disp)}
.pdfbox p{margin:2px 0 0;color:var(--muted);font-size:13.5px}
footer{border-top:1px solid var(--line);margin-top:64px}
footer .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px 32px;padding-block:24px 32px;font-size:12.5px;color:var(--muted)}
footer .logo{height:48px;width:auto}
footer a.u{text-decoration:underline;text-underline-offset:3px;color:var(--fg)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

/* desplegable de temas */
.dd{position:relative;flex:none}
.ddb{display:inline-flex;align-items:center;gap:8px;font:600 14px var(--sans);padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--fg);cursor:pointer}
.ddb:hover,.ddb[aria-expanded="true"]{background:var(--soft)}
.ddb .dot{width:8px;height:8px;border-radius:50%;background:var(--acc)}
.chev{width:7px;height:7px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(45deg) translateY(-2px);transition:transform .15s}
.ddb[aria-expanded="true"] .chev{transform:rotate(225deg) translateY(-1px)}
.ddp{position:absolute;left:0;top:calc(100% + 10px);width:340px;max-height:min(72vh,640px);overflow-y:auto;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:6px;box-shadow:0 18px 40px -18px rgba(0,0,0,.35);display:flex;flex-direction:column;z-index:40}
.ddp[hidden]{display:none}
.ddp .ddh{font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:8px 10px 6px}
.ddp a{display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:10px;color:var(--fg);text-decoration:none}
.ddp a:hover{background:var(--soft)}
.ddp a[aria-current="page"]{background:var(--acc-soft,var(--soft))}
.ddp b{flex:none;font:800 20px/1 var(--disp);width:28px;text-align:center;color:var(--acc-ink)}
.ddp span{display:flex;flex-direction:column;min-width:0}
.ddp strong{font-weight:600;font-size:14px;line-height:1.25}
.ddp small{color:var(--muted);font-size:12.5px;line-height:1.3}
@media (max-width:640px){.dd{position:static}.ddp{position:fixed;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));width:auto;top:calc(env(safe-area-inset-top,0px) + 66px)}}
.hdr .dd{margin-left:4px}

/* ===== colors per tema ===== */
#view,[style*="--h"]{--th:hsl(var(--h,262) 62% 29%);--th-soft:hsl(var(--h,262) 80% 95%);--th-line:hsl(var(--h,262) 50% 80%)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) #view,:root:not([data-theme="light"]) [style*="--h"]{--th:hsl(var(--h,262) 78% 72%);--th-soft:hsl(var(--h,262) 30% 16%);--th-line:hsl(var(--h,262) 25% 32%)}}
:root[data-theme="dark"] #view,:root[data-theme="dark"] [style*="--h"]{--th:hsl(var(--h,262) 78% 72%);--th-soft:hsl(var(--h,262) 30% 16%);--th-line:hsl(var(--h,262) 25% 32%)}
.ph{background:var(--th-soft);border-bottom:1px solid var(--th-line)}
.ph .th{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.tbadge{display:inline-flex;align-items:baseline;gap:6px;font:600 12px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:#fff;background:var(--th);padding:6px 12px;border-radius:999px;white-space:nowrap}
:root[data-theme="dark"] .tbadge,:root:not([data-theme="light"]) .tbadge{color:#111}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .tbadge{color:#fff}}
.tbadge b{font:800 17px var(--disp);letter-spacing:-.02em}
.tbadge.sm{padding:4px 10px;font-size:11px}
.ph h1{font-size:clamp(28px,5vw,46px)}
.tabs a[aria-current="page"]{background:var(--th);color:#fff}
:root[data-theme="dark"] .tabs a[aria-current="page"]{color:#111}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tabs a[aria-current="page"]{color:#111}}
.crumbs span{opacity:.6}
.eyebrow{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.eyebrow .ap{font:500 12px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.pg-title{padding-bottom:14px;border-bottom:3px solid var(--th);margin-bottom:22px}
aside.toc .tcard{display:flex;align-items:center;gap:10px;border:1px solid var(--th-line);border-left:4px solid var(--th)!important;background:var(--th-soft);border-radius:10px;padding:10px 12px;margin-bottom:16px;color:var(--fg)!important}
.tcard .tn{font:800 15px var(--disp);color:var(--th)}
.tcard b{font:700 13.5px/1.25 var(--disp)}
.toc a{border-left-width:3px}
.toc a .sn{display:inline-block;min-width:18px;font:600 11.5px var(--mono);color:var(--th);margin-right:4px}
.toc a.on{color:var(--fg);border-color:var(--th);background:var(--th-soft);font-weight:600}
.toc a.on .sn{color:var(--th)}
.toc a.s2{border-left-color:var(--th-line)}
.prose h3{padding:2px 0 2px 14px;border-left:4px solid var(--th);margin:36px 0 12px}
.prose h3 .n{display:inline-block;background:var(--th-soft);color:var(--th);border:1px solid var(--th-line);border-radius:6px;padding:1px 7px;margin-right:10px;font-size:13px}
.prose blockquote{border-left-color:var(--th);background:var(--th-soft)}
.prose th{border-bottom-color:var(--th)}
.prose li::marker{color:var(--th)}
.pager a:hover{border-color:var(--th);background:var(--th-soft)}
.tema .ab{color:var(--th)}
.tema[open]>summary{background:var(--th-soft)}
.tema .sec:hover{background:var(--th-soft)}
.tema .sec .nn{color:var(--th)}
.tema{border-left:4px solid transparent}.tema[open]{border-left-color:var(--th)}
.chip{border-color:var(--th-line);background:var(--th-soft);color:var(--fg)}
.chip:hover{background:var(--th);color:#fff;border-color:var(--th)}
.apl{display:grid;gap:12px;border-top:0}
.sec.big{grid-template-columns:44px minmax(0,1fr);gap:14px;padding:16px 18px;border:1px solid var(--th-line);border-radius:14px;background:var(--bg)}
.sec.big:hover{background:var(--th-soft);border-color:var(--th)}
.sec.big .nn{font:800 34px/1 var(--disp);letter-spacing:-.05em;color:var(--th);padding-top:0}
.sec.big .ap{display:block;font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.sec.big b{font:700 19px var(--disp);letter-spacing:-.02em}
.sec.big .lb{display:inline-block;margin-top:8px;font:600 12px var(--mono);color:var(--th)}
.chips.big{margin-top:20px}
.fgroup>h2{border-bottom-color:var(--th)}
.fgroup>h2 span{color:var(--th)}
.ddp b{color:var(--th)}
.ddp a[aria-current="page"]{background:var(--th-soft)}
.hdr .dd{margin-left:4px}

/* ===== experiment 3D dins dels apunts ===== */
.inlab{margin:30px 0;border:1.5px solid var(--th-line);border-radius:18px;background:var(--lab-bg);overflow:hidden;max-width:none}
.inlab>header{padding:16px 20px 14px;display:grid;gap:3px;background:var(--th-soft);border-bottom:1px solid var(--th-line)}
.inlab .k{font:600 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--th)}
.inlab h4{margin:0;font:700 19px/1.2 var(--disp);letter-spacing:-.02em}
.inlab header p{margin:2px 0 0;color:var(--muted);font-size:14.5px;line-height:1.45}
.labslot{min-height:120px;display:grid;place-items:center;padding:0}
.labslot>.labgo{margin:36px}
.inlab .labwrap{display:block;width:100%}
.inlab .stage{border:0;border-radius:0;aspect-ratio:16/9;min-height:300px;max-height:560px;background:radial-gradient(120% 100% at 50% 0%,var(--bg) 0%,var(--lab-bg) 70%)}
.inlab .panel{border:0;border-top:1px solid var(--th-line);border-radius:0;background:var(--bg);padding:16px 20px 20px}
@media (max-width:640px){.inlab .stage{aspect-ratio:4/3;min-height:260px}.inlab .panel{padding:14px}}
.stage{background:radial-gradient(120% 100% at 50% 0%,var(--bg) 0%,var(--lab-bg) 70%)}
.tb{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tbb{font:600 12.5px var(--sans);padding:7px 13px;border-radius:999px;border:1px solid var(--line);background:none;color:var(--fg);cursor:pointer}
.tbb:hover{border-color:var(--th,var(--acc))}
.tbb[aria-pressed="true"]{background:var(--th,var(--acc));border-color:var(--th,var(--acc));color:#fff}
.tbb .ic{font-size:9px;margin-right:5px;letter-spacing:-1px}
.spd{margin-left:auto;font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
.spd select{font:inherit;font-size:12.5px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);padding:4px 6px}
.pgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px 28px;align-items:start}
@media (max-width:700px){.pgrid{grid-template-columns:minmax(0,1fr)}}
.pcol{display:grid;gap:14px;align-content:start;min-width:0}
.ctl input[type=range]{accent-color:var(--th,var(--acc))}

.back{display:inline-flex;align-items:center;gap:6px;flex:none;font:600 13.5px var(--sans);padding:7px 13px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--fg);white-space:nowrap}
.back:hover{background:var(--soft);border-color:var(--fg)}
.back[hidden]{display:none}
@media (max-width:560px){.back .bt{display:none}.back{padding:7px 11px}}

/* descàrregues PDF */
.dlcard{display:flex;align-items:center;gap:16px;padding:16px 20px;border:1px solid var(--line);border-radius:16px;background:var(--bg);color:var(--fg);transition:border-color .15s,background .15s,transform .15s}
.dlcard:hover{border-color:var(--acc);background:var(--acc-soft);transform:translateY(-2px)}
.dlcard .dli{flex:none;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--acc);color:var(--on-acc)}
.dlcard .dli svg{width:22px;height:22px}
.dlcard .dlt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}

.dlcard.sm{padding:12px 14px;gap:12px;border-radius:14px}

.dlcard.sm .dli{width:36px;height:36px;border-radius:50%;background:var(--bg);color:var(--fg);border:1px solid var(--line)}
.dlcard.sm .dli svg{width:18px;height:18px}
.dlcard.sm:hover .dli{background:var(--acc);color:var(--on-acc);border-color:var(--acc)}
.dlp{width:44px;height:44px;border-radius:50%;object-fit:cover;object-position:50% 20%;flex:none;border:2px solid var(--th,var(--line));background:var(--soft)}
.dlgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}

.hero+.gut .dlcard{margin-top:28px}

/* simulacre */
.simbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px;margin-top:20px}
.clock{font:700 clamp(30px,6vw,44px) var(--mono);letter-spacing:.02em;margin-right:12px;color:var(--acc-ink);font-variant-numeric:tabular-nums}
.simmsg{margin:12px 0 0;font-weight:600;color:var(--acc-ink)}
.exh{display:flex;align-items:baseline;gap:10px;margin:26px 0 8px;font:800 18px var(--disp);letter-spacing:-.02em}
.exh small{font:500 12px var(--mono);color:var(--muted);letter-spacing:.04em}
.simx .exh:first-child{margin-top:4px}
.selfa{margin-top:36px;padding:18px 20px;border:1px solid var(--line);border-radius:16px;background:var(--soft)}

.sgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.sgrid label{display:flex;flex-direction:column;gap:4px;font:600 12px var(--mono)}
.sgrid input{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);font:inherit;min-width:0}

/* menú de blocs */
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.bcard{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:18px;overflow:hidden;background:var(--bg);transition:transform .15s,border-color .15s,box-shadow .15s}

.bb{display:flex;flex-direction:column;gap:6px;padding:16px 18px 18px}
.bb .bn{font:700 11.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--th)}
.bb b{font:800 22px/1.1 var(--disp);letter-spacing:-.03em}
.bb .bd{font-size:13.5px;line-height:1.45;color:var(--muted)}
.bb .meta{margin-top:4px}
.bhead{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.bhead>div{flex:1;min-width:240px}
.bhead .bn{font:700 12px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--th)}

.toc .toch{font:600 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}

.bb .meta{font:500 11.5px var(--mono);color:var(--muted);letter-spacing:.04em}

.trow{display:grid;grid-template-columns:64px minmax(0,1fr);gap:14px;align-items:center;padding:16px 4px;border-bottom:1px solid var(--line);color:inherit;text-decoration:none}
.trow:hover{background:var(--th-soft)}
.trow .ab{font:800 30px var(--disp);letter-spacing:-.05em;color:var(--th)}
.trow .tt b{display:block;font:700 18px var(--disp);letter-spacing:-.02em}

<script>
window.LABS3={};
(function(){
var TH=window.THREE||mkTH();
function cssv(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()||'#888888'}
function palette(){return{fg:cssv('--fg'),acc:cssv('--acc'),muted:cssv('--muted'),line:cssv('--line'),bg:cssv('--lab-bg'),
  red:'#e5484d',blue:'#3b82f6',green:'#22a06b',orange:'#f59e0b',yellow:'#f2b705',purple:cssv('--acc'),pink:'#ec4899',cyan:'#06b6d4'}}
function nf(x,d){
  if(!isFinite(x))return '—';
  var a=Math.abs(x);
  if(a!==0&&(a>=1e5||a<1e-3)){var e=Math.floor(Math.log10(a)),m=x/Math.pow(10,e);return m.toFixed(d===undefined?2:Math.min(d,3))+'·10'+sup(e)}
  return x.toFixed(d===undefined?2:d).replace('.',',');
}
function sup(e){var s={'0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹','-':'⁻'};return String(e).split('').map(function(c){return s[c]}).join('')}

/* utilidades de escena */
var FAT_VS='uniform vec2 uRes;uniform float uW;uniform float uK;attribute vec3 other;attribute float sd;'+
'void main(){mat4 M=projectionMatrix*modelViewMatrix;vec4 a=M*vec4(position,1.);vec4 b=M*vec4(other,1.);'+
'vec2 sa=a.xy/a.w*uRes*.5;vec2 sb=b.xy/b.w*uRes*.5;vec2 d=sb-sa;float l=length(d);d=l>1e-4?d/l:vec2(1.,0.);'+
'vec2 n=vec2(-d.y,d.x);vec2 off=(n*sd-d)*uW*uK*.5;gl_Position=vec4((sa+off)/(uRes*.5)*a.w,a.z,a.w);}';
var FAT_FS='uniform vec3 color;uniform float op;void main(){gl_FragColor=vec4(color,op);}';
function makeUtil(scene,root,C,uni){
  var U={C:C,TH:TH,root:root,cur:root};
  function fat(maxSeg,col,o){
    var nv=maxSeg*4,g=new TH.BufferGeometry(),idx=new Uint16Array(maxSeg*6);
    for(var i=0;i<maxSeg;i++){var b=i*4,j=i*6;idx[j]=b;idx[j+1]=b+1;idx[j+2]=b+2;idx[j+3]=b+1;idx[j+4]=b+3;idx[j+5]=b+2}
    var sd=new Float32Array(nv);for(var i2=0;i2<maxSeg;i2++){sd[i2*4]=-1;sd[i2*4+1]=1;sd[i2*4+2]=1;sd[i2*4+3]=-1}
    g.setAttribute('position',new TH.BufferAttribute(new Float32Array(nv*3),3));
    g.setAttribute('other',new TH.BufferAttribute(new Float32Array(nv*3),3));
    g.setAttribute('sd',new TH.BufferAttribute(sd,1));
    g.setIndex(new TH.BufferAttribute(idx,1));g.setDrawRange(0,0);
    var m=new TH.ShaderMaterial({vertexShader:FAT_VS,fragmentShader:FAT_FS,transparent:(o.op||1)<1,side:TH.DoubleSide,
      uniforms:{uRes:uni.uRes,uK:uni.uK,uW:{value:o.w||2.6},color:{value:new TH.Color(col)},op:{value:o.op||1}}});
    m.color=m.uniforms.color.value;
    var M=new TH.Mesh(g,m);M.frustumCulled=false;M.userData.fat=true;M.userData.max=maxSeg;(o.parent||U.cur).add(M);return M}
  function fatSet(F,segs){ // segs: [[ax,ay,az,bx,by,bz],...]
    var g=F.geometry,P=g.attributes.position.array,Q=g.attributes.other.array,n=Math.min(segs.length,F.userData.max);
    for(var i=0;i<n;i++){var s=segs[i],b=i*12;
      P[b]=s[0];P[b+1]=s[1];P[b+2]=s[2];P[b+3]=s[0];P[b+4]=s[1];P[b+5]=s[2];P[b+6]=s[3];P[b+7]=s[4];P[b+8]=s[5];P[b+9]=s[3];P[b+10]=s[4];P[b+11]=s[5];
      Q[b]=s[3];Q[b+1]=s[4];Q[b+2]=s[5];Q[b+3]=s[3];Q[b+4]=s[4];Q[b+5]=s[5];Q[b+6]=s[0];Q[b+7]=s[1];Q[b+8]=s[2];Q[b+9]=s[0];Q[b+10]=s[1];Q[b+11]=s[2]}
    g.attributes.position.needsUpdate=true;g.attributes.other.needsUpdate=true;g.setDrawRange(0,n*6);F.userData.n=n}
  function ptsToSegs(pts,loop){var r=[];for(var i=0;i+1<pts.length;i++){var a=pts[i],b=pts[i+1];r.push([a[0],a[1],a[2],b[0],b[1],b[2]])}
    if(loop&&pts.length>2){var a2=pts[pts.length-1],b2=pts[0];r.push([a2[0],a2[1],a2[2],b2[0],b2[1],b2[2]])}return r}
  U.mat=function(col,o){return new TH.MeshPhongMaterial(Object.assign({color:col,shininess:55,specular:0x333333},o||{}))};
  U.basic=function(col,o){return new TH.MeshBasicMaterial(Object.assign({color:col},o||{}))};
  U.sphere=function(r,col,pos,o){var m=new TH.Mesh(new TH.SphereGeometry(r,20,14),U.mat(col,o));if(pos)m.position.set(pos[0],pos[1],pos[2]);U.cur.add(m);return m};
  U.box=function(w,h,d,col,pos,o){var m=new TH.Mesh(new TH.BoxGeometry(w,h,d),U.mat(col,o));if(pos)m.position.set(pos[0],pos[1],pos[2]);U.cur.add(m);return m};
  U.line=function(pts,col,o){
    o=o||{};
    if(o.dashed){
      var n=pts.length,max=o.max||n,arr=new Float32Array(max*3);
      for(var i=0;i<n;i++){arr[i*3]=pts[i][0];arr[i*3+1]=pts[i][1];arr[i*3+2]=pts[i][2]}
      var g=new TH.BufferGeometry();g.setAttribute('position',new TH.BufferAttribute(arr,3));g.setDrawRange(0,n);
      var mat=new TH.LineDashedMaterial({color:col,dashSize:.3,gapSize:.2,transparent:!!o.op,opacity:o.op||1});
      var L=o.loop?new TH.LineLoop(g,mat):new TH.Line(g,mat);L.computeLineDistances();L.userData.n=n;(o.parent||U.cur).add(L);return L}
    var F=fat(Math.max(1,(o.max||pts.length)-1+(o.loop?1:0)),col,o);F.userData.loop=!!o.loop;fatSet(F,ptsToSegs(pts,o.loop));return F};
  U.setLine=function(L,pts){
    if(L.userData.fat){fatSet(L,ptsToSegs(pts,L.userData.loop));return}
    var a=L.geometry.attributes.position,arr=a.array,n=Math.min(pts.length,arr.length/3);
    for(var i=0;i<n;i++){arr[i*3]=pts[i][0];arr[i*3+1]=pts[i][1];arr[i*3+2]=pts[i][2]}
    a.needsUpdate=true;L.geometry.setDrawRange(0,n);L.userData.n=n;
    if(L.material.isLineDashedMaterial)L.computeLineDistances()};
  U.segs=function(max,col,o){o=o||{};if(!o.w)o.w=1.7;return fat(max,col,o)};
  U.setSegs=function(L,list){fatSet(L,list)};
  var UP=new TH.Vector3(0,1,0);
  function Arrow3(dir,origin,len,col,hl,hw){
    var g=new TH.Group();
    g.line=new TH.Mesh(new TH.CylinderGeometry(1,1,1,10,1).translate(0,.5,0),U.mat(col));
    g.cone=new TH.Mesh(new TH.ConeGeometry(1,1,16,1).translate(0,.5,0),U.mat(col));
    g.add(g.line);g.add(g.cone);
    g.setDirection=function(d){this.quaternion.setFromUnitVectors(UP,d)};
    g.setLength=function(len,hl,hw){
      len=Math.max(len,.001);hl=hl===undefined?len*.26:hl;hw=hw===undefined?len*.12:hw;hl=Math.min(hl,len*.6);hw=Math.min(hw,.3);hw=Math.max(hw,.06);
      var r=Math.max(.022,Math.min(.06,hw*.28)),sh=Math.max(.001,len-hl);
      this.line.scale.set(r,sh,r);this.cone.position.y=sh;this.cone.scale.set(hw,hl,hw)};
    if(origin)g.position.copy(origin);
    g.setDirection(dir||UP);g.setLength(len===undefined?1:len,hl,hw);return g}
  U.arrow=function(o,d,len,col,hl,hw){
    var a=new Arrow3(new TH.Vector3(d[0],d[1],d[2]).normalize(),new TH.Vector3(o[0],o[1],o[2]),len,col,hl,hw);U.cur.add(a);return a};
  U.setArrow=function(a,o,d,len){
    a.position.set(o[0],o[1],o[2]);
    var v=new TH.Vector3(d[0],d[1],d[2]);if(v.lengthSq()<1e-12){a.visible=false;return}a.visible=true;
    a.setDirection(v.normalize());a.setLength(Math.max(len,.001),Math.min(len*.3,.5),Math.min(len*.15,.25))};
  U.label=function(text,col,scale,pos){
    var c=document.createElement('canvas'),x=c.getContext('2d'),f='600 44px "IBM Plex Sans",Arial,sans-serif';x.font=f;
    var w=Math.ceil(x.measureText(text).width)+24;c.width=Math.max(64,w);c.height=72;x=c.getContext('2d');
    x.font=f;x.textAlign='center';x.textBaseline='middle';x.fillStyle=col;x.fillText(text,c.width/2,38);
    var t=new TH.CanvasTexture(c);var s=new TH.Sprite(new TH.SpriteMaterial({map:t,transparent:true,depthTest:false}));
    s.scale.set(scale*c.width/72,scale,1);if(pos)s.position.set(pos[0],pos[1],pos[2]);U.cur.add(s);return s};
  U.grid=function(size,div,y){var g=new TH.GridHelper(size,div,C.line,C.line);g.position.y=y||0;g.material.transparent=true;g.material.opacity=.7;U.cur.add(g);return g};
  U.nf=nf;
  U.group=function(){var g=new TH.Group();U.cur.add(g);return g};
  U.into=function(g,fn){var p=U.cur;U.cur=g;try{fn()}finally{U.cur=p}};
  U.clear=function(g){for(var i=g.children.length-1;i>=0;i--){var o=g.children[i];g.remove(o);o.traverse(function(n){if(n.geometry)n.geometry.dispose();if(n.material){if(n.material.map)n.material.map.dispose();n.material.dispose&&n.material.dispose()}})}};
  U.wl2rgb=function(nm){ // 380-780 nm -> color string
    var r=0,g=0,b=0;
    if(nm>=380&&nm<440){r=-(nm-440)/60;b=1}else if(nm<490){g=(nm-440)/50;b=1}else if(nm<510){g=1;b=-(nm-510)/20}else if(nm<580){r=(nm-510)/70;g=1}else if(nm<645){r=1;g=-(nm-645)/65}else if(nm<=780){r=1}
    var f=nm<420?.3+.7*(nm-380)/40:nm>700?.3+.7*(780-nm)/80:1;
    function h(v){return Math.round(255*Math.pow(Math.max(0,v*f),.8))}
    return 'rgb('+h(r)+','+h(g)+','+h(b)+')'};
  return U;
}

LABS3.mount=function(LB,stage,panel){
  var C=palette(),renderer;
  try{renderer=new TH.WebGLRenderer({antialias:true,alpha:true,powerPreference:'low-power'})}catch(e){stage.insertAdjacentHTML('beforeend','<div class="nogl">El teu navegador no pot mostrar gràfics 3D (WebGL).</div>');return function(){}}
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
  stage.insertBefore(renderer.domElement,stage.firstChild);
  var scene=new TH.Scene(),camera=new TH.PerspectiveCamera(42,1,.1,500);
  scene.add(new TH.HemisphereLight(0xffffff,0x8a85a0,.8));var dl=new TH.DirectionalLight(0xffffff,.75);dl.position.set(6,12,8);scene.add(dl);var dl2=new TH.DirectionalLight(0xffffff,.25);dl2.position.set(-8,4,-6);scene.add(dl2);
  var uni={uRes:{value:new TH.Vector2(1,1)},uK:{value:1}};
  var root=new TH.Group();scene.add(root);
  var U=makeUtil(scene,root,C,uni);
  var cam={th:.6,ph:1.1,d:22,t:new TH.Vector3()},raf=0,alive=true,last=performance.now(),T=0;
  var mode=null,inst=null,P={},O={},c2d=null,c2c=null,modeIdx=0,rdEls={},paused=false,speed=1,moved=false,fitT=0,fitDone=false,_v=new TH.Vector3();

  function place(){
    var s=Math.sin(cam.ph);camera.position.set(cam.t.x+cam.d*s*Math.sin(cam.th),cam.t.y+cam.d*Math.cos(cam.ph),cam.t.z+cam.d*s*Math.cos(cam.th));camera.lookAt(cam.t)}
  function size(){var w=stage.clientWidth,h=stage.clientHeight;if(!w||!h)return;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();var pr=renderer.getPixelRatio();uni.uRes.value.set(w*pr,h*pr);uni.uK.value=pr}
  var ro=window.ResizeObserver?new ResizeObserver(size):null;if(ro)ro.observe(stage);size();

  /* cámara orbital con puntero */
  var ptrs={},pd=0;
  var cv=renderer.domElement;
  cv.addEventListener('pointerdown',function(e){moved=true;cv.setPointerCapture(e.pointerId);ptrs[e.pointerId]={x:e.clientX,y:e.clientY};pd=0});
  cv.addEventListener('pointermove',function(e){
    var p=ptrs[e.pointerId];if(!p)return;var ids=Object.keys(ptrs);
    if(ids.length===1){cam.th-=(e.clientX-p.x)*.008;cam.ph=Math.min(3.0,Math.max(.12,cam.ph-(e.clientY-p.y)*.008))}
    else if(ids.length===2){var o=ptrs[ids[0]==e.pointerId?ids[1]:ids[0]];var d0=Math.hypot(p.x-o.x,p.y-o.y),d1=Math.hypot(e.clientX-o.x,e.clientY-o.y);if(d0>0)cam.d=Math.min(80,Math.max(4,cam.d*d0/d1))}
    p.x=e.clientX;p.y=e.clientY});
  function up(e){delete ptrs[e.pointerId]}
  cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
  cv.addEventListener('wheel',function(e){e.preventDefault();moved=true;cam.d=Math.min(80,Math.max(4,cam.d*Math.exp(e.deltaY*.0012)))},{passive:false});

  /* panel */
  function buildPanel(){
    var h='';
    if(LB.modes.length>1){h+='<div class="modes" role="group" aria-label="Escenes">'+LB.modes.map(function(m,i){return '<button type="button" data-m="'+i+'" aria-pressed="'+(i===modeIdx)+'">'+m.name+'</button>'}).join('')+'</div>'}
    mode.params.forEach(function(p){
      if(p.type==='select'){

LABS.sistemes=function(b){

   draw:function(c,w,h,S,P){var v=View(w,h,-8,8,-6,6);axes(c,v,P,w,h);
     function L(a,b,cc,col){if(a===0&&b===0)return;var p=[],x0=v.x0,x1=v.x1;if(b!==0){line(c,v.X(x0),v.Y((cc-a*x0)/b),v.X(x1),v.Y((cc-a*x1)/b),col,2.4)}else{line(c,v.X(cc/a),v.Y(v.y0),v.X(cc/a),v.Y(v.y1),col,2.4)}}
     L(S.a1,S.b1,S.c1,P.th);L(S.a2,S.b2,S.c2,P.fg);

     else{var z1=S.a1===0&&S.b1===0,z2=S.a2===0&&S.b2===0;var cm=(S.a1*S.c2-S.a2*S.c1===0)&&(S.b1*S.c2-S.b2*S.c1===0);

/* 7. Distància punt-pla 3D */
LABS.puntpla=function(b){
  var cam={yaw:.8,pit:.45};
  build(b,{title:'Distància d’un punt a un pla (3D)',h:380,desc:'Defineix el pla Ax + By + Cz + D = 0 i el punt P. Arrossega el dibuix per girar-lo. La distància és la del segment perpendicular.',
   ctl:[{k:'A',l:'A',min:-3,max:3,step:1,v:1,d:0},{k:'B',l:'B',min:-3,max:3,step:1,v:1,d:0},{k:'C',l:'C',min:-3,max:3,step:1,v:1,d:0},{k:'D',l:'D',min:-6,max:6,step:1,v:-3,d:0},
        {k:'px',l:'P x',min:-4,max:4,step:.5,v:3,d:1},{k:'py',l:'P y',min:-4,max:4,step:.5,v:2,d:1},{k:'pz',l:'P z',min:-4,max:4,step:.5,v:3,d:1}],
   init:function(a){var cv=a.cv,dr=false,lx=0,ly=0;cv.style.touchAction='none';cv.style.cursor='grab';
     cv.addEventListener('pointerdown',function(e){dr=true;lx=e.clientX;ly=e.clientY;cv.setPointerCapture(e.pointerId)});
     cv.addEventListener('pointermove',function(e){if(!dr)return;cam.yaw+=(e.clientX-lx)*.01;cam.pit=Math.max(-1.4,Math.min(1.4,cam.pit+(e.clientY-ly)*.01));lx=e.clientX;ly=e.clientY;a.draw()});
     cv.addEventListener('pointerup',function(){dr=false})},
   draw:function(c,w,h,S,P){var R=4.5,sc=Math.min(w,h)/(2*R*1.25),cx=w/2,cy=h/2;
     function pr(p){var x=p[0],y=p[1],z=p[2];var cs=Math.cos(cam.yaw),sn=Math.sin(cam.yaw);var x1=x*cs-y*sn,y1=x*sn+y*cs;var cp=Math.cos(cam.pit),sp=Math.sin(cam.pit);var y2=y1*cp-z*sp,z2=y1*sp+z*cp;return[cx+x1*sc,cy-z2*sc,y2]}
     var n=[S.A,S.B,S.C],nn=Math.hypot(n[0],n[1],n[2]);
     // cub de referència
     var cc=[];for(var i0=0;i0<2;i0++)for(var j0=0;j0<2;j0++)for(var k0=0;k0<2;k0++)cc.push([(i0?R:-R),(j0?R:-R),(k0?R:-R)]);
     c.save();c.strokeStyle=P.ln;c.lineWidth=1;cc.forEach(function(p,ia){cc.forEach(function(q,ib){if(ib<=ia)return;if((p[0]!==q[0])+(p[1]!==q[1])+(p[2]!==q[2])!==1)return;var u1=pr(p),u2=pr(q);c.beginPath();c.moveTo(u1[0],u1[1]);c.lineTo(u2[0],u2[1]);c.stroke()})});c.restore();
     [[[1,0,0],'x'],[[0,1,0],'y'],[[0,0,1],'z']].forEach(function(a){var o=pr([0,0,0]),e=pr([a[0][0]*R,a[0][1]*R,a[0][2]*R]);line(c,o[0],o[1],e[0],e[1],P.mu,1.3);txt(c,a[1],e[0]+(e[0]>o[0]?7:-7),e[1],P.mu,e[0]>o[0]?'left':'right',12)});
     var info;
     if(nn>0){
       // polígon del pla amb el cub [-R,R]^3
       var pts=[],cs=[-R,R];
       function f(p){return n[0]*p[0]+n[1]*p[1]+n[2]*p[2]+S.D}
       var cor=[];for(var i=0;i<2;i++)for(var j=0;j<2;j++)for(var k=0;k<2;k++)cor.push([cs[i],cs[j],cs[k]]);
       cor.forEach(function(p,a){cor.forEach(function(q,b2){if(b2<=a)return;var d=(p[0]!==q[0])+(p[1]!==q[1])+(p[2]!==q[2]);if(d!==1)return;var fp=f(p),fq=f(q);if(fp*fq<0){var t=fp/(fp-fq);pts.push([p[0]+t*(q[0]-p[0]),p[1]+t*(q[1]-p[1]),p[2]+t*(q[2]-p[2])])}else if(fp===0)pts.push(p)})});
       if(pts.length>=3){var cen=[0,0,0];pts.forEach(function(p){cen[0]+=p[0]/pts.length;cen[1]+=p[1]/pts.length;cen[2]+=p[2]/pts.length});
         var u=Math.abs(n[0])<Math.abs(n[1])?[1,0,0]:[0,1,0];var e1=[n[1]*u[2]-n[2]*u[1],n[2]*u[0]-n[0]*u[2],n[0]*u[1]-n[1]*u[0]];var l1=Math.hypot.apply(null,e1);e1=e1.map(function(t){return t/l1});
         var e2=[n[1]*e1[2]-n[2]*e1[1],n[2]*e1[0]-n[0]*e1[2],n[0]*e1[1]-n[1]*e1[0]];var l2=Math.hypot.apply(null,e2);e2=e2.map(function(t){return t/l2});
         pts.sort(function(p,q){var a1=Math.atan2((p[0]-cen[0])*e2[0]+(p[1]-cen[1])*e2[1]+(p[2]-cen[2])*e2[2],(p[0]-cen[0])*e1[0]+(p[1]-cen[1])*e1[1]+(p[2]-cen[2])*e1[2]);var a2=Math.atan2((q[0]-cen[0])*e2[0]+(q[1]-cen[1])*e2[1]+(q[2]-cen[2])*e2[2],(q[0]-cen[0])*e1[0]+(q[1]-cen[1])*e1[1]+(q[2]-cen[2])*e1[2]);return a1-a2});
         c.save();c.fillStyle=P.th;c.globalAlpha=.22;c.strokeStyle=P.th;c.beginPath();pts.forEach(function(p,i){var q=pr(p);i?c.lineTo(q[0],q[1]):c.moveTo(q[0],q[1])});c.closePath();c.fill();c.globalAlpha=1;c.lineWidth=1.6;c.stroke();c.restore()}
       var Pp=[S.px,S.py,S.pz],t=f(Pp)/(nn*nn),F=[Pp[0]-t*n[0],Pp[1]-t*n[1],Pp[2]-t*n[2]],d=Math.abs(f(Pp))/nn;
       var a=pr(Pp),bq=pr(F);line(c,a[0],a[1],bq[0],bq[1],P.fg,2,[6,4]);dot(c,bq[0],bq[1],4.5,P.th);dot(c,a[0],a[1],6,P.fg);txt(c,'P',a[0]+9,a[1]-9,P.fg,'left',13);txt(c,'P′',bq[0]+8,bq[1]+10,P.th,'left',12);
       info='<span>π: '+S.A+'x '+(S.B<0?'−':'+')+' '+Math.abs(S.B)+'y '+(S.C<0?'−':'+')+' '+Math.abs(S.C)+'z '+(S.D<0?'−':'+')+' '+Math.abs(S.D)+' = 0</span><span>d(P, π) = |A·x₀+B·y₀+C·z₀+D| / √(A²+B²+C²) = <b>'+fmt(d,3)+'</b></span><span>P′ = ('+fmt(F[0],2)+' , '+fmt(F[1],2)+' , '+fmt(F[2],2)+')</span>';
     } else {var a=pr([S.px,S.py,S.pz]);dot(c,a[0],a[1],6,P.fg);info='<span class="lnote">Cal que (A, B, C) ≠ (0, 0, 0) per tenir un pla.</span>'}
     return info}});
};
/* 8. Normal */
function erf(x){var s=x<0?-1:1;x=Math.abs(x);var t=1/(1+.3275911*x);var y=1-(((((1.061405429*t-1.453152027)*t)+1.421413741)*t-.284496736)*t+.254829592)*t*Math.exp(-x*x);return s*y}
function Phi(z){return .5*(1+erf(z/Math.SQRT2))}
LABS.normal=function(b){
  build(b,{title:'Distribució normal N(μ, σ)',h:300,desc:'Mou μ i σ i tria l’interval (a, b): l’àrea ombrejada és P(a < X < b).',
   ctl:[{k:'mu',l:'μ',min:-3,max:3,step:.1,v:0,d:1},{k:'sg',l:'σ',min:.4,max:2.5,step:.05,v:1,d:2},{k:'a',l:'a',min:-8,max:8,step:.1,v:-1,d:1},{k:'b',l:'b',min:-8,max:8,step:.1,v:1,d:1}],
   draw:function(c,w,h,S,P){var v=View(w,h,-8,8,0,1.05);var f=function(x){return Math.exp(-.5*Math.pow((x-S.mu)/S.sg,2))/(S.sg*Math.sqrt(2*Math.PI))};
     var ymax=Math.max(.5,f(S.mu)*1.15);v=View(w,h,-8,8,0,ymax);axes(c,v,P,w,h);
     var a=Math.min(S.a,S.b),bb=Math.max(S.a,S.b);c.save();c.fillStyle=P.th;c.globalAlpha=.3;c.beginPath();c.moveTo(v.X(a),v.Y(0));for(var i=0;i<=120;i++){var x=a+(bb-a)*i/120;c.lineTo(v.X(x),v.Y(f(x)))}c.lineTo(v.X(bb),v.Y(0));c.closePath();c.fill();c.restore();
     curve(c,v,f,P.th,2.6);line(c,v.X(S.mu),v.Y(0),v.X(S.mu),v.Y(f(S.mu)),P.mu,1.2,[4,4]);
     var za=(a-S.mu)/S.sg,zb=(bb-S.mu)/S.sg,p=Phi(zb)-Phi(za);
     return '<span>Z = (X − μ)/σ → ('+fmt(za,2)+' ; '+fmt(zb,2)+')</span><span>P(a &lt; X &lt; b) = <b>'+fmt(p,4)+'</b> ('+fmt(p*100,2)+' %)</span><span class="lnote">Regla 68–95–99,7: μ±σ, μ±2σ, μ±3σ</span>'}});
};
/* 9. Binomial */
LABS.binomial=function(b){
  function C(n,k){var r=1;for(var i=1;i<=k;i++)r=r*(n-k+i)/i;return r}
  build(b,{title:'Distribució binomial B(n, p)',h:300,desc:'Nombre d’èxits en n proves independents amb probabilitat p. Marca k per veure P(X = k) i P(X ≤ k).',
   ctl:[{k:'n',l:'n',min:1,max:40,step:1,v:10,d:0},{k:'p',l:'p',min:.02,max:.98,step:.01,v:.25,d:2},{k:'k',l:'k',min:0,max:40,step:1,v:3,d:0}],
   draw:function(c,w,h,S,P){var n=S.n,p=S.p,pr=[],mx=0,k=Math.min(S.k,n);for(var i=0;i<=n;i++){var q=C(n,i)*Math.pow(p,i)*Math.pow(1-p,n-i);pr.push(q);mx=Math.max(mx,q)}
     var v=View(w,h,-.8,n+.8,0,mx*1.15);axes(c,v,P,w,h);var bw=Math.max(2,(v.X(1)-v.X(0))*.78),cum=0;
     for(i=0;i<=n;i++){c.save();c.fillStyle=i===k?P.fg:(i<k?P.th:P.soft);c.globalAlpha=i<k?.55:1;c.strokeStyle=P.th;c.lineWidth=1;c.fillRect(v.X(i)-bw/2,v.Y(pr[i]),bw,v.Y(0)-v.Y(pr[i]));c.strokeRect(v.X(i)-bw/2,v.Y(pr[i]),bw,v.Y(0)-v.Y(pr[i]));c.restore();if(i<=k)cum+=pr[i]}
     return '<span>Mitjana μ = np = <b>'+fmt(n*p,2)+'</b></span><span>σ = √(npq) = <b>'+fmt(Math.sqrt(n*p*(1-p)),2)+'</b></span><span>P(X = '+k+') = <b>'+fmt(pr[k],4)+'</b></span><span>P(X ≤ '+k+') = <b>'+fmt(cum,4)+'</b></span>'}});
};
/* ===== Nous laboratoris 2D ===== */
function bis(g,a,b){var ga=g(a);for(var i=0;i<60;i++){var m=(a+b)/2,gm=g(m);if((ga<0)===(gm<0)){a=m;ga=gm}else b=m}return (a+b)/2}
/* Teorema del valor mitjà i de Rolle */
LABS.tvm=function(b){
  var F=[{n:'x³ − 3x',f:function(x){return x*x*x-3*x},d:function(x){return 3*x*x-3},x:[-2.6,2.6],y:[-4.5,4.5],a:-1.5,b:1.9},
         {n:'2·sin x',f:function(x){return 2*Math.sin(x)},d:function(x){return 2*Math.cos(x)},x:[-.6,7],y:[-2.8,2.8],a:.4,b:3.5},
         {n:'|x|  (no derivable a 0)',f:Math.abs,d:function(x){return x<0?-1:1},x:[-2.6,2.6],y:[-.6,3],a:-1.5,b:1.5,nd:[0]},
         {n:'1/x  (discontínua a 0)',f:function(x){return 1/x},d:function(x){return -1/(x*x)},x:[-3,3],y:[-4,4],a:-2,b:2,nd:[0],nc:[0]}];
  build(b,{title:'Teorema del valor mitjà i teorema de Rolle',h:330,
   desc:'Si f és contínua a [a, b] i derivable a (a, b), hi ha un punt c on la tangent és paral·lela a la secant. Prova amb funcions que no compleixen les hipòtesis.',
   ctl:[{k:'f',l:'Funció',sel:F.map(function(q){return q.n})},{k:'a',l:'a',min:-2.5,max:6.5,step:.05,v:-1.5,d:2},{k:'b',l:'b',min:-2.5,max:6.5,step:.05,v:1.9,d:2}],
   onsel:function(S,k,I){var q=F[S.f];S.a=q.a;S.b=q.b;I.a.value=q.a;I.b.value=q.b;I.a._up();I.b._up()},
   draw:function(c,w,h,S,P){var q=F[S.f],v=View(w,h,q.x[0],q.x[1],q.y[0],q.y[1]);axes(c,v,P,w,h);
     var a=Math.min(S.a,S.b),bb=Math.max(S.a,S.b);if(bb-a<.1)bb=a+.1;

  function open(o){pn.hidden=!o;bt.setAttribute('aria-expanded',String(o));if(o)cur()}

  addEventListener('hashchange',function(){open(false)});
  new MutationObserver(function(){sync();cur()}).observe(nav,{subtree:true,childList:true,characterData:true,attributes:true,attributeFilter:['aria-current']});sync();cur()})();

 /* 12. Índex flotant dels apunts i barra de lectura */
 (function(){if(page==='index'||page==='novetats'||!$('#view'))return;var Vw=$('#view');
  var bar=ce('div','mk-rd');bar.setAttribute('aria-hidden','true');bar.innerHTML='<i></i>';D.body.appendChild(bar);
  var btn=ce('button','mk-ix',svg('<path d="M4 6h16M4 12h10M4 18h13"/>')+'<span>Índex</span>');btn.type='button';btn.hidden=true;btn.setAttribute('aria-expanded','false');btn.setAttribute('aria-haspopup','true');
  var pn=ce('div','mk-ixp');pn.hidden=true;pn.setAttribute('role','navigation');pn.setAttribute('aria-label','Índex de l’apartat');
  D.body.appendChild(btn);D.body.appendChild(pn);
  var H=[],L=[],tm=0;
  function build(){
   if(!/^#[ta]\d+-s\d+/.test(location.hash)){btn.hidden=true;pn.hidden=true;H=[];return}
   H=$$('.prose h3,.prose h4.subh',Vw);
   if(H.length<4){btn.hidden=true;pn.hidden=true;H=[];return}
   pn.innerHTML='<div class="mk-ixh">En aquest apartat</div>';L=[];
   H.forEach(function(h,i){var a=ce('a','mk-ixl'+(h.tagName==='H4'?' sub':''));a.href='#';a.textContent=h.textContent.replace(/\s+/g,' ').trim();a.addEventListener('click',function(e){e.preventDefault();h.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches||D.documentElement.getAttribute('data-motion')==='reduced'?'auto':'smooth',block:'start'});close()});pn.appendChild(a);L.push(a)});
   btn.hidden=false;spy()}
  function open(){pn.hidden=false;btn.setAttribute('aria-expanded','true');spy();var c=$('.on',pn);if(c)c.scrollIntoView({block:'center'})}
  function close(){pn.hidden=true;btn.setAttribute('aria-expanded','false')}
  btn.addEventListener('click',function(){pn.hidden?open():close()});
  D.addEventListener('keydown',function(e){if(e.key==='Escape'&&!pn.hidden){close();btn.focus()}});
  D.addEventListener('mousedown',function(e){if(!pn.hidden&&!pn.contains(e.target)&&!btn.contains(e.target))close()});
  function spy(){var y=innerHeight*.28,cur=-1;for(var i=0;i<H.length;i++){if(H[i].getBoundingClientRect().top<=y)cur=i;else break}
   L.forEach(function(a,i){a.classList.toggle('on',i===cur);if(i===cur)a.setAttribute('aria-current','true');else a.removeAttribute('aria-current')});
   var d=D.documentElement,t=d.scrollHeight-innerHeight;bar.firstChild.style.transform='scaleX('+(t>0?Math.min(1,Math.max(0,scrollY/t)):0)+')'}
  var raf=0;addEventListener('scroll',function(){if(!raf)raf=requestAnimationFrame(function(){raf=0;spy()})},{passive:true});
  function sched(){clearTimeout(tm);tm=setTimeout(build,120)}
  new MutationObserver(sched).observe(Vw,{childList:true,subtree:true});addEventListener('hashchange',sched);build()})();

 /* 15. Enllaç que no porta enlloc: avís en comptes de tornar a la portada en silenci */
 (function(){var Vw=$('#view');if(!Vw||!/^(mates|fisica|filosofia)$/.test(page))return;var tm=0;
  function chk(){var h=location.hash,old=$('.mk-nf',Vw);
   if(!/^#(t\d+|a\d+|bloc\d+)(-s\d+|-prob)?$/.test(h)){if(old)old.remove();return}
   if(!$('.hero',Vw)){if(old)old.remove();return}
   if(old&&old.getAttribute('data-h')===h)return;if(old)old.remove();
   var b=ce('div','mk-nf','<span>No hem trobat aquest apartat. T’hem portat a la portada de l’assignatura.</span><button type="button" aria-label="Tanca l’avís">×</button>');b.setAttribute('role','status');b.setAttribute('data-h',h);
   $('button',b).addEventListener('click',function(){b.remove()});Vw.insertBefore(b,Vw.firstChild)}
  function sc(){clearTimeout(tm);tm=setTimeout(chk,350)}
  addEventListener('hashchange',sc);sc()})();

 (function(){var UP={"m": {"1": "2026-10-26", "2": "2026-10-26", "3": "2026-10-26", "4": "2026-10-25", "5": "2026-10-26", "6": "2026-10-26", "7": "2026-10-26", "8": "2026-10-25", "9": "2026-10-26", "10": "2026-10-26", "11": "2026-10-26", "12": "2026-10-26"}, "f": {"1": "2026-10-26", "2": "2026-10-26", "3": "2026-10-26", "4": "2026-10-26", "5": "2026-10-26", "6": "2026-10-26", "7": "2026-10-26", "8": "2026-10-26", "9": "2026-10-26", "10": "2026-10-26", "11": "2026-10-26"}, "h": {"1": "2026-10-26", "2": "2026-10-26", "3": "2026-10-26", "4": "2026-10-26", "5": "2026-10-26", "6": "2026-10-26", "7": "2026-10-26", "8": "2026-10-26"}, "all": "2026-10-26"};if(!UP)return;var kk={mates:'m',fisica:'f',filosofia:'h'}[page],Vw=$('#view'),tm=0;
  function fmt(iso){var m=/^(\d{4})-(\d\d)-(\d\d)$/.exec(iso);if(!m)return iso;var d=new Date(+m[1],+m[2]-1,+m[3]),es=window.MKL&&MKL.es;
   try{return new Intl.DateTimeFormat(es?'es-ES':'ca-ES',{day:'numeric',month:'long',year:'numeric'}).format(d)}catch(e){return iso}}
  function lbl(){return window.MKL&&MKL.es?'Actualizado el ':'Actualitzat el '}
  function line(){if(!kk||!Vw)return;var old=$('.mk-ud',Vw),m=/^#[ta](\d+)(?:-|$)/.exec(location.hash),id=m&&m[1],iso=id&&UP[kk]&&UP[kk][id];
   if(!iso||!$('.ph .wrap',Vw)){if(old)old.remove();return}
   var txt=lbl()+fmt(iso);
   if(old){if(old.getAttribute('data-k')!==kk+id+(window.MKL&&MKL.es)){old.remove()}else return}
   var w=$('.ph .wrap',Vw),e=ce('p','mk-ud');e.textContent=txt;e.setAttribute('data-k',kk+id+(window.MKL&&MKL.es));w.appendChild(e)}
  function sc(){clearTimeout(tm);tm=setTimeout(line,150)}
  if(Vw){new MutationObserver(sc).observe(Vw,{childList:true,subtree:true});addEventListener('hashchange',sc);sc()}
  /* peu de pàgina */
  var ft=$$('footer *').filter(function(e){return e.children.length===0&&/©/.test(e.textContent)})[0];
  if(ft&&!$('.mk-fud')){var s=ce('span','mk-fud');s.textContent=' · '+lbl()+fmt(UP.all);ft.appendChild(s)}})();
})();
