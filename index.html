<style>
/* Layout: cabecera con logo y las tres asignaturas; portada centrada en el logo; tres tarjetas de color (rojo, morado, amarillo); cada asignatura tiñe su página con su color */
:root{
  --bg:#ffffff; --fg:#111111; --muted:#6c6a6a; --line:#e8e5e5; --soft:#f6f4f4; --strong:#111111; --on:#ffffff;
  --red:#c8102e;
  --m:#c8102e; --mk:#c8102e; --mo:#ffffff;
  --f:#6d28d9; --fk:#6d28d9; --fo:#ffffff;
  --h:#f2b705; --hk:#8a5f00; --ho:#1a1400;
  --acc:var(--m); --acc-ink:var(--mk); --on-acc:var(--mo);
  --disp:"Inter Tight","Helvetica Neue",Arial,sans-serif; --sans:"IBM Plex Sans",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
  --lgA:url("img/l8af0cc04aa.png"); --lgB:url("img/l68a5775cfa.png");
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e0c0c;--fg:#f2eeee;--muted:#a09a9a;--line:#2a2525;--soft:#181414;--strong:#f2eeee;--on:#0e0c0c;--red:#ff4d63;--m:#ff5d73;--mk:#ff5d73;--mo:#1a0508;--f:#a78bfa;--fk:#a78bfa;--fo:#120826;--h:#ffd23f;--hk:#ffd23f;--ho:#1a1400;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e0c0c;--fg:#f2eeee;--muted:#a09a9a;--line:#2a2525;--soft:#181414;--strong:#f2eeee;--on:#0e0c0c;--red:#ff4d63;--m:#ff5d73;--mk:#ff5d73;--mo:#1a0508;--f:#a78bfa;--fk:#a78bfa;--fo:#120826;--h:#ffd23f;--hk:#ffd23f;--ho:#1a1400;color-scheme:dark}
[data-s="mates"]{--acc:var(--m);--acc-ink:var(--mk);--on-acc:var(--mo)}
[data-s="fisica"]{--acc:var(--f);--acc-ink:var(--fk);--on-acc:var(--fo)}
[data-s="filosofia"]{--acc:var(--h);--acc-ink:var(--hk);--on-acc:var(--ho)}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font:15px/1.55 var(--sans);margin:0;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
a{color:inherit;text-decoration:none}
.gut{padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.wrap{max-width:1040px;margin:0 auto}
:focus-visible{outline:2px solid var(--fg);outline-offset:3px;border-radius:6px}
.logo{position:relative;display:block;aspect-ratio:900/458}
.logo::before,.logo::after{content:"";position:absolute;inset:0}
.logo::before{background:var(--fg);-webkit-mask:var(--lgA) center/contain no-repeat;mask:var(--lgA) center/contain no-repeat}
.logo::after{background:var(--red);-webkit-mask:var(--lgB) center/contain no-repeat;mask:var(--lgB) center/contain no-repeat}

/* cabecera */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hdr .wrap{display:flex;align-items:center;gap:16px;height:64px}
.hdr .logo{height:46px;flex:none}
nav.main{display:flex;gap:4px;margin-left:auto;overflow-x:auto;scrollbar-width:none}
nav.main::-webkit-scrollbar{display:none}
nav.main a{display:inline-flex;align-items:center;gap:8px;font-size:14px;padding:7px 12px;border-radius:999px;white-space:nowrap;color:var(--muted)}
nav.main a::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}
nav.main a:hover{color:var(--fg);background:var(--soft)}
nav.main a[aria-current="page"]{color:var(--fg);background:var(--soft);font-weight:600}
.ico{flex:none;width:36px;height:36px;border-radius:999px;border:1px solid var(--line);background:none;color:var(--fg);display:grid;place-items:center;cursor:pointer}
.ico svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.6}
.ico:hover{border-color:var(--fg)}
.sht{display:none}
@media (max-width:640px){.hdr .logo{height:40px}.lng{display:none}.sht{display:inline}nav.main a{padding:7px 8px;gap:6px}.hdr .wrap{gap:8px}}

/* textos */
h1,h2,h3{font-family:var(--disp);letter-spacing:-.03em;text-wrap:balance;margin:0}
.lbl{font:500 11.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.lead{font-size:16.5px;color:var(--muted);max-width:56ch;margin:0}
section{padding-block:40px 8px}
.sh{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:16px}
.sh h2{font-size:22px;font-weight:700}

/* portada */
.hero{padding-block:clamp(36px,6vw,64px) clamp(28px,5vw,48px);text-align:center;border-bottom:1px solid var(--line)}
.hero .logo{width:min(380px,72%);margin:0 auto 18px}
.hero .lead{margin:0 auto}
.hero .tag{margin:0 0 14px}
.hero .subj{margin:14px 0 0;font:500 12px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.hero .lead{font-size:18px}
.btn{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 20px;border-radius:999px;border:1.5px solid var(--fg);font-weight:600;font-size:14.5px;cursor:pointer;background:none;color:var(--fg)}
.btn.fill{background:var(--strong);color:var(--on)}
.btn.fill:hover{opacity:.85}
.btn:not(.fill):hover{background:var(--soft)}
.btn.acc{background:var(--acc);border-color:var(--acc);color:var(--on-acc)}
.btn.acc:hover{opacity:.88}

/* tarjetas de asignatura */
.courses{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:820px){.courses{grid-template-columns:1fr}}
.course{display:flex;flex-direction:column;gap:8px;padding:0;border:1px solid var(--line);border-radius:14px;overflow:hidden;transition:border-color .15s,transform .15s}
.course:hover{border-color:var(--fg)}
.course .top{background:var(--c);color:var(--o);padding:18px 20px 16px;display:flex;flex-direction:column;gap:6px}
.course .top b{font:800 44px/1 var(--disp);letter-spacing:-.05em}
.course .top span{font:500 11.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;opacity:.85}
.course .bot{padding:6px 20px 20px;display:flex;flex-direction:column;gap:6px}
.course .bot strong{font:700 20px var(--disp);letter-spacing:-.02em}
.course .bot small{color:var(--muted);font-size:13.5px}
.course .bot .go{font-weight:600;font-size:14px;margin-top:6px}

/* filas */
.list{border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:88px minmax(0,1fr) auto;align-items:center;gap:16px;padding:16px 4px;border-bottom:1px solid var(--line);transition:background .15s}
a.row:hover{background:var(--soft)}
.row .ab{font:800 22px var(--disp);letter-spacing:-.04em;display:flex;align-items:center;gap:8px}
.row .ab::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c,var(--line));flex:none}
.row b{display:block;font-weight:600}
.row small{color:var(--muted);font-size:13px}
.row .go{font-size:18px;color:var(--muted)}
a.row:hover .go{color:var(--fg)}
@media (max-width:520px){.row{grid-template-columns:70px minmax(0,1fr) auto;gap:10px}.row .ab{font-size:19px}}

/* vista de asignatura */
.ph{padding-block:clamp(36px,6vw,56px) 24px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--acc) 8%,var(--bg))}
.crumbs{display:flex;gap:6px;flex-wrap:wrap;font:500 12.5px var(--mono);color:var(--muted);margin-bottom:14px}
.crumbs a:hover{color:var(--fg);text-decoration:underline}
.ph h1{font-size:clamp(34px,6vw,56px);font-weight:800;margin-bottom:10px}
.sh1{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.sh1 .ab{font:800 clamp(40px,7vw,64px)/1 var(--disp);letter-spacing:-.05em;color:var(--acc-ink)}
.sh1 .dot{width:12px;height:12px;border-radius:50%;background:var(--acc)}
.ph .cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.tabs{display:flex;gap:4px;margin-top:28px;border-bottom:1px solid var(--line);margin-bottom:-25px;overflow-x:auto;scrollbar-width:none}
.tabs a{padding:10px 14px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs a:hover{color:var(--fg)}
.tabs a[aria-current="page"]{color:var(--fg);border-color:var(--acc);font-weight:600}
.cols{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:40px}
@media (max-width:820px){.cols{grid-template-columns:1fr;gap:8px}}
.temas{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.temas li{display:grid;grid-template-columns:36px minmax(0,1fr);gap:10px;padding:14px 0;border-bottom:1px solid var(--line)}
.temas li>span{font:700 15px var(--mono);color:var(--acc-ink)}
.temas b{display:block;font-weight:600}
.temas small{color:var(--muted);font-size:13.5px}
.facts{margin:0;border-top:1px solid var(--line)}
.facts div{display:flex;justify-content:space-between;gap:16px;padding:11px 0;border-bottom:1px solid var(--line);font-size:14px}
.facts dt{color:var(--muted)}
.facts dd{margin:0;font-weight:600;text-align:right;overflow-wrap:anywhere}
.slot{margin-top:16px;border:1px dashed var(--line);border-radius:12px;padding:14px 16px;font-size:13.5px;color:var(--muted)}
.slot b{display:block;color:var(--fg);font-size:14px;margin-bottom:2px}
.gblk{margin-bottom:30px}
.gblk h3{font:500 11.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--acc-ink);margin:0 0 10px}
.formula{padding:14px 16px;background:var(--soft);border-radius:12px;font:13px/1.8 var(--mono);overflow-x:auto;border-left:3px solid var(--acc)}
.formula p{margin:0;white-space:pre}
.ul{margin:0;padding-left:18px;font-size:14.5px}
.ul li{margin-bottom:8px}
.ul li::marker{color:var(--acc-ink)}
.ul li b{font-weight:600}
.cols.one{grid-template-columns:minmax(0,760px)}
footer{border-top:1px solid var(--line);margin-top:64px;background:var(--soft)}
footer .wrap{padding-block:44px 28px;font-size:14px}
.ft-top{display:grid;grid-template-columns:1.4fr 1fr 1.2fr;gap:32px 48px;padding-bottom:32px}
.ft-brand .logo{width:150px;margin-bottom:14px}
.ft-brand p{margin:0;max-width:34ch;color:var(--muted);font-size:14px}
.ft-col{display:flex;flex-direction:column;gap:8px;min-width:0;overflow-wrap:anywhere}
.ft-col b{font:500 11.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.ft-col a{color:var(--fg)}
.ft-col a:hover{text-decoration:underline;text-underline-offset:3px}
.ft-ic{display:flex;gap:10px;margin-top:8px}
footer .fy{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;color:var(--fg)}
footer .fy:hover{border-color:var(--red);color:var(--red);text-decoration:none}
footer .fy svg{width:20px;height:20px}
.ft-bot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 24px;padding-top:20px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted)}
@media (max-width:760px){.ft-top{grid-template-columns:1fr;gap:28px}}
/* contacto */
.contact{padding-block:56px 8px}
.ct-head{max-width:64ch;margin-bottom:26px}
.ct-head h2{font-size:clamp(26px,4vw,36px);font-weight:800;margin:8px 0 12px}
.ct-head p{margin:0;font-size:16px;color:var(--muted)}
.ct-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:860px){.ct-grid{grid-template-columns:1fr}}
.ct-card{display:flex;flex-direction:column;gap:8px;padding:22px;border:1px solid var(--line);border-radius:16px;background:var(--soft);transition:border-color .15s,transform .15s}
.ct-card:hover{border-color:var(--fg);transform:translateY(-2px)}
.ct-ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--bg);border:1px solid var(--line);color:var(--red)}
.ct-ic svg{width:22px;height:22px}
.ct-card h3{font-size:19px;font-weight:700;margin-top:6px}
.ct-card p{margin:0;font-size:14.5px;color:var(--muted);flex:1}
.ct-link{margin-top:8px;font-weight:600;font-size:14px;text-decoration:underline;text-underline-offset:3px;overflow-wrap:anywhere}
.ct-note{margin:18px 0 0;font-size:13.5px;color:var(--muted)}
footer a.yt{text-decoration:underline;text-underline-offset:3px;color:var(--fg)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* desplegable de temas */
.dd{position:relative;flex:none}
.ddb{display:inline-flex;align-items:center;gap:8px;font:600 14px var(--sans);padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--fg);cursor:pointer}
.ddb:hover,.ddb[aria-expanded="true"]{background:var(--soft)}
.ddb .dot{width:8px;height:8px;border-radius:50%;background:var(--acc)}
.chev{width:7px;height:7px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(45deg) translateY(-2px);transition:transform .15s}
.ddb[aria-expanded="true"] .chev{transform:rotate(225deg) translateY(-1px)}
.ddp{position:absolute;left:0;top:calc(100% + 10px);width:340px;max-height:min(72vh,640px);overflow-y:auto;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:6px;box-shadow:0 18px 40px -18px rgba(0,0,0,.35);display:flex;flex-direction:column;z-index:40}
.ddp[hidden]{display:none}
.ddp .ddh{font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:8px 10px 6px}
.ddp a{display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:10px;color:var(--fg);text-decoration:none}
.ddp a:hover{background:var(--soft)}
.ddp a[aria-current="page"]{background:var(--acc-soft,var(--soft))}
.ddp b{flex:none;font:800 20px/1 var(--disp);width:28px;text-align:center;color:var(--acc-ink)}
.ddp span{display:flex;flex-direction:column;min-width:0}
.ddp strong{font-weight:600;font-size:14px;line-height:1.25}
.ddp small{color:var(--muted);font-size:12.5px;line-height:1.3}
@media (max-width:640px){.dd{position:static}.ddp{position:fixed;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));width:auto;top:calc(env(safe-area-inset-top,0px) + 66px)}}
.temas li.hit{outline:2px solid var(--acc);outline-offset:4px;border-radius:10px}

.back{display:inline-flex;align-items:center;gap:6px;flex:none;font:600 13.5px var(--sans);padding:7px 13px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--fg);white-space:nowrap}
.back:hover{background:var(--soft);border-color:var(--fg)}
.back[hidden]{display:none}
@media (max-width:560px){.back .bt{display:none}.back{padding:7px 11px}}
@media (max-width:480px){.hdr .logo{display:none}.hdr .wrap{gap:4px}nav.main{gap:0;margin-left:0}nav.main a{padding:7px 6px;gap:5px;font-size:13px}nav.main a::before{width:6px;height:6px}}
</style>

.mk-sg{margin-top:6px;padding-top:12px;border-top:1px solid var(--line);font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase}
.mk-sn{display:block;font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.45}

.rp-btn{display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:0 18px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font:600 14px var(--sans,system-ui,sans-serif);cursor:pointer;text-decoration:none}
.rp-btn:hover{border-color:var(--fg)}.rp-btn.acc{background:var(--fg);color:var(--bg);border-color:var(--fg)}

  window.addEventListener('load',function(){
   navigator.serviceWorker.register('sw.js').then(function(reg){
    var first=!navigator.serviceWorker.controller;
    reg.addEventListener('updatefound',function(){var w=reg.installing;if(!w)return;
     w.addEventListener('statechange',function(){if(w.state==='activated')toast(first?'Ja pots usar el portal sense connexió.':'Portal actualitzat: recarrega per veure les novetats.')})})
   }).catch(function(){})});
  window.addEventListener('beforeinstallprompt',function(e){
   e.preventDefault();dp=e;if(btn)return;
   btn=document.createElement('button');btn.type='button';btn.className='mk-inst';btn.textContent='Instal·la l’app';
   btn.onclick=function(){dp.prompt();dp.userChoice.finally(function(){btn.remove();btn=null;dp=null})};
   document.body.appendChild(btn)});
  window.addEventListener('appinstalled',function(){if(btn){btn.remove();btn=null}});
 }catch(_){}
})();
</script><!--/mk-js--></body></html>
