name: Proves del portal

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * 1'   # cada dilluns, per detectar problemes sense haver canviat res
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: proves-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proves:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tests/package.json
      - name: Instal·la dependències
        working-directory: tests
        run: npm install --no-audit --no-fund
      - name: Memòria cau de Chromium
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('tests/package.json') }}
      - name: Instal·la Chromium
        working-directory: tests
        run: |
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" = "true" ]; then
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps chromium
          fi
      - name: Comprova que la compilació està al dia
        run: node tools/build.js --check
      - name: Valida el contingut (enllaços, alt, SEO, sitemap, JSON)
        run: node tools/validate.js
      - name: Proves
        working-directory: tests
        run: |
          set -o pipefail
          node run.js 2>&1 | tee ../proves.log
      - name: Accessibilitat (teclat i lector de pantalla)
        working-directory: tests
        run: node a11y.js
      - name: WCAG 2.2 AA (foco, objectius, reflux, zoom, etiquetes)
        working-directory: tests
        run: node wcag.js
      - name: Funcions (assistent, recorregut, vídeo, còpia, QR)
        working-directory: tests
        run: node features.js
      - name: Compte (inici de sessió, sincronització i esborrat amb Firebase simulat)
        working-directory: tests
        run: node cuenta.js
      - name: Resum
        if: always()
        run: |
          {
            echo "### Proves del portal"
            if grep -q "comprovacions correctes" proves.log; then
              echo "✅ $(grep 'comprovacions correctes' proves.log | tail -1)"
            else
              echo "❌ Hi ha comprovacions que fallen:"
              echo '```'
              grep '✗' proves.log | head -40 || true
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Desa el registre si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: registre-proves
          path: proves.log
          retention-days: 14

  webkit:
    name: WebKit (Safari / iPhone)
    runs-on: ubuntu-latest
    continue-on-error: true  # informativo: ver nota en «publica»
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tests/package.json
      - name: Instal·la dependències
        working-directory: tests
        run: npm install --no-audit --no-fund
      - name: Instal·la WebKit
        working-directory: tests
        run: npx playwright install --with-deps webkit
      - name: Proves a WebKit
        working-directory: tests
        run: node webkit.js
      - name: Desa les captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: captures-webkit
          path: tests/webkit-out
          retention-days: 7

  visual:
    name: Proves visuals (informatiu)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Les captures de referència es generen en una altra màquina: les tipografies del sistema poden canviar uns píxels.
    # Per això no bloqueja; mostra les diferències com a artefacte. En local: node tests/visual.js
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tests/package.json
      - name: Instal·la dependències
        working-directory: tests
        run: npm install --no-audit --no-fund
      - name: Instal·la Chromium
        working-directory: tests
        run: npx playwright install --with-deps chromium
      - name: Compara les captures
        working-directory: tests
        run: node visual.js
      - name: Desa les diferències
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diferencies-visuals
          path: tests/visual/_diff
          retention-days: 14

  publica:
    name: Publica a GitHub Pages (només si les proves passen)
    # Inactiu fins que a Settings → Pages l'origen sigui «GitHub Actions» i es creï la variable de repositori
    # DEPLOY_WITH_ACTIONS = true. Mentrestant, Pages continua publicant des de la branca com fins ara.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.DEPLOY_WITH_ACTIONS == 'true'
    needs: [proves]  # WebKit no bloquea: hoy falla al instalar sus dependencias en ubuntu-latest (no es un fallo del portal)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepara el lloc (sense fonts, proves ni eines)
        run: |
          mkdir _site
          rsync -a --exclude='.git' --exclude='.github' --exclude='tests' --exclude='tools' --exclude='latex' --exclude='desktop' --exclude='docs' --exclude='node_modules' --exclude='_site' ./ _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
