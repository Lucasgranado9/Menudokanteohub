<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0}img{max-width:100%}[hidden]{display:none!important}
:root{
  --bg:#ffffff; --fg:#111111; --muted:#68646e; --line:#e7e3ee; --soft:#f6f3fa; --strong:#111111; --on:#ffffff;
  --red:#c8102e;
  --acc:#6d28d9; --acc-ink:#6d28d9; --on-acc:#ffffff; --acc-soft:#efe8fb;
  --warn:#f2b705;
  --lab-bg:#f3effa; --lab-line:#c9b8ec;
  --disp:"Inter Tight","Helvetica Neue",Arial,sans-serif; --sans:"IBM Plex Sans",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace; --serif:"IBM Plex Serif",Georgia,serif;
  --lgA:url("img/logo-a.png"); --lgB:url("img/logo-b.png");
  --figf:none;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e0c12;--fg:#f2eff6;--muted:#a49fb0;--line:#2a2535;--soft:#17131f;--strong:#f2eff6;--on:#0e0c12;--red:#ff4d63;--acc:#a78bfa;--acc-ink:#b9a2fb;--on-acc:#120826;--acc-soft:#221a38;--lab-bg:#17121f;--lab-line:#3a2f55;--figf:invert(.9) hue-rotate(180deg);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e0c12;--fg:#f2eff6;--muted:#a49fb0;--line:#2a2535;--soft:#17131f;--strong:#f2eff6;--on:#0e0c12;--red:#ff4d63;--acc:#a78bfa;--acc-ink:#b9a2fb;--on-acc:#120826;--acc-soft:#221a38;--lab-bg:#17121f;--lab-line:#3a2f55;--figf:invert(.9) hue-rotate(180deg);color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth;scroll-padding-top:84px}
body{background:var(--bg);color:var(--fg);font:15px/1.6 var(--sans);margin:0;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
a{color:inherit;text-decoration:none}
.gut{padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.wrap{max-width:1120px;margin:0 auto}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:6px}
.logo{position:relative;display:block;aspect-ratio:900/458}
.logo::before,.logo::after{content:"";position:absolute;inset:0}
.logo::before{background:var(--fg);-webkit-mask:var(--lgA) center/contain no-repeat;mask:var(--lgA) center/contain no-repeat}
.logo::after{background:var(--red);-webkit-mask:var(--lgB) center/contain no-repeat;mask:var(--lgB) center/contain no-repeat}

/* cabecera */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hdr .wrap{display:flex;align-items:center;gap:14px;height:62px}
.hdr .logo{height:44px;flex:none;width:auto}
.hdr .sub{font:800 15px var(--disp);letter-spacing:-.02em;color:var(--acc-ink);display:flex;align-items:center;gap:8px;white-space:nowrap}
.hdr .sub::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--acc)}
nav.main{display:flex;gap:2px;margin-left:auto;overflow-x:auto;scrollbar-width:none}
nav.main::-webkit-scrollbar{display:none}
nav.main a{display:inline-flex;align-items:center;font-size:14px;padding:7px 12px;border-radius:999px;white-space:nowrap;color:var(--muted)}
nav.main a:hover{color:var(--fg);background:var(--soft)}
nav.main a[aria-current="page"]{color:var(--fg);background:var(--acc-soft);font-weight:600}
.ico{flex:none;width:36px;height:36px;border-radius:999px;border:1px solid var(--line);background:none;color:var(--fg);display:grid;place-items:center;cursor:pointer}
.ico svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.6}
.ico:hover{border-color:var(--acc)}
@media (max-width:760px){.hdr .sub{display:none}.hdr .logo{height:38px}nav.main a{padding:7px 9px}}

h1,h2,h3{font-family:var(--disp);letter-spacing:-.03em;text-wrap:balance;margin:0}
.lbl{font:500 11.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 20px;border-radius:999px;border:1.5px solid var(--fg);font-weight:600;font-size:14.5px;cursor:pointer;background:none;color:var(--fg);font-family:inherit}
.btn:hover{background:var(--soft)}
.btn.acc{background:var(--acc);border-color:var(--acc);color:var(--on-acc)}
.btn.acc:hover{opacity:.88}
.btn.sm{min-height:36px;padding:0 14px;font-size:13.5px}

/* portada */
.hero{padding-block:clamp(40px,7vw,80px) clamp(28px,5vw,48px);border-bottom:1px solid var(--line);background:linear-gradient(180deg,var(--acc-soft),var(--bg))}
.hero .grid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:40px;align-items:center}
@media (max-width:860px){.hero .grid{grid-template-columns:1fr}}
.hero h1{font-size:clamp(46px,9vw,92px);font-weight:800;line-height:.95;margin:10px 0 16px;color:var(--acc-ink)}
.hero p.lead{font-size:17px;color:var(--muted);max-width:52ch;margin:0 0 24px}
.hero .cta{display:flex;flex-wrap:wrap;gap:10px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat{padding:16px 18px;border:1px solid var(--line);border-radius:14px;background:var(--bg)}
.stat b{display:block;font:800 36px/1 var(--disp);letter-spacing:-.05em;color:var(--acc-ink)}
.stat span{font-size:13px;color:var(--muted)}
section.blk{padding-block:40px 8px}
.sh{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.sh h2{font-size:24px;font-weight:700}
.find{width:min(320px,100%);min-height:40px;border:1px solid var(--line);border-radius:999px;padding:0 16px;background:var(--bg);color:var(--fg);font:inherit;font-size:14px}
.find:focus{outline:2px solid var(--acc);border-color:var(--acc)}

/* índice de temas */
.tlist{border-top:1px solid var(--line)}
.tema{border-bottom:1px solid var(--line)}
.tema>summary{list-style:none;display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:14px;align-items:center;padding:16px 4px;cursor:pointer}
.tema>summary::-webkit-details-marker{display:none}
.tema>summary:hover{background:var(--soft)}
.tema .ab{font:800 30px var(--disp);letter-spacing:-.05em;color:var(--acc-ink)}
.tema .tt b{display:block;font:700 18px var(--disp);letter-spacing:-.02em}
.tema .tt small{color:var(--muted);font-size:13px}
.tema .chev{width:22px;height:22px;transition:transform .15s;color:var(--muted)}
.tema[open] .chev{transform:rotate(90deg)}
.tema .body{padding:2px 4px 22px 78px;display:grid;gap:4px}
@media (max-width:560px){.tema>summary{grid-template-columns:44px minmax(0,1fr) auto}.tema .ab{font-size:24px}.tema .body{padding-left:8px}}
.sec{display:grid;grid-template-columns:34px minmax(0,1fr);gap:8px;padding:8px 10px;border-radius:10px}
.sec:hover{background:var(--acc-soft)}
.sec .nn{font:600 13px var(--mono);color:var(--acc-ink);padding-top:2px}
.sec b{font-weight:600}
.sec .subs{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{display:inline-flex;align-items:center;gap:6px;font:500 12.5px var(--mono);padding:6px 12px;border-radius:999px;border:1px solid var(--lab-line);background:var(--lab-bg);color:var(--acc-ink)}
.chip:hover{background:var(--acc);color:var(--on-acc);border-color:var(--acc)}

/* laboratorios (tarjetas) */
.labgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.labc{display:flex;flex-direction:column;gap:6px;padding:18px;border:1px solid var(--lab-line);border-radius:14px;background:var(--lab-bg);transition:transform .15s,border-color .15s}
.labc:hover{border-color:var(--acc);transform:translateY(-2px)}
.labc .k{font:600 11.5px var(--mono);letter-spacing:.08em;color:var(--acc-ink);text-transform:uppercase}
.labc b{font:700 18px/1.2 var(--disp);letter-spacing:-.02em}
.labc p{margin:0;color:var(--muted);font-size:13.5px}
.labc i{font-style:normal;font-weight:600;font-size:13.5px;color:var(--acc-ink);margin-top:auto;padding-top:8px}

/* página de tema / apuntes */
.ph{padding-block:clamp(28px,5vw,48px) 22px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--acc) 7%,var(--bg))}
.crumbs{display:flex;gap:6px;flex-wrap:wrap;font:500 12.5px var(--mono);color:var(--muted);margin-bottom:12px}
.crumbs a:hover{color:var(--fg);text-decoration:underline}
.ph h1{font-size:clamp(30px,5.5vw,52px);font-weight:800}
.ph .ab{font:800 14px var(--mono);color:var(--acc-ink);letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px;display:block}
.tabs{display:flex;gap:4px;margin-top:20px;overflow-x:auto;scrollbar-width:none}
.tabs a{padding:8px 14px;font-weight:500;color:var(--muted);border-radius:999px;white-space:nowrap;font-size:14px}
.tabs a:hover{color:var(--fg);background:var(--soft)}
.tabs a[aria-current="page"]{color:var(--on-acc);background:var(--acc);font-weight:600}
.layout{display:grid;grid-template-columns:240px minmax(0,1fr);gap:48px;padding-block:32px}
@media (max-width:960px){.layout{grid-template-columns:1fr;gap:16px}}
aside.toc{position:sticky;top:84px;align-self:start;max-height:calc(100vh - 100px);overflow:auto;font-size:13.5px}
@media (max-width:960px){aside.toc{position:static;max-height:none}}
.toc h4{font:600 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.toc a{display:block;padding:5px 10px;border-left:2px solid var(--line);color:var(--muted)}
.toc a:hover{color:var(--fg)}
.toc a.on{color:var(--acc-ink);border-color:var(--acc);font-weight:600}
.toc a.s2{padding-left:22px;font-size:12.5px}
.toc .gap{height:10px}
.tocd>summary{cursor:pointer;font-weight:600;padding:8px 0;list-style:none}
.tocd>summary::-webkit-details-marker{display:none}
@media (min-width:961px){.tocd>summary{display:none}}
.note-main{min-width:0}
.pg-title{font-size:clamp(26px,4.2vw,38px);font-weight:800;margin-bottom:6px}
.pg-title .n{color:var(--acc-ink);margin-right:10px}

/* prosa */
.prose{font-size:16px;line-height:1.7;max-width:76ch}
.prose p{margin:0 0 14px}
.prose h3{font-size:21px;font-weight:700;margin:34px 0 10px;scroll-margin-top:84px}
.prose h3 .n{font:600 14px var(--mono);color:var(--acc-ink);margin-right:10px}
.prose ul,.prose ol{padding-left:22px;margin:0 0 14px}
.prose li{margin-bottom:6px}
.prose li::marker{color:var(--acc-ink)}
.prose strong{font-weight:600}
.prose blockquote{margin:18px 0;padding:14px 18px;border-left:4px solid var(--acc);background:var(--acc-soft);border-radius:0 12px 12px 0}
.prose blockquote p:last-child{margin-bottom:0}
.prose p.tip{padding:12px 16px;border-radius:12px;background:color-mix(in srgb,var(--warn) 16%,var(--bg));border:1px solid color-mix(in srgb,var(--warn) 45%,var(--bg))}
.prose p.note{color:var(--muted);font-size:14.5px}
.prose code{font:13px var(--mono);background:var(--soft);padding:1px 5px;border-radius:5px}
.tbl{overflow-x:auto;margin:16px 0;max-width:100%}
.prose table{border-collapse:collapse;font-size:14.5px;min-width:100%}
.prose th,.prose td{border-bottom:1px solid var(--line);padding:9px 12px;text-align:left;vertical-align:top}
.prose th{font:600 12px var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);border-bottom:2px solid var(--acc)}
.prose figure{margin:22px 0;padding:14px;border:1px solid var(--line);border-radius:14px;background:#fff;text-align:center}
.prose figure img{max-width:100%;height:auto;filter:var(--figf);display:inline-block}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .prose figure{background:#14111b}}
:root[data-theme="dark"] .prose figure{background:#14111b}
.prose figcaption{font-size:13.5px;color:var(--muted);margin-top:10px;text-align:left}
.prose figcaption b{color:var(--fg)}
.katex{font-size:1.06em}
.katex-display{overflow-x:auto;overflow-y:hidden;padding:4px 0;margin:14px 0}
.labcard{display:grid;gap:4px;margin:20px 0;padding:16px 20px;border:1.5px solid var(--lab-line);border-radius:14px;background:var(--lab-bg);transition:border-color .15s}
.labcard:hover{border-color:var(--acc)}
.labcard .k{font:600 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--acc-ink)}
.labcard b{font:600 16px/1.35 var(--sans)}
.labcard i{font-style:normal;font-size:13.5px;font-weight:600;color:var(--acc-ink)}

/* problemas */
.prob{border:1px solid var(--line);border-radius:14px;margin:0 0 16px;overflow:hidden}
.prob>h3{font-size:16px;padding:12px 18px;background:var(--acc-soft);margin:0!important}
.prob .st{padding:14px 18px 6px}
.prob details{border-top:1px dashed var(--line)}
.prob summary{cursor:pointer;padding:12px 18px;font-weight:600;color:var(--acc-ink);list-style:none}
.prob summary::-webkit-details-marker{display:none}
.prob summary::before{content:"▸ ";}
.prob details[open] summary::before{content:"▾ "}
.prob .so{padding:0 18px 8px}

/* pager */
.pager{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:40px;max-width:76ch}
.pager a{display:flex;flex-direction:column;gap:2px;padding:14px 16px;border:1px solid var(--line);border-radius:12px}
.pager a:hover{border-color:var(--acc);background:var(--acc-soft)}
.pager a.nx{text-align:right;grid-column:2}
.pager small{font:500 11px var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.pager b{font-weight:600;font-size:14.5px}

/* laboratorio 3D */
.labwrap{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start}
@media (max-width:900px){.labwrap{grid-template-columns:minmax(0,1fr)}}
.stage{width:100%;min-width:0;position:relative;border:1px solid var(--lab-line);border-radius:16px;overflow:hidden;background:var(--lab-bg);aspect-ratio:16/10;min-height:300px;touch-action:none}
@media (max-width:900px){.stage{aspect-ratio:4/3}}
.stage canvas{display:block;width:100%;height:100%;cursor:grab;touch-action:none}
.stage canvas:active{cursor:grabbing}
.stage .hint{position:absolute;left:12px;bottom:10px;font:500 11.5px var(--mono);color:var(--muted);pointer-events:none;background:color-mix(in srgb,var(--bg) 75%,transparent);padding:3px 8px;border-radius:999px}
.stage .nogl{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:var(--muted)}
.panel{border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:14px;background:var(--bg)}
.modes{display:flex;flex-wrap:wrap;gap:6px}
.modes button{font:500 13px var(--sans);padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:none;color:var(--muted);cursor:pointer}
.modes button[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:var(--on-acc);font-weight:600}
.ctl{display:grid;gap:4px}
.ctl label{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--muted)}
.ctl label output{font:600 13px var(--mono);color:var(--fg)}
.ctl input[type=range]{width:100%;accent-color:var(--acc);height:28px}
.ctl select{font:inherit;min-height:36px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg);padding:0 8px}
.rd{display:grid;gap:0;border-top:1px solid var(--line);margin:0}
.rd div{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.rd dt{color:var(--muted)}
.rd dd{margin:0;font:600 13px var(--mono);text-align:right}
.panel .row2{display:flex;gap:8px;flex-wrap:wrap}
.labtext{margin-top:20px;max-width:76ch;color:var(--muted)}
.labtext b{color:var(--fg)}
.wave2d{width:100%;height:90px;border:1px solid var(--line);border-radius:10px;background:var(--bg);display:block}

/* formulari / apunts */
.fgroup{margin-bottom:44px}
.fgroup>h2{font-size:24px;padding-bottom:10px;border-bottom:2px solid var(--acc);margin-bottom:6px}
.fgroup>h2 span{color:var(--acc-ink);margin-right:10px;font-family:var(--mono);font-size:15px}
.pdfbox{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px;padding:20px 22px;border:1.5px solid var(--lab-line);border-radius:16px;background:var(--lab-bg)}
.pdfbox b{font:700 18px var(--disp)}
.pdfbox p{margin:2px 0 0;color:var(--muted);font-size:13.5px}
footer{border-top:1px solid var(--line);margin-top:64px}
footer .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px 32px;padding-block:24px 32px;font-size:12.5px;color:var(--muted)}
footer .logo{height:48px;width:auto}
footer a.u{text-decoration:underline;text-underline-offset:3px;color:var(--fg)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

/* desplegable de temas */
.dd{position:relative;flex:none}
.ddb{display:inline-flex;align-items:center;gap:8px;font:600 14px var(--sans);padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--fg);cursor:pointer}
.ddb:hover,.ddb[aria-expanded="true"]{background:var(--soft)}
.ddb .dot{width:8px;height:8px;border-radius:50%;background:var(--acc)}
.chev{width:7px;height:7px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(45deg) translateY(-2px);transition:transform .15s}
.ddb[aria-expanded="true"] .chev{transform:rotate(225deg) translateY(-1px)}
.ddp{position:absolute;left:0;top:calc(100% + 10px);width:340px;max-height:min(72vh,640px);overflow-y:auto;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:6px;box-shadow:0 18px 40px -18px rgba(0,0,0,.35);display:flex;flex-direction:column;z-index:40}
.ddp[hidden]{display:none}
.ddp .ddh{font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:8px 10px 6px}

<script>window.DATA={"autors": [{"id": 1, "key": "platon", "title": "Plató", "full": "Plató", "dates": "428 – 348 aC", "era": "Filosofia antiga", "tag": "Teoria de les Idees, dualisme i polis ideal", "hue": 195, "obres": "Apologia, Fedó, El Banquet, La República, Timeu", "secs": [{"n": 1, "num": "1.4.1", "title": "Vida", "subs": [], "html": "<p>neix a Atenes (o a l'illa pròxima d'Egina) l'any 428 aC. I mor l'any 348 aC. Aquest llarg període de 80 anys és important per a Atenes perquè va passar per diferents moments polítics que influiran en la vida del filòsof. El seu nom vertader era Aristocles, i \"Plató\" (en grec, amplada) fou el sobrenom que van posar a causa de l'amplada de les seves espatlles o del seu front.<\/p>\n<p>Era de família aristocràtica, fill d'Ariston, descendent d'un rei que es considerava emparentat amb el déu Poseidó, i Perictione, també \"descendent\" llunyana del mateix déu (val a dir que fent-se descendents dels déus els aristoi asseguraven la seva superioritat).<\/p>\n<p>Va rebre una de les millors educacions de l'època, tenint en compte que es va formar a casa del seu padrastre, amic de Pèricles, i que va viure a l'època de màxima esplendor d'Atenes. Atenes era una polis democràtica que, dirigida per Pèricles, va intentar convertir-se en un imperi, la qual cosa va provocar un enfrontament amb les polis properes, la Guerra del Peloponès, que va perdre. Essent Plató adolescent va morir Pèricles i el Consell de la ciutat, tot deixant-se influir a vegades per interessos particulars, va començar a imposar restriccions a les llibertats dels ciutadans. Quan va acabar definitivament la guerra, amb la crisi provocada per l'ocupació dels enemics espartans i mentre la majoria de l'exèrcit es trobava a Egea refent-se, els aristòcrates conservadors, dirigits especialment per dos parents de Plató (Crities i Carmides) forçaren l'Assemblea per tal que cedís la sobirania a un consell de trenta ciutadans. Aquests van prometre tornar la ciutat a la normalitat, però el seu comportament, eliminant els seus adversaris polítics i segrestant el poder de les institucions , va fer que se'ls anomenés els Trenta Tirans. Quan l'exèrcit dels demòcrates va tornar a Atenes un any després va restaurar-se ràpidament la democràcia. Amb tots aquests canvis, però, la democràcia atenenca havia perdut les seves forces.<\/p>\n<p>Totes aquestes confabulacions havien fet minvar la confiança dels ciutadans en el govern del seu poble, i per això es començà a témer als innovadors intel·lectuals que proposaven la revisió de les tradicions. Aquí és on succeeix l'episodi de la mort de Sòcrates, el gran mestre de Plató. Un cop mort aquest, Plató va fugir a Megara amb altres socràtics. És possible que després viatges per la riba sud de la Mediterrània i conegués Egipte i Cirenne. Més tard, va romandre a Tàrent (sud d'Itàlia), on conegué el pitagorisme, i a l'illa de Sicília. També sembla que es va relacionar amb Cràtil, famós heraclitià. Part de la vida de Plató està marcada per tres viatges que va fer a Siracusa (polis siciliana) per donar a conèixer el que va ser el seu model d'estat perfecte. El model va fracassar.<\/p>\n<p>Plató Des de la part més acadèmica, Plató donava classes i escrivia llibres. Sabem molt poc de les seves lliçons, però coneixem les seves obres que estaven pensades per divulgar la seva filosofia i mostrar el mètode socràtic. Per aquesta raó, reprodueixen en forma de diàleg les discussions entre diferents interlocutors, un d'ells, quasi sempre Sòcrates. Això és el que s'anomenen els diàlegs de Plató. S'ha de tenir en compte que Plató no va escriure un sistema filosòfic complet, ordenat, acabat, sinó que la seva obra és un continu diàleg amb les mateixes qüestions des de dificultats o plantejaments diferents; per això, és important tenir en compte l'evolució de les seves idees.<\/p>", "min": 3}, {"n": 2, "num": "1.4.2", "title": "Obra", "subs": [{"id": "s2-1", "num": "2.1", "title": "Diàlegs Socràtics de Joventut"}, {"id": "s2-2", "num": "2.2", "title": "Diàlegs de transició"}, {"id": "s2-3", "num": "2.3", "title": "Diàlegs de maduresa"}, {"id": "s2-4", "num": "2.4", "title": "Diàlegs d’última etapa (maduresa i pragmatisme polític)"}], "html": "<p>Per analitzar l’obra extensa de Plató, ens basarem en la col·lecció de Plató de l'editorial Gredos organitza els diàlegs seguint un ordre temàtic i cronològic que facilita l'estudi exhaustiu de la seva obra. A continuació, estructuro els diàlegs basant-me en aquesta col·lecció i en el marc cronològic generalment acceptat:<\/p>\n<figure><img loading=\"lazy\" src=\"filo/platon_00.jpg\" alt=\"\"><\/figure>\n<h3 id=\"s2-1\"><span class=\"n\">2.1<\/span>Diàlegs Socràtics de Joventut<\/h3>\n<p>En aquesta etapa, Plató està profundament influenciat per Sòcrates i empra els diàlegs per immortalitzar les seves ensenyances i mètodes. Les obres es caracteritzen pel diàleg socràtic, en què es busca la definició de conceptes ètics i humans mitjançant preguntes i respostes.<\/p>\n<ul>\n<li>Apologia de Sòcrates: Defensa de Sòcrates davant el tribunal.<\/li>\n<li>Critó: Reflexiona sobre la justícia i l’obligació d’obeir les lleis.<\/li>\n<li>Eutifró: Un debat sobre la naturalesa de la pietat i la seva relació amb la justícia.<\/li>\n<li>Ion: Breu discussió sobre la inspiració artística i la poesia.<\/li>\n<li>Lisis: Tracta sobre l’amistat i els vincles personals.<\/li>\n<li>Càrmides: Cerca la definició de la temperança (sòfrosine).<\/li>\n<li>Hípies Major i Hípies Menor: Discutides definicions de la bellesa (Major) i si és millor actuar amb coneixement o per ignorància (Menor).<\/li>\n<li>Làques: Analitza el significat del coratge.<\/li>\n<li>Protàgores: Debat sobre si la virtut és una i si es pot ensenyar, en oposició al sofista Protàgores.<\/li>\n<\/ul>\n<h3 id=\"s2-2\"><span class=\"n\">2.2<\/span>Diàlegs de transició<\/h3>\n<p>Aquí, Plató comença a desenvolupar idees pròpies, com la teoria de les idees i la reminiscència, i planteja diàlegs amb major profunditat argumentativa.<\/p>\n<ul>\n<li>Gòrgies: Reflexió sobre la retòrica, el poder polític i la justícia.<\/li>\n<li>Menó: Discuteix si la virtut es pot ensenyar, introduint la teoria de la reminiscència.<\/li>\n<li>Menéxeno: Una obra que parodia els discursos fúnebres atenesos, destacant qüestions de retòrica i política.<\/li>\n<li>Eutidemo: Diàleg que explora l'erística (l'art d'argumentar pel simple plaer de guanyar) i la relació entre virtut i coneixement.<\/li>\n<li>Cratil: Discuteix la relació entre el llenguatge i la realitat, prefigurant qüestions lingüístiques modernes.<\/li>\n<\/ul>\n<h3 id=\"s2-3\"><span class=\"n\">2.3<\/span>Diàlegs de maduresa<\/h3>\n<p>Plató desplega el seu sistema filosòfic, combinant metafísica, epistemologia, política i ètica, amb obres més llargues i complexes.<\/p>\n<ul>\n<li>Fedó: Exposa la immortalitat de l’ànima i la separació entre cos i ànima.<\/li>\n<li>Fedre: Reflexiona sobre l’amor, l’ànima i la retòrica, amb un to més espiritual.<\/li>\n<li>El banquet (Simpòsium): Reflexió sobre l’amor, des del desig físic fins a la contemplació del Bé.<\/li>\n<li>La República: La seva obra mestra. Desenvolupa la teoria de la justícia, l'ànima tripartida, l’educació del filòsof-rei i l’al·legoria de la caverna.<\/li>\n<\/ul>\n<h3 id=\"s2-4\"><span class=\"n\">2.4<\/span>Diàlegs d’última etapa (maduresa i pragmatisme polític)<\/h3>\n<p>Plató es concentra en idees més pràctiques i sistemàtiques, sobretot en relació amb la política i la religió.<\/p>\n<ul>\n<li>Parmènides: Un dels diàlegs més tècnics, analitza la teoria de les idees amb rigor lògic i autoconscient.<\/li>\n<li>El Teetet: Discuteix la naturalesa del coneixement, plantejant que és percepció, opinió o recordació.<\/li>\n<li>El Sofista: Explora el concepte de l’ésser i la distinció entre realitat i aparença.<\/li>\n<li>El Polític: Reflexiona sobre les qualitats i funcions del governant ideal.<\/li>\n<li>El Fileb: Discuteix la relació entre plaer, intel·lecte i la vida bona.<\/li>\n<li>Timeu: Diàleg cosmològic sobre l’origen de l’univers i l’ordre del cosmos.<\/li>\n<li>Críties: Narra la història de l’Atlàntida, deixant el diàleg inacabat.<\/li>\n<li>Les Lleis: La seva obra més tardana i extensa, ofereix una visió pràctica de la política, amb regles per una societat governada per lleis, no per filòsofs.<\/li>\n<\/ul>\n<figure><img loading=\"lazy\" src=\"filo/platon_01.jpg\" alt=\"\"><\/figure>", "min": 3}, {"n": 3, "num": "1.4.3", "title": "Idees?", "subs": [], "html": "<p>Els filòsofs anteriors a Plató consideraren dues maneres d'accedir a la realitat :o bé a través d'allò que percebem amb els sentits i que se'ns mostra canviant (Heràclit) o bé a través d'allò que pensem i que és immutable (Parmènides). Plató recull totes dues i anomena de forma diferent la realitat coneguda: a allò que percebem ho anomena \"cosa\" i a allò que pensem, \"idea\".<\/p>\n<p>¿Com percebem les coses i com copsem les idees? Per respondre això recollirà la distinció de Parmènides entre la doxa (opinió), el coneixement sensible que tenim de les coses a partir dels sentits, i l’episteme (veritat), el coneixement racional que tenim de les idees a partir de la raó. Amb la doxa podem percebre les coses, però per saber què són hem de recórrer a l’episteme (per exemple, podem percebre un animal qualsevol, però per saber què és un animal hem de saber a què s'anomena animal, és a dir, hem de tenir la idea d'animal). Allò percebut a través dels sentits no és sempre igual sinó que és relatiu al moment i les condicions de la percepció (segurament després d'un temps aquell animal ja no sigui igual, però la idea del que és un animal seguirà sent la mateixa). En canvi, el que es copsa per la raó es manté sempre immutable (la idea d'animal seguirà sent la mateixa i per a tothom igual). A aquestes entitats immutables que serveixen per poder conèixer les coses, Plató les anomenà Idees (eidos, en grec forma). Però no hem de confondre aquesta concepció amb el que entenem normalment per idea. Nosaltres considerem que una idea és un concepte mental resultat d'un procés d'abstracció: la idea de llibre és el concepte mental que hem format després de conèixer molts llibres.<\/p>\n<figure><img loading=\"lazy\" src=\"filo/platon_02.jpg\" alt=\"\"><\/figure>\n<p>Per a Plató això no és així. No podem reconèixer un llibre sense saber què és un llibre, i el que és un llibre no existeix a la realitat sensible, perquè en aquesta trobem llibres concrets: de diferents colors, mides, temàtiques, però cap d'ells és la Idea de Llibre. Per a Plató les Idees són una realitat que existeix per si mateixa fora de la ment, i són, per tant, objectives, úniques (tot i que s'apliquen a moltes coses), absolutes (perquè són independents de les coses), immutables (perquè no varien mai) i eternes (perquè existeixen sempre). Ja els presocràtics havien mostrat l'existència d'entitats immutables i eternes, els pitagòrics, en concret, parlaven així dels objectes matemàtics com, per exemple, un triangle. El triangle formaria part d'aquestes realitats que Plató anomena Idees; en canvi, un senyal de trànsit que indica perill, seria una cosa triangular. Tant la Idea de Triangle com abans la d'Animal tenen en comú que són entitats abstractes que poden concretar-se de diferents maneres (la Idea d'Animal en una balena i la Idea de Triangle en el senyal de cediu el pas) i que existeixen independentment de les coses (si s'extingissin les balenes o no hi hagués senyals de trànsit, la Idea de Balena i la de Triangle continuarien existint). I, segons Plató, això passa amb totes les Idees que tenim a la ment: la d'Arbre, de Gos, de Justícia, de Bondat, etc. Només aquestes entitats són reals, perquè es mantenen sempre igual, i són eternes, la Idea d'Arbre sempre és la mateixa i encara que taléssim tots els arbres del planeta, no talaríem la Idea d'Arbre. Veiem aquí que Plató dona a les idees pràcticament les mateixes característiques que Parmènides donava a l’ésser. I és que si volem tenir un coneixement vertader (episteme), aquest ha de tenir aquestes característiques: si la Idea de Triangle canvies a cada moment i segons cada persona, seria impossible saber què és un triangle i molt més reconèixer-ne un.<\/p>\n<p>Plató diu que el que hi ha a la nostra ment és el coneixement de les Idees, però no aquestes, llavors, on són les Idees? Si definim les Idees per contraposició a les coses que percebem pels sentits, i les coses \"habiten\" en el món sensible, les Idees \"habiten\" en el seu món, el món de les Idees o món intel·ligible (ja que només podem accedir-hi per mitjà de l'intel·lecte). No hem d'entendre aquí que Plató parla d'un altre món físic, perquè les Idees són per naturalesa intangible, sinó d'un món en sentit metafòric o, com ell també diu, d'un gènere diferent de la realitat. El que vol afirmar clarament és que les Idees tenen un estatus diferent i independent dels éssers humans i és per això que es mantenen pures. Així, el que sigui la Bellesa no ha de decidir-ho un grup de persones, sinó que serà la mateixa Bellesa la que es farà present en el món sensible a través de les coses belles i el que cal és conèixer bé la Idea de Bellesa per reconèixer bé les coses belles, igual que el que cal és saber què és un llibre per reconèixer-ne un.<\/p>\n<figure><img loading=\"lazy\" src=\"filo/platon_03.jpg\" alt=\"\"><\/figure>\n<p>El que està fent Plató és presentar la realitat de dues maneres: des de les coses i des de les Idees. Com a món sensible i com a món intel·ligible. Però no només això, sinó que, en descriure el primer com a canviant i relatiu (com feia Heràclit) i el segon com a immutable i absolut (com feia Parmènides), el que està fent, des d'un punt de vista ontològic, és donar més importància a les Idees que a les coses (recordem l'exemple: si desapareixen els boscos del planeta no desapareix la Idea d'Arbre) . Per tant, el món dels objectes, de les coses, no és el vertader món sinó una imatge de la vertadera realitat, formada per les Idees que són la causa de l'existència de les coses (sense la Idea d'Arbre no hi hauria arbres en sentit estricte).<\/p>\n<p>Tot i que el món de les Idees és plural (perquè conté moltes Idees) igual que el món sensible (que conté moltes coses), hi ha una diferència clara i és que en el qual primer existeix unificació en tant que només hi ha una idea per a cada espècie de coses. D'aquesta manera una sola Idea es relaciona amb moltes coses, mentre que moltes coses es relacionen amb una Idea, Ara bé, com és possible això? Com és que una única Idea pot ser moltes coses en el món sensible? Aquí Plató s'està enfrontant amb el problema presocràtic del pas de la unitat a la multiplicitat, que en ell es transforma en la següent qüestió: quina relació hi ha entre el món de les coses o món sensible i el món de les Idees o món intel·ligible?<\/p>", "min": 6}, {"n": 4, "num": "1.4.4", "title": "Les teories de la participació (méthexis) i de la imitació (mimesis)", "subs": [], "html": "<p>Les coses es relacionen amb les Idees en la mesura que participen d'aquestes, són una part d'elles. Així un gos és un gos perquè participa de la Idea de Gos. Ara bé, les coses no participen només d'una única Idea sinó de totes aquelles incloses en la seva essència. Per exemple, el gos participa també de la Idea d'Ésser, d'Ésser viu, d'Animal, de Mamífer, etc. Aquesta teoria portaria a pensar que les Idees, que són úniques, també són múltiples en tant que totes les coses del món sensible que participen d'elles en són una part, però igual que no pensem que per moltes representacions que hi hagi d'un paisatge aquest es multiplica, tampoc es multipliquen les Idees.<\/p>\n<p>Per completar la relació entre les coses i les Idees introdueix la teoria de la imitació, segons la qual el que fan les coses és imitar les Idees, i per això s'hi assemblen, malgrat que no arriben mai a ser igual que elles, perquè en el món sensible, en estar tot sotmès al canvi, no es pot assolir la perfecció. Així, una cosa és bella perquè participa de la Idea de Bellesa o perquè la imita, però no hi ha cap cosa en aquest món que sigui la Bellesa en si mateixa. Plató accepta una certa comunicació entre les Idees pel fet que el món intel·ligible es troba ordenat, de forma que hi ha Idees \"menors\" que participen d'Idees \"majors\", segons la jerarquia dels gèneres i les espècies, per exemple, la Idea de Mamífer participa de la idea d'Animal i aquesta de la d'Ésser viu, etc. Al final de la cadena trobaríem la Idea suprema, la Idea de Bé, de la qual participen totes les Idees.<\/p>\n<p>Les Idees són, doncs, els models a partir dels quals existeix el món de les coses, el món que percebem, que no és res més que una imatge imperfecta de la vertadera realitat. Plató planteja la construcció d'aquest món per obra d'un Gran Artesà, el Demiürg (inspirant-se potser en el Nous d'Anaxàgores). Aquell no va crear el món del no-res (concepció que no apareixerà fins al cristianisme), sinó que el va construir a partir de la matèria Informe (sense forma), eterna i de l'espai buit, tot prenent com a model les Idees. Per això en el món sensible hi ha un cert ordre, com ara el moviment circular dels astres al voltant de la Terra (Plató recull, el geocentrisme de l'època), les estacions, el dia i la nit, etc. Remarquem els elements que Plató introdueix per arrodonir la teoria de la realitat: les Idees, la matèria i el lloc. Ells possibiliten l’existència de les coses: les idees perquè són el seu model, la matèria perquè fa concret el model i el lloc perquè representa l'espai on les coses poden existir tot i que és imperceptible pels sentits i incomprensible. Només és perceptible gràcies al raonament. Amb aquesta teoria Plató està rebutjant la concepció atomista segons la qual l'ordre de l'univers és deu a l'atzar<\/p>", "min": 3}, {"n": 5, "num": "1.4.5", "title": "El mite de la caverna", "subs": [], "html": "<p>Comencem a respondre la qüestió sobre l'epistemologia platònica fent una al·lusió al gust de Plató per la invenció i utilització de mites. Amb ell els mites tenen una utilitat pedagògica: coneixedor de la dificultat de les seves teories i amb l'objectiu de transmetre adequadament el seu coneixement, inventa històries que puguin il·lustrar de forma metafòrica i al·legòrica la seva filosofia. El mite més conegut del filòsof és l'anomenat mite de la caverna (La República, VII), en el qual explica la diferència entre els dos mons, els diferents nivells de coneixement i les dificultats de comprensió de la seva teoria. El mite ens descriu una caverna il·luminada per la llum d'un foc; entre el foc i el fons de la caverna hi ha un mur, darrere el qual unes persones parlen i caminen tot portant a sobre d'elles estàtues de persones, animals i d'altres objectes.<\/p>\n<figure><img loading=\"lazy\" src=\"filo/platon_04.jpg\" alt=\"\"><\/figure>\n<aside class=\"nota\"><p><i>No és difícil veure<\/i> <i>metafòricament en el mite la<\/i> <i>descripció dels dos mons<\/i> <i>platònics:<\/i><\/p><p><i><b>El món de les coses estaria<\/b><\/i> <i><b>representat, d'una banda,<\/b><\/i> <i><b>per les ombres que es veuen<\/b><\/i> <i><b>a la paret, que es mouen i<\/b><\/i> <i><b>no són gaire clares, i, de<\/b><\/i> <i><b>l'altra, per les estàtues<\/b><\/i> <i><b>que serien les coses<\/b><\/i> <i><b>sensibles i concretes.<\/b><\/i><\/p><p><i><b>El món de les Idees seria el<\/b><\/i> <i><b>món dels objectes clars i<\/b><\/i> <i><b>il·luminats pel Sol, que<\/b><\/i> <i><b>representen les realitats<\/b><\/i> <i><b>intel·ligibles, les<\/b><\/i> <i><b>dees,<\/b><\/i> <i><b>de les quals la que més<\/b><\/i> <i><b>destaca i nodreix les altres<\/b><\/i> <i><b>és el Bé (el Sol)<\/b><\/i> <i><b>.<\/b><\/i><\/p><p><b>Mite de la Caverna il·lustrat<\/b><\/p><\/aside>\n<p>El mur tapa les persones, però no les estàtues que porten i són aquestes estàtues les que queden projectades a la paret del fons de la caverna, en un efecte semblant al que es produeix en un espectacle d'ombres xineses. Descriu també uns éssers humans, lligats de cames i peus des de sempre, a l'altra banda del mur; la seva situació els obliga a veure només l’interior de la caverna, de manera que, per a ells, la realitat són les ombres dels objectes projectades a la paret i els sons deformats que els arriben. Plató explica que si agaféssim un d'aquests homes i, deslliurat, el portéssim al costat del foc, primer no podria obrir els ulls, després no acceptaria com a reals els objectes que estava veient, però al final, un cop acostumat a la nova situació, reconeixeria com a vertaderes realitats els objectes (les estàtues) dels quals abans només vela les ombres.<\/p>\n<p>I si se l'emportés fora de la cova reconeixeria, els objectes naturals clars i il·luminats per l'única font de vida: el Sol. Encara més, si després d'això se'l conduís de nou a l'interior de la cova i expliqués als seus companys presoners que el que consideraven real no són més que meres ombres de la realitat, aquests el prendrien per boig i el matarien si intentés deslliurar-los per mostrar-los-hi, no fos cas que ells també es tornessin bojos.<\/p>", "min": 2}, {"n": 6, "num": "1.4.6", "title": "El símil de la línia", "subs": [], "html": "<p>Immediatament abans de l'explicació d'aquest mite trobem també a La República una descripció del que per a Plató són els diferents graus de coneixement, en el que s'anomena el símil de la línia. Aquí torna a recollir la divisió de Parmènides entre el coneixement que ens proporcionen els sentits (doxa o opinió) i el que ens proporciona la raó (episteme o veritat). En el diàleg, Sòcrates convida el seu interlocutor Glaucó a imaginar una línia dividida en quatres parts desiguals:<\/p>\n<figure><img loading=\"lazy\" src=\"filo/platon_05.jpg\" alt=\"\"><\/figure>\n<p>Segons Plató, el desenvolupament de la ment humana passa en el seu recorregut des de la ignorància fins al coneixement per dos moments: el de la doxa i el de l'episteme. Tots dos es diferencien tant per la fiabilitat del coneixement que ens donen com pel seu objecte de coneixement. Farem aquest recorregut reprenent l'exemple de la Bellesa. Si pregunten a algú què és i ens comença a descriure determinades coses belles (per exemple, una obra d'art, una composició musical, una posta de sol, etc.), llavors, l'estat mental d'aquesta persona és un estat de doxa perquè només coneix imatges o còpies de la Bellesa. Si, en canvi, posseeix la noció mateixa de la Bellesa en si, en comparació amb la qual s'han de jutjar les coses belles, llavors l'estat de la seva ment és un estat d'episteme. En el primer cas, una persona pot saber que allò que descriu és bell perquè d'altres ho diuen o perquè s'ho imagina a partir de la seva experiència ; per això parlem d'opinió. En el segons cas, es pot saber què és la Bellesa en si perquè s'intueix i es reconeix quan es veu alguna cosa bella. Trobem, per tant, d'una banda, una diferència epistemològica, sabem més en el cas de l'episteme perquè la bellesa no pot ser només una cosa bella, i d'una altra, una diferència ontològica, allò que es coneix per opinió és molt menys real, perquè si no existís la Idea de Bellesa no podrien tampoc existir coses belles. Curiosament, nosaltres pensem que el que es coneix pels sentits és totalment fiable i important, però com ja van veure els presocràtics, per explicar el que percebem necessitem conèixer en profunditat allò que \"no es veu\" amb els sentits sinó amb la ment, en el cas de Plató, les Idees.<\/p>\n<p>Plató fila més prim i ens assenyala dos tipus de doxa i dos tipus d'episteme. El primer segment de la línia (la eikasia o sensació) correspon a aquell tipus de coneixement que es basa exclusivament en la percepció sensible, com per exemple que el bolígraf cau quan el deixo anar. Si estiguéssim al segon segment (la pistis o creença), potser podríem explicar que els cossos cauen perquè així ho hem observat molts cops. En la dianoia o raonament discursiu ens veuríem impulsats a buscar conclusions a partir de les hipòtesis que tenim, fent us de les matemàtiques, per arribar a formular una teoria com, segons l'exemple, la de la gravetat. En l'últim esglaó, la noesi o intuïció descobriríem que sense les Idees de Cos, de Número, de Llei..., i la seva relació, no és possible fer cap de les afirmacions que hem fet i que intuint intel·lectualment aquestes idees podem respondre la qüestió vertaderament. Aquest últim és el saber absolut, el coneixement directe de les Idees on no arriba tothom. Els sofistes, per exemple, es situaríem en la pistis, perquè el seu relativisme suposa que l'únic important és tenir una explicació convincent de les coses, que mai és definitiva.<\/p>\n<p>A més a més, el símil de la línia es relaciona directament amb el mite de la caverna perquè a part dels graus o tipus de coneixement, Plató parla dels diferents graus d'ésser que hi ha, establint així un paral·lelisme entre les seves concepcions ontològica (hi ha diferents formes d'éssers) i epistemològica (hi ha diferents formes de conèixer). Així, l'objecte de la sensació són les imatges (les ombres , del mite de la caverna); l'objecte de la creença són les coses naturals, els éssers vius i els objectes artificials (les estàtues del mite); l'objecte del raonament discursiu són les entitats matemàtiques; i l'objecte de la intuïció són les Idees (la realitat exterior a la caverna)<\/p>", "min": 4}, {"n": 7, "num": "1.4.7", "title": "La dialèctica i la teoria de la reminiscència", "subs": [], "html": "<p>El camí cap al coneixement intuïtiu és possible gràcies a un mètode: la dialèctica. Aquest és un procés fonamentat en el diàleg i l'anàlisi dels conceptes que ens ajuda a anar del coneixement sensible de les coses a la intuïció directa de les Idees i de la seva jerarquia, arribant així \"al que és en si cada cosa sense cap sensació i per mitjà de la raó\". I, així, quan algú utilitza la dialèctica \"per a enlairar-se cap a l'essència de les coses, no desisteix fins a aconseguir per mitjà de la intel·ligència allò que constitueix el Bé en si, arriba realment al que és intel·ligible\" (La República). Aquest procés també es pot recórrer a l'inrevés, tot reconstruint la jerarquia de les Idees sense recórrer als sentits, és el que s'anomena dialèctica descendent.<\/p>\n<p>La dialèctica necessita del recolzament d'una teoria, la teoria de la reminiscència (anamnesis), sense la qual no quedaria del tot explicat com es desencadena el procés cap a l'autèntic coneixement. La teoria de la reminiscència defensa la tesi \"conèixer és recordar\". Per explicar-la, Sòcrates fa que un esclau, sense cap formació, descobreixi els fonaments de la geometria. I com ho fa? A partir de preguntes adients provoca que l'esclau trobi les solucions per si mateix. Això demostra segons Plató que el que podem saber de les coses ja ho hem après i que quan diem que ho aprenem, realment el que fem és recordar-ho. La pregunta és:<\/p>\n<p>si ja ho hem après abans de néixer, on, quan i com hem adquirit aquest coneixement? Si pensem que el vertader coneixement és el que ens proporciona la contemplació de les idees (noesis) i, si aquestes són eternes, llavors el coneixement és innat, és a dir ja existeix abans i independentment del nostre naixement.<\/p>\n<p>Plató ens ho explica, des d'un punt de vist poètic, a través d'un altre mite: el mite del tir alat (Fedre). En aquest ens descriu de forma metafòrica el món de les Idees com una cúpula supra celeste en la qual són totes. A aquest \"lloc\" no pot accedir el nostre cos perquè la seva naturalesa material no li permet, però sí la nostra ànima, que per a Plató és immortal i preexistent, tal com pensaven els pitagòrics. És la nostra ànima la que contempla les Idees després d'una imaginària cursa en la qual és representada per un tir i dos cavalls.<\/p>\n<figure><img loading=\"lazy\" src=\"filo/platon_06.jpg\" alt=\"\"><\/figure>\n<p>En aquesta cursa les ànimes més racionals (representades en el mite per l'auriga que controla els cavalls) arriben a dalt de la cúpula i aconsegueixen contemplar totes les idees. En canvi, les més irascibles, dominades per un dels cavalls (el de color blanc), es deixen portar pels honors terrenals; el mateix passa amb les més concupiscibles (dominades per l'altre cavall, el de color negre), que es deixen portar pels plaers.<\/p>\n<p>Totes dues volen tornar cap al món sensible i obliguen l'auriga a quedar-se a mig camí; són aquestes les que, després , tornaran al món sensible per encarnar-se en un cos oblidant tot el que han vist. I és per això que \"conèixer és recordar\", perquè és a partir de les coses que veiem en el món sensible com recordem les Idees que abans havíem contemplat al món intel·ligible. Per exemple, quan veiem un cos bell la nostra ànima reconeix en ell la Idea de Bellesa que havia contemplat. I així comença el camí de les ànimes més insatisfetes cap al coneixement: \"veient la bellesa d'aquest món i recordant la veritat, pren ales i, una vegada alada, desitja emprendre el vol\". En aquest procés Plató dona una importància primordial a l'amor (Eros), perquè és a partir de l'impuls cap a la possessió dels altres (desig) com l’ànima busca retrobar-se amb la Bellesa en si i, per tant, amb totes les altres Idees.<\/p>", "min": 3}, {"n": 8, "num": "1.4.8", "title": "El dualisme platònic", "subs": [], "html": "<p>Pel que hem dit, ja es pot saber que Plató té una concepció dualista de l'ésser humà, és a dir, creu que està format per un cos i per una ànima. Segons el mite del tir alat, l'ànima, després de la cursa amb la resta d'ànimes i segons hagi estat la seva conducta, \"cau\" al món sensible, es reencarna donant vida a un cos, sent d'aquesta forma principi de vida. D'aquesta unió accidental (és a dir, transitòria) sorgeixen els éssers humans, que són matèria (cos) animada (amb principi de vida). Plató presenta aquesta unió com un càstig per a l'ànima perquè el cos és una presó que no li permet contemplar directament les Idees, per la qual cosa desitja ser pura sense cap element material que la destorbi.<\/p>\n<p>Abans de continuar parlant de la naturalesa de l'ànima, seleccionarem dos arguments utilitzats per Plató, en el Fedó, per demostrar la seva immortalitat. Un d'aquests es basa en la simplicitat de l'ànima: si només es pot descompondre (i, per tant, morir) allò que és compost, i si l'ànima no es composta sinó simple (perquè en ser intangible s'assembla més a les Idees que no pas a les coses), l'ànima no pot morir, ja que comparteix les característiques de les Idees. Un altre argument es fonamenta en la teoria de la reminiscència: si conèixer és recordar les Idees i les Idees només les pot conèixer l'ànima, aquesta ha de ser necessàriament preexistent a la seva unió amb el cos.<\/p>\n<figure><img loading=\"lazy\" src=\"filo/platon_07.jpg\" alt=\"\"><\/figure>\n<figure><img loading=\"lazy\" src=\"filo/platon_08.jpg\" alt=\"\"><\/figure>\n<p>La naturalesa de l'ànima és tal que necessita, com afirmaven els pitagòrics, de la purificació, és a dir, desvincular-se per sempre del món material; i per això, el que ha de fer és apropar-se cada vegada més al món de les Idees, a través del coneixement. Mentre no ho faci del tot tornarà a reencarnar-se en un altre cos, és a dir, quan el cos mor, si l'ànima no ha assolit encara un grau de purificació transmigra a un altre cos i així fins a aconseguir la desitjada purificació.<\/p>\n<p>I, com l'aconsegueix? En l'ànima, tot i ser única, es poden distingir tres facultats: la racional, encarregada del coneixement (situada en el cap), la irascible, que persegueix els desitjos de noblesa com l'honor o la fama (situada al pit), i la concupiscible, que persegueix els plaers del cos com el sexe o el menjar (situada al ventre). Sembla que aquestes localitzacions no s'han de prendre al peu de la lletra, sinó més aviat interpretar-les com a punts d'interacció entre el cos i cadascuna de les funcions de l'ànima.<\/p>\n<p>Aquesta diferenciació de funcions la podem entendre si pensem en els conflictes que passen en la vida emocional i racional de qualsevol persona, com quan, per exemple, tenim un dilema entre el qual desitjaríem fer i el que pensem que hem de fer. Aquesta mena de conflictes són el que Plató plasma en el mite del tir alat, on l'ànima racional seria l'auriga, la irascible el cavall blanc i la concupiscible el cavall negre.<\/p>", "min": 3}, {"n": 9, "num": "1.4.9", "title": "La justícia com a virtut / les virtuts de l'ànima", "subs": [], "html": "<p>Tot i que cadascuna de les facultats de l'ànima té funcions diferents, la part racional és la més important per a Plató, ja que amb ella assolim el veritable coneixement i perquè la seva funció és també equilibrar totes les necessitats de l'ésser humà.<\/p>\n<p>Quan això s'aconsegueix, Plató diu que hem assolit la virtut, perquè ser virtuós vol dir fer ben fet allò que hem de fer. I com que cada facultat de l'ànima té una funció diferent, existeixen per a Plató tres tipus de virtuts que s'assoleixen quan cadascuna d'aquestes funcions es desenvolupa de forma correcta. Així, en aquells que destaca la facultat concupiscible, la virtut s'aconsegueix a través de la moderació, en aquells que preval la facultat irascible, la virtut serà el valor i, finalment, aquells en què predomini la facultat racional tindran com a virtut la prudència o saviesa.<\/p>\n<p>D'aquesta manera, l'ésser humà trobarà l’harmonia quan la racionalitat moderi de forma prudent la seva irascibilitat, fent-se fort per portar a terme les seves decisions, i atemperi la seva concupiscibilitat, no excedint-se en els seus desitjos. Aquest és, potser, un privilegi reservat al savi, que assolint-les totes adquireix la virtut per excel·lència: la justícia. En canvi, aquells que es deixen portar per les emocions i els plaers de forma desenfrenada només aconseguiran una vida desordenada i, per tant, infeliç.<\/p>\n<p>D'aquesta manera tornem a l'objectiu principal de Plató: si les persones amb una vida poc virtuosa són la majoria, ¿com aconseguir redreçar-les cap a una vida harmoniosa? Serà a través de l'educació com Plató pensa que cal obrir els ulls a les persones que encara viuen a la caverna.<\/p>\n<figure><img loading=\"lazy\" src=\"filo/platon_09.jpg\" alt=\"\"><\/figure>\n<figure><img loading=\"lazy\" src=\"filo/platon_10.jpg\" alt=\"\"><\/figure>", "min": 1}, {"n": 10, "num": "1.4.10", "title": "La polis ideal i l’educació", "subs": [{"id": "s10-1", "num": "10.1", "title": "L’educació i altres formes de govern"}], "html": "<p>Contestant la qüestió per l'ésser humà hem respost també la pregunta per l'ètica. Com ser feliç? Essent virtuós. Ara bé, hem de pensar que pel món grec l'acció individual no estava deslligada de l'acció social; és a dir, un individu no és considerat com a persona independent sinó com a ciutadà. Per això , el benestar individual depèn del benestar social i al contrari. Per tant, que els individus d'una societat siguin feliços depèn directament del tipus de govern que tinguin.<\/p>\n<figure><img loading=\"lazy\" src=\"filo/platon_11.jpg\" alt=\"\"><\/figure>\n<p>Tenint en compte les seves teories sobre el coneixement, sobre la realitat i sobre l'ésser humà, Plató, a La República i a Les Lleis, explica el que seria per a ell una societat ideal. Parteix del supòsit que no tothom està igualment preparat per naturalesa per portar a terme les diferents tasques que són importants en una societat. Per això, el més just és que cadascú faci aquelles feines per a les quals és especialment destre, aconseguint així la felicitat. Partint de la teoria sobre les facultats de l'ànima, Plató proposa que a la polis ideal haurien d'existir tres classes socials, dedicades a tres activitats diferents: els governants (en els que predomina la racionalitat), els guardians (en els que predomina la irascibilitat) i els productors (en els que predomina la concupiscibilitat). D'aquesta forma planteja una divisió del treball tenint en compte les aptituds individuals de cada ciutadà. Els productors (comerciants, artesans i pagesos) es dedicarien al treball necessari per a abastar Estat, ja que ells són els que gaudeixen d'aquests plaers (menjar, beguda ...). Per això, Plató pensa que podrien tenir família i propietat privada, tant de coses com de persones, tot i que la seva virtut haurà de ser la temperància. Els guardians haurien de ser els defensors de l'Estat davant l’agressió de qualsevol enemic perquè així podrien demostrar el seu coratge natural i aconseguir el reconeixement i l’honor que busquen. Per portar a terme bé les seves responsabilitats i aconseguir la seva virtut característica, el valor o coratge, seria necessari que tinguessin un tipus de vida comunitària, sense propietats privades ni famílies que els poguessin distreure de la seva funció. Per últim, els governants, la virtut dels quals és la prudència, haurien de sortir d'entre els guardians més coratjosos i intel·ligents i viurien també de forma comunitària.<\/p>\n<p>De la mateixa manera que la conducta moral ens condueix a la justícia, quan les tres facultats de l’ànima actuen harmònicament d'acord amb les tres virtuts, també l’Estat serà just si cadascuna de les classes socials es regeix per la virtut corresponent a la funció dominant de la seva ànima: s'exigirà prudència als governants, valor a les guerres i moderació als productors. Només si hi ha una relació harmònica entre les tres classes i s'aconsegueix que cada estament compleixi la funció que té assignada sense interferir en la dels altres, serà possible fer valer la justícia i s'assolirà l'objectiu de l'Estat: el bé comú o la felicitat de la comunitat.<\/p>\n<h3 id=\"s10-1\"><span class=\"n\">10.1<\/span>L’educació i altres formes de govern<\/h3>\n<p>Plató pensa que per aconseguir aquests objectius és importantíssim que els ciutadans estiguin instruïts, perquè l'educació és garantia d'un Estat just, no només perquè prepara els seus governants, sinó perquè fa entendre el sentit de l'estructura de la realitat. Per això, planteja un model educatiu per a tothom, sense diferències socials ni sexuals, un model en el qual la intel·ligència és el que compta. El pla d'estudis és molt guiat: el primer nivell, per a tothom, s'inicia des de la infància, dura fins als vint anys, i comporta un domini de les arts, concretament poesia, música i gimnàstica (recordem que els grecs feien gimnàstica acompanyats del ritme de l'oboè); en el segon nivell, després d'una selecció, els millors estudiaran matemàtica i astronomia durant deu anys més; finalment, els que passin a l'últim nivell s'exercitaran durant 5 anys en la dialèctica i hauran d'exercir un càrrec militar durant 15 anys per poder ser governants. D'aquesta forma, l'educació fa possible que tota persona que assoleixi el procés estigui preparada per governar.<\/p>\n<figure><img loading=\"lazy\" src=\"filo/platon_12.jpg\" alt=\"\"><\/figure>\n<p>Del que hem dit se'n deriva que, per a Plató, la millor forma de govern és l'aristocràcia o govern dels millors, ja que són aquests en tant que savis, i no la majoria, els que poden saber més que convé a una polis perquè pugui garantir la felicitat dels seus ciutadans. Com veiem, Plató proposa una societat classista fonamentada en diferències morals i intel·lectuals, però no econòmiques ni de llinatge. Amb això, està defensant un tipus de justícia segons la qual s'ha de donar a cadascú d'acord amb les seves pròpies capacitats, i no d'acord amb el principi d'igualtat que diu que s'ha de donar a tothom el mateix.<\/p>\n<p>La democràcia, descrita per ell com la llibertat absoluta, té com a conseqüència, una tirania com la que ell va viure a Atenes. En canvi, considera que l'Estat només funcionarà bé si els governants són savis i, com que els més savis són els filòsofs, els filòsofs són els que han de governar. Ara bé, Plató es va tornar més escèptic després de la seva experiència política a Siracusa, la qual li va fer modificar aquesta concepció. Donada la impossibilitat, per utòpica, d'un govern presidit per un filòsof rei, a Les Lleis, estableix la necessitat que sigui una bona legislació la que garanteixi l'aplicació de la justícia. D'aquesta manera ja tenim enquadrada tota la filosofia platònica des de l'intent de crear una societat ideal ordenada de forma racional, igual que és ordenat el món de les Idees que la justifica.<\/p>\n<p>Tot i que hem presentat com una filosofia compacta, cal recordar que Plató va anar incorporant modificacions a les seves teories a mesura que les analitzava i les intentava portar a la pràctica. Però, això no és res més que una conseqüència de la condició dialèctica de l'apropament al coneixement: de veritat només n'hi ha una, però el camí per arribar-hi no sempre és planer. A partir de Plató tota la filosofia portarà la seva empremta, inclosa la del seu primer crític, el seu deixeble Aristòtil.<\/p>", "min": 5}]}, {"id": 2, "key": "descartes", "title": "Descartes", "full": "René Descartes", "dates": "1596 – 1650", "era": "Racionalisme", "tag": "El mètode, el cogito i el dualisme", "hue": 262, "obres": "Discurs del mètode, Meditacions metafísiques, Principis de filosofia", "secs": [{"n": 1, "num": "3.1.2", "title": "Vida, Obra i Objectius", "subs": [], "html": "<p>(1596-1650) va néixer a La Haye (Turena, França) en el si d'una família de l'alta burgesia. Era el tercer fill d'un conseller del parlament de Rennes, i va rebre una bona educació a l'escola dels jesuïtes de La Flèche. De jove va passar per períodes de llarga convalescència a causa de la seva delicada salut, temps que va dedicar a llegir llibres de tota mena, entre ells de disciplines científiques i de filosofia. Ja en aquesta època es veu que el sorprèn que els filòsofs no es posin d'acord en les seves idees.<\/p>\n<p>Així explica ell aquest període: \"He estat criat en les lletres des de la meva infantesa; i com que em feien creure que amb elles es podia adquirir un coneixement clar i segur de tot allò que és útil per a la vida, tenia un gran desig d'aprendre-les. Però (...) vaig canviar enterament de parer perquè em trobava entrebancat per tants dubtes i errors que em semblava que no n'havia tret cap profit, en cas de procurar instruir-me, fora d'haver descobert, cada vegada més la meva ignorància. I això que estava en una de les escoles més famoses d'Europa.\" (Discurs del mètode).<\/p>\n<p>Un cop acabats els estudis de dret (1616) i dedicar-se durant un temps a la vida mundana d'un burges (esgrima, equitació...), es decanta l'any següent per la carrera militar i, arran de l'amistat amb Isaac Beeckman, per l'estudi matemàtic i físic. El 1619 retirat en un quarter i, \"ple d'entusiasme\" per la reflexió sobre \"els fonaments d'una ciència admirable\", té tres somnis que li mostren la seva vocació filosòfica. Així, un any després abandona la vida militar, ven la seva part de les rendes familiars i viatja per Europa. Als 33 anys es retira a Holanda, paradigma de la tolerància i la llibertat, disposat a treballar en la seva filosofia. Allí redactarà les seves obres filosòfiques més importants: Discurs del mètode (1637), Meditacions metafísiques (1641), Principis de filosofia (1644), Les passions de l'ànima (1649).<\/p>\n<p>Durant aquests temps no perd el contacte amb la vida intel·lectual del moment; coneix, per exemple, la condemna de Galileu i els atacs que, des de diversos nuclis culturals, es produeixen contra la seva pròpia filosofia. Viatja a França tres cops, on publica alguns dels seus llibres. A més a més, manté nombroses relacions epistolars amb alguns dels seus coetanis, els quals, a suggeriment seu, presenten objeccions al seu pensament, que ell respon. L'any 1649 accepta la invitació de la reina Cristina de Suècia d'establir-se a Estocolm per ensenyar-li filosofia. Allí Descartes morirà d'una pulmonia deguda al rigor de l'hivern.<\/p>\n<p>Els objectius de la filosofia de Descartes es plasmen clarament en la seva obra. Al Discurs del mètode manifesta la seva decisió de \"no recercar altres ciències que aquella que es pogués trobar en mi mateix o bé en el gran llibre del món\"; a les Meditacions Metafísiques comenta que \"tenia sempre un gran desig d'aprendre a distingir el ver del fals, per tal de veure-hi clar en les meves accions i caminar amb seguretat per la vida\". També, en la resposta a les objeccions de les Meditacions que li adreça el jesuïta Bourdin exposarà: \"he afirmat en molts<\/p>\n<p>René Descartes llocs dels meus escrits que imito els arquitectes en el fet que, per construir edificis sòlids en llocs on la roca, l'argila o qualsevol altre sol ferm estigui cobert per una capa sorrenca, primer excaven fosses i després n'extreuen tota la sorra i les altres coses barrejades amb ella, per a assentar els fonaments sobre sol ferm. Així doncs, jo he rebutjat primer totes les coses dubtoses com si fossin sorra.<\/p>\n<figure><img loading=\"lazy\" src=\"filo/descartes_00.jpg\" alt=\"\"><\/figure>\n<p class=\"cap\"><b>“Maison” on va néixer Descartes a La Haye en Touraine<\/b><\/p>\n<p>Així, Descartes, basant-se en la perspectiva històrica que li dona el seu temps, s'adona que no hi ha qüestió important sobre la qual no hi hagi disputes i, per tant, són totes motiu de dubte. En aquesta situació, la proposta de Descartes se centra a aconseguir, a partir de la reflexió individual, un fonament sòlid per a la filosofia que havia de servir-li també de guia per a la seva vida. No volia crear un nou sistema filosòfic, sinó ordenar el coneixement sobre bases sòlides. Hem de tenir en compte que quan Descartes parla de filosofia es refereix a una única ciència però amb disciplines diferents. Ell mateix ho representa mitjançant un arbre que té en les seves arrels la metafísica, en el seu tronc la física i en les seves branques les diferents ciències pràctiques. Des de la perspectiva filosòfica, però, les seves aportacions es donen en el que ell anomena metafísica, on trobem un dels temes principals: el mètode.<\/p>", "min": 4}, {"n": 2, "num": "3.1.3", "title": "El coneixement: un nou mètode per a la investigació filosòfica", "subs": [{"id": "s2-1", "num": "2.1", "title": "El mètode"}, {"id": "s2-2", "num": "2.2", "title": "Dues capacitats intel·lectuals"}, {"id": "s2-3", "num": "2.3", "title": "Les regles del mètode"}, {"id": "s2-4", "num": "2.4", "title": "L'aplicació del mètode: el dubte metòdic i la primera veritat"}, {"id": "s2-5", "num": "2.5", "title": "La primera veritat: «Penso, doncs existeixo»"}, {"id": "s2-6", "num": "2.6", "title": "El pensament i les idees"}], "html": "<h3 id=\"s2-1\"><span class=\"n\">2.1<\/span>El mètode<\/h3>\n<figure><img loading=\"lazy\" src=\"filo/descartes_01.jpg\" alt=\"\"><\/figure>\n<p>Com hem vist, Descartes considera bàsic que la recerca filosòfica es construeixi sobre uns bons fonaments i que segueixi un mètode. A la primera part del Discurs del mètode ens diu: \"el meu propòsit no és pas ensenyar el mètode que tothom ha de seguir per a dirigir bé la seva raó, sinó simplement mostrar de quina manera jo he procurat dirigir la meva\". Aquesta és precisament una aportació de Descartes que caracteritza l'actitud filosòfica dels filòsofs de l'època moderna: la construcció d'un sistema fonamentat en unes regles bàsiques de pensament, de forma que puguem aclarir, a partir d'elles, totes les qüestions filosòfiques importants. El punt de partida són, per tant, aquestes regles bàsiques de pensament, el mètode. Diu Descartes: \"per mètode entenc un seguit de regles certes i fàcils, gràcies a les quals tot aquell que les observi exactament no prengui mai quelcom fals per vertader i, sense cap despesa d'esforç mental, sinó per incrementar el seu coneixement pas a pas, arribi a una vertadera comprensió de totes aquelles coses que no sobrepassin la seva capacitat\" (Discurs del mètode). És a dir, com a bon racionalista,<\/p>\n<p>Descartes està pressuposant que si la ment segueix unes directrius rigoroses pot arribar a respondre's dubtes sobre les qüestions que se li plantegin de la mateixa manera que un geòmetra arriba a demostracions a partir de llargues cadenes de raonaments. El més important en aquest camí és no acceptar res com a vertader si no deriva dels nostres raonaments els quals han de fonamentar-se en principis sòlids. Si això és així, no hi pot haver coneixement que, per més difícil que sigui, no puguem arribar a descobrir. Si realment acceptem el propòsit del plantejament de Descartes haurem d'abandonar tot allò que pugui destorbar la raó en la seva recerca, és a dir, els prejudicis (judicis precipitats o sense fonament), provocats per les passions, les precipitacions o per la influència de l'autoritat, ja que, amb ells, la ment es distreu i no utilitza correctament les seves capacitats intel·lectuals.<\/p>\n<h3 id=\"s2-2\"><span class=\"n\">2.2<\/span>Dues capacitats intel·lectuals<\/h3>\n<p>Descartes, a les Regles per a la direcció de l'esperit, 1684, (obra inacabada precursora del Discurs) parla de la intuïció i la deducció, dues capacitats intel·lectuals \"mitjançant les qual s som capaços, enterament, sense por d'il·lusió de cap mena, d'arribar al coneixement de les coses\":<\/p>\n<ul>\n<li>La <i>intuïció<\/i> és una activitat pura i simple de la ment que es produeix quan copsem intel·lectualment quelcom de forma clara i distinta; \"apareix tan sense esforç i tan distintament a una ment atenta i no emboirada que quedem completament lliures de dubte quant a l'objecte de la nostra comprensió\".<\/li>\n<\/ul>\n<p class=\"cap\"><b>Discurs del mètode.<\/b> <b>Alianza Ed.<\/b><\/p>\n<ul>\n<li>La <i>deducció<\/i> és l'operació per la qual nosaltres entenem tot allò que es conclou necessàriament d'altres coses que ja coneixem amb certesa. És a dir, la deducció, a diferència de la intuïció no és immediata, sinó mediata, és un coneixement que consisteix a partir d'algunes coses que sabem amb total seguretat per arribar a unes altres que no sabíem.<\/li>\n<\/ul>\n<p>La intuïció pot atènyer nocions com la d'extensió, la de moviment i la de figura; també veritats indubtables com \"jo existeixo\", \"jo penso\"; i, finalment, lligams establerts entre diverses veritats, com per exemple la noció comuna \"dues coses iguals a una tercera són iguals entre elles\". Aplicada a un cas concret, aquesta noció ens permet afirmar que si 1+3=4 i 2+2=4, intuïtivament sabem que 1+3=2+2. No obstant això, Descartes s'adona que no sempre som conscients de l'evidència del coneixement intuïtiu i ens ho mostra a la Regla 12 quan escriu: \"sovint és més fàcil examinar diverses natures juntes que separar-ne una de les altres. Així, per exemple, puc conèixer un triangle encara que mai no m'hagi adonat que, en aquest coneixement es troba implícit el coneixement d'angle, de línia, etc.; tanmateix, això no ens impedeix de dir que la naturalesa del triangle es compon de totes aquestes naturaleses i que elles són millor conegudes que aquest triangle perquè són elles les que es troben compreses en ell.\" Intuïció i deducció són els camins més segurs cap al coneixement; però no són pròpiament el \"mètode\", perquè intuïció i deducció no són regles, sinó activitats de la ment. El mètode indica \"com usar la intuïció per no caure en l'error (...) i com ha de portar-se a terme la deducció per tal que nosaltres arribem al coneixement de totes les coses.\" (Regla 4)<\/p>\n<h3 id=\"s2-3\"><span class=\"n\">2.3<\/span>Les regles del mètode<\/h3>\n<p>Hem dit abans que el mètode és un seguit de regles certes i fàcils. Ara podríem afegir que aquestes regles ens ajudaran a emprar correctament la intuïció i la deducció. Descartes parla al Discurs de quatre regles, anomenades de l'evidència, de l'anàlisi, de la síntesi i de l'enumeració.<\/p>\n<ul>\n<li>Regla de <i>l'evidència<\/i> . Descartes parteix del fet que la seva ment té percepcions i que no totes són igual de creïbles. Així proposa acceptar només aquelles que siguin evidents, i evident és aquella percepció que la intuïció capta de manera clara i distinta. Una percepció és clara quan es presenta de forma òbvia i immediata a una ment atenta; una percepció és distinta quan és tan precisa que es diferencia perfectament de qualsevol altra, impossibilitant tota confusió. Tot això suposa que Descartes està introduint un nou criteri de veritat: un coneixement és vertader si és evident per a la raó (i no si s'adequa o no a la realitat, com pensava l'escolàstica medieval).<\/li>\n<li>Regla de l'anàlisi. Consisteix a dividir cadascuna de les dificultats que s'examini en tantes parts com sigui possible i com calgui per a resoldre-la millor. Descartes pensa que la divisió en parts d'un problema acaba en aquells elements que es poden reconèixer com a simples (que no poden dividir-se més); és el que ell anomena les naturaleses simples que són evidents per a la ment, i posa com a exemples la figura o l'extensió d'un cos. La regla de l'anàlisi és del tot imprescindible perquè la intuïció només percep de forma clara i distinta allò que és simple; i si copsem intel·lectualment quelcom complex, només podrem saber si és evident (cert), quan les seves parts simples també ho siguin.<\/li>\n<li>Regla de la <i>síntesi<\/i> . Un cop s'ha arribat a les naturaleses simples per mitjà de l'anàlisi i s'han copsat com a evidents, s'ha de reconstruir el procés de forma segura, és a dir,<\/li>\n<\/ul>\n<p>mitjançant la deducció. Deductivament, encadenarem les parts en què hem dividit el problema des de les més simples a les més complexes, de forma que la complexitat del problema es redueixi a relacions evidents entre parts simples igualment evidents. Descartes ens proposa tractar els problemes filosòfics com si fossin problemes matemàtics, en els que, per estar segurs de la correcció del resultat, cal seguir un procés en el qual cada pas sigui correcte. La conclusió és, per tant, que per a tenir seguretat respecte a una totalitat, l'hem de tenir sobre cadascuna de les parts, ja que una sola equivocació posa en perill la fortalesa o validesa de tota la cadena. Per a no equivocar-se, cal la darrera regla.<\/p>\n<ul>\n<li>Regla de <i>l'enumeració<\/i> . Aquesta obliga a fer recomptes i revisions de tot el procés. És una regla de segon grau que s'aplica a les dues anteriors: els recomptes comproven l'anàlisi i les revisions comproven la deducció. El propòsit d'aquesta regla és donar una visió global del procés i intentar evitar els errors que provenen de la debilitat de la memòria i de la precipitació.<\/li>\n<\/ul>\n<h3 id=\"s2-4\"><span class=\"n\">2.4<\/span>L'aplicació del mètode: el dubte metòdic i la primera veritat<\/h3>\n<p>Un cop Descartes ha clarificat el seu mètode, l'aplica a la investigació filosòfica perquè, com sabem, considera que la filosofia és l'arrel del coneixement. Així, pensa que el mètode ha de resoldre les qüestions bàsiques de la filosofia que, per a ell, són fonamentalment tres: l'existència de Déu, la de l'ànima i la del món. Això és el que intenta fer a les Meditacions Metafísiques.<\/p>\n<p>Descartes va començar aplicant la primera regla del mètode, l'evidència. Es va autoimposar analitzar tots els coneixements que ell tenia i així \"rebutjar com a absolutament fals tot allò en què pogués imaginar el més petit dubte, per tal de veure si després d'això quedava en la meva convicció alguna cosa que fos completament indubtable\". Per això, comença dubtant de tot el que és possible dubtar, és a dir, aplicant les qüestions metòdic, que representa l'obligació, per una banda, d'eliminar de la seva ment tots els coneixements que siguin dubtoses i, per l'altra, d'estar pendent de no incorporar-ne cap que no sigui clar i distint o que no es relacioni intuïtivament amb els que ja té.<\/p>\n<p>1. Així, repassant tot el que ell dona per evident, descobreix que és possible dubtar del nostre coneixement de la realitat externa, allò que anomenem món, perquè aquest coneixement prové dels nostres sentits i és fàcil recordar com aquests alguna vegada ens han enganyat: \"he observat que una torre que de lluny em semblava rodona, de prop la veia quadrada i que estàtues colossals, situades al capdamunt d'aquestes torres, em semblaven, vistes des de baix, petites figures\". Partint de la idea que no és bo fiar-se d'allò que alguna vegada ens ha enganyat, decideix no fiar-se de tots aquests coneixements que semblaven originar-se en els sentits, tant els externs com els interns.<\/p>\n<p>2. Descartes va més enllà en aquest recorregut que està fent per les coses que ell creia certes fins aleshores. Afirma que no només és possible dubtar del coneixement de les coses sinó també de la seva existència, perquè ha somiat moltes vegades coses que creia existents quan no era així: i, qui sap si la nostra vida no és un somni com havia suggerit Calderón de la Barca? Descartes planteja, doncs, la possibilitat de dubtar de les experiències personals en general, a causa de la dificultat de discernir la vigília del somni. És veritat que normalment ho sabem fer, però això no implica que sempre ho puguem fer. I si no tenim una certesa absoluta, hem de dubtar.<\/p>\n<p>3. Hi ha alguna cosa de la qual no puguem dubtar tant desperts com adormits? Descartes proposa les veritats matemàtiques perquè, per exemple, fins i tot en somnis dos i dos són quatre i els triangles tenen tres costats. Així i tot, contempla una nova possibilitat de dubte: podria ser que existís un poderós \"geni maligne\" que el fes pensar així, és a dir, el fes creure en l'evidència de les veritats matemàtiques. Tot i que és una hipòtesi poc probable, permet introduir el dubte, i per això la certesa de les veritats matemàtiques ha de ser qüestionada de moment.<\/p>\n<h3 id=\"s2-5\"><span class=\"n\">2.5<\/span>La primera veritat: «Penso, doncs existeixo»<\/h3>\n<p>Si Descartes no trobés una veritat que fos indubtable, el procés de coneixement no podria començar i només li quedaria com a solució l'escepticisme; però ell rebutja les opinions i la suspensió del judici i aspira a posseir certeses. I serà a través del mateix dubte com trobarà la primera veritat. Hi ha alguna cosa que és indubtable i és el fet que ell està dubtant, sigui en somnis o despert, sigui enganyat o no per un geni maligne, ell està dubtant i això és indubtable. I troba que l'acte de dubtar, que és una forma de pensar, manifesta de manera evident la seva existència, per això arriba a l'afirmació \"penso, doncs existeixo\" (en llatí \"cogito ergo sum\"). Un clar precedent d'aquest plantejament el constitueix la següent afirmació de Sant Agustí: \"Quan dubto si la veritat existeix o no ja hi ha una veritat certa, la qüestió. Veiem com Descartes ho explica al Discurs del mètode: \"vaig adonar-me que mentre volia pensar que tot era fals, era necessari que jo que pensava això, fos alguna cosa i vaig veure que aquesta veritat 'penso, doncs existeixo' era tan evident que ni les suposicions més extravagants dels escèptics podien fer-la caure, per això vaig pensar que podia admetre-la sense escrúpols com el primer principi de la filosofia que buscava.<\/p>\n<figure><img loading=\"lazy\" src=\"filo/descartes_02.jpg\" alt=\"\"><\/figure>\n<p>D'aquesta forma estava demostrant dues coses primera que podia trobar-se una primera veritat a partir de la qual començar a construir un coneixement racional i, segona, que era possible posar en pràctica el seu criteri de veritat, l'evidència, perquè si no hagués trobat cap evidència, la regla seria inútil.<\/p>\n<p>Les critiques més importants a la filosofia de Descartes, per part dels seus contemporanis, van en la següent direcció: l'expressió \"penso, doncs existeixo, anomenada \"el cogito\", és formulada com si fos un raonament deductiu on hi hauria una premissa implícita \"totes les coses que pensen existeixen, una premissa explicita, \"jo penso\" i una conclusió \"per tant, jo existeixo\". Si el cogito fos una deducció ja no seria una veritat intuïtiva i, per tant, no seria una evidència.<\/p>\n<p>Descartes respon que no és una deducció sinó una veritat clara i distinta que hem obtingut per \"evidència\"; el sentit de l'expressió és: \"penso, i en això conec que existeixo\", perquè com ell mateix diu, per pensar cal existir, i ell descobreix les dues alhora: \"penso, existeixo\". El que està clar és que ell pensa haver trobat el primer principi de la seva filosofia, i per això, a partir d'ara, la recerca filosòfica pot començar. Com diu a les respostes a les objeccions de Bourdin \"he rebutjat primer, com si fos sorra, totes les coses dubtoses; i advertint després que no pot dubtar-se que la substància que dubta o que pensa existeix he utilitzat això com una roca sobre la qual col·locar els fonaments de la meva filosofia\". Si acceptem el seu recorregut fins aquest punt, caldria ara clarificar què és pensar i què és existir. Descartes resumeix les dues coses en l'expressió \"soc una cosa que pensa\" i \"Què és una cosa que pensa? És una cosa que dubta, que afirma, que nega, que entén poques coses, que n'ignora moltes, que estima, que odia, que vol, que no vol, que imagina i que sent. I què vol dir \"ésser una cosa? Descartes està introduint aquí el concepte de substància que clarificarà més endavant.<\/p>\n<h3 id=\"s2-6\"><span class=\"n\">2.6<\/span>El pensament i les idees<\/h3>\n<p>Amb el cogito Descartes arriba a la conclusió que només és vertader allò que es pot concebre clara i distintament i l'exemple més clar és l'evidència de la seva pròpia existència mentre pensa. Descartes, una vegada sap que ell \"és una cosa que pensa\", comença a examinar els continguts del seu pensament tot aplicant la regla de l'evidència. Troba així que els pensaments són de dos tipus: les idees -ésser humà, cel, Déu - que són com imatges coses i els desitjos i judicis -estimar, tenir por, afirmar, negar-, que afegeixen alguna cosa a les idees.<\/p>\n<p>Com veiem, per a Descartes el pensament no recau directament sobre les coses sinó que el pensament pensa idees, ja que en principi l'existència del món extern encara no li consta de forma evident. Aquesta és una aportació filosòfica de la modernitat que cal remarcar: coneixement sobre la realitat parteix de les idees que d'ella tenim a la
