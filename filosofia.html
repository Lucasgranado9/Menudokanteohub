 "Un científic"], "a": 1, "e": "És el sentit de la terra: supera el nihilisme i es fa creador de valors."}, {"q": "Què és l’etern retorn?", "o": ["Una teoria física demostrada", "La idea que tot es repeteix i cal viure de manera que s’afirmaria repetir-ho", "La reencarnació cristiana", "Un mètode científic"], "a": 1, "e": "És una prova d’afirmació de la vida: viure com si haguessis de viure-ho infinites vegades."}, {"q": "Què defensa el perspectivisme?", "o": ["Que hi ha una veritat absoluta", "Que no hi ha fets purs, sinó interpretacions des de perspectives vitals", "Que la ciència és infal·lible", "Que cal rebutjar el coneixement"], "a": 1, "e": "Tot coneixement és interpretació; la «veritat» depèn de la perspectiva i de la voluntat de poder."}]}, "glos": [{"k": "platon", "t": "Idea", "d": "Realitat intel·ligible, immutable i eterna; model de les coses sensibles."}, {"k": "platon", "t": "Dóxa i epistème", "d": "Opinió sobre el món sensible i coneixement veritable de les Idees."}, {"k": "platon", "t": "Reminiscència", "d": "Teoria segons la qual conèixer és recordar el que l’ànima va contemplar al món de les Idees."}, {"k": "platon", "t": "Dialèctica", "d": "Mètode ascendent de la raó per arribar a les Idees, i porta fins a la Idea del Bé."}, {"k": "platon", "t": "Méthexis i mímesi", "d": "Dues explicacions de la relació entre Idees i coses: participació i imitació."}, {"k": "platon", "t": "Justícia", "d": "Virtut de la polis i de l’ànima en què cada part fa la funció que li correspon."}, {"k": "descartes", "t": "Cogito", "d": "«Penso, per tant existeixo»: primera veritat indubtable."}, {"k": "descartes", "t": "Dubte metòdic", "d": "Dubte provisional, mètode per arribar a un fonament indubtable."}, {"k": "descartes", "t": "Evidència", "d": "Criteri de veritat: només és cert allò que es presenta amb claredat i distinció."}, {"k": "descartes", "t": "Idees innates", "d": "Idees presents a la ment des del naixement, com la de Déu."}, {"k": "descartes", "t": "Res cogitans i res extensa", "d": "Substància pensant (ànima) i substància extensa (cos i món material)."}, {"k": "descartes", "t": "Geni maligne", "d": "Hipòtesi que exagera el dubte: un ésser poderós que ens enganyaria sempre."}, {"k": "locke", "t": "Tabula rasa", "d": "Ment en blanc en néixer; totes les idees vénen de l’experiència."}, {"k": "locke", "t": "Sensació i reflexió", "d": "Fonts de les idees: experiència externa i experiència de les operacions internes."}, {"k": "locke", "t": "Qualitats primàries i secundàries", "d": "Les primàries són pròpies dels objectes; les secundàries depenen de la nostra percepció."}, {"k": "locke", "t": "Estat de natura", "d": "Condició prepolítica de llibertat i igualtat sota la llei natural."}, {"k": "locke", "t": "Drets naturals", "d": "Vida, llibertat i propietat, anteriors a l’Estat."}, {"k": "locke", "t": "Contracte social", "d": "Pacte pel qual neix el govern per protegir els drets naturals."}, {"k": "hume", "t": "Impressió", "d": "Percepció viva i immediata (sensació o sentiment)."}, {"k": "hume", "t": "Principi de còpia", "d": "Tota idea simple deriva d’una impressió."}, {"k": "hume", "t": "Relacions d’idees i qüestions de fet", "d": "Veritats necessàries (matemàtica) enfront de veritats contingents (experiència)."}, {"k": "hume", "t": "Hàbit o costum", "d": "Disposició que ens fa esperar un efecte després d’observar-ne la causa moltes vegades."}, {"k": "hume", "t": "Feix de percepcions", "d": "Concepció del jo i de la substància com a col·lecció de percepcions."}, {"k": "hume", "t": "Simpatia", "d": "Capacitat de compartir sentiments d’altres, base de la moral."}, {"k": "kant", "t": "A priori i a posteriori", "d": "Independent de l’experiència o procedent d’ella."}, {"k": "kant", "t": "Judici sintètic a priori", "d": "Judici que amplia el coneixement i és universal i necessari."}, {"k": "kant", "t": "Fenomen i noümen", "d": "La cosa tal com apareix al subjecte i la cosa en si, incognoscible."}, {"k": "kant", "t": "Revolució copernicana", "d": "El subjecte determina la forma de l’objecte conegut."}, {"k": "kant", "t": "Imperatiu categòric", "d": "Mandat moral incondicional: obra segons màximes universalitzables."}, {"k": "kant", "t": "Autonomia", "d": "La voluntat es dóna a si mateixa la llei moral."}, {"k": "mill", "t": "Utilitarisme", "d": "Ètica que valora les accions segons la felicitat que produeixen."}, {"k": "mill", "t": "Plaers superiors", "d": "Plaers intel·lectuals i morals, de més qualitat que els corporals."}, {"k": "mill", "t": "Principi del dany", "d": "Límit de la llibertat: no perjudicar els altres."}, {"k": "mill", "t": "Tirania de la majoria", "d": "Opressió de l’individu per l’opinió dominant."}, {"k": "nietzsche", "t": "Apol·lini i dionisíac", "d": "L’ordre i la forma enfront de l’instint i l’embriaguesa vital."}, {"k": "nietzsche", "t": "Moral d’amos i d’esclaus", "d": "Moral afirmativa dels forts enfront de la moral reactiva dels febles."}, {"k": "nietzsche", "t": "Ressentiment", "d": "Rancúnia dels febles que s’imposa convertint la seva feblesa en virtut."}, {"k": "nietzsche", "t": "Nihilisme", "d": "Pèrdua de sentit dels valors suprems després de la «mort de Déu»."}, {"k": "nietzsche", "t": "Superhome", "d": "Creador de valors que afirma la vida i la terra."}, {"k": "nietzsche", "t": "Etern retorn", "d": "Idea de la repetició infinita com a prova d’afirmació de la vida."}, {"k": "nietzsche", "t": "Voluntat de poder", "d": "Força vital que explica la realitat i la vida."}, {"k": "nietzsche", "t": "Perspectivisme", "d": "Tot coneixement és interpretació des d’una perspectiva."}], "comp": [{"r": "Època i corrent", "c": ["Grècia, s. V-IV aC · idealisme", "S. XVII · racionalisme", "S. XVII · empirisme", "S. XVIII · empirisme escèptic", "S. XVIII · criticisme", "S. XIX · utilitarisme i liberalisme", "S. XIX · vitalisme"]}, {"r": "Font del coneixement", "c": ["Raó i reminiscència (dialèctica)", "Raó, idees innates i mètode", "Experiència: sensació i reflexió", "Impressions dels sentits; idees com a còpies", "Sensibilitat + enteniment (síntesi)", "—", "Perspectives vitals; crítica de la metafísica"]}, {"r": "Realitat", "c": ["Dos móns: sensible i intel·ligible (Idees)", "Tres substàncies: pensant, extensa i infinita", "Substància com a substrat desconegut", "Rebutja la substància i la causalitat necessària", "Fenomen (cognoscible) i noümen (cosa en si)", "—", "Devenir; voluntat de poder"]}, {"r": "Ànima o jo", "c": ["Ànima immortal; el cos és una presó", "Jo = res cogitans", "Identitat personal per la consciència", "Jo = feix de percepcions", "Subjecte transcendental", "—", "El cos; l’«ànima» com a invenció"]}, {"r": "Ètica", "c": ["Intel·lectualisme moral: virtut = coneixement del Bé", "Moral provisional", "Llei natural", "Sentiment i simpatia", "Ètica formal: imperatiu categòric", "Utilitarisme: la màxima felicitat", "Crítica de la moral; superhome"]}, {"r": "Política i societat", "c": ["Polis ideal governada pels filòsofs", "—", "Liberalisme: pacte, drets naturals, divisió de poders", "Convenció i utilitat", "Autonomia i dignitat de la persona", "Llibertat individual i principi del dany", "Crítica de la moral gregària"]}, {"r": "Obra clau", "c": ["La República", "Discurs del mètode", "Assaig sobre l’enteniment humà", "Tractat sobre la naturalesa humana", "Crítica de la raó pura", "Sobre la llibertat · Utilitarisme", "Així parlà Zaratustra"]}]};</script>
<script>
